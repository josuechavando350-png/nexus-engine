[package]
name = "nexus-graph"
description = "Graph backends behind the nexus-ontology ports: in-memory (default) and Neo4j/Memgraph via Cypher (optional feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Enables the real Neo4j/Memgraph adapter. NOT part of the default build:
# see the dependency policy in the workspace manifest.
neo4j = ["dep:neo4rs", "dep:tokio"]

[dependencies]
nexus-event = { workspace = true }
nexus-ontology = { workspace = true }
neo4rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
