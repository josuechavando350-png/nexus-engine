nexus-update = { path = "crates/nexus-update", version = "6.0.0" }
nexus-distributed = { path = "crates/nexus-distributed", version = "6.0.0" }

rdkafka = { version = "0.36", default-features = false, features = ["tokio", "libz"] }
neo4rs = { version = "0.8" }
wasmtime = { version = "=36.0.13", default-features = false, features = ["cranelift", "runtime"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
