[workspace]
resolver = "2"
members = [
    "crates/nexus-kernel",
    "crates/nexus-event",
    "crates/nexus-observability",
    "crates/nexus-policy",
    "crates/nexus-ontology",
    "crates/nexus-graph",
    "crates/nexus-ingest",
    "crates/nexus-edge-protocol",
    "crates/nexus-edge-wasm",
    "crates/nexus-agent",
    "crates/nexus-sim",
    "crates/nexus-oneway",
    "crates/nexus-memory",
    "crates/nexus-goal",
    "crates/nexus-planner",
    "crates/nexus-reasoning",
    "crates/nexus-model",
    "crates/nexus-world-model",
    "crates/nexus-durable",
    "crates/nexus-evaluator",
    "crates/nexus-recovery",
    "crates/nexus-agents-v4",
    "crates/nexus-intelligence",
    "crates/nexus-control-model",
    "crates/nexus-identity",
    "crates/nexus-authz",
    "crates/nexus-registry",
    "crates/nexus-secrets-v5",
    "crates/nexus-cost",
    "crates/nexus-alerts",
    "crates/nexus-audit-v5",
    "crates/nexus-api-contracts",
    "crates/nexus-control-plane",
    "crates/nexus-sdk",
    "examples/autonomous-factory",
    "crates/nexus-cluster",
    "crates/nexus-consensus",
    "crates/nexus-replication",
    "crates/nexus-placement",
    "crates/nexus-discovery",
    "crates/nexus-federation",
    "crates/nexus-offline",
    "crates/nexus-mesh",
    "crates/nexus-fleet",
    "crates/nexus-update",
    "crates/nexus-distributed",
    "services/clusterd",
    "examples/distributed-factory",
    "services/controld",
    "services/ingestd",
    "services/graphd",
    "services/orchestratord",
    "services/gatewayd",
    "examples/factory-line",
    "examples/warehouse-robot",
    "examples/inspection-drone-sim",
    "bench",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
rust-version = "1.75"
license = "UNLICENSED"
publish = false
repository = "https://github.com/josuechavando350-png/nexus-engine"

[workspace.dependencies]
nexus-kernel = { path = "crates/nexus-kernel", version = "6.0.0" }
nexus-event = { path = "crates/nexus-event", version = "6.0.0" }
nexus-observability = { path = "crates/nexus-observability", version = "6.0.0" }
nexus-policy = { path = "crates/nexus-policy", version = "6.0.0" }
nexus-ontology = { path = "crates/nexus-ontology", version = "6.0.0" }
nexus-graph = { path = "crates/nexus-graph", version = "6.0.0" }
nexus-ingest = { path = "crates/nexus-ingest", version = "6.0.0" }
nexus-edge-protocol = { path = "crates/nexus-edge-protocol", version = "6.0.0" }
nexus-edge-wasm = { path = "crates/nexus-edge-wasm", version = "6.0.0" }
nexus-agent = { path = "crates/nexus-agent", version = "6.0.0" }
nexus-sim = { path = "crates/nexus-sim", version = "6.0.0" }
nexus-oneway = { path = "crates/nexus-oneway", version = "6.0.0" }
nexus-memory = { path = "crates/nexus-memory", version = "6.0.0" }
nexus-goal = { path = "crates/nexus-goal", version = "6.0.0" }
nexus-planner = { path = "crates/nexus-planner", version = "6.0.0" }
nexus-reasoning = { path = "crates/nexus-reasoning", version = "6.0.0" }
nexus-model = { path = "crates/nexus-model", version = "6.0.0" }
nexus-world-model = { path = "crates/nexus-world-model", version = "6.0.0" }
nexus-durable = { path = "crates/nexus-durable", version = "6.0.0" }
nexus-evaluator = { path = "crates/nexus-evaluator", version = "6.0.0" }
nexus-recovery = { path = "crates/nexus-recovery", version = "6.0.0" }
nexus-agents-v4 = { path = "crates/nexus-agents-v4", version = "6.0.0" }
nexus-intelligence = { path = "crates/nexus-intelligence", version = "6.0.0" }
nexus-control-model = { path = "crates/nexus-control-model", version = "6.0.0" }
nexus-identity = { path = "crates/nexus-identity", version = "6.0.0" }
nexus-authz = { path = "crates/nexus-authz", version = "6.0.0" }
