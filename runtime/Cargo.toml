nexus-secrets-v5 = { path = "crates/nexus-secrets-v5", version = "6.0.0" }
nexus-cost = { path = "crates/nexus-cost", version = "6.0.0" }
nexus-alerts = { path = "crates/nexus-alerts", version = "6.0.0" }
nexus-audit-v5 = { path = "crates/nexus-audit-v5", version = "6.0.0" }
