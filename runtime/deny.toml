# cargo-deny configuration.
#
# The default feature set of this workspace has zero external dependencies, so
# in the default build these checks have almost nothing to inspect — which is
# the point. They matter when the optional adapter features are enabled.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Narrow, reviewed exceptions for unmaintained crates that are currently
# transitive only through the optional neo4rs 0.8 adapter. There is no patched
# stable neo4rs release that removes this chain as of the audit closeout. The
# adapter boundary is replaceable; remove these entries as soon as upstream
# ships a maintained dependency chain.
ignore = [
    { id = "RUSTSEC-2025-0012", reason = "backoff 0.4.0 is transitive through optional neo4rs 0.8; no patched stable upstream chain is available" },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is transitive through backoff/optional neo4rs 0.8; no patched stable upstream chain is available" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is transitive through optional neo4rs 0.8; no patched stable upstream chain is available" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is transitive through optional neo4rs 0.8; no patched stable upstream chain is available" },
]

[licenses]
version = 2
# Permissive licences only. Anything copyleft entering the runtime would
# change the licensing position of a product that ships to customer sites.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# CDLA-Permissive-2.0 is accepted only for the webpki root-certificate data
# crates pulled by the optional Neo4j adapter; it is not globally allowlisted.
exceptions = [
    { crate = "webpki-roots@0.26.11", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# Workspace members are publish=false proprietary crates. cargo-deny should
# police third-party dependency licences, not require an SPDX public licence
# expression for private unpublished NEXUS crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Dependencies that must never enter the runtime.
deny = [
    # Unmaintained or superseded time handling.
    { name = "time", version = "<0.3" },
    # Pulls a second async runtime into a process that already has one.
    { name = "async-std" },
    # Native TLS stacks are excluded in favour of rustls where TLS is needed.
    { name = "openssl-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
