[package]
name = "gatewayd"
description = "NEXUS V3 service: gatewayd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gatewayd"
path = "src/main.rs"

[features]
default = []
kafka = ["nexus-ingest/kafka"]
wasmtime = ["nexus-edge-wasm/wasmtime"]

[dependencies]
nexus-event = { workspace = true }
nexus-observability = { workspace = true }
nexus-ingest = { workspace = true }
nexus-oneway = { workspace = true }
nexus-edge-protocol = { workspace = true }
nexus-edge-wasm = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
