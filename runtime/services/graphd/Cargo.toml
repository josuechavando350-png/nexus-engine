[package]
name = "graphd"
description = "NEXUS V3 service: graphd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "graphd"
path = "src/main.rs"

[features]
default = []
kafka = ["nexus-ingest/kafka"]
neo4j = ["nexus-graph/neo4j"]

[dependencies]
nexus-event = { workspace = true }
nexus-observability = { workspace = true }
nexus-ingest = { workspace = true }
nexus-ontology = { workspace = true }
nexus-graph = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
