# NEXUS V3 — local development infrastructure.
#
# Brings up the data highway (Redpanda, Kafka API compatible) and the graph
# backend (Neo4j) so the runtime can be exercised against real infrastructure
# instead of the in-memory defaults.
#
# NOTE: nothing here is production configuration. Single node, no TLS, no
# authentication on Redpanda, a development password on Neo4j supplied through
# the environment. It is a developer fixture and is documented as one.
#
#   docker compose -f runtime/docker/docker-compose.yml up -d
#   cargo run -p factory-line              # offline demo, no infrastructure
#   cargo run -p ingestd --features kafka  # against Redpanda

name: nexus-v3

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: nexus-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Creates the canonical topics once the broker is healthy. Topic names are
  # the ones in nexus_event::topics; a typo here shows up as an empty
  # consumer rather than a silent auto-created topic.
  topics:
    image: redpandadata/redpanda:v24.2.7
    container_name: nexus-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        for topic in \
          nexus.telemetry.raw \
          nexus.telemetry.normalized \
          nexus.detections \
          nexus.graph.mutations \
          nexus.task.proposals \
          nexus.audit \
          nexus.deadletter
        do
          rpk topic create "$$topic" \
            --brokers redpanda:29092 \
            --partitions 3 \
            --replicas 1 || true
        done
        rpk topic list --brokers redpanda:29092
    restart: "no"

  neo4j:
    image: neo4j:5.24-community
    container_name: nexus-neo4j
    environment:
      # Supplied from runtime/.env; there is no default credential.
      NEO4J_AUTH: "neo4j/${NEXUS_GRAPH_PASSWORD:?set NEXUS_GRAPH_PASSWORD in runtime/.env}"
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - neo4j-data:/data

volumes:
  redpanda-data:
  neo4j-data:
