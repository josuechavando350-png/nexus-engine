[project]
name = "nexus-semantic-nlp"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "google-cloud-language>=2.17,<3",
  "redis>=6,<7"
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"
