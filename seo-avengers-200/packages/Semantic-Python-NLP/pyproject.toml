[project]
name = "nexus-semantic-nlp"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "redis>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "spacy>=3.8,<4",
  "xx-ent-wiki-sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl"
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.setuptools]
py-modules = ["main", "bert_embeddings", "railway_entry", "render_entry", "render_neon_entry", "neon_store", "local_semantic_provider", "site_bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py312"
