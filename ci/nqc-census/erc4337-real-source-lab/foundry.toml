[profile.default]
src = "src"
test = "test"
libs = ["lib"]
out = "out"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "../morpho-native-lab/out" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
