[workspace]
members = ["crates/nqc-census-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
