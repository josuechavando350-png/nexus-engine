name: Validacion Nexus

on:
  push:
    branches: [main, nexus-v2, nexus-v3, nexus-v4, nexus-v5, nexus-v6]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Traer codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Revisar formato (Lint)
        run: pnpm lint

      - name: Revisar tipos (Typecheck)
        run: pnpm typecheck

      - name: Ejecutar pruebas (Test)
        run: pnpm test

      - name: Construir proyecto (Build)
        run: pnpm build

      - name: Quality Gates V2
        run: pnpm quality-gates

      - name: Auditoria de dependencias
        run: pnpm audit --audit-level high

