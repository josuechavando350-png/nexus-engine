          }
          runtime['attestation_sha256']=stable(runtime)
          (ev/'runtime-summary.json').write_text(json.dumps(runtime,indent=2,sort_keys=True)+'\n')
          PY

          sha256sum evidence/* > evidence/SHA256SUMS.txt
          cat evidence/runtime-summary.json

      - name: Upload immutable T35 physical evidence
