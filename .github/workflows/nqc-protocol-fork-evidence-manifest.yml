name: NQC T39 Content Addressed Evidence Manifest

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-evidence-manifest.yml
      - ci/nqc-protocol-fork/PROTOCOL_FORK_EVIDENCE_MANIFEST.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate content-addressed gate registry without premature closure
        shell: bash
        env:
          NQC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path

          p=Path("ci/nqc-protocol-fork/PROTOCOL_FORK_EVIDENCE_MANIFEST.json")
          d=json.loads(p.read_text())
          assert d["schema_version"]==1
          assert d["gate"]=="EVIDENCE_MANIFEST_CONTENT_ADDRESSED"
          required=d["required_gates"]
          entries=d["entries"]
          assert len(required)==len(set(required))
          assert set(required)==set(entries)
          sha=re.compile(r"^[0-9a-f]{64}$")
          head=re.compile(r"^[0-9a-f]{40}$")

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["NQC_GITHUB_TOKEN"]
          if not token:
              raise AssertionError("missing GitHub Actions token for artifact attestation")

          def api_get(path):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"nqc-protocol-fork-evidence-manifest-v3",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read())

          def artifact_refs(item):
              refs=[]
              if "artifact_id" in item:
                  refs.append({
                      "artifact_id":item["artifact_id"],
                      "workflow_run_id":item["workflow_run_id"],
                      "artifact_sha256":item["artifact_sha256"],
                      "head":item["head"],
                  })
              refs += item.get("evidence",[])
              refs += item.get("bound_underlying_evidence",[])
              return refs

          verified_artifacts=0
          def verify_artifact(gate,ref):
              artifact_id=int(ref["artifact_id"])
              workflow_run_id=int(ref["workflow_run_id"])
              artifact_sha256=ref["artifact_sha256"]
              artifact_head=ref["head"]
              assert artifact_id>0 and workflow_run_id>0, (gate,"invalid artifact/run id")
              assert sha.fullmatch(artifact_sha256), (gate,"bad artifact sha256")
              assert head.fullmatch(artifact_head), (gate,"bad artifact head")
              actual=api_get(f"/actions/artifacts/{artifact_id}")
              assert int(actual["id"])==artifact_id, (gate,"artifact id mismatch")
              assert actual.get("expired") is False, (gate,"artifact expired",artifact_id)
              assert actual.get("digest")==f"sha256:{artifact_sha256}", (
                  gate,"artifact digest mismatch",artifact_id,actual.get("digest")
              )
              run=actual.get("workflow_run") or {}
              assert int(run.get("id",0))==workflow_run_id, (
                  gate,"artifact workflow run mismatch",artifact_id,run.get("id")
              )
              assert run.get("head_sha")==artifact_head, (
                  gate,"artifact head mismatch",artifact_id,run.get("head_sha"),artifact_head
              )
              run_detail=api_get(f"/actions/runs/{workflow_run_id}")
              assert int(run_detail.get("id",0))==workflow_run_id, (
                  gate,"workflow run id mismatch",workflow_run_id
              )
              assert run_detail.get("head_sha")==artifact_head, (
                  gate,"workflow run head mismatch",run_detail.get("head_sha"),artifact_head
              )
              assert run_detail.get("status")=="completed", (
                  gate,"workflow run not completed",run_detail.get("status")
              )
              assert run_detail.get("conclusion")=="success", (
                  gate,"workflow run did not succeed",run_detail.get("conclusion")
              )

          pending=[]
          for gate in required:
              item=entries[gate]
              assert "status" in item
              if "head" in item:
                  assert head.fullmatch(item["head"]), (gate,"bad head")
              refs=artifact_refs(item)
              for ref in refs:
                  verify_artifact(gate,ref)
                  verified_artifacts += 1
              if item["status"]=="PASS":
                  assert refs, (gate,"PASS without content-addressed artifact")
              else:
                  pending.append(gate)

          blockers=d["source_blockers"]
          assert blockers["PFT-SRC-002"]=="CLOSED"
          if not pending:
              assert d["status"]=="PASS"
              assert all(v=="CLOSED" for v in blockers.values())
              assert d["protocol_fork_truth"]=="NOT_CLOSED"
              print(f"EVIDENCE_MANIFEST_CONTENT_ADDRESSED_PASS verified_artifacts={verified_artifacts}")
          else:
              assert d["status"].startswith("NOT_TESTED_")
              assert d["protocol_fork_truth"]=="NOT_CLOSED"
              print("EVIDENCE_MANIFEST_PENDING gates="+",".join(pending)+f" verified_artifacts={verified_artifacts}")
          PY

          sha256sum ci/nqc-protocol-fork/PROTOCOL_FORK_EVIDENCE_MANIFEST.json             > /tmp/nqc-pft-evidence-manifest.sha256
          sha256sum -c /tmp/nqc-pft-evidence-manifest.sha256
