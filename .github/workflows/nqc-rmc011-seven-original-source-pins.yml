name: NQC RMC-011 Independent Seven Bounded Sources (NOT D11 CLOSE)
on:
  pull_request:
    paths:
      - '.github/workflows/nqc-rmc011-seven-original-source-pins.yml'
      - 'ci/nqc-census/rmc011-capital-source-universe.json'
      - 'ci/nqc-census/rmc011_independent_seven_bounded_rejections.py'
      - 'ci/nqc-census/test_rmc011_independent_seven_bounded_rejections.py'
      - 'ci/nqc-census/RMC011_SEVEN_BOUNDED_ORIGINAL_PINS.md'
      - 'ci/nqc-census/test_verify_rmc011_capital_source_universe.py'
      - 'ci/nqc-census/test_verify_rmc011_family_discovery_readiness.py'
      - 'ci/nqc-census/test_verify_rmc011_bounded_family_promotion.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nqc-rmc011-seven-bounded-source-pins-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  independent-source-reauthentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact 7/13 source lock; never promote full D11
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/nqc-census/rmc011-capital-source-universe.json)" = c1b9f136a13f220af9dceaae50e5caa3105121eb
          test "$(git hash-object ci/nqc-census/rmc011-external-capital-provider-registry.json)" = a9c1427bb05828d08ade537899ee1b8e43b97ed2
          test "$(git hash-object ci/nqc-census/rmc011-execution-plan-requirement-catalog.json)" = 53aacf43fac87bbf4a5438ceeab7530d9287e88f
          test "$(git hash-object ci/nqc-census/final-census-authority-lock.json)" = b1182b27b0ff3856b17a6f829ac3c693eab74400
          python3 ci/nqc-census/test_verify_rmc011_capital_source_universe.py -v
          python3 ci/nqc-census/test_verify_rmc011_family_discovery_readiness.py -v
          python3 ci/nqc-census/test_verify_rmc011_family_discovery_promotion.py -v
          python3 ci/nqc-census/test_verify_rmc011_bounded_family_promotion.py -v
          python3 ci/nqc-census/verify-rmc011-capital-source-universe.py \
            | tee "$RUNNER_TEMP/rmc011-seven-universe.txt"
          grep -F 'resolved=9 unresolved=4' "$RUNNER_TEMP/rmc011-seven-universe.txt"
          grep -F 'terminal_claim_allowed=false' "$RUNNER_TEMP/rmc011-seven-universe.txt"
          python3 ci/nqc-census/verify-rmc011-bounded-family-promotion.py
          echo NQC_D11_PARTIAL_SEVEN_BOUNDED_ONLY_NOT_TERMINAL
      - name: Independently authenticate original producing GitHub workflow & artifact
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nqc011-source-original"
          mkdir -p "$WORK/private" "$WORK/public"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37826819250" \
            > "$WORK/private/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11571178483" \
            > "$WORK/private/artifact.json"
          jq -e '.id==37826819250 and .status=="completed" and .conclusion=="success" and
                 .run_attempt==1 and .head_sha=="e7e33cb96935ecf9effaab601d105b097c700671" and
                 .name=="NQC RMC-011 Bounded Family Rejection Evidence"' \
            "$WORK/private/run.json" >/dev/null
          jq -e '.id==11571178483 and .expired==false and
                 .workflow_run.id==37826819250 and
                 .workflow_run.head_sha=="e7e33cb96935ecf9effaab601d105b097c700671" and
                 .name=="rmc011-bounded-family-rejections-e7e33cb96935ecf9effaab601d105b097c700671-37826819250-1" and
                 .digest=="sha256:83a22012952b41dea2061134007a65fb6da76b63c0cf7836ea0804828a2a2d5d"' \
            "$WORK/private/artifact.json" >/dev/null
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11571178483/zip" \
            -o "$WORK/private/original.zip"
          printf '%s  %s\n' 83a22012952b41dea2061134007a65fb6da76b63c0cf7836ea0804828a2a2d5d "$WORK/private/original.zip" \
            | sha256sum --check --strict
          echo RMC011_SEVEN_ORIGINAL_WORKFLOW_AND_ARCHIVE_BYTES_AUTHENTICATED
      - name: Run real-source adversarial tests and independently replay every member
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nqc011-source-original"
          python3 -m py_compile ci/nqc-census/rmc011_independent_seven_bounded_rejections.py \
            ci/nqc-census/test_rmc011_independent_seven_bounded_rejections.py
          python3 ci/nqc-census/test_rmc011_independent_seven_bounded_rejections.py \
            --archive "$WORK/private/original.zip" \
            --run-meta "$WORK/private/run.json" \
            --artifact-meta "$WORK/private/artifact.json" \
            2>&1 | tee "$WORK/public/adversarial-tests.txt"
          python3 ci/nqc-census/rmc011_independent_seven_bounded_rejections.py \
            --archive "$WORK/private/original.zip" \
            --run-meta "$WORK/private/run.json" \
            --artifact-meta "$WORK/private/artifact.json" \
            --out "$WORK/public/independent-seven-bounded.json"
          python3 ci/nqc-census/rmc011_independent_seven_bounded_rejections.py \
            --archive "$WORK/private/original.zip" \
            --run-meta "$WORK/private/run.json" \
            --artifact-meta "$WORK/private/artifact.json" \
            --out "$WORK/private/independent-replay.json"
          cmp "$WORK/public/independent-seven-bounded.json" "$WORK/private/independent-replay.json"
          jq -e '.status=="RMC011_SEVEN_BOUNDED_REJECTIONS_INDEPENDENTLY_REAUTHENTICATED_NOT_D11" and
                 .rejected_families_within_nqc_configured_scope==7 and
                 .remaining_unresolved_families==6 and
                 .family_universe_discovery_certified==false and
                 .capital_truth_D11_terminal_closed==false and
                 .nqc_approved_external_gas_provider_count==0 and
                 .nqc_nonrecourse_native_gas_authorized==false and
                 .nqc_realized_net_usd_wad=="0" and
                 .real_market_census_closed==false' \
            "$WORK/public/independent-seven-bounded.json" >/dev/null
          sha256sum ci/nqc-census/rmc011_independent_seven_bounded_rejections.py \
            ci/nqc-census/test_rmc011_independent_seven_bounded_rejections.py \
            ci/nqc-census/RMC011_SEVEN_BOUNDED_ORIGINAL_PINS.md \
            > "$WORK/public/producer-source.sha256"
          (cd "$WORK/public" &&
            sha256sum independent-seven-bounded.json adversarial-tests.txt producer-source.sha256 > archive.sha256 &&
            sha256sum -c archive.sha256)
          echo RMC011_SEVEN_REAL_BOUNDED_SOURCE_REFERENCES_VERIFIED_D11_BLOCKED
      - name: Publish only source SHA witnesses and NO raw provider/account data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc011-seven-independent-source-pins-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/nqc011-source-original/public/*.json
            ${{ runner.temp }}/nqc011-source-original/public/*.sha256
            ${{ runner.temp }}/nqc011-source-original/public/*.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
