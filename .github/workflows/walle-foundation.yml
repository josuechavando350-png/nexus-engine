name: Walle Connected Verification

on:
  push:
    branches:
      - feat/walle-certification-engine
    paths:
      - 'walle/**'
      - 'seo-avengers-2500/**'
      - 'seo-avengers-1000/**'
      - 'seo-avengers-800/**'
      - 'seo-avengers-600/**'
      - 'seo-avengers-400/**'
      - 'seo-avengers-200/**'
      - '.github/workflows/walle-foundation.yml'
  pull_request:
    paths:
      - 'walle/**'
      - 'seo-avengers-2500/**'
      - 'seo-avengers-1000/**'
      - 'seo-avengers-800/**'
      - 'seo-avengers-600/**'
      - 'seo-avengers-400/**'
      - 'seo-avengers-200/**'
      - '.github/workflows/walle-foundation.yml'

permissions:
  contents: read

jobs:
  verify-walle-connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact source and pristine checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.88.0

      - name: Verify connected Walle engine
        run: bash walle/scripts/verify.sh

      - name: Assert verifier left repository clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
