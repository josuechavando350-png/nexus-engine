name: TEMP Perceptual Images Bootstrap

on:
  push:
    branches:
      - feat/capability-09-perceptual-images

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-09-perceptual-images
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Apply audited source correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/perceptual-images/src/index.ts')
          text = path.read_text()
          old = 'throw new Error(`command failed: ${basename(file)} ${args.join(" ")} :: ${message}`);'
          new = 'throw new Error(`command failed: ${basename(file)} ${args.join(" ")} :: ${message}`, { cause: error });'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected lint correction target not found')
          PY
      - name: Install workspace and sync lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Package validation
        run: |
          pnpm --filter @nexus/perceptual-images typecheck
          pnpm --filter @nexus/perceptual-images test
          pnpm --filter @nexus/perceptual-images build
          pnpm lint
      - name: Install AVIF and build pinned libjxl tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libavif-bin cmake ninja-build pkg-config git
          git clone --filter=blob:none https://github.com/libjxl/libjxl.git .tmp-libjxl
          git -C .tmp-libjxl checkout --detach a7a9c787341cf703dede03c2009fa460cae5e5df
          test "$(git -C .tmp-libjxl rev-parse HEAD)" = "a7a9c787341cf703dede03c2009fa460cae5e5df"
          git -C .tmp-libjxl submodule update --init --recursive --depth 1
          cmake -S .tmp-libjxl -B .tmp-libjxl/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DJPEGXL_ENABLE_DEVTOOLS=ON -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF
          cmake --build .tmp-libjxl/build --target cjxl djxl ssimulacra2 -j2
          command -v avifenc
          command -v avifdec
          test -x .tmp-libjxl/build/tools/cjxl
          test -x .tmp-libjxl/build/tools/djxl
          test -x .tmp-libjxl/build/tools/ssimulacra2
          avifenc --version
          .tmp-libjxl/build/tools/cjxl --version
      - name: Native end-to-end smoke
        run: |
          set -euo pipefail
          mkdir -p .tmp-perceptual/out
          (
            cd packages/perceptual-images
            node --input-type=module - <<'NODE'
          import sharp from 'sharp';
          await sharp({create:{width:96,height:96,channels:3,background:{r:45,g:90,b:140}}}).png().toFile('../../.tmp-perceptual/source.png');
          NODE
          )
          cat > .tmp-perceptual/spec.json <<JSON
          {
            "sourcePath": ".tmp-perceptual/source.png",
            "outputDir": ".tmp-perceptual/out",
            "tools": {
              "avifenc": "$(command -v avifenc)",
              "avifdec": "$(command -v avifdec)",
              "cjxl": "${GITHUB_WORKSPACE}/.tmp-libjxl/build/tools/cjxl",
              "djxl": "${GITHUB_WORKSPACE}/.tmp-libjxl/build/tools/djxl",
              "ssimulacra2": "${GITHUB_WORKSPACE}/.tmp-libjxl/build/tools/ssimulacra2"
            },
            "policy": {
              "tier": "HIGH",
              "minimumSavingsRatio": 0,
              "avif": [{"quality": 70, "speed": 6, "chroma": "444"}],
              "jxl": [{"distance": 1, "effort": 7}]
            }
          }
          JSON
          node scripts/audit-perceptual-images.mjs --spec .tmp-perceptual/spec.json | tee .tmp-perceptual/report.json
          grep -q '"status": "READY"' .tmp-perceptual/report.json
          grep -q '"AVIF"' .tmp-perceptual/report.json
          grep -q '"JXL"' .tmp-perceptual/report.json
      - name: Verify bounded tree changes
        run: |
          git diff --exit-code -- . ':(exclude)pnpm-lock.yaml' ':(exclude)packages/perceptual-images/src/index.ts'
          grep -Fq '  packages/perceptual-images:' pnpm-lock.yaml
      - name: Commit synchronized source and lockfile
        run: |
          if git diff --quiet -- packages/perceptual-images/src/index.ts pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/perceptual-images/src/index.ts pnpm-lock.yaml
          git commit -m 'fix(images): preserve command error cause and sync lockfile'
          git push origin HEAD:feat/capability-09-perceptual-images
