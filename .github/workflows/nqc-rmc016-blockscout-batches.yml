name: NQC RMC-016 Immutable Blockscout Receipt Batches

on:
  push:
    branches:
      - nqc/rmc016-blockscout-batch-checkpoint-20261008
  pull_request:
    paths:
      - ci/nqc-census/rmc016_resume_blockscout_batch.py
      - ci/nqc-census/test_rmc016_resume_blockscout_batch.py
      - ci/nqc-census/RMC016_BLOCKSCOUT_BATCH_CONTRACT.md
      - .github/workflows/nqc-rmc016-blockscout-batches.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rmc016-batch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact ancestry, unchanged D16 authority and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7ec0f23fb7e114c6ac6d873bdb2889f309c2ac50 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = \
            5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa
          python3 ci/nqc-census/test_rmc016_resume_blockscout_batch.py
          python3 -m py_compile ci/nqc-census/rmc016_resume_blockscout_batch.py
          echo RMC016_BLOCKSCOUT_BATCH_ADVERSARIAL_PASS

  bounded-real-receipts:
    needs: fixture-gates
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Authenticate original, full dRPC and partial Blockscout upstream archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rmc016-sources"
          auth() {
            local run="$1" head="$2" tree="$3" name="$4" conclusion="$5" artifact="$6" art_name="$7" sha="$8" path="$9"
            local r a
            r="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            a="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact")"
            test "$(jq -r .status <<<"$r")" = completed
            test "$(jq -r .conclusion <<<"$r")" = "$conclusion"
            test "$(jq -r .name <<<"$r")" = "$name"
            test "$(jq -r .head_sha <<<"$r")" = "$head"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)" = "$tree"
            test "$(jq -r .expired <<<"$a")" = false
            test "$(jq -r .name <<<"$a")" = "$art_name"
            test "$(jq -r .digest <<<"$a")" = "sha256:$sha"
            test "$(jq -r .workflow_run.id <<<"$a")" = "$run"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" \
              -o "$path"
            printf '%s  %s\n' "$sha" "$path" | sha256sum -c --strict
          }
          auth 37718661409 abe54f1f23bd7bff8c37871200f7da7c59c45ac3 \
            c74f8d9d2c317a011284398643b2d4aa6de06e83 \
            'NQC RMC-016 Full Liquidation Ledger Discovery' success \
            11524139188 rmc016-full-liquidation-events-abe54f1f23bd7bff8c37871200f7da7c59c45ac3 \
            6b4098c1acf153106ac5b67d2c5c7db5cd0295a16c782ad8c34ae75303306204 \
            "$RUNNER_TEMP/rmc016-sources/source.zip"
          auth 37719091371 569d4aaeecb3d066389c054efed695be02e3ef40 \
            ba648214fb5cb1cdca1db1f42f28059054d78e63 \
            'NQC RMC-016 Dual Operator Winner Receipt Parity' failure \
            11524199698 rmc016-dual-winner-receipts-569d4aaeecb3d066389c054efed695be02e3ef40 \
            182b5e81b00ca04e53c9193c1496a725dc152ade9a17d3ab2dfaeb5045ac86b6 \
            "$RUNNER_TEMP/rmc016-sources/drpc.zip"
          auth 37720137160 7ec0f23fb7e114c6ac6d873bdb2889f309c2ac50 \
            3b5f24cee08806403243885e90f662ee75784a85 \
            'NQC RMC-016 Independent Winner Receipt Continuation' failure \
            11525810815 rmc016-resumed-independent-receipts-7ec0f23fb7e114c6ac6d873bdb2889f309c2ac50 \
            b64e15fde2112efa32564a224dbf38b2b338bda35d2aefc68c0cb78b3f6339da \
            "$RUNNER_TEMP/rmc016-sources/blockscout10.zip"
          echo RMC016_PREVIOUS_FAILURE_EVIDENCE_EXACTLY_AUTHENTICATED
      - name: Resume only six NEW Blockscout receipts at explicit public-provider pace
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/rmc016_resume_blockscout_batch.py \
            --source-zip "$RUNNER_TEMP/rmc016-sources/source.zip" \
            --drpc-zip "$RUNNER_TEMP/rmc016-sources/drpc.zip" \
            --prior-blockscout-zip "$RUNNER_TEMP/rmc016-sources/blockscout10.zip" \
            --max-new 6 --min-interval 7 \
            --out "$RUNNER_TEMP/rmc016-blockscout-batch"
          report="$RUNNER_TEMP/rmc016-blockscout-batch/receipt-parity-report.json"
          jq -e '
            .status == "RMC016_SECOND_OPERATOR_BATCH_CHECKPOINT_PARTIAL" and
            .prior_receipt_count == 10 and
            .new_receipt_count >= 1 and .new_receipt_count <= 6 and
            .verified_receipt_count == (10 + .new_receipt_count) and
            .remaining_receipt_count == (127 - .verified_receipt_count) and
            .all_127_receipts_cross_operator_reconciled == false and
            .nexus_realized_pnl_proven == false and
            .nexus_capture_probability_calibrated == false and
            .nexus_gas_funding_proven == false and
            .independent_full_window_log_consensus == false and
            .real_market_census_closed == false
          ' "$report" >/dev/null
          (cd "$RUNNER_TEMP/rmc016-blockscout-batch" && sha256sum -c archive.sha256)
          echo RMC016_REAL_RECEIPT_BATCH_INCOMPLETE_BUT_REPRODUCIBLE
      - name: Preserve immutable progress even if public provider hits quota
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc016-blockscout-batch-${{ github.sha }}
          path: ${{ runner.temp }}/rmc016-blockscout-batch/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
