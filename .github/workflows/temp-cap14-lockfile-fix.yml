name: TEMP Cap14 lockfile fix

on:
  push:
    branches:
      - feat/capability-14-query-fanout
    paths:
      - '.github/workflows/temp-cap14-lockfile-fix.yml'

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-14-query-fanout
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Regenerate workspace lockfile and self-clean
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --frozen-lockfile=false
          grep -Fq 'packages/query-fanout:' pnpm-lock.yaml
          rm .github/workflows/temp-cap14-lockfile-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/temp-cap14-lockfile-fix.yml
          git diff --cached --check
          git commit -m 'chore(query-fanout): synchronize workspace lockfile'
          git push origin HEAD:feat/capability-14-query-fanout
