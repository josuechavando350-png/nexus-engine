name: NQC RMC-011 Terminal Readiness

on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc011-capital-source-universe.json"
      - "ci/nqc-census/verify-rmc011-capital-source-universe.py"
      - "ci/nqc-census/CAPITAL_CENSUS_CONTRACT.md"
      - ".github/workflows/nqc-census-capital-terminal-readiness.yml"
  push:
    branches:
      - "nqc/rmc-011-derived-authority-lock-20260930"
    paths:
      - "ci/nqc-census/rmc011-capital-source-universe.json"
      - "ci/nqc-census/verify-rmc011-capital-source-universe.py"
      - "ci/nqc-census/CAPITAL_CENSUS_CONTRACT.md"
      - ".github/workflows/nqc-census-capital-terminal-readiness.yml"

permissions:
  contents: read

jobs:
  source-universe-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate D11 source-universe truth
        run: python3 ci/nqc-census/verify-rmc011-capital-source-universe.py
      - name: Enforce terminal claim boundary
        shell: bash
        run: |
          set -euo pipefail
          FILE=ci/nqc-census/rmc011-capital-source-universe.json
          if jq -e '.terminal_claim_allowed == true' "$FILE" >/dev/null; then
            jq -e '
              .status == "D11_TERMINAL_CLOSED" and
              (.families | all(.terminally_resolved == true)) and
              .unknown_family_count == 0
            ' "$FILE" >/dev/null
            echo RMC011_TERMINAL_READINESS=PASS
          else
            echo RMC011_TERMINAL_READINESS=BLOCKED_INCOMPLETE_SOURCE_UNIVERSE
          fi
