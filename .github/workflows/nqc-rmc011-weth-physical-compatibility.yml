name: NQC RMC-011 WETH Historical Physical Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/nqc-rmc011-weth-physical-compatibility.yml'
      - 'ci/nqc-census/weth-physical/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nqc-rmc011-weth-physical-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  historical-fork-weth:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Authenticate evidence ancestry and run 14 read-only adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2f4558a8bed604b6e3d0ce418f9235ecd2069b6 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = 5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa
          python3 ci/nqc-census/weth-physical/test_verify_weth_rpc.py
          python3 -m py_compile ci/nqc-census/weth-physical/verify_weth_rpc.py
          mkdir -p "$RUNNER_TEMP/rmc011-weth-result"
          sha256sum ci/nqc-census/weth-physical/foundry.toml \
                    ci/nqc-census/weth-physical/test/NqcRmc011WethPhysicalCompatibilityFork.t.sol \
                    ci/nqc-census/weth-physical/verify_weth_rpc.py \
                    ci/nqc-census/weth-physical/test_verify_weth_rpc.py \
                    > "$RUNNER_TEMP/rmc011-weth-result/original-source.sha256"
          echo RMC011_WETH_OFFLINE_NEGATIVE_TESTS_PASS

      - name: Independently pin Ethereum D08 block and WETH9 deployed runtime code
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rmc011-weth-result/rpc-runtime.json"
          python3 ci/nqc-census/weth-physical/verify_weth_rpc.py --out "$out"
          jq -e '
            .status=="RMC011_WETH_ANCHORED_DUAL_OPERATOR_RUNTIME_WITNESS_PASS" and
            .chain_id==1 and
            .block_number==26095351 and
            .block_hash=="0x0d7a15fbb72e69696a33c65bc20902fe08e5630862ada64b065a97405c70c781" and
            .cross_operator_code_identity_and_header_consensus==true and
            .actual_transfer_approval_deposit_withdraw_fork_replayed==false and
            .nqc_token_execution_admission_certified==false and
            .own_capital_zero_execution_proven==false and
            .external_gas_sponsorship_proven==false and
            .nexus_realized_pnl_proven==false and
            .real_market_census_closed==false
          ' "$out" >/dev/null
          echo RMC011_WETH_TWO_OPERATOR_HISTORICAL_RUNTIME_ATTESTED_NOT_ELIGIBLE

      - name: Install pinned Foundry 1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqc-rmc011-foundry"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/nqc-rmc011-foundry/foundry.tar.gz" \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          printf '%s  %s\n' \
            cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b \
            "$RUNNER_TEMP/nqc-rmc011-foundry/foundry.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nqc-rmc011-foundry/foundry.tar.gz" -C "$RUNNER_TEMP/nqc-rmc011-foundry"
          "$RUNNER_TEMP/nqc-rmc011-foundry/forge" --version | tee "$RUNNER_TEMP/rmc011-weth-result/foundry-version.txt"
          echo RMC011_FOUNDRY_PIN_PASS

      - name: Physically execute nine WETH9 behavior tests on historical mainnet fork
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/nqc-rmc011-foundry:$PATH"
          origin="$GITHUB_WORKSPACE/ci/nqc-census/weth-physical"
          target="$RUNNER_TEMP/nqc-rmc011-physical-sandbox"
          mkdir -p "$target/test" "$target/src"
          cp "$origin/foundry.toml" "$target/foundry.toml"
          cp "$origin/test/NqcRmc011WethPhysicalCompatibilityFork.t.sol" "$target/test/"
          cd "$target"
          forge fmt
          forge fmt --check
          sha256sum foundry.toml test/NqcRmc011WethPhysicalCompatibilityFork.t.sol \
            > "$RUNNER_TEMP/rmc011-weth-result/formatted-source.sha256"
          forge build --sizes 2>&1 | tee "$RUNNER_TEMP/rmc011-weth-result/forge-build.txt"
          forge test --fork-url https://eth.drpc.org --fork-block-number 26095351 \
            --match-contract NqcRmc011WethPhysicalCompatibilityForkTest -vvv 2>&1 \
            | tee "$RUNNER_TEMP/rmc011-weth-result/fork-test.txt"
          grep -Fq 'Suite result: ok. 9 passed; 0 failed; 0 skipped' \
            "$RUNNER_TEMP/rmc011-weth-result/fork-test.txt"
          for name in \
            testPinnedMainnetRuntimeAndMetadata \
            testDepositMintsExactUnitsWithoutExtraFee \
            testTransferPreservesExactSenderRecipientDeltas \
            testAllowanceAndTransferFromConserveExactUnits \
            testExcessAllowanceCannotBeSpentAndNoStateChange \
            testRecipientRevertingHookIsNotInvoked \
            testWithdrawBurnsExactWethAndReturnsExactEther \
            testZeroTransferAndApprovalDoNotRebaseBalances \
            testCannotTransferUnownedWeth
          do
            grep -Fq "[PASS] ${name}()" "$RUNNER_TEMP/rmc011-weth-result/fork-test.txt"
          done
          echo RMC011_WETH_HISTORICAL_FORK_BEHAVIOR_9_PASS_NOT_NEXUS_EXECUTION

      - name: Issue narrowly scoped append-only witness report
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rmc011-weth-result" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          rpc=json.loads((root/"rpc-runtime.json").read_bytes())
          assert rpc["status"]=="RMC011_WETH_ANCHORED_DUAL_OPERATOR_RUNTIME_WITNESS_PASS"
          log=(root/"fork-test.txt").read_text()
          assert 'Suite result: ok. 9 passed; 0 failed; 0 skipped' in log
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          report={
              "schema_version":1,
              "status":"RMC011_WETH_A1_SINGLE_FORK_PHYSICAL_BEHAVIOR_9_PASS_NOT_CERTIFIED",
              "observation_scope":"ETHEREUM_D08_A1_WETH9_ONE_HISTORICAL_BLOCK_ONLY",
              "chain_id":1,
              "block_number":26095351,
              "block_hash":"0x0d7a15fbb72e69696a33c65bc20902fe08e5630862ada64b065a97405c70c781",
              "weth_token":"0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2",
              "cross_operator_code_and_header_consensus":True,
              "runtime_code_sha256":rpc["weth_runtime_sha256"],
              "foundry_physical_fork_test_count":9,
              "historical_fork_provider_id":"drpc",
              "historical_code_provider_ids":["drpc","blast"],
              "original_source_manifest_sha256":sha(root/"original-source.sha256"),
              "tested_formatted_source_manifest_sha256":sha(root/"formatted-source.sha256"),
              "fork_test_log_sha256":sha(root/"fork-test.txt"),
              "forge_build_log_sha256":sha(root/"forge-build.txt"),
              "fixture_vm_deal_minted_native_eth":True,
              "no_real_transaction_broadcast":True,
              "d08_token_execution_admission_changed":False,
              "d08_514279_blocked_token_sources_unchanged":True,
              "own_capital_zero_funding_proven":False,
              "flash_principal_or_gas_sponsor_admitted":False,
              "aave_liquidation_or_flash_callback_executed":False,
              "actual_nexus_net_pnl_proven":False,
              "rmc011_terminal_closed":False,
              "real_market_census_closed":False,
          }
          payload=(json.dumps(report,sort_keys=True,separators=(",",":"))+"\n").encode()
          report["report_sha256"]=hashlib.sha256(payload).hexdigest()
          (root/"fork-weth-compatibility-report.json").write_text(
              json.dumps(report,sort_keys=True,separators=(",",":"))+"\n")
          print(report["status"],"runtime_code_sha256",report["runtime_code_sha256"])
          PY
          (cd "$RUNNER_TEMP/rmc011-weth-result" &&
            find . -maxdepth 1 -type f ! -name archive.sha256 -printf '%f\n' | sort |
            while read -r name; do sha256sum "$name"; done > archive.sha256 &&
            sha256sum --check --strict archive.sha256)
          echo RMC011_WETH_HISTORICAL_PHYSICAL_WITNESS_NOT_TOKEN_ADMISSION

      - name: Preserve source-authenticated fork evidence or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc011-weth-physical-fork-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rmc011-weth-result/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
