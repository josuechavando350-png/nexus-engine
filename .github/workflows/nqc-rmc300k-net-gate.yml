name: NQC RMC-300K Target Gate

on:
  push:
    branches:
      - nqc/rmc300k-net-acceptance-gate-20261007
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audited-target-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check immutable source and run adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 96a0b3e3c0b55df1b1d890f8c70a7a9014e2ff9a HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = "5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa"
          test "$(git hash-object ci/nqc-census/rmc011-external-capital-provider-registry.json)" = "a9c1427bb05828d08ade537899ee1b8e43b97ed2"
          python3 ci/nqc-census/test_rmc300k_monthly_net_gate.py
          python3 ci/nqc-census/rmc300k_monthly_net_gate.py --source ci/nqc-census/rmc016-production-evidence.json --capital-registry ci/nqc-census/rmc011-external-capital-provider-registry.json --out /tmp/rmc300k-underwriting.json
          jq -e '.status=="RMC300K_NET_MONTHLY_TARGET_UNPROVEN" and .target_monthly_net_usd_wad=="300000000000000000000000" and .monthly_300k_certified==false and .real_market_census_closed==false and .nexus_net_monthly_forecast_usd_wad==null and .external_capital_registry.registered_authorized_provider_count==0 and .external_capital_registry.external_gas_provider_authorized==false' /tmp/rmc300k-underwriting.json
          echo RMC300K_POLICY_GATE_PASS_NOT_PROVEN
      - name: Retain source-locked negative underwriting evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc300k-net-target-baseline-${{ github.sha }}
          path: /tmp/rmc300k-underwriting.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
