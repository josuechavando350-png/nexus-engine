name: NQC T39 Parity Mismatch Ledger

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-mismatch-ledger.yml
      - ci/nqc-protocol-fork/PARITY_MISMATCH_LEDGER.json
      - ci/nqc-protocol-fork/compatibility/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mismatch-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate ledger truthfulness
        shell: bash
        env:
          NQC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          p=Path("ci/nqc-protocol-fork/PARITY_MISMATCH_LEDGER.json")
          d=json.loads(p.read_text())
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["NQC_GITHUB_TOKEN"]
          sha40=re.compile(r"^[0-9a-f]{40}$")
          sha256=re.compile(r"^[0-9a-f]{64}$")
          if not token:
              raise AssertionError("missing GitHub Actions token for mismatch-ledger attestation")

          expected_resolution_roles={
              "PFT-MISMATCH-AAVE-ACCOUNTING-001":{
                  "resolution_full_account_risk",
                  "resolution_exact_account_risk",
              },
              "PFT-MISMATCH-AAVE-FLASH-PREMIUM-001":{
                  "resolution_executor_historical",
                  "resolution_full_liquidation_matrix",
              },
          }

          expected_producer={
              ("PFT-MISMATCH-AAVE-ACCOUNTING-001","resolution_full_account_risk"):(
                  "NQC T39 Aave Full Account Risk Parity",
                  ".github/workflows/nqc-protocol-fork-aave-full-account-risk-parity.yml",
                  "success",
              ),
              ("PFT-MISMATCH-AAVE-ACCOUNTING-001","resolution_exact_account_risk"):(
                  "NQC T39 Aave Account Risk Exact Parity",
                  ".github/workflows/nqc-protocol-fork-aave-account-risk-parity.yml",
                  "success",
              ),
              ("PFT-MISMATCH-AAVE-FLASH-PREMIUM-001","observed_mismatch"):(
                  "NQC T39 Aave Executor Historical Fork Parity",
                  ".github/workflows/nqc-protocol-fork-aave-executor-historical.yml",
                  "failure",
              ),
              ("PFT-MISMATCH-AAVE-FLASH-PREMIUM-001","resolution_executor_historical"):(
                  "NQC T39 Aave Executor Historical Fork Parity",
                  ".github/workflows/nqc-protocol-fork-aave-executor-historical.yml",
                  "success",
              ),
              ("PFT-MISMATCH-AAVE-FLASH-PREMIUM-001","resolution_full_liquidation_matrix"):(
                  "NQC T39 Aave Full Liquidation Integer Matrix",
                  ".github/workflows/nqc-protocol-fork-aave-liquidation-matrix.yml",
                  "success",
              ),
          }

          def api_get(path):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"nqc-parity-mismatch-ledger-v3",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read())

          def verify_artifact(entry_id,ref):
              role=ref.get("role")
              assert isinstance(role,str) and role, (entry_id,"missing role")
              producer_key=(entry_id,role)
              assert producer_key in expected_producer, (
                  entry_id,role,"no authoritative producer contract"
              )
              expected_name,expected_path,expected_conclusion=expected_producer[producer_key]
              head=ref["head"]
              run_id=int(ref["workflow_run_id"])
              artifact_id=int(ref["artifact_id"])
              digest=ref["artifact_sha256"]
              assert sha40.fullmatch(head), (entry_id,"bad head")
              assert run_id>0 and artifact_id>0, (entry_id,"bad ids")
              assert sha256.fullmatch(digest), (entry_id,"bad digest")
              actual=api_get(f"/actions/artifacts/{artifact_id}")
              assert int(actual["id"])==artifact_id, (entry_id,"artifact id mismatch")
              assert actual.get("expired") is False, (entry_id,"artifact expired")
              assert actual.get("digest")==f"sha256:{digest}", (
                  entry_id,"artifact digest mismatch",actual.get("digest")
              )
              run=actual.get("workflow_run") or {}
              assert int(run.get("id",0))==run_id, (entry_id,"run mismatch",run.get("id"))
              assert run.get("head_sha")==head, (
                  entry_id,"head mismatch",run.get("head_sha"),head
              )
              run_detail=api_get(f"/actions/runs/{run_id}")
              assert int(run_detail.get("id",0))==run_id, (entry_id,"run detail id mismatch")
              assert run_detail.get("head_sha")==head, (
                  entry_id,"run detail head mismatch",run_detail.get("head_sha"),head
              )
              assert run_detail.get("status")=="completed", (
                  entry_id,"workflow not completed",run_detail.get("status")
              )
              assert run_detail.get("conclusion")==expected_conclusion, (
                  entry_id,role,"unexpected workflow conclusion",
                  run_detail.get("conclusion"),expected_conclusion
              )
              assert run_detail.get("name")==expected_name, (
                  entry_id,role,"workflow name mismatch",run_detail.get("name"),expected_name
              )
              assert run_detail.get("path")==expected_path, (
                  entry_id,role,"workflow path mismatch",run_detail.get("path"),expected_path
              )
          assert d["schema_version"] == 1
          assert d["gate"] == "PARITY_MISMATCH_LEDGER_OPEN_ZERO"
          entries=d["entries"]
          semantic=[x for x in entries if x["classification"]=="SEMANTIC_MISMATCH"]
          resolved=[x for x in semantic if x["status"]=="RESOLVED"]
          pending=[x for x in semantic if x["status"]!="RESOLVED"]
          unexplained=[x for x in pending if not x.get("explanation")]
          for entry in semantic:
              refs=entry.get("evidence_refs",[])
              assert refs, (entry["id"],"semantic mismatch lacks content-addressed evidence")
              roles=set()
              for ref in refs:
                  assert ref["role"] not in roles, (entry["id"],"duplicate evidence role",ref["role"])
                  roles.add(ref["role"])
                  verify_artifact(entry["id"],ref)
              if entry["status"]=="RESOLVED":
                  required_roles=expected_resolution_roles.get(entry["id"])
                  assert required_roles is not None, (
                      entry["id"],"resolved mismatch has no declared resolution-role contract"
                  )
                  assert required_roles.issubset(roles), (
                      entry["id"],"resolved mismatch lacks required resolution evidence",
                      sorted(required_roles-roles)
                  )
                  verification=entry.get("verification",{})
                  assert verification.get("result")=="PASS", (
                      entry["id"],"resolved mismatch verification not PASS"
                  )

          counts=d["counts"]
          assert counts["detected_semantic_mismatches"] == len(semantic)
          assert counts["resolved_semantic_mismatches"] == len(resolved)
          assert counts["open_total"] == len(pending)
          assert counts["unexplained_open"] == len(unexplained)
          assert counts["explained_repair_pending"] == len(pending)-len(unexplained)
          if counts["open_total"] == 0:
              assert d["status"] == "PASS"
              print("PARITY_MISMATCH_LEDGER_OPEN_ZERO_PASS")
          else:
              assert d["status"].startswith("NOT_TESTED_")
              print(
                  "PARITY_MISMATCH_LEDGER_PENDING "
                  f"open_total={counts['open_total']} "
                  f"unexplained_open={counts['unexplained_open']}"
              )
          assert d["protocol_fork_truth"] == "NOT_CLOSED"
          PY
