name: NEXUS Temporary Lockfile Repair

on:
  push:
    branches:
      - feat/capability-04-generative-readiness
    paths:
      - .github/workflows/repair-capability-lockfile.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-04-generative-readiness
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Regenerate workspace lockfile deterministically
        run: pnpm install --no-frozen-lockfile
      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          if [[ -z "$changed" ]]; then
            exit 0
          fi
          if [[ "$changed" != " M pnpm-lock.yaml" ]]; then
            echo "Unexpected files changed during lockfile regeneration" >&2
            exit 1
          fi
      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(ci): sync generative-readiness workspace lockfile"
          git push origin HEAD:feat/capability-04-generative-readiness
