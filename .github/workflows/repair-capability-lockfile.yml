name: NEXUS Temporary Lockfile Repair

on:
  push:
    branches:
      - feat/capability-03-local-presence
    paths:
      - .github/workflows/repair-capability-lockfile.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capability-03-local-presence
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate workspace lockfile deterministically
        run: pnpm install --no-frozen-lockfile
      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          if [[ -z "$changed" ]]; then
            echo "No lockfile drift to repair"
            exit 0
          fi
          if [[ "$changed" != " M pnpm-lock.yaml" ]]; then
            echo "Unexpected files changed during lockfile regeneration" >&2
            exit 1
          fi
      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(ci): sync local-presence workspace lockfile"
          git push origin HEAD:feat/capability-03-local-presence
