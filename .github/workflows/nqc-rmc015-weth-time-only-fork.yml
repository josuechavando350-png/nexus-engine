name: NQC RMC-015 WETH Time-Only Intrablock Probe
on:
  pull_request:
    paths:
      - '.github/workflows/nqc-rmc015-weth-time-only-fork.yml'
      - 'ci/nqc-census/rmc015_weth_time_only_inputs.py'
      - 'ci/nqc-census/test_rmc015_weth_time_only_inputs.py'
      - 'ci/nqc-census/weth-physical/test/NqcRmc015WethTimeOnlyHF.t.sol'
      - 'ci/nqc-census/weth-physical/foundry-time-only.toml'
      - 'ci/nqc-census/RMC015_WETH_TIME_ONLY_FORK_CONTRACT.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-time-only-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pin upstream and adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1048bb5558138429873b4459b9339f2527abbd13 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = 5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa
          python3 ci/nqc-census/test_rmc015_weth_time_only_inputs.py
          python3 ci/nqc-census/test_rmc016_top3_preblock_health.py
          python3 -m py_compile ci/nqc-census/rmc015_weth_time_only_inputs.py
          mkdir -p "$RUNNER_TEMP/rmc015-time"
          sha256sum ci/nqc-census/rmc015_weth_time_only_inputs.py ci/nqc-census/weth-physical/test/NqcRmc015WethTimeOnlyHF.t.sol > "$RUNNER_TEMP/rmc015-time/source-sha256.txt"
          echo RMC015_TIME_ONLY_NEGATIVE_TESTS_PASS
      - name: Reauthenticate previous original top-three real preblock HF evidence
        shell: bash
        run: |
          set -euo pipefail
          rid=37739986399
          head=1048bb5558138429873b4459b9339f2527abbd13
          aid=11533556749
          dg=069652fdb01f6921979edad188634a2fd6d72860163cbf6b3d47fab5fabe6fd6
          m="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid")"
          a="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid")"
          test "$(jq -r .status <<<"$m")" = completed
          test "$(jq -r .conclusion <<<"$m")" = success
          test "$(jq -r .name <<<"$m")" = 'NQC RMC-016 Top-Three WETH Preblock Health Truth'
          test "$(jq -r .head_sha <<<"$m")" = "$head"
          test "$(jq -r .expired <<<"$a")" = false
          test "$(jq -r .workflow_run.id <<<"$a")" = "$rid"
          test "$(jq -r .name <<<"$a")" = "rmc016-three-winner-preblock-hf-$head"
          test "$(jq -r .digest <<<"$a")" = "sha256:$dg"
          file="$RUNNER_TEMP/rmc015-time/source.zip"
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" -o "$file"
          printf '%s  %s\n' "$dg" "$file" | sha256sum --check --strict
          echo RMC015_IMMUTABLE_TOP3_HF_CERTIFICATE_VERIFIED
      - name: Independently verify three historical winning block timestamps
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/rmc015_weth_time_only_inputs.py --source-zip "$RUNNER_TEMP/rmc015-time/source.zip" --out "$RUNNER_TEMP/rmc015-time/anchors.json"
          jq -e '.status=="RMC015_REAL_TOP3_WETH_PREBLOCK_AND_WINNER_TIME_ANCHORS_PASS" and (.canonical_time_anchors|length)==3 and .source_two_operator_time_consensus==true and .time_only_fork_execution_performed==false and .real_market_census_closed==false' "$RUNNER_TEMP/rmc015-time/anchors.json"
      - name: Install pinned Foundry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rmc015-foundry"
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/rmc015-foundry.tar.gz" https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          printf '%s  %s\n' cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b "$RUNNER_TEMP/rmc015-foundry.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/rmc015-foundry.tar.gz" -C "$RUNNER_TEMP/rmc015-foundry"
          "$RUNNER_TEMP/rmc015-foundry/forge" --version
      - name: Physically test three counterfactual time-only changes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/rmc015-foundry:$PATH"
          root="$RUNNER_TEMP/rmc015-time"
          forge_root="$RUNNER_TEMP/rmc015-forge"
          mkdir -p "$forge_root/test" "$forge_root/src"
          cp ci/nqc-census/weth-physical/foundry-time-only.toml "$forge_root/foundry.toml"
          cp ci/nqc-census/weth-physical/test/NqcRmc015WethTimeOnlyHF.t.sol "$forge_root/test/"
          cd "$forge_root"
          forge fmt
          forge fmt --check
          forge build --sizes 2>&1 | tee "$root/build.txt"
          for i in 0 1 2; do
            rank=$((i+1))
            src="$root/anchors.json"
            export NQC_RMC015_BORROWER="$(jq -r ".canonical_time_anchors[$i].borrower" "$src")"
            export NQC_RMC015_PREVIOUS_BLOCK="$(jq -r ".canonical_time_anchors[$i].previous_block_number" "$src")"
            export NQC_RMC015_WINNER_BLOCK="$(jq -r ".canonical_time_anchors[$i].winning_block_number" "$src")"
            export NQC_RMC015_PREVIOUS_TIMESTAMP="$(jq -r ".canonical_time_anchors[$i].previous_block_timestamp" "$src")"
            export NQC_RMC015_WINNER_TIMESTAMP="$(jq -r ".canonical_time_anchors[$i].winning_block_timestamp" "$src")"
            export NQC_RMC015_SOURCE_PREVIOUS_HF="$(jq -r ".canonical_time_anchors[$i].previous_health_factor_wad" "$src")"
            forge test --fork-url https://eth.drpc.org --fork-block-number "$NQC_RMC015_PREVIOUS_BLOCK" --match-contract NqcRmc015WethTimeOnlyHfForkTest -vvv 2>&1 | tee "$root/rank-$rank.txt"
            grep -Fq 'Suite result: ok. 1 passed; 0 failed; 0 skipped' "$root/rank-$rank.txt"
            grep -Fq 'NQC_TIME_ONLY_HF_AFTER_WAD' "$root/rank-$rank.txt"
          done
          sha256sum foundry.toml test/NqcRmc015WethTimeOnlyHF.t.sol > "$root/formatted-tested-source.sha256"
      - name: Conserve measured health-factor changes, never assume capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rmc015-time" <<'PY'
          import json,re,hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          src=json.loads((root/"anchors.json").read_bytes())
          rows=[]
          for i,row in enumerate(src["canonical_time_anchors"],start=1):
              log=(root/f"rank-{i}.txt").read_text()
              def read(name):
                  matches=re.findall(re.escape(name)+r"\s*:\s*([0-9]+)",log)
                  assert len(matches)==1,(name,matches)
                  return int(matches[0])
              before=read("NQC_TIME_ONLY_HF_BEFORE_WAD")
              after=read("NQC_TIME_ONLY_HF_AFTER_WAD")
              crossed=read("NQC_TIME_ONLY_CROSSED_BELOW_ONE")
              assert before==int(row["previous_health_factor_wad"])
              assert crossed==int(after<10**18)
              rows.append({"rank":i,"previous_hf_wad":str(before),"winner_time_only_hf_wad":str(after),"time_only_below_one":bool(crossed)})
          out={"schema_version":1,"status":"RMC015_TOP3_TIME_ONLY_REAL_FORK_DIAGNOSTIC_PASS","observed_case_count":3,"time_only_below_one_count":sum(v["time_only_below_one"] for v in rows),"measurements":rows,"selected_using_future_winners":True,"intrablack_original_transactions_replayed":False,"nexus_execution_or_capture_proven":False,"external_gas_and_flash_funding_proven":False,"nexus_net_profit_proven":False,"real_market_census_closed":False}
          def canon(v):return (json.dumps(v,sort_keys=True,separators=(",",":"))+"\n").encode()
          out["report_sha256"]=hashlib.sha256(canon(out)).hexdigest()
          (root/"time-only-conclusion.json").write_bytes(canon(out))
          print(out["status"],"below_one",out["time_only_below_one_count"])
          PY
          (cd "$RUNNER_TEMP/rmc015-time" && find . -maxdepth 1 -type f ! -name source.zip ! -name archive.sha256 -printf '%f\n' | sort | while read -r file; do sha256sum "$file"; done > archive.sha256 && sha256sum --check --strict archive.sha256)
      - name: Preserve source evidence or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc015-three-weth-time-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rmc015-time/*.json
            ${{ runner.temp }}/rmc015-time/*.txt
            ${{ runner.temp }}/rmc015-time/*.sha256
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
