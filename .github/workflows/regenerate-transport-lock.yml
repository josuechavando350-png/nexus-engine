name: Regenerate transport workspace lockfile

on:
  push:
    branches:
      - feat/capability-01-transport-http3

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/capability-01-transport-http3
          fetch-depth: 0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Regenerate lockfile metadata only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit canonical lockfile and remove one-shot workflow
        env:
          EXPECTED_BRANCH: feat/capability-01-transport-http3
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/regenerate-transport-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile change was required"
            exit 1
          fi
          git commit -m "fix(transport): canonicalize workspace lockfile"
          git push origin HEAD:"$EXPECTED_BRANCH"
