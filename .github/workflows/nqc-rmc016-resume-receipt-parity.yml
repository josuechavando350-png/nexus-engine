name: NQC RMC-016 Independent Winner Receipt Continuation

on:
  push:
    branches:
      - 'nqc/rmc016-dual-receipt-parity-20261008'
    paths:
      - 'ci/nqc-census/rmc016_resume_verified_receipts.py'
      - 'ci/nqc-census/test_rmc016_resume_verified_receipts.py'
      - 'ci/nqc-census/RMC016_RESUMED_RECEIPT_PARITY_CONTRACT.md'
      - '.github/workflows/nqc-rmc016-resume-receipt-parity.yml'
  pull_request:
    paths:
      - 'ci/nqc-census/rmc016_resume_verified_receipts.py'
      - 'ci/nqc-census/test_rmc016_resume_verified_receipts.py'
      - 'ci/nqc-census/RMC016_RESUMED_RECEIPT_PARITY_CONTRACT.md'
      - '.github/workflows/nqc-rmc016-resume-receipt-parity.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nqc-rmc016-resumed-receipts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-adversarial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable historic inputs and test adversarial source recovery
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 569d4aaeecb3d066389c054efed695be02e3ef40 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = \
            "5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa"
          python3 ci/nqc-census/test_rmc016_resume_verified_receipts.py
          python3 -m py_compile \
            ci/nqc-census/rmc016_resume_verified_receipts.py \
            ci/nqc-census/test_rmc016_resume_verified_receipts.py
          echo RMC016_RESUMED_WINNER_RECEIPTS_ADVERSARIAL_TESTS_PASS

  independent-blockscout-receipts:
    needs: offline-adversarial-contract
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_RUN: '37718661409'
      SRC_HEAD: 'abe54f1f23bd7bff8c37871200f7da7c59c45ac3'
      SRC_TREE: 'c74f8d9d2c317a011284398643b2d4aa6de06e83'
      SRC_ARTIFACT: '11524139188'
      SRC_SHA: '6b4098c1acf153106ac5b67d2c5c7db5cd0295a16c782ad8c34ae75303306204'
      DRPC_RUN: '37719091371'
      DRPC_HEAD: '569d4aaeecb3d066389c054efed695be02e3ef40'
      DRPC_TREE: 'ba648214fb5cb1cdca1db1f42f28059054d78e63'
      DRPC_ARTIFACT: '11524199698'
      DRPC_SHA: '182b5e81b00ca04e53c9193c1496a725dc152ade9a17d3ab2dfaeb5045ac86b6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Authenticate canonical event source and failed dual-receipt predecessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqc016-resume-source"
          check() {
            local run="$1" head="$2" tree="$3" workflow="$4" conclusion="$5" artifact="$6" name="$7" digest="$8" out="$9"
            local r a
            r="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            a="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact")"
            test "$(jq -r '.status' <<<"$r")" = completed
            test "$(jq -r '.conclusion' <<<"$r")" = "$conclusion"
            test "$(jq -r '.name' <<<"$r")" = "$workflow"
            test "$(jq -r '.head_sha' <<<"$r")" = "$head"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')" = "$tree"
            test "$(jq -r '.expired' <<<"$a")" = false
            test "$(jq -r '.workflow_run.id' <<<"$a")" = "$run"
            test "$(jq -r '.name' <<<"$a")" = "$name"
            test "$(jq -r '.digest' <<<"$a")" = "sha256:$digest"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" -o "$out"
            printf '%s  %s\n' "$digest" "$out" | sha256sum -c --strict
            echo "RMC016_EXACT_WORKFLOW_ARTIFACT_PASS run=$run artifact=$artifact conclusion=$conclusion"
          }
          check "$SRC_RUN" "$SRC_HEAD" "$SRC_TREE" \
            'NQC RMC-016 Full Liquidation Ledger Discovery' success \
            "$SRC_ARTIFACT" "rmc016-full-liquidation-events-$SRC_HEAD" "$SRC_SHA" \
            "$RUNNER_TEMP/nqc016-resume-source/events.zip"
          check "$DRPC_RUN" "$DRPC_HEAD" "$DRPC_TREE" \
            'NQC RMC-016 Dual Operator Winner Receipt Parity' failure \
            "$DRPC_ARTIFACT" "rmc016-dual-winner-receipts-$DRPC_HEAD" "$DRPC_SHA" \
            "$RUNNER_TEMP/nqc016-resume-source/drpc-checkpoint.zip"
          echo "EVENT_ZIP=$RUNNER_TEMP/nqc016-resume-source/events.zip" >> "$GITHUB_ENV"
          echo "DRPC_CHECKPOINT_ZIP=$RUNNER_TEMP/nqc016-resume-source/drpc-checkpoint.zip" >> "$GITHUB_ENV"

      - name: Validate 127 Blockscout receipts against immutable 127 dRPC receipt witnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/rmc016_resume_verified_receipts.py \
            --source-zip "$EVENT_ZIP" \
            --drpc-checkpoint-zip "$DRPC_CHECKPOINT_ZIP" \
            --min-interval 3 \
            --out "$RUNNER_TEMP/nqc016-independent-receipts"
          REPORT="$RUNNER_TEMP/nqc016-independent-receipts/receipt-parity-report.json"
          jq -e '
            .schema_version == 1 and
            .status == "RMC016_TWO_OPERATOR_RECEIPT_PARITY_HISTORICAL_ONLY" and
            .historical_source_event_run_id == 37718661409 and
            .prior_drpc_checkpoint_run_id == 37719091371 and
            .prior_drpc_workflow_completed_successfully == false and
            .prior_drpc_receipt_stage_complete == true and
            .blockscout_receipt_stage_complete == true and
            .independent_receipt_operator_count == 2 and
            .source_liquidation_event_count == 139 and
            .unique_winner_transaction_count == 127 and
            .gas_paid_wei == "448369976498898050" and
            .independent_full_window_event_enumeration_certified == false and
            .historical_gas_usd_certified == false and
            .all_route_costs_certified == false and
            .nexus_external_gas_funding_proven == false and
            .nexus_execution_proven == false and
            .nexus_capture_calibrated == false and
            .nexus_realized_pnl_proven == false and
            .nexus_monthly_net_pnl_estimate_usd == null and
            .real_market_census_closed == false
          ' "$REPORT" >/dev/null
          (cd "$RUNNER_TEMP/nqc016-independent-receipts" && sha256sum -c archive.sha256)
          echo RMC016_127_HISTORICAL_RECEIPTS_TWO_OPERATOR_PARITY_PASS_NOT_NEXUS_PNL

      - name: Preserve immutable success or partial second-operator receipt diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc016-resumed-independent-receipts-${{ github.sha }}
          path: ${{ runner.temp }}/nqc016-independent-receipts/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
