name: NEXUS Real Browser Capture Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXUS_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/browser-capture
  NEXUS_VISUAL_BASELINE_DIR: quality-baselines/browser-capture
  NEXUS_VISUAL_MAX_CHANGED_RATIO: "0.001"

jobs:
  real-browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact source and pristine checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$NEXUS_VALIDATED_SHA" || exit 1
          test -z "$(git status --porcelain)"
          git show-ref --verify --quiet refs/remotes/origin/main
          mkdir -p artifacts/browser-capture
          printf '%s\n' "$actual" > artifacts/browser-capture/validated-source-sha.txt

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install real browser engines
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            echo "Playwright install attempt ${attempt}/3"
            if pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 15))
          done

      - name: Install perceptual comparison tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          compare -version
          identify -version

      - name: Capture visual baseline from base revision
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [ -z "$base_sha" ] || echo "$base_sha" | grep -Eq '^0+$'; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          test "$base_sha" != "$NEXUS_VALIDATED_SHA" || {
            if git rev-parse HEAD^ >/dev/null 2>&1; then base_sha="$(git rev-parse HEAD^)"; fi
          }
          echo "Visual baseline source: $base_sha"
          rm -rf /tmp/nexus-visual-base .artifacts/baseline-capture "$NEXUS_VISUAL_BASELINE_DIR"
          git worktree add --detach /tmp/nexus-visual-base "$base_sha"
          (
            cd /tmp/nexus-visual-base
            corepack enable
            corepack prepare pnpm@10.15.0 --activate
            pnpm install --frozen-lockfile
            NEXUS_CAPTURE_EVIDENCE_DIR="$GITHUB_WORKSPACE/.artifacts/baseline-capture" pnpm --filter @nexus/capture test:browser
          )
          mkdir -p "$NEXUS_VISUAL_BASELINE_DIR"
          cp "$GITHUB_WORKSPACE"/.artifacts/baseline-capture/*.png "$NEXUS_VISUAL_BASELINE_DIR"/
          test "$(find "$NEXUS_VISUAL_BASELINE_DIR" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "6"
          printf '%s\n' "$base_sha" > .artifacts/visual-baseline-source-sha.txt
          git worktree remove --force /tmp/nexus-visual-base

      - name: Capture Chromium and WebKit evidence
        run: pnpm --filter @nexus/capture test:browser

      - name: Capture CANO client at mobile tablet and desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-capture/cano-penal
          pnpm --filter @nexus/cano-penal build
          pnpm --filter @nexus/cano-penal start -- -p 3102 >/tmp/cano-penal-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3102/ >/tmp/cano-home.html; then
              break
            fi
            test "$attempt" -lt 60 || { cat /tmp/cano-penal-next.log; exit 1; }
            sleep 1
          done
          grep -Fq 'Conozco cómo investiga la autoridad.' /tmp/cano-home.html
          for asset in logo-cano.png eduardo-cano-escritorio.jpg audiencia-01.jpg audiencia-02.jpg audiencia-03.jpg audiencia-04.jpg audiencia-05.jpg; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:3102/media/$asset"
          done
          pnpm --filter @nexus/capture exec playwright screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3102/ artifacts/browser-capture/cano-penal/mobile-390.png
          pnpm --filter @nexus/capture exec playwright screenshot --browser=chromium --viewport-size="768,1024" --full-page http://127.0.0.1:3102/ artifacts/browser-capture/cano-penal/tablet-768.png
          pnpm --filter @nexus/capture exec playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:3102/ artifacts/browser-capture/cano-penal/desktop-1440.png
          test "$(find artifacts/browser-capture/cano-penal -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "3"

      - name: Verify persisted evidence
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/browser-capture"
          mutations="$root/mutations"
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          test "$(tr -d '\n\r' < "$root/validated-source-sha.txt")" = "$NEXUS_VALIDATED_SHA"
          test -f "$root/capture-manifest.json"
          test "$(find "$root" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "6"
          test "$(find "$root" -maxdepth 1 -type f -name '*-axe.json' | wc -l | tr -d ' ')" = "6"
          test "$(find "$root" -maxdepth 1 -type f -name '*-design-genome.json' | wc -l | tr -d ' ')" = "6"
          test "$(find "$root" -maxdepth 1 -type f -name '*-apca.json' | wc -l | tr -d ' ')" = "6"
          test "$(find "$root" -maxdepth 1 -type f -name '*-performance.json' | wc -l | tr -d ' ')" = "6"
          test "$(find "$mutations" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "8"
          test "$(find "$mutations" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = "8"
          test "$(find "$root/cano-penal" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "3"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'artifacts/browser-capture';
          for (const suffix of ['-axe.json','-design-genome.json','-apca.json','-performance.json']) {
            const files = fs.readdirSync(root).filter(n => n.endsWith(suffix));
            if (files.length !== 6) process.exit(1);
            for (const name of files) JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          }
          const expected = new Set(['BRAND_SWAP','INDUSTRY_TRANSPLANT','GRAYSCALE','MOTION_REMOVAL','VIEWPORT_TORTURE_NARROW','VIEWPORT_TORTURE_WIDE','CONTENT_STRESS','ASSET_DEGRADATION']);
          for (const name of fs.readdirSync(path.join(root,'mutations')).filter(n => n.endsWith('.json'))) {
            const d = JSON.parse(fs.readFileSync(path.join(root,'mutations',name),'utf8'));
            if (!expected.delete(d.mutationId) || !d.diagnostics || d.diagnostics.visibleElementCount <= 0) process.exit(1);
          }
          if (expected.size) process.exit(1);
          NODE
          find "$root" -type f ! -name 'artifact-checksums.sha256' -print0 | sort -z | xargs -0 sha256sum > "$root/artifact-checksums.sha256"
          test -s "$root/artifact-checksums.sha256"
          sha256sum -c "$root/artifact-checksums.sha256"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Evaluate visual baseline and generate CI Quality Passport
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci-browser-quality.mjs
          test -s "$NEXUS_CAPTURE_EVIDENCE_DIR/quality-passport-ci.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.NEXUS_CAPTURE_EVIDENCE_DIR + '/quality-passport-ci.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (p.authority !== 'NEXUS_CI_QUALITY_PASSPORT_V1' || !p.passportSha256) process.exit(1);
          if (p.visualRegression?.verdict !== 'PASS') {
            console.error(`Visual evidence must PASS for V10 closure; got ${p.visualRegression?.verdict || 'MISSING'}`);
            process.exit(1);
          }
          console.log('Passport visual verdict: PASS');
          NODE

      - name: Upload real browser evidence and Quality Passport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-real-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/browser-capture
            .artifacts/visual-baseline-source-sha.txt
          if-no-files-found: error
          retention-days: 90
