name: NQC T39 Aave Full Liquidation Integer Matrix

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-aave-liquidation-matrix.yml
      - ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py
      - ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_parity.py
      - ci/nqc-protocol-fork/corpus/cases/aave-liquidation-*.json
      - ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py
      - ci/nqc-protocol-fork/recovered-source/**
      - ci/nqc-protocol-fork/compatibility/**
      - ci/nqc-protocol-fork/locks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-liquidation-integer-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_TOOLCHAIN: "1.98.1"
      FOUNDRY_VERSION: "1.7.1"
      FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
      SOLC_VERSION: "0.8.24+commit.e11b9ed9"
      SOLC_SHA256: "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f"
      NQC_MATRIX: /tmp/nqc-aave-liquidation-matrix

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable inputs and prepare isolated sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          rm -rf "$NQC_MATRIX"
          mkdir -p "$NQC_MATRIX/foundry/src" "$NQC_MATRIX/foundry/test"             "$NQC_MATRIX/source" "$NQC_MATRIX/evidence/blastapi-public"             "$NQC_MATRIX/evidence/mevblocker-rpc" "$NQC_MATRIX/evidence/canonical"
          git rev-parse HEAD > "$NQC_MATRIX/evidence/repository-source-sha.txt"
          (cd ci/nqc-protocol-fork/recovered-source && sha256sum -c SOURCE_FILES.sha256)
          cp -a ci/nqc-protocol-fork/recovered-source/. "$NQC_MATRIX/source/"
          patch --dry-run --silent -p1 -d "$NQC_MATRIX/source" < \
            ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch
          patch --silent -p1 -d "$NQC_MATRIX/source" < \
            ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch
          grep -F 'percent_mul_ceil_unbounded' \
            "$NQC_MATRIX/source/crates/nqc-aave-opportunity/src/lib.rs"
          python3 ci/nqc-protocol-fork/parity/prepare_reserve_parity.py "$NQC_MATRIX/source"

          python3 ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py             --multi ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json             --single ci/nqc-protocol-fork/corpus/cases/aave-liquidation-usdc-2026-a36f.json             --output "$NQC_MATRIX/foundry/test/PftAaveLiquidationMatrixWitness.t.sol"

          cat > "$NQC_MATRIX/foundry/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "../evidence" }]
          EOF

          sha256sum             ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json             ci/nqc-protocol-fork/corpus/cases/aave-liquidation-usdc-2026-a36f.json             ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch             ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.json             ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py             ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_parity.py             "$NQC_MATRIX/foundry/test/PftAaveLiquidationMatrixWitness.t.sol"             > "$NQC_MATRIX/evidence/input-source.sha256"

      - name: Install pinned Foundry solc and Rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NQC_MATRIX/bin"
          curl --fail --location --retry 5 --retry-all-errors             -o "$NQC_MATRIX/foundry.tar.gz"             "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  $NQC_MATRIX/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$NQC_MATRIX/foundry.tar.gz" -C "$NQC_MATRIX/bin"
          export PATH="$NQC_MATRIX/bin:$PATH"
          forge --version | tee "$NQC_MATRIX/evidence/forge.txt"
          forge --version | grep -F "$FOUNDRY_VERSION"

          curl --fail --location --retry 5 --retry-all-errors             -o "$NQC_MATRIX/solc-0.8.24"             "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9"
          echo "$SOLC_SHA256  $NQC_MATRIX/solc-0.8.24" | sha256sum -c -
          chmod +x "$NQC_MATRIX/solc-0.8.24"
          "$NQC_MATRIX/solc-0.8.24" --version | tee "$NQC_MATRIX/evidence/solc.txt"
          "$NQC_MATRIX/solc-0.8.24" --version | grep -F "$SOLC_VERSION"

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv | tee "$NQC_MATRIX/evidence/rustc.txt"
          cargo fetch --locked --manifest-path "$NQC_MATRIX/source/Cargo.toml"

      - name: Capture all 15 transaction-prestate liquidation witnesses from both providers
        shell: bash
        working-directory: /tmp/nqc-aave-liquidation-matrix/foundry
        run: |
          set -euo pipefail
          export PATH="$NQC_MATRIX/bin:$PATH"

          for entry in             'blastapi-public|https://eth-mainnet.public.blastapi.io|18901|0.35'             'mevblocker-rpc|https://rpc.mevblocker.io|18902|1.25'; do
            IFS='|' read -r provider_id provider_url port min_interval <<< "$entry"

            NQC_PFT_PROXY_PORT="$port"             NQC_PFT_UPSTREAM_URL="$provider_url"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval"             NQC_PFT_MAX_ATTEMPTS=12             NQC_PFT_UPSTREAM_TIMEOUT_SECONDS=60             NQC_PFT_PROXY_LOG="$NQC_MATRIX/evidence/$provider_id-throttle.jsonl"               python3 "$GITHUB_WORKSPACE/ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py"               > "$NQC_MATRIX/evidence/$provider_id-throttle.log" 2>&1 &
            proxy_pid=$!
            trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 150); do
              if curl --silent --fail "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
                ready=1; break
              fi
              sleep 0.1
            done
            test "$ready" -eq 1

            PFT_RPC_URL="http://127.0.0.1:$port"             PFT_WITNESS_DIR="$NQC_MATRIX/evidence/$provider_id"               forge test --use "$NQC_MATRIX/solc-0.8.24"                 --match-contract PftAaveLiquidationMatrixWitnessTest -vvvv                 2>&1 | tee "$NQC_MATRIX/evidence/$provider_id-foundry.log"
            grep -F "2 tests passed, 0 failed, 0 skipped (2 total tests)"               "$NQC_MATRIX/evidence/$provider_id-foundry.log"
            test "$(find "$NQC_MATRIX/evidence/$provider_id" -maxdepth 1 -name '*.json' | wc -l)" -eq 15
            for index in $(seq 0 14); do
              test -s "$NQC_MATRIX/evidence/$provider_id/$index.json"
              python3 -m json.tool "$NQC_MATRIX/evidence/$provider_id/$index.json" >/dev/null
            done

            kill "$proxy_pid"
            wait "$proxy_pid" 2>/dev/null || true
            trap - EXIT
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/nqc-aave-liquidation-matrix/evidence")
          for index in range(15):
              left=json.loads((root/"blastapi-public"/f"{index}.json").read_text())
              right=json.loads((root/"mevblocker-rpc"/f"{index}.json").read_text())
              if left != right:
                  keys=sorted(k for k in set(left)|set(right) if left.get(k)!=right.get(k))
                  raise SystemExit(f"PROVIDER_DISSENT case={index} keys={keys}")
              (root/"canonical"/f"{index}.json").write_text(
                  json.dumps(left,indent=2,sort_keys=True)+"\n"
              )
          print("AAVE_LIQUIDATION_MATRIX_TWO_PROVIDER_WITNESS_PASS cases=15")
          PY

      - name: Execute recovered integer math over complete admitted corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_parity.py             --witness-dir "$NQC_MATRIX/evidence/canonical"             --multi ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json             --single ci/nqc-protocol-fork/corpus/cases/aave-liquidation-usdc-2026-a36f.json             --output "$NQC_MATRIX/source/crates/nqc-aave-math/examples/pft_liquidation_matrix.rs"
          cp "$NQC_MATRIX/source/crates/nqc-aave-math/examples/pft_liquidation_matrix.rs"             "$NQC_MATRIX/evidence/"

          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo check --locked --offline \
            --manifest-path "$NQC_MATRIX/source/Cargo.toml" \
            -p nqc-aave-opportunity
          cargo run --locked --offline             --manifest-path "$NQC_MATRIX/source/Cargo.toml"             -p nqc-aave-math --example pft_liquidation_matrix             2>&1 | tee "$NQC_MATRIX/evidence/liquidation-matrix.log"

          test "$(grep -c '^AAVE_LIQUIDATION_MATRIX_PASS ' "$NQC_MATRIX/evidence/liquidation-matrix.log")" -eq 15
          grep -E '^AAVE_LIQUIDATION_MATRIX_TOTAL cases=15 exact_integer_checks=60 default_close_cap_matches=[1-9][0-9]* full_close_cap_matches=[1-9][0-9]* unexplained_mismatches=0$'             "$NQC_MATRIX/evidence/liquidation-matrix.log"

          printf '%s\n' 'PASS_ALL_15_HISTORICAL_LIQUIDATIONS_EXACT_INTEGER_MATH'             > "$NQC_MATRIX/evidence/parity-status.txt"
          printf '%s\n' 'PASS' > "$NQC_MATRIX/evidence/AAVE_LIQUIDATION_INTEGER_MATH_PARITY.txt"
          printf '%s\n' '0' > "$NQC_MATRIX/evidence/unexplained-mismatch-count.txt"
          printf '%s\n' 'NOT_CLOSED' > "$NQC_MATRIX/evidence/protocol-fork-truth.txt"
          (
            cd "$NQC_MATRIX/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve complete liquidation matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-aave-liquidation-matrix-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-aave-liquidation-matrix/evidence
          if-no-files-found: error
          retention-days: 30
