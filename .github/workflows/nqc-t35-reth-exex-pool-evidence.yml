name: NQC T35 Reth P2P ExEx Physical Evidence v2

on:
  push:
    branches:
      - nqc/t35-reth-physical-evidence-20260926
    paths:
      - .github/workflows/nqc-t35-reth-exex-pool-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-reth:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain and upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-t35/evidence
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc -Vv | tee /tmp/nqc-t35/evidence/rustc.txt
          cargo -V | tee /tmp/nqc-t35/evidence/cargo.txt
          cat > /tmp/nqc-t35/evidence/upstream-pin.json <<'EOF'
          {
            "release_tag": "v2.5.2",
            "annotated_tag_object_sha": "d62e996e15a2fb67c190e9baaeeba79df5415346",
            "source_commit_sha": "5a6940e351fed80458fe6c9da8581cbe4b8bd036",
            "release_asset": "reth-v2.5.2-x86_64-unknown-linux-gnu.tar.gz",
            "release_asset_sha256": "e360895ac51b351ff0c44573f0f619bb1e7c3ff2df55502af1190c14c9b5ef6d"
          }
          EOF

      - name: Verify official Reth release and exact source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35
          curl --fail --location --retry 5 --retry-all-errors             -o reth-release.tar.gz             https://github.com/paradigmxyz/reth/releases/download/v2.5.2/reth-v2.5.2-x86_64-unknown-linux-gnu.tar.gz
          echo "e360895ac51b351ff0c44573f0f619bb1e7c3ff2df55502af1190c14c9b5ef6d  reth-release.tar.gz" | sha256sum -c -
          sha256sum reth-release.tar.gz > evidence/upstream-release.sha256
          git clone --filter=blob:none https://github.com/paradigmxyz/reth.git reth
          cd reth
          git checkout --detach 5a6940e351fed80458fe6c9da8581cbe4b8bd036
          test "$(git rev-parse HEAD)" = "5a6940e351fed80458fe6c9da8581cbe4b8bd036"
          test -z "$(git status --porcelain=v1)"
          sha256sum Cargo.lock > ../evidence/upstream-cargo-lock.sha256
          git rev-parse HEAD > ../evidence/upstream-source-commit.txt

      - name: Cache pinned Reth build products
        id: reth-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/nqc-t35/reth/target
          key: nqc-t35-reth-v2.5.2-rust1.98.1-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build pinned NQC Sensor Fabric recognition bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat \
            .github/nqc-t35/sensor-runtime.tar.gz.b64 \
            .github/nqc-t35/sensor-runtime.tar.gz.b64.part01 \
            .github/nqc-t35/sensor-runtime.tar.gz.b64.part02 \
            .github/nqc-t35/sensor-runtime.tar.gz.b64.part03 \
            | base64 -d > /tmp/nqc-t35/sensor-runtime.tar.gz
          echo "4aa5178d6fe6cf1a5de412cc96152d48e45b188ea74af4361ab0ea44c122329e  /tmp/nqc-t35/sensor-runtime.tar.gz" | sha256sum -c -
          rm -rf /tmp/nqc-t35/sensor-runtime
          mkdir -p /tmp/nqc-t35/sensor-runtime
          tar -xzf /tmp/nqc-t35/sensor-runtime.tar.gz -C /tmp/nqc-t35/sensor-runtime
          (
            cd /tmp/nqc-t35/sensor-runtime
            sha256sum -c SOURCE_SHA256SUMS.txt
            cargo generate-lockfile
            cargo build -p nqc-t35-sensor-bridge
          )
          SENSOR_BIN=/tmp/nqc-t35/sensor-runtime/target/debug/nqc-t35-sensor-bridge
          test -x "$SENSOR_BIN"
          sha256sum "$SENSOR_BIN" > /tmp/nqc-t35/evidence/sensor-bridge-binary.sha256
          stat -c %s "$SENSOR_BIN" > /tmp/nqc-t35/evidence/sensor-bridge-binary.size
          sha256sum /tmp/nqc-t35/sensor-runtime/Cargo.lock > /tmp/nqc-t35/evidence/sensor-runtime-cargo-lock.sha256
          cp /tmp/nqc-t35/sensor-runtime/SOURCE_SHA256SUMS.txt /tmp/nqc-t35/evidence/sensor-runtime-source.sha256sums
          echo "4aa5178d6fe6cf1a5de412cc96152d48e45b188ea74af4361ab0ea44c122329e  sensor-runtime.tar.gz" > /tmp/nqc-t35/evidence/sensor-runtime-bundle.sha256

      - name: Install observation-only ExEx observer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth
          python3 - <<'PY'
          from pathlib import Path

          network = Path("crates/net/network/src/transactions/mod.rs")
          ns = network.read_text()
          method_marker = "    fn on_network_tx_event(&mut self, event: NetworkTransactionEvent<N>) {"
          if method_marker not in ns:
              raise SystemExit("network transaction event method marker missing")
          helper = r'''    fn nqc_t35_capture_peer_signal(
                  peer_id: &PeerId,
                  kind: &str,
                  hash: &B256,
                  wire_payload_hash: &B256,
              ) {
                  let Some(path) = std::env::var_os("NQC_T35_P2P_RAW") else { return };
                  static START: std::sync::OnceLock<std::time::Instant> = std::sync::OnceLock::new();
                  let origin = START.get_or_init(std::time::Instant::now);
                  let now = || u64::try_from(origin.elapsed().as_nanos()).unwrap_or(u64::MAX).saturating_add(1);
                  let receive = now();
                  let decoded = now();
                  let ingested = now();
                  let recognized = now();
                  let line = format!(
                      "{{\"kind\":\"{}\",\"peer_id_full\":\"{:#x}\",\"tx_hash\":\"{:#x}\",\"wire_payload_hash\":\"{:#x}\",\"wire_payload_hash_algorithm\":\"KECCAK256_RLP_ETH_MESSAGE_BODY\",\"origin\":\"External\",\"capture_receive_relative_ns\":{},\"capture_decoded_relative_ns\":{},\"capture_ingested_relative_ns\":{},\"capture_recognized_relative_ns\":{}}}",
                      kind, peer_id, hash, wire_payload_hash, receive, decoded, ingested, recognized
                  );
                  if let Ok(mut file) = std::fs::OpenOptions::new().create(true).append(true).open(path) {
                      use std::io::Write as _;
                      let _ = writeln!(file, "{line}");
                  }
                  if let Some(socket_path) = std::env::var_os("NQC_T35_SENSOR_SOCKET") {
                      if let Ok(socket) = std::os::unix::net::UnixDatagram::unbound() {
                          let _ = socket.send_to(line.as_bytes(), socket_path);
                      }
                  }
              }

          '''
          ns = ns.replace(method_marker, helper + method_marker, 1)

          full_anchor = '''                // ensure we didn't receive any blob transactions as these are disallowed to be
          '''
          full_insert = '''                let nqc_t35_wire_payload_hash =
                    alloy_primitives::keccak256(alloy_rlp::encode(&msg));
                for tx in &msg.0 {
                    Self::nqc_t35_capture_peer_signal(
                        &peer_id,
                        "IncomingTransactions",
                        tx.tx_hash(),
                        &nqc_t35_wire_payload_hash,
                    );
                }

                // ensure we didn't receive any blob transactions as these are disallowed to be
          '''
          if full_anchor not in ns:
              raise SystemExit("full transaction capture anchor missing")
          ns = ns.replace(full_anchor, full_insert, 1)

          network.write_text(ns)

          root = Path("Cargo.toml")
          s = root.read_text()
          anchor = '    "examples/network/",\n'
          member = '    "examples/nqc-t35-observer",\n'
          if member not in s:
              if anchor not in s:
                  raise SystemExit("workspace member anchor missing")
              root.write_text(s.replace(anchor, anchor + member, 1))

          p = Path("examples/nqc-t35-observer")
          (p / "src").mkdir(parents=True, exist_ok=True)
          (p / "Cargo.toml").write_text(r'''[package]
          name = "nqc-t35-observer"
          version = "0.0.0"
          publish = false
          edition.workspace = true
          license.workspace = true

          [dependencies]
          reth = { path = "../../bin/reth", default-features = false, features = ["dev"] }
          reth-exex.workspace = true
          reth-node-api.workspace = true
          reth-node-ethereum.workspace = true
          futures-util.workspace = true
          eyre.workspace = true
          alloy-consensus.workspace = true

          [lints]
          workspace = true
          ''')

          (p / "src/main.rs").write_text(r'''use futures_util::TryStreamExt;
          use alloy_consensus::BlockHeader;
          use reth_exex::{ExExContext, ExExEvent, ExExNotification};
          use reth_node_api::FullNodeComponents;
          use reth_node_ethereum::EthereumNode;
          use std::io::Write as _;

          fn monotonic_ns() -> u64 {
              static START: std::sync::OnceLock<std::time::Instant> = std::sync::OnceLock::new();
              let origin = START.get_or_init(std::time::Instant::now);
              u64::try_from(origin.elapsed().as_nanos()).unwrap_or(u64::MAX).saturating_add(1)
          }

          fn write_exex(kind: &str, number: u64, hash: impl core::fmt::Display) {
              let Some(path) = std::env::var_os("NQC_T35_EXEX_RAW") else { return };
              let receive = monotonic_ns();
              let decoded = monotonic_ns();
              let ingested = monotonic_ns();
              let recognized = monotonic_ns();
              let line = format!(
                  "{{\"notification_kind\":\"{}\",\"canonical_block_number\":{},\"canonical_block_hash\":\"{}\",\"capture_receive_relative_ns\":{},\"capture_decoded_relative_ns\":{},\"capture_ingested_relative_ns\":{},\"capture_recognized_relative_ns\":{}}}",
                  kind, number, hash, receive, decoded, ingested, recognized
              );
              if let Ok(mut f) = std::fs::OpenOptions::new().create(true).append(true).open(path) {
                  let _ = writeln!(f, "{line}");
              }
              if let Some(socket_path) = std::env::var_os("NQC_T35_SENSOR_SOCKET") {
                  if let Ok(socket) = std::os::unix::net::UnixDatagram::unbound() {
                      let _ = socket.send_to(line.as_bytes(), socket_path);
                  }
              }
          }

          async fn observer<Node: FullNodeComponents>(mut ctx: ExExContext<Node>) -> eyre::Result<()> {
              while let Some(notification) = ctx.notifications.try_next().await? {
                  match &notification {
                      ExExNotification::ChainCommitted { new } => write_exex("ChainCommitted", new.tip().number(), new.tip().hash()),
                      ExExNotification::ChainReorged { new, .. } => write_exex("ChainReorged", new.tip().number(), new.tip().hash()),
                      ExExNotification::ChainReverted { old } => write_exex("ChainReverted", old.tip().number(), old.tip().hash()),
                  }
                  if let Some(committed) = notification.committed_chain() {
                      ctx.events.send(ExExEvent::FinishedHeight(committed.tip().num_hash()))?;
                  }
              }
              Ok(())
          }

          fn main() -> eyre::Result<()> {
              reth::cli::Cli::parse_args().run(async move |builder, _| {
                  let handle = builder
                      .node(EthereumNode::default())
                      .install_exex("NQC-T35-Observer", async move |ctx| Ok(observer(ctx)))
                      .launch_with_debug_capabilities()
                      .await?;
                  handle.wait_for_node_exit().await
              })
          }
          ''')
          PY
          git add -N examples/nqc-t35-observer/Cargo.toml examples/nqc-t35-observer/src/main.rs
          git diff --check
          git diff --binary > /tmp/nqc-t35/evidence/nqc-t35-observer.patch
          test -s /tmp/nqc-t35/evidence/nqc-t35-observer.patch
          sha256sum /tmp/nqc-t35/evidence/nqc-t35-observer.patch > /tmp/nqc-t35/evidence/observer-patch.sha256
          git diff --stat | tee /tmp/nqc-t35/evidence/observer-patch.stat
          {
            sha256sum \
              Cargo.toml \
              crates/net/network/src/transactions/mod.rs \
              examples/nqc-t35-observer/Cargo.toml \
              examples/nqc-t35-observer/src/main.rs
          } | sort > /tmp/nqc-t35/evidence/capture-source-files.sha256sums
          sha256sum /tmp/nqc-t35/evidence/capture-source-files.sha256sums > /tmp/nqc-t35/evidence/capture-source-tree.sha256

      - name: Build pinned observer binary
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth
          cargo build -p nqc-t35-observer
          BIN="$PWD/target/debug/nqc-t35-observer"
          test -x "$BIN"
          "$BIN" --version | tee /tmp/nqc-t35/evidence/observer-version.txt
          sha256sum "$BIN" > /tmp/nqc-t35/evidence/observer-binary.sha256
          stat -c %s "$BIN" > /tmp/nqc-t35/evidence/observer-binary.size
          git diff --binary | sha256sum | awk '{print $1}' > /tmp/nqc-t35/evidence/observer-source-patch.sha256

      - name: Save pinned Reth build cache
        if: steps.reth-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/nqc-t35/reth/target
          key: nqc-t35-reth-v2.5.2-rust1.98.1-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Run physical two-node Reth P2P ExEx IPC experiment
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth
          BIN="$PWD/target/debug/nqc-t35-observer"
          rm -rf /tmp/nqc-a /tmp/nqc-b
          rm -f /tmp/nqc-a.ipc /tmp/nqc-b.ipc /tmp/nqc-a-p2p.raw /tmp/nqc-a-exex.raw /tmp/nqc-t35-sensor.sock
          rm -f /tmp/nqc-t35/evidence/p2p.ndjson /tmp/nqc-t35/evidence/exex.ndjson /tmp/nqc-t35/evidence/sensor-bridge-ready.txt /tmp/nqc-t35/evidence/sensor-bridge-complete.txt
          mkdir -p /tmp/nqc-a /tmp/nqc-b

          cleanup() {
            test -f /tmp/nqc-t35/sensor.pid && kill "$(cat /tmp/nqc-t35/sensor.pid)" 2>/dev/null || true
            test -f /tmp/nqc-t35/a.pid && kill "$(cat /tmp/nqc-t35/a.pid)" 2>/dev/null || true
            test -f /tmp/nqc-t35/b.pid && kill "$(cat /tmp/nqc-t35/b.pid)" 2>/dev/null || true
          }
          trap cleanup EXIT

          NQC_T35_EXEX_RAW=/tmp/nqc-b-exex.raw           "$BIN" node --dev --dev.block-time 10s --datadir /tmp/nqc-b             --disable-discovery --no-persist-peers --nat none             --ipcpath /tmp/nqc-b.ipc --http --http.addr 127.0.0.1 --http.port 18546             --http.api admin,eth,net,web3 --port 31304 --authrpc.port 18552             > /tmp/nqc-t35/evidence/reth-b.log 2>&1 &
          echo $! > /tmp/nqc-t35/b.pid

          for i in $(seq 1 120); do
            curl -fsS -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}'               http://127.0.0.1:18546 > /tmp/nqc-t35/evidence/b-client.json && break
            sleep 1
          done
          test -s /tmp/nqc-t35/evidence/b-client.json

          curl -fsS -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"admin_nodeInfo","params":[]}'             http://127.0.0.1:18546 > /tmp/nqc-t35/evidence/b-nodeinfo.json
          ENODE="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/nqc-t35/evidence/b-nodeinfo.json'))['result']['enode'])
          PY
          )"
          test -n "$ENODE"

          NQC_T35_P2P_RAW=/tmp/nqc-a-p2p.raw NQC_T35_EXEX_RAW=/tmp/nqc-a-exex.raw NQC_T35_SENSOR_SOCKET=/tmp/nqc-t35-sensor.sock           "$BIN" node --dev --dev.block-time 10s --datadir /tmp/nqc-a             --disable-discovery --trusted-only --trusted-peers "$ENODE" --no-persist-peers --nat none             --ipcpath /tmp/nqc-a.ipc --http --http.addr 127.0.0.1 --http.port 18545             --http.api admin,eth,net,web3 --port 31303 --authrpc.port 18551             > /tmp/nqc-t35/evidence/reth-a.log 2>&1 &
          echo $! > /tmp/nqc-t35/a.pid

          for i in $(seq 1 120); do
            curl -fsS -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}'               http://127.0.0.1:18545 > /tmp/nqc-t35/evidence/a-client.json && break
            sleep 1
          done
          test -s /tmp/nqc-t35/evidence/a-client.json

          curl -fsS -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"admin_nodeInfo","params":[]}' \
            http://127.0.0.1:18545 > /tmp/nqc-t35/evidence/a-nodeinfo.json
          test -s /tmp/nqc-t35/evidence/a-nodeinfo.json

          for i in $(seq 1 90); do
            curl -fsS -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"net_peerCount","params":[]}'               http://127.0.0.1:18545 > /tmp/nqc-t35/evidence/a-peer-count.json || true
            if python3 - <<'PY'
          import json,sys
          try:
              n=int(json.load(open('/tmp/nqc-t35/evidence/a-peer-count.json'))['result'],16)
              sys.exit(0 if n == 1 else 1)
          except Exception:
              sys.exit(1)
          PY
            then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          n=int(json.load(open('/tmp/nqc-t35/evidence/a-peer-count.json'))['result'],16)
          assert n == 1, n
          PY

          curl -fsS -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"admin_peers","params":[]}'             http://127.0.0.1:18545 > /tmp/nqc-t35/evidence/a-peers.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/nqc-t35/evidence/a-peers.json'))['result']
          assert len(p)==1, len(p)
          PY

          SENSOR_BIN=/tmp/nqc-t35/sensor-runtime/target/debug/nqc-t35-sensor-bridge
          "$SENSOR_BIN" /tmp/nqc-t35-sensor.sock /tmp/nqc-t35/evidence \
            > /tmp/nqc-t35/evidence/sensor-bridge.log 2>&1 &
          echo $! > /tmp/nqc-t35/sensor.pid
          for i in $(seq 1 30); do
            test -s /tmp/nqc-t35/evidence/sensor-bridge-ready.txt && break
            sleep 1
          done
          test -s /tmp/nqc-t35/evidence/sensor-bridge-ready.txt
          test -S /tmp/nqc-t35-sensor.sock

          python3 - <<'PY'
          import json, urllib.request

          def rpc(method, params):
              payload=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params},separators=(",",":")).encode()
              req=urllib.request.Request("http://127.0.0.1:18546",data=payload,headers={"content-type":"application/json"})
              with urllib.request.urlopen(req,timeout=5) as r:
                  body=json.loads(r.read().decode())
              if body.get("error") is not None:
                  raise RuntimeError(f"{method}: {body['error']}")
              return body

          accounts=rpc("eth_accounts",[])
          open("/tmp/nqc-t35/evidence/b-accounts.json","w").write(json.dumps(accounts,sort_keys=True)+"\n")
          values=accounts.get("result") or []
          assert values, accounts
          sender=values[0]
          chain_id=rpc("eth_chainId",[])["result"]
          nonce=rpc("eth_getTransactionCount",[sender,"pending"])["result"]
          gas_price=rpc("eth_gasPrice",[])["result"]
          submission=rpc("eth_sendTransaction",[{
              "from":sender,
              "to":"0x000000000000000000000000000000000000dead",
              "value":"0x1",
              "gas":"0x5208",
              "gasPrice":gas_price,
              "nonce":nonce,
              "chainId":chain_id,
              "type":"0x0"
          }])
          txhash=submission.get("result")
          assert isinstance(txhash,str) and txhash.startswith("0x"), submission
          open("/tmp/nqc-t35/evidence/submission.json","w").write(json.dumps(submission,sort_keys=True)+"\n")
          open("/tmp/nqc-t35/evidence/submitted-tx-hash.txt","w").write(txhash.lower()+"\n")
          PY
          TXHASH="$(cat /tmp/nqc-t35/evidence/submitted-tx-hash.txt)"

          for i in $(seq 1 60); do
            if test -s /tmp/nqc-a-p2p.raw && grep -qi "$TXHASH" /tmp/nqc-a-p2p.raw; then break; fi
            sleep 1
          done
          test -s /tmp/nqc-a-p2p.raw
          grep -qi "$TXHASH" /tmp/nqc-a-p2p.raw

          for i in $(seq 1 60); do
            test -s /tmp/nqc-a-exex.raw && break
            sleep 1
          done
          test -s /tmp/nqc-a-exex.raw

          test -S /tmp/nqc-a.ipc
          python3 - <<'PY'
          import json,socket
          path='/tmp/nqc-a.ipc'
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          s.settimeout(5)
          s.connect(path)
          s.sendall(b'{"jsonrpc":"2.0","id":35,"method":"eth_chainId","params":[]}\n')
          data=s.recv(65536)
          s.close()
          assert data, 'empty IPC response'
          text=data.decode(errors='strict').strip()
          obj=json.loads(text.splitlines()[0])
          assert obj.get('id')==35 and isinstance(obj.get('result'),str), obj
          open('/tmp/nqc-t35/evidence/ipc-chain-id.json','w').write(json.dumps(obj,sort_keys=True)+'\n')
          PY

          curl -fsS -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["latest",false]}'             http://127.0.0.1:18545 > /tmp/nqc-t35/evidence/canonical-head.json

          for i in $(seq 1 60); do
            test -s /tmp/nqc-t35/evidence/sensor-bridge-complete.txt && break
            sleep 1
          done
          test -s /tmp/nqc-t35/evidence/sensor-bridge-complete.txt
          test -s /tmp/nqc-t35/evidence/p2p.ndjson
          test -s /tmp/nqc-t35/evidence/exex.ndjson
          cp /tmp/nqc-a-p2p.raw /tmp/nqc-t35/evidence/p2p-raw.ndjson
          cp /tmp/nqc-a-exex.raw /tmp/nqc-t35/evidence/exex-raw.ndjson

          cleanup
          trap - EXIT

      - name: Build and verify attested evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          ev=Path('/tmp/nqc-t35/evidence')
          def sha_bytes(b): return hashlib.sha256(b).hexdigest()
          def stable(x): return sha_bytes(json.dumps(x,sort_keys=True,separators=(',',':')).encode())
          def fsha(p):
              z=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): z.update(b)
              return z.hexdigest()
          def htxt(path): return Path(path).read_text().split()[0]
          def hex64(x): return isinstance(x,str) and len(x)==64 and all(c in '0123456789abcdef' for c in x.lower())

          src='5a6940e351fed80458fe6c9da8581cbe4b8bd036'
          binary_sha=htxt(ev/'observer-binary.sha256')
          binary_size=int((ev/'observer-binary.size').read_text().strip())
          binary_version=(ev/'observer-version.txt').read_text().strip()
          patch_sha=htxt(ev/'observer-patch.sha256')
          source_tree_sha=htxt(ev/'capture-source-tree.sha256')
          lock_sha=htxt(ev/'upstream-cargo-lock.sha256')
          bridge_sha=htxt(ev/'sensor-bridge-binary.sha256')
          bridge_size=int((ev/'sensor-bridge-binary.size').read_text().strip())
          sensor_lock_sha=htxt(ev/'sensor-runtime-cargo-lock.sha256')
          sensor_bundle_sha='4aa5178d6fe6cf1a5de412cc96152d48e45b188ea74af4361ab0ea44c122329e'

          node=json.load(open(ev/'a-nodeinfo.json'))['result']
          peers=json.load(open(ev/'a-peers.json'))['result']
          assert len(peers)==1
          node_id=node['id']
          chain_id=int(json.load(open(ev/'ipc-chain-id.json'))['result'],16)
          head=json.load(open(ev/'canonical-head.json'))['result']
          assert int(head['number'],16)>0 and isinstance(head['hash'],str) and len(head['hash'])==66
          txhash=(ev/'submitted-tx-hash.txt').read_text().strip().lower().removeprefix('0x')
          assert hex64(txhash)

          endpoint=str(Path('/tmp/nqc-a.ipc').resolve())
          endpoint_sha=sha_bytes(endpoint.encode())
          separation={
              'schema_version':1,
              'canonical_truth_lane':'RETH_AF_UNIX_IPC',
              'canonical_ipc_endpoint':endpoint,
              'canonical_ipc_endpoint_sha256':endpoint_sha,
              'chain_id':chain_id,
              'canonical_head_number':int(head['number'],16),
              'canonical_head_hash':head['hash'].lower().removeprefix('0x'),
              'p2p_lane_role':'SPECULATIVE_SIGNAL_ONLY',
              'exex_lane_role':'CANONICAL_NOTIFICATION_SIGNAL_ONLY',
              'p2p_can_issue_authority':False,
              'exex_can_issue_authority':False,
              'authority_issued':False,
          }
          sep_path=ev/'canonical-lane-separation-proof.json'
          sep_path.write_text(json.dumps(separation,indent=2,sort_keys=True)+'\n')
          separation_sha=fsha(sep_path)

          rustc=(ev/'rustc.txt').read_text().splitlines()[0]
          cargo=(ev/'cargo.txt').read_text().strip()
          features=['reth-default-features-disabled','reth-feature-dev','nqc-t35-peer-gossip-hook','nqc-t35-exex-observer']
          identity_core={
              'schema_version':1,'component':'nqc-reth-t35-capture',
              'upstream_repository':'paradigmxyz/reth','upstream_release_tag':'v2.5.2',
              'upstream_tag_object_sha':'d62e996e15a2fb67c190e9baaeeba79df5415346',
              'upstream_source_commit_sha':src,
              'upstream_release_asset_sha256':'e360895ac51b351ff0c44573f0f619bb1e7c3ff2df55502af1190c14c9b5ef6d',
              'upstream_cargo_lock_sha256':lock_sha,
              'capture_patch_sha256':patch_sha,
              'capture_source_tree_sha256':source_tree_sha,
              'rustc_version':rustc,'cargo_version':cargo,'build_profile':'dev',
              'features':features,
              'p2p_hook':'TransactionsManager::on_network_tx_event::IncomingTransactions direct peer-gossip hook',
              'exex_installation':'NodeBuilder::install_exex NQC-T35-Observer',
              'canonical_lane_separation_proof_sha256':separation_sha,
          }
          build_identity=stable(identity_core)
          capture={
              **identity_core,
              'capture_binary_sha256':binary_sha,
              'capture_binary_size_bytes':binary_size,
              'capture_binary_version':binary_version,
              'capture_build_identity_sha256':build_identity,
              'nqc_sensor_runtime_bundle_sha256':sensor_bundle_sha,
              'nqc_sensor_runtime_cargo_lock_sha256':sensor_lock_sha,
              'nqc_sensor_bridge_binary_sha256':bridge_sha,
              'nqc_sensor_bridge_binary_size_bytes':bridge_size,
          }
          (ev/'capture-build-manifest.json').write_text(json.dumps(capture,indent=2,sort_keys=True)+'\n')

          instance_hash=sha_bytes(node_id.encode())
          boot_hash=stable({'github_run_id':os.environ.get('GITHUB_RUN_ID',''),'node_id':node_id,'capture_binary_sha256':binary_sha})

          def validate_trace(lane):
              path=ev/f'{lane.lower()}.ndjson'
              rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              assert rows, lane
              prev={}
              lat=[]
              for r in rows:
                  assert r['schema_version']==3 and r['lane']==lane
                  for k in ('source_identity_hash','source_epoch_hash','clock_epoch_hash','signal_hash','raw_evidence_hash','timestamp_source_hash','sensor_observation_hash','recognition_ticket_hash'):
                      assert hex64(r.get(k)), (lane,k,r.get(k))
                  assert r.get('recognition_stage')=='NQC_SENSOR_FABRIC'
                  assert r.get('traceable') is True
                  assert r.get('clock_scope')=='LOCAL_MONOTONIC'
                  assert r.get('monotonic_clock')=='RUST_STD_INSTANT'
                  assert r.get('disciplined_ns') is None and r.get('global_max_error_ns') is None
                  vals=[r.get('sequence'),r.get('receive_monotonic_ns'),r.get('decoded_ns'),r.get('sensor_ingested_ns'),r.get('recognized_ns')]
                  assert all(isinstance(v,int) and v>0 for v in vals), (lane,vals)
                  seq,recv,dec,ing,rec=vals
                  assert recv<=dec<=ing<=rec
                  key=(r['source_identity_hash'],r['source_epoch_hash'],r['clock_epoch_hash'])
                  assert seq>prev.get(key,0)
                  prev[key]=seq
                  lat.append(rec-recv)
                  if lane=='P2P':
                      assert r.get('transaction_origin')=='External'
                      for k in ('peer_identity_hash','network_path_hash','wire_payload_hash'):
                          assert hex64(r.get(k)), (lane,k)
                      assert str(r.get('submitted_tx_hash','')).lower().removeprefix('0x')==txhash
                  else:
                      assert r.get('notification_kind') in {'ChainCommitted','ChainReorged','ChainReverted'}
                      assert isinstance(r.get('canonical_block_number'),int) and r['canonical_block_number']>0
                      assert hex64(str(r.get('canonical_block_hash','')).lower().removeprefix('0x'))
                      assert hex64(r.get('notification_hash'))
              xs=sorted(lat)
              def q(ppm): return xs[((len(xs)-1)*ppm)//1_000_000]
              return rows,{'samples':len(xs),'p50_ns':q(500_000),'p95_ns':q(950_000),'p99_ns':q(990_000),'max_ns':xs[-1]}

          summaries={}
          for lane,quality in [('P2P','PEER_GOSSIP_EXACT'),('EXEX','CANON_STATE_NOTIFICATION_EXACT')]:
              rows,lat=validate_trace(lane)
              path=ev/f'{lane.lower()}.ndjson'
              manifest={
                  'schema_version':3,'format':'NQC_RETH_SIGNAL_TRACE_V3','lane':lane,
                  'capture_quality':quality,'reth_binary_sha256':binary_sha,'reth_version':binary_version,
                  'reth_source_commit':src,'capture_api_revision':'reth-v2.5.2-nqc-t35-peer-gossip-sensor-v3',
                  'reth_instance_hash':instance_hash,'reth_boot_hash':boot_hash,
                  'capture_build_hash':build_identity,
                  'canonical_lane_separation_proof_sha256':separation_sha,
                  'canonical_ipc_endpoint_sha256':endpoint_sha,'chain_id':chain_id,
                  'trace_file':path.name,'trace_sha256':fsha(path),'events':len(rows),
                  'nqc_sensor_bridge_binary_sha256':bridge_sha,
                  'nqc_sensor_runtime_bundle_sha256':sensor_bundle_sha,
                  'recognition_stage':'NQC_SENSOR_FABRIC',
                  'clock_scope':'LOCAL_MONOTONIC',
                  'production_latency_claim':'NONE',
              }
              (ev/f'{lane.lower()}-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              summaries[lane.lower()]={'status':'MEASURED','events':len(rows),'capture_quality':quality,'recognition_latency_local_ns':lat}

          p2p_raw=[json.loads(x) for x in (ev/'p2p-raw.ndjson').read_text().splitlines() if x.strip()]
          assert any(str(x.get('tx_hash','')).lower().removeprefix('0x')==txhash and x.get('origin')=='External' and x.get('kind')=='IncomingTransactions' for x in p2p_raw)
          assert all(x.get('wire_payload_hash_algorithm')=='KECCAK256_RLP_ETH_MESSAGE_BODY' for x in p2p_raw)
          exex_raw=[json.loads(x) for x in (ev/'exex-raw.ndjson').read_text().splitlines() if x.strip()]
          assert any(x.get('notification_kind') in {'ChainCommitted','ChainReorged','ChainReverted'} for x in exex_raw)

          physical={
              'schema_version':3,
              'status':'PASS',
              'physical_reth_p2p_exex_ready':True,
              'scope':'PHYSICAL_LOCAL_TWO_RETH_DEV_NODES_ON_GITHUB_RUNNER',
              'release_pin_verified':True,
              'capture_build_verified':True,
              'reth_source_commit':src,
              'capture_build_identity_sha256':build_identity,
              'capture_binary_sha256':binary_sha,
              'nqc_sensor_bridge_binary_sha256':bridge_sha,
              'nqc_sensor_runtime_bundle_sha256':sensor_bundle_sha,
              'chain_id':chain_id,
              'connected_peer_count':1,
              'submitted_tx_hash':txhash,
              'submitted_tx_observed_as_external_peer_gossip':True,
              'nqc_sensor_fabric_recognition':True,
              'canonical_ipc_roundtrip':True,
              'canonical_lane_separate_from_signal_lanes':True,
              'p2p':summaries['p2p'],'exex':summaries['exex'],
              'authority_issued':False,
              'mainnet_market_evidence':False,
              'global_clock_discipline':'NOT_TESTED',
              'production_latency_claim':'NONE',
              'latency_scope':'NQC_SENSOR_BRIDGE_INGRESS_TO_RECOGNITION_ONLY',
              'cross_process_wire_to_sensor_latency_claim':'NONE',
          }
          physical['attestation_sha256']=stable(physical)
          (ev/'physical-probe-v3.json').write_text(json.dumps(physical,indent=2,sort_keys=True)+'\n')
          (ev/'runtime-summary.json').write_text(json.dumps(physical,indent=2,sort_keys=True)+'\n')

          assert physical['physical_reth_p2p_exex_ready'] is True
          assert physical['p2p']['capture_quality']=='PEER_GOSSIP_EXACT'
          assert physical['exex']['capture_quality']=='CANON_STATE_NOTIFICATION_EXACT'
          assert physical['nqc_sensor_fabric_recognition'] is True
          assert physical['authority_issued'] is False
          print(json.dumps(physical,indent=2,sort_keys=True))
          PY

          cd /tmp/nqc-t35
          sha256sum evidence/* | sort > evidence/SHA256SUMS.txt

      - name: Upload T35 physical evidence
        uses: actions/upload-artifact@v4
        with:
          name: nqc-t35-reth-p2p-exex-physical-evidence-v2
          path: /tmp/nqc-t35/evidence/
          if-no-files-found: error
          retention-days: 30
