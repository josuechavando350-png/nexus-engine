name: NQC T39 V2 Real Historical Reorg Invalidation

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-v2-real-reorg.yml
      - ci/nqc-protocol-fork/parity/**
      - ci/nqc-protocol-fork/reimplementation/nqc-v2-state/**
      - ci/nqc-protocol-fork/recovered-source/**
      - ci/nqc-protocol-fork/compatibility/**
      - ci/nqc-protocol-fork/locks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-historical-reorg:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RUST_TOOLCHAIN: "1.98.1"
      NQC_V2_REORG: /tmp/nqc-v2-real-reorg

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact sources and prepare isolated graph
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          rm -rf "$NQC_V2_REORG"
          mkdir -p "$NQC_V2_REORG/recovered-source" "$NQC_V2_REORG/reimplementation" "$NQC_V2_REORG/evidence"
          git rev-parse HEAD > "$NQC_V2_REORG/evidence/repository-source-sha.txt"
          (cd ci/nqc-protocol-fork/recovered-source && sha256sum -c SOURCE_FILES.sha256)
          cp -a ci/nqc-protocol-fork/recovered-source/. "$NQC_V2_REORG/recovered-source/"
          cp -a ci/nqc-protocol-fork/reimplementation/nqc-v2-state "$NQC_V2_REORG/reimplementation/"

          declare -A patches=(
            [PFT-COMPAT-001-aave-u40.patch]=9dbea652b4555e6240f694a4ceb9b3eb8354d12dcaaf6ec2e3a254a7ab3463ca
            [PFT-COMPAT-002-executor-return.patch]=3c41e00641b4715471f17933749c8059b0c84aa9c8d4b85ec16c25f155623ba7
            [PFT-COMPAT-003-sync-devdep.patch]=7076c8d5c6f4ba737c7e5a8e030bcb2a32a50642969d35d3156082ddf1eea3a5
            [PFT-COMPAT-005-opportunity-devdep.patch]=12c23465ce52ffa71f6bb45737e2b56f866d4d4a56dcad22ffd31f81d2a73664
          )
          for name in "${!patches[@]}"; do
            patch="$GITHUB_WORKSPACE/ci/nqc-protocol-fork/compatibility/$name"
            test "$(sha256sum "$patch" | cut -d' ' -f1)" = "${patches[$name]}"
            git -C "$NQC_V2_REORG/recovered-source" apply --unidiff-zero "$patch"
          done

          cp ci/nqc-protocol-fork/locks/recovered-2b640cc-Cargo.lock "$NQC_V2_REORG/recovered-source/Cargo.lock"
          cp ci/nqc-protocol-fork/locks/recovered-2b640cc-Cargo.lock "$NQC_V2_REORG/reimplementation/nqc-v2-state/Cargo.lock"

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv | tee "$NQC_V2_REORG/evidence/rustc.txt"
          cargo -V | tee "$NQC_V2_REORG/evidence/cargo.txt"
          cargo fetch --locked --manifest-path "$NQC_V2_REORG/recovered-source/Cargo.toml"

      - name: Execute deterministic multi-block replacement semantics
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo generate-lockfile --offline             --manifest-path "$NQC_V2_REORG/reimplementation/nqc-v2-state/Cargo.toml"
          cargo test --offline             --manifest-path "$NQC_V2_REORG/reimplementation/nqc-v2-state/Cargo.toml"             deep_replacement_drops_multi_block_orphan_replay_state -- --nocapture             2>&1 | tee "$NQC_V2_REORG/evidence/deep-reorg-unit.log"
          grep -F "1 passed; 0 failed" "$NQC_V2_REORG/evidence/deep-reorg-unit.log"

      - name: Capture real historical orphan and exact canonical V2 state
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ci/nqc-protocol-fork/parity/v2_real_reorg_witness.py             --out "$NQC_V2_REORG/evidence"
          grep -F '"classification": "REAL_POW_ORPHAN_HEADER_PLUS_CANONICAL_V2_STATE"'             "$NQC_V2_REORG/evidence/v2-real-reorg-witness.json"
          python3 ci/nqc-protocol-fork/parity/generate_v2_real_reorg_parity.py             "$NQC_V2_REORG/evidence/v2-real-reorg-witness.json"             "$NQC_V2_REORG/reimplementation/nqc-v2-state/examples/pft_v2_real_reorg.rs"
          cp "$NQC_V2_REORG/reimplementation/nqc-v2-state/examples/pft_v2_real_reorg.rs"             "$NQC_V2_REORG/evidence/"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/nqc-v2-real-reorg/reimplementation/nqc-v2-state/Cargo.toml")
          text=p.read_text()
          anchor='nqc-v2-router = { path = "../../recovered-source/crates/nqc-v2-router" }\n'
          addition=anchor+'nqc-replay = { path = "../../recovered-source/crates/nqc-replay" }\n'
          if 'nqc-replay = ' not in text:
              if text.count(anchor)!=1:
                  raise SystemExit("Cargo.toml dependency anchor mismatch")
              text=text.replace(anchor,addition)
          p.write_text(text)
          PY

          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo generate-lockfile --offline             --manifest-path "$NQC_V2_REORG/reimplementation/nqc-v2-state/Cargo.toml"
          sha256sum             ci/nqc-protocol-fork/parity/v2_real_reorg_witness.py             ci/nqc-protocol-fork/parity/generate_v2_real_reorg_parity.py             ci/nqc-protocol-fork/reimplementation/nqc-v2-state/src/lib.rs             > "$NQC_V2_REORG/evidence/harness-source.sha256"

      - name: Build and execute real orphan invalidation against both providers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo build --offline             --manifest-path "$NQC_V2_REORG/reimplementation/nqc-v2-state/Cargo.toml"             --example pft_v2_real_reorg

          for entry in 'blastapi-public|https://eth-mainnet.public.blastapi.io|18571|0.35' 'mevblocker-rpc|https://rpc.mevblocker.io|18572|1.25'; do
            IFS='|' read -r provider_id provider_url port min_interval <<< "$entry"
            socket="$NQC_V2_REORG/$provider_id.ipc"

            NQC_PFT_PROXY_PORT="$port"             NQC_PFT_UPSTREAM_URL="$provider_url"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval"             NQC_PFT_MAX_ATTEMPTS=12             NQC_PFT_UPSTREAM_TIMEOUT_SECONDS=60             NQC_PFT_PROXY_LOG="$NQC_V2_REORG/evidence/$provider_id-throttle.jsonl"               python3 ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py               > "$NQC_V2_REORG/evidence/$provider_id-throttle.log" 2>&1 &
            throttle_pid=$!

            NQC_PFT_IPC_SOCKET="$socket"             NQC_PFT_UPSTREAM_URL="http://127.0.0.1:$port"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_BRIDGE_TIMEOUT_SECONDS=180               python3 ci/nqc-protocol-fork/parity/ipc_http_bridge.py               > "$NQC_V2_REORG/evidence/$provider_id-bridge.log" 2>&1 &
            bridge_pid=$!
            trap 'kill "$bridge_pid" "$throttle_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 150); do
              if test -S "$socket" && curl --silent --fail "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
                ready=1; break
              fi
              sleep 0.1
            done
            test "$ready" -eq 1

            NQC_PFT_IPC_PATH="$socket" NQC_PFT_UPSTREAM_ID="$provider_id"               "$NQC_V2_REORG/reimplementation/nqc-v2-state/target/debug/examples/pft_v2_real_reorg"               2>&1 | tee "$NQC_V2_REORG/evidence/$provider_id-real-reorg.log"
            grep -F "V2_REAL_REORG_INVALIDATION_PASS upstream=$provider_id"               "$NQC_V2_REORG/evidence/$provider_id-real-reorg.log"
            grep -F "V2_REAL_REORG_TOTAL upstream=$provider_id real_orphan_checks=1 canonical_refresh_checks=1 replay_invalidation_checks=1"               "$NQC_V2_REORG/evidence/$provider_id-real-reorg.log"

            kill "$bridge_pid" "$throttle_pid"
            wait "$bridge_pid" "$throttle_pid" 2>/dev/null || true
            trap - EXIT
          done

          printf '%s\n' 'PASS_REAL_SHALLOW_ORPHAN_INVALIDATION_PLUS_DETERMINISTIC_DEEP_REBUILD'             > "$NQC_V2_REORG/evidence/parity-status.txt"
          printf '%s\n' 'PARITY_EVIDENCE_COMPLETE_PENDING_T39_GATE_AGGREGATION'             > "$NQC_V2_REORG/evidence/PFT-SRC-002-status.txt"
          printf '%s\n' 'NOT_CLOSED' > "$NQC_V2_REORG/evidence/protocol-fork-truth.txt"
          (
            cd "$NQC_V2_REORG/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-v2-real-reorg-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-v2-real-reorg/evidence
          if-no-files-found: error
          retention-days: 30
