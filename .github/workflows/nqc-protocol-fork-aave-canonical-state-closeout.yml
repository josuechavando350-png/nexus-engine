name: NQC T39 Aave Canonical State Parity Closeout

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-aave-canonical-state-closeout.yml
      - ci/nqc-protocol-fork/AAVE_CANONICAL_STATE_PARITY_CLOSEOUT.json
      - ci/nqc-protocol-fork/compatibility/PFT-COMPAT-008-aave-exact-accounting.json
      - ci/nqc-protocol-fork/compatibility/PFT-COMPAT-008-aave-exact-accounting.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate exact evidence binding
        shell: bash
        env:
          NQC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path
          closeout=json.loads(Path("ci/nqc-protocol-fork/AAVE_CANONICAL_STATE_PARITY_CLOSEOUT.json").read_text())
          compat=json.loads(Path("ci/nqc-protocol-fork/compatibility/PFT-COMPAT-008-aave-exact-accounting.json").read_text())
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["NQC_GITHUB_TOKEN"]
          sha40=re.compile(r"^[0-9a-f]{40}$")
          sha256=re.compile(r"^[0-9a-f]{64}$")
          if not token:
              raise AssertionError("missing GitHub Actions token for canonical-state attestation")

          expected_producer={
              "canonical_witness":(
                  "NQC T39 Aave Canonical State Witness",
                  ".github/workflows/nqc-protocol-fork-aave-state-witness.yml",
              ),
              "recovered_user_meta":(
                  "NQC T39 Aave Recovered Reader Parity",
                  ".github/workflows/nqc-protocol-fork-aave-reader-parity.yml",
              ),
              "reserve_index_scaled_balance":(
                  "NQC T39 Aave Reserve Balance Parity",
                  ".github/workflows/nqc-protocol-fork-aave-reserve-parity.yml",
              ),
              "full_account_risk":(
                  "NQC T39 Aave Full Account Risk Parity",
                  ".github/workflows/nqc-protocol-fork-aave-full-account-risk-parity.yml",
              ),
              "exact_emode_zero_account_risk":(
                  "NQC T39 Aave Account Risk Exact Parity",
                  ".github/workflows/nqc-protocol-fork-aave-account-risk-parity.yml",
              ),
          }

          def api_get(path):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"nqc-aave-canonical-state-closeout-v3",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read())

          def verify_artifact(label,item):
              head=item["head"]
              run_id=int(item["workflow_run_id"])
              artifact_id=int(item["artifact_id"])
              digest=item["artifact_zip_sha256"]
              assert sha40.fullmatch(head), (label,"bad head")
              assert run_id>0 and artifact_id>0, (label,"bad ids")
              assert sha256.fullmatch(digest), (label,"bad digest")
              actual=api_get(f"/actions/artifacts/{artifact_id}")
              run_detail=api_get(f"/actions/runs/{run_id}")
              assert int(actual["id"])==artifact_id, (label,"artifact id mismatch")
              assert actual.get("expired") is False, (label,"artifact expired")
              assert actual.get("digest")==f"sha256:{digest}", (
                  label,"artifact digest mismatch",actual.get("digest")
              )
              run=actual.get("workflow_run") or {}
              assert int(run.get("id",0))==run_id, (label,"run mismatch",run.get("id"))
              assert run.get("head_sha")==head, (
                  label,"head mismatch",run.get("head_sha"),head
              )
              assert run_detail.get("head_sha")==head, (
                  label,"run head mismatch",run_detail.get("head_sha"),head
              )
              assert run_detail.get("status")=="completed", (
                  label,"workflow not completed",run_detail.get("status")
              )
              assert run_detail.get("conclusion")=="success", (
                  label,"workflow did not succeed",run_detail.get("conclusion")
              )
              expected_name,expected_path=expected_producer[label]
              assert run_detail.get("name")==expected_name, (
                  label,"workflow name mismatch",run_detail.get("name"),expected_name
              )
              assert run_detail.get("path")==expected_path, (
                  label,"workflow path mismatch",run_detail.get("path"),expected_path
              )
          assert closeout["gate"]=="AAVE_CANONICAL_STATE_PARITY"
          assert closeout["status"]=="PASS"
          assert closeout["providers"]==["blastapi-public","mevblocker-rpc"]
          assert len(closeout["anchors"])==2
          assert sum(x["users"] for x in closeout["anchors"])==15
          ev=closeout["evidence"]
          artifact_labels={label for label,item in ev.items() if "artifact_id" in item}
          assert artifact_labels==set(expected_producer), (
              "unexpected or incomplete Aave evidence producer set",sorted(artifact_labels)
          )
          for label in sorted(artifact_labels):
              verify_artifact(label,ev[label])
          assert ev["recovered_user_meta"]["exact_comparisons"]==30
          assert ev["reserve_index_scaled_balance"]["balance_parity_passes_per_provider"]==15
          assert ev["reserve_index_scaled_balance"]["reserves_per_provider"]==12
          assert ev["reserve_index_scaled_balance"]["positions_per_provider"]==45
          assert ev["full_account_risk"]["users_per_provider"]==15
          assert ev["full_account_risk"]["exact_integer_checks_per_provider"]==60
          assert ev["full_account_risk"]["emode_users_per_provider"]==2
          assert ev["full_account_risk"]["unexplained_mismatches"]==0
          assert ev["exact_emode_zero_account_risk"]["users"]==13
          assert ev["exact_emode_zero_account_risk"]["exact_integer_checks"]==39
          assert closeout["unexplained_mismatches"]==0
          assert compat["compatibility_id"]=="PFT-COMPAT-008"
          assert compat["status"]=="RESOLVED_EXACT_TWO_PROVIDER_PARITY"
          assert compat["source_bytes_modified"] is False
          resolved=compat["resolved_verification"]
          assert resolved["head"]=="7494e76f9e8b942f021468578de4ff19aef68dbd"
          assert resolved["full_account_risk"]["workflow_run"]==36341553888
          assert resolved["full_account_risk"]["unexplained_mismatches"]==0
          assert closeout["protocol_fork_truth"]=="NOT_CLOSED"
          print("AAVE_CANONICAL_STATE_PARITY_CLOSEOUT_PASS")
          PY
          sha256sum             ci/nqc-protocol-fork/AAVE_CANONICAL_STATE_PARITY_CLOSEOUT.json             ci/nqc-protocol-fork/compatibility/PFT-COMPAT-008-aave-exact-accounting.json             ci/nqc-protocol-fork/compatibility/PFT-COMPAT-008-aave-exact-accounting.py             > /tmp/aave-canonical-state-closeout.sha256
          sha256sum -c /tmp/aave-canonical-state-closeout.sha256
