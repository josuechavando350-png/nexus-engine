name: Regenerate Rust lockfile on audit branch

on:
  push:
    paths:
      - '.github/workflows/regenerate-lock-pr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        working-directory: runtime
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- runtime/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/Cargo.lock
          git commit -m "fix(runtime): regenerate audit-branch lockfile for Wasmtime 36.0.13"
          git push
