name: NEXUS H07 Clean-Room Operability Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  clean-room-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact source and pristine checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          test -z "$(git status --porcelain)"
          git show-ref --verify --quiet refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Setup Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Record clean-room identity
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "validated_sha=$NEXUS_VALIDATED_SHA"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
          } | tee .artifacts/h07-environment.txt
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Playwright dependencies
        run: pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit
      - name: Build once and validate independently
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:browser
          pnpm build
          pnpm security-hygiene
          pnpm v3-gates
          pnpm rust:test
          pnpm rust:lint
          pnpm rust:build
          pnpm third-party-proof
      - name: Execute operability proof
        run: pnpm operability:h07
      - name: Assert clean build and evidence identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f .artifacts/h07-operability-proof.json
      - name: Upload evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h07-clean-room-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            .artifacts/h07-environment.txt
            .artifacts/h07-operability-proof.json
          if-no-files-found: error
          retention-days: 90
