name: NEXUS H07 Clean-Room Operability Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/h07-operability-proof.mjs"
      - "package.json"
      - ".github/workflows/h07-clean-room-proof.yml"
      - "docs/operations/**"
      - "runtime/**"
      - "packages/ontology/**"
      - "packages/capture/**"
      - "packages/emitter/**"
      - "packages/quality/**"
  push:
    branches: [main]
    paths:
      - "scripts/h07-operability-proof.mjs"
      - "package.json"
      - ".github/workflows/h07-clean-room-proof.yml"
      - "docs/operations/**"
      - "runtime/**"
      - "packages/ontology/**"
      - "packages/capture/**"
      - "packages/emitter/**"
      - "packages/quality/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-room-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Setup pinned Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Record clean-room identity
        run: |
          mkdir -p .artifacts
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "runner=${RUNNER_OS}-${RUNNER_ARCH}"
          } | tee .artifacts/h07-environment.txt

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          for attempt in 1 2 3; do
            echo "Playwright browser/dependency install attempt ${attempt}/3"
            if pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Playwright installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Build and validate independently
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm security-hygiene
          pnpm v3-gates
          pnpm v4-gates
          pnpm v5-gates
          pnpm v6-gates
          pnpm v7-gates
          pnpm v8-gates
          pnpm v9-gates
          pnpm v10-gates
          pnpm rust:test
          pnpm rust:lint
          pnpm rust:build

      - name: Execute deploy backup restore rollback offboarding proof
        run: pnpm operability:h07

      - name: Upload evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h07-clean-room-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            .artifacts/h07-environment.txt
            .artifacts/h07-operability-proof.json
          if-no-files-found: error
          retention-days: 90
