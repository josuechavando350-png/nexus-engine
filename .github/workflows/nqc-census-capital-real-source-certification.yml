          cp -- ci/nqc-census/rmc011-execution-plan-requirement-catalog.json "$PACKAGE/rmc011-execution-plan-requirement-catalog.json"
          cp -- /tmp/rmc011-execution-plan-requirement-catalog-report.json "$PACKAGE/execution-plan-requirement-catalog-report.json"
          cp -- ci/nqc-census/rmc011-permissionless-debt-facility-catalog.json "$PACKAGE/rmc011-permissionless-debt-facility-catalog.json"
          cp -- /tmp/rmc011-permissionless-debt-catalog-report.json "$PACKAGE/permissionless-debt-catalog-report.json"
          cp -- ci/nqc-census/rmc011-collateral-funding-path-catalog.json "$PACKAGE/rmc011-collateral-funding-path-catalog.json"
          cp -- /tmp/rmc011-collateral-path-report.json "$PACKAGE/collateral-funding-path-report.json"
          cp -- "$RUNNER_TEMP/rmc011-debt-family-resolution.json" "$PACKAGE/debt-family-resolution.json"
          cp -- "$RUNNER_TEMP/rmc011-protocol-family-resolution.json" "$PACKAGE/protocol-family-resolution.json"
          test -d "$RUNNER_TEMP/rmc011-protocol-family-evidence"
          mkdir -p "$PACKAGE/protocol-family-evidence"
          cp -a "$RUNNER_TEMP/rmc011-protocol-family-evidence/." "$PACKAGE/protocol-family-evidence/"
          test -d "$RUNNER_TEMP/rmc011-debt-family-evidence"
          mkdir -p "$PACKAGE/debt-family-evidence"
          cp -a "$RUNNER_TEMP/rmc011-debt-family-evidence/." "$PACKAGE/debt-family-evidence/"
          cp -- /tmp/rmc011-bounded-family-rejections.json "$PACKAGE/bounded-family-rejections.json"
          if [[ -d "$RUNNER_TEMP/rmc011-bounded-family-evidence" ]]; then
            mkdir -p "$PACKAGE/bounded-family-evidence"
            cp -a "$RUNNER_TEMP/rmc011-bounded-family-evidence/." "$PACKAGE/bounded-family-evidence/"
          fi
          cp -- ci/nqc-census/rmc011-capital-family-discovery.json "$PACKAGE/rmc011-capital-family-discovery.json"
          cp -- /tmp/rmc011-family-discovery-readiness.json "$PACKAGE/rmc011-family-discovery-readiness.json"
          if [[ -d "$RUNNER_TEMP/rmc011-family-discovery-evidence" ]]; then
            mkdir -p "$PACKAGE/family-discovery-evidence"
            cp -a "$RUNNER_TEMP/rmc011-family-discovery-evidence/." "$PACKAGE/family-discovery-evidence/"
          fi
          for stage in d06 d07 d08 d09 d10; do
            test -d "$RUNNER_TEMP/$stage-raw"
            cp -a "$RUNNER_TEMP/$stage-raw" "$PACKAGE/upstream/$stage"
          done

          if [[ -f "$RUNNER_TEMP/rmc011-source-universe-authenticated" ]] && jq -e '
            .status == "CAPITAL_SOURCE_UNIVERSE_COMPLETE" and
            .terminal_claim_allowed == true and
            .family_universe_discovery.status == "AUTHENTICATED_COMPLETE" and
            (.families | length == 13) and
            (.families | all(.terminally_resolved == true))
          ' "$PACKAGE/rmc011-capital-source-universe.json" >/dev/null; then
            cp -- "$RUNNER_TEMP/rmc011-source-universe-authenticated" "$PACKAGE/d11/source-universe-transport-auth.sha256"
            cp -- "$RUNNER_TEMP/rmc011-terminal-evidence-authenticated.tsv" "$PACKAGE/d11/source-universe-transport-auth.tsv"
            python3 ci/nqc-census/verify-rmc011-terminal-closeout.py \
              "$PACKAGE/rmc011-capital-source-universe.json" \
              "$PACKAGE/d11/capital-real-source-closeout.json" \
              "$PACKAGE/d11/capital-upstream-authority-lock.json" \
              "$PACKAGE/d11/source-universe-transport-auth.tsv" \
              "$PACKAGE/d11/source-universe-transport-auth.sha256" \
              "$PACKAGE/d11/d11-terminal-closeout.json"
            jq -e '
              .schema_version == 1 and
              .stage == "RMC-011" and
              .status == "D11_TERMINAL_CLOSED" and
              .d11_terminal_closed == true and
              .terminal_capital_census_complete == true and
              .capital_source_universe_complete == true and
              .family_universe_discovery_authenticated == true and
              .source_universe_transport_auth_count == 14 and
              (.source_universe_transport_auth_sha256 | test("^[0-9a-f]{64}$")) and
              .resolved_family_count == 13 and
              .unknown_family_count == 0 and
              .actionable_requirement_coverage_complete == false and
              .profitability_claimed == false and
              .shadow_eligibility_claimed == false and
              .canary_claimed == false and
              .real_pnl_claimed == false
            ' "$PACKAGE/d11/d11-terminal-closeout.json" >/dev/null
            echo "D11_TERMINAL_CLOSEOUT_INCLUDED=PASS"
          else
            echo "D11_TERMINAL_CLOSED=BLOCKED_SOURCE_UNIVERSE"
          fi

          (
            cd "$PACKAGE"
            LC_ALL=C find . -type f ! -name CERTIFICATION-PACKAGE-SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > CERTIFICATION-PACKAGE-SHA256SUMS
            test -s CERTIFICATION-PACKAGE-SHA256SUMS
            sha256sum -c CERTIFICATION-PACKAGE-SHA256SUMS
            (
              cd d11
              sha256sum -c capital-archive.sha256
            )
          )

          echo "RMC011_SELF_CONTAINED_EVIDENCE_PACKAGE=PASS"
          echo "RMC011_EVIDENCE_PACKAGE_SHA256=$(sha256sum "$PACKAGE/CERTIFICATION-PACKAGE-SHA256SUMS" | awk '{print $1}')"

      - name: Upload immutable D11 certification archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc011-real-source-certification-${{ github.sha }}
          path: ${{ runner.temp }}/rmc011-certification-package/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
