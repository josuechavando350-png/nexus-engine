            .oracle_resolution_complete == false and
            .emode_resolution_complete == false and
            .zero_own_capital_collateral_path_claimed == false and
            (.non_claims | index("AAVE_RESERVE_LIQUIDITY_IS_NOT_NQC_BORROWING_CAPACITY") != null) and
            (.non_claims | index("TERMINAL_D11_NOT_CERTIFIED") != null)
