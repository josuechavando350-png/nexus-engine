name: NEXUS Baseline Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  architecture:
    name: V3 runtime boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: V3 boundary gate
        run: node scripts/v3-architecture-gates.mjs

  web-quality:
    name: Web invariants and SHA-bound build
    runs-on: ubuntu-24.04
    needs: architecture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Validate workspace
        run: |
          set -euo pipefail
          pnpm security-hygiene
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm quality-gates
          pnpm third-party-proof
          pnpm build
          test -z "$(git status --porcelain --untracked-files=no)"

  rust-workspace:
    name: Rust locked workspace
    runs-on: ubuntu-24.04
    needs: web-quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - name: Setup Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Format, lint, test and release build
        working-directory: runtime
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace --release
          test -z "$(git -C .. status --porcelain --untracked-files=no)"

  rust-adapters:
    name: Optional adapters locked
    runs-on: ubuntu-24.04
    needs: rust-workspace
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Kafka prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev
      - name: Compile adapters
        working-directory: runtime
        run: |
          set -euo pipefail
          cargo check --locked -p nexus-edge-protocol --features ed25519
          cargo check --locked -p nexus-graph --features neo4j
          cargo check --locked -p nexus-ingest --features kafka
          cargo check --locked -p nexus-edge-wasm --features wasmtime
