name: NEXUS V6 Closeout — staged compile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/closeout-stages.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  architecture:
    name: 00 · Architecture gates V3→V6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run static architecture gates only
        shell: bash
        run: |
          set -euo pipefail

          NODE_BIN_DIR="$(dirname "$(command -v node)")"

          env PATH="$NODE_BIN_DIR" node scripts/v3-architecture-gates.mjs
          env PATH="$NODE_BIN_DIR" node scripts/v4-architecture-gates.mjs
          env PATH="$NODE_BIN_DIR" node scripts/v5-architecture-gates.mjs
          env PATH="$NODE_BIN_DIR" node scripts/v6-architecture-gates.mjs

  web-quality:
    name: 00.5 · Node/TypeScript quality
    runs-on: ubuntu-latest
    needs: architecture

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Security hygiene
        run: pnpm security-hygiene

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Quality gates
        run: pnpm quality-gates

      - name: Build
        run: pnpm build

  v3-core:
    name: 01 · V3 core compile
    runs-on: ubuntu-latest
    needs: [architecture, web-quality]
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-closeout-${{ hashFiles('runtime/**/Cargo.toml') }}

      - name: Check V3 core and services
        run: |
          cargo check \
            -p nexus-event \
            -p nexus-observability \
            -p nexus-policy \
            -p nexus-ontology \
            -p nexus-graph \
            -p nexus-ingest \
            -p nexus-edge-protocol \
            -p nexus-edge-wasm \
            -p nexus-agent \
            -p nexus-sim \
            -p nexus-oneway \
            -p ingestd \
            -p graphd \
            -p orchestratord \
            -p gatewayd \
            -p factory-line \
            -p warehouse-robot \
            -p inspection-drone-sim

  v3-adapters:
    name: 02 · V3 optional adapters
    runs-on: ubuntu-latest
    needs: v3-core
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Kafka adapter build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev

      - name: Compile each external adapter separately
        run: |
          cargo check -p nexus-edge-protocol --features ed25519
          cargo check -p nexus-graph --features neo4j
          cargo check -p nexus-ingest --features kafka
          cargo check -p nexus-edge-wasm --features wasmtime

  v4:
    name: 03 · V4 intelligence compile
    runs-on: ubuntu-latest
    needs: v3-adapters
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check V4 layer
        run: |
          cargo check \
            -p nexus-memory \
            -p nexus-goal \
            -p nexus-planner \
            -p nexus-reasoning \
            -p nexus-model \
            -p nexus-world-model \
            -p nexus-durable \
            -p nexus-evaluator \
            -p nexus-recovery \
            -p nexus-agents-v4 \
            -p nexus-intelligence \
            -p autonomous-factory

  v5:
    name: 04 · V5 control plane compile
    runs-on: ubuntu-latest
    needs: v4
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check V5 layer
        run: |
          cargo check \
            -p nexus-control-model \
            -p nexus-identity \
            -p nexus-authz \
            -p nexus-registry \
            -p nexus-secrets-v5 \
            -p nexus-cost \
            -p nexus-alerts \
            -p nexus-audit-v5 \
            -p nexus-api-contracts \
            -p nexus-control-plane \
            -p nexus-sdk \
            -p controld

  v6:
    name: 05 · V6 distributed runtime compile
    runs-on: ubuntu-latest
    needs: v5
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check V6 layer
        run: |
          cargo check \
            -p nexus-cluster \
            -p nexus-consensus \
            -p nexus-replication \
            -p nexus-placement \
            -p nexus-discovery \
            -p nexus-federation \
            -p nexus-offline \
            -p nexus-mesh \
            -p nexus-fleet \
            -p nexus-update \
            -p nexus-distributed \
            -p clusterd \
            -p distributed-factory

  workspace:
    name: 06 · Full workspace compile
    runs-on: ubuntu-latest
    needs: v6
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release
