name: AXIOMA FORJA Linux User Service Proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-user-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prove fail-closed pinned unit generation and systemd syntax
        env:
          FORJA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORJA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          command -v systemd-analyze
          node --check forja/linux-service.mjs
          node --test forja/tests/linux-service.test.mjs
          STATE="$(mktemp -d "$RUNNER_TEMP/forja-service-XXXXXX")"
          chmod 700 "$STATE"
          node forja/linux-service.mjs render "$PWD" "$STATE" > "$RUNNER_TEMP/forja-user.service"
          grep -F "guard $PWD $STATE $FORJA_SOURCE_SHA" "$RUNNER_TEMP/forja-user.service"
          systemd-analyze verify "$RUNNER_TEMP/forja-user.service"
          node forja/linux-service.mjs guard "$PWD" "$STATE" "$FORJA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
