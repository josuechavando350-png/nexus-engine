name: NQC T37 Phase3 Physical Unified Dry-Run

on:
  push:
    branches:
      - nqc/t37-unified-dryrun-evidence-20260926
    paths:
      - .github/workflows/nqc-t37-phase3-physical-unified-dryrun.yml
      - ci/nqc-t37/physical-contracts/**
      - ci/nqc-t37/phase3-validator.rs
      - ci/nqc-t37/unified-evidence-crate.parts/**
      - ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol
      - ci/nqc-t35/**
      - ci/nqc-t37/upstream-attestations/T35_EXACT_CLOSURE.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-unified-dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Pin Rust and verify exact upstream Reth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-t35/evidence
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup component add rustfmt clippy --toolchain 1.98.1
          rustc -Vv | tee /tmp/nqc-t35/evidence/rustc.txt
          cargo -V | tee /tmp/nqc-t35/evidence/cargo.txt
          cargo fmt --version | tee /tmp/nqc-t35/evidence/rustfmt.txt
          cargo clippy --version | tee /tmp/nqc-t35/evidence/clippy.txt

          cd /tmp/nqc-t35
          curl --fail --location --retry 5 --retry-all-errors \
            -o reth-release.tar.gz \
            https://github.com/paradigmxyz/reth/releases/download/v2.5.2/reth-v2.5.2-x86_64-unknown-linux-gnu.tar.gz
          echo "e360895ac51b351ff0c44573f0f619bb1e7c3ff2df55502af1190c14c9b5ef6d  reth-release.tar.gz" | sha256sum -c -
          test "$(stat -c %s reth-release.tar.gz)" = "51932647"
          sha256sum reth-release.tar.gz > evidence/upstream-release.sha256

          git clone --filter=blob:none https://github.com/paradigmxyz/reth.git reth
          cd reth
          git checkout --detach 5a6940e351fed80458fe6c9da8581cbe4b8bd036
          test "$(git rev-parse HEAD)" = "5a6940e351fed80458fe6c9da8581cbe4b8bd036"
          test -z "$(git status --porcelain=v1)"
          sha256sum Cargo.lock > ../evidence/upstream-cargo-lock.sha256
          git rev-parse HEAD > ../evidence/upstream-source-commit.txt

      - name: Restore pinned Reth build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/nqc-t35/reth/target
          key: nqc-t35-reth-v2.5.2-rust1.98.1-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install exact P2P ingress and Sensor Fabric ExEx instrumentation
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth

          mkdir -p examples/nqc-sensor-fabric/src examples/nqc-t35-observer/src
          base64 -d "$GITHUB_WORKSPACE/ci/nqc-t35/nqc-sensor-fabric.lib.rs.gz.b64" | gzip -d > examples/nqc-sensor-fabric/src/lib.rs
          sed -i 's/use alloy::primitives::{keccak256, B256};/use alloy_primitives::{keccak256, B256};/' examples/nqc-sensor-fabric/src/lib.rs
          cp "$GITHUB_WORKSPACE/ci/nqc-t35/nqc-sensor-fabric.Cargo.toml" examples/nqc-sensor-fabric/Cargo.toml
          cp "$GITHUB_WORKSPACE/ci/nqc-t35/nqc-t35-observer.Cargo.toml" examples/nqc-t35-observer/Cargo.toml
          cp "$GITHUB_WORKSPACE/ci/nqc-t35/nqc-t35-observer.main.rs" examples/nqc-t35-observer/src/main.rs

          python3 - <<'PY'
          from pathlib import Path

          root=Path("Cargo.toml")
          s=root.read_text()
          anchor='    "examples/network/",\n'
          for member in ('    "examples/nqc-sensor-fabric",\n','    "examples/nqc-t35-observer",\n'):
              if member not in s:
                  if anchor not in s:
                      raise SystemExit("workspace anchor missing")
                  s=s.replace(anchor,anchor+member,1)
                  anchor=member
          root.write_text(s)

          net_manifest=Path("crates/net/network/Cargo.toml")
          nm=net_manifest.read_text()
          dep='nqc-sensor-fabric = { path = "../../../examples/nqc-sensor-fabric" }\n'
          if dep not in nm:
              marker='[dependencies]\n'
              if marker not in nm:
                  raise SystemExit("reth-network dependency marker missing")
              nm=nm.replace(marker,marker+dep,1)
          net_manifest.write_text(nm)

          network=Path("crates/net/network/src/transactions/mod.rs")
          ns=network.read_text()
          import_anchor='use rayon::iter::{IntoParallelIterator, ParallelIterator};\n'
          sensor_import='''use nqc_sensor_fabric::{
              ClockStamp, SensorEpochKey, SensorFabric, SensorFabricPolicy, SensorIdentity,
              SensorObservation, SensorSourceClass, SignalKey, SignalKind,
          };
          '''
          if sensor_import not in ns:
              if import_anchor not in ns:
                  raise SystemExit("network import anchor missing")
              ns=ns.replace(import_anchor,import_anchor+sensor_import,1)

          method_marker="    fn on_network_tx_event(&mut self, event: NetworkTransactionEvent<N>) {"
          if method_marker not in ns:
              raise SystemExit("network transaction event marker missing")

          helper=r'''    fn nqc_t35_capture_peer_signal(
                  peer_id: &PeerId,
                  kind: &str,
                  hash: &B256,
                  wire_payload_hash: &B256,
              ) {
                  let Some(path) = std::env::var_os("NQC_T35_P2P_RAW") else { return };

                  fn monotonic_ns() -> u64 {
                      static START: std::sync::OnceLock<std::time::Instant> = std::sync::OnceLock::new();
                      let origin = START.get_or_init(std::time::Instant::now);
                      u64::try_from(origin.elapsed().as_nanos())
                          .unwrap_or(u64::MAX)
                          .saturating_add(1)
                  }
                  fn seed_hash(label: &[u8], env_name: &str) -> B256 {
                      let seed = std::env::var(env_name).unwrap_or_else(|_| "UNSET".to_string());
                      let mut bytes = Vec::with_capacity(label.len() + seed.len() + 1);
                      bytes.extend_from_slice(label);
                      bytes.push(0);
                      bytes.extend_from_slice(seed.as_bytes());
                      alloy_primitives::keccak256(bytes)
                  }
                  fn policy() -> SensorFabricPolicy {
                      SensorFabricPolicy {
                          max_signals: 8192,
                          max_observations_per_signal: 8,
                          max_comparable_clock_error_ns: 100_000,
                          hard_max_clock_error_ns: 1_000_000,
                          min_regions_for_cross_region_claim: 2,
                          recognition_shards: 64,
                          wave_capacity: 8192,
                          max_per_chain: 8192,
                          max_per_kind: 8192,
                      }
                  }

                  static FABRIC: std::sync::OnceLock<parking_lot::Mutex<SensorFabric>> =
                      std::sync::OnceLock::new();
                  static SEQUENCE: std::sync::atomic::AtomicU64 =
                      std::sync::atomic::AtomicU64::new(0);

                  let receive = monotonic_ns();
                  let decoded = monotonic_ns();
                  let sequence = SEQUENCE
                      .fetch_add(1, std::sync::atomic::Ordering::Relaxed)
                      .saturating_add(1);

                  let chain_id = std::env::var("NQC_T35_CHAIN_ID")
                      .ok()
                      .and_then(|value| value.parse::<u64>().ok())
                      .unwrap_or(1337);
                  let region_hash = seed_hash(b"NQC_T35_REGION", "NQC_T35_REGION_SEED");
                  let instance_hash = seed_hash(b"NQC_T35_INSTANCE", "NQC_T35_INSTANCE_SEED");
                  let boot_hash = seed_hash(b"NQC_T35_BOOT", "NQC_T35_BOOT_SEED");
                  let source_epoch_hash =
                      seed_hash(b"NQC_T35_P2P_SOURCE_EPOCH", "NQC_T35_BOOT_SEED");
                  let clock_epoch_hash =
                      seed_hash(b"NQC_T35_CLOCK_EPOCH", "NQC_T35_BOOT_SEED");

                  let peer_text = format!("{peer_id:#x}");
                  let peer_identity_hash = alloy_primitives::keccak256(peer_text.as_bytes());
                  let mut path_bytes = Vec::with_capacity(peer_text.len() + 64);
                  path_bytes.extend_from_slice(b"NQC_T35_RETH_PEER_GOSSIP_PATH_V1");
                  path_bytes.extend_from_slice(instance_hash.as_slice());
                  path_bytes.extend_from_slice(peer_text.as_bytes());
                  let network_path_hash = alloy_primitives::keccak256(path_bytes);

                  let signal = SignalKey {
                      chain_id,
                      kind: SignalKind::PendingTransaction,
                      payload_hash: *hash,
                      subject_hash: *hash,
                  };
                  let observation = SensorObservation {
                      sensor_epoch: SensorEpochKey {
                          sensor: SensorIdentity {
                              region_hash,
                              instance_hash,
                              source_class: SensorSourceClass::LocalRethP2p,
                          },
                          boot_hash,
                          source_epoch_hash,
                          clock_epoch_hash,
                      },
                      sequence,
                      signal,
                      clock: ClockStamp {
                          monotonic_ns: receive,
                          disciplined_ns: None,
                          max_error_ns: 0,
                          traceable: false,
                      },
                      network_path_hash,
                      raw_evidence_hash: *wire_payload_hash,
                  };
                  let sensor_observation_hash = observation.fingerprint();

                  let fabric = FABRIC.get_or_init(|| {
                      parking_lot::Mutex::new(
                          SensorFabric::new(policy()).expect("NQC T35 Sensor Fabric policy"),
                      )
                  });
                  let mut fabric = fabric.lock();
                  fabric.ingest(observation).expect("NQC T35 P2P Sensor Fabric ingest");
                  let sensor_ingested = monotonic_ns();
                  let wave = fabric
                      .plan_recognition_wave()
                      .expect("NQC T35 P2P recognition wave");
                  let ticket = wave
                      .shards
                      .iter()
                      .flat_map(|shard| shard.tickets.iter())
                      .find(|ticket| ticket.key == signal)
                      .copied()
                      .expect("NQC T35 P2P recognition ticket");
                  let recognition_ticket_hash = ticket.fingerprint();
                  drop(fabric);
                  let recognized = monotonic_ns();

                  let mut source_bytes = Vec::with_capacity(peer_text.len() + 96);
                  source_bytes.extend_from_slice(b"NQC_T35_P2P_SENSOR_SOURCE_V1");
                  source_bytes.extend_from_slice(region_hash.as_slice());
                  source_bytes.extend_from_slice(instance_hash.as_slice());
                  source_bytes.extend_from_slice(peer_text.as_bytes());
                  let source_identity_hash = alloy_primitives::keccak256(source_bytes);
                  let timestamp_source_hash =
                      alloy_primitives::keccak256(b"RUST_STD_INSTANT_PROCESS_LOCAL_V1");

                  let Ok(mut file) = std::fs::OpenOptions::new()
                      .create(true)
                      .append(true)
                      .open(path)
                  else {
                      return
                  };
                  use std::io::Write as _;
                  let _ = writeln!(
                      file,
                      "{{\"schema_version\":3,\"lane\":\"P2P\",\"capture_point\":\"RETH_TRANSACTIONS_MANAGER_INCOMING_TRANSACTIONS\",\"source_identity_hash\":\"{:#x}\",\"source_epoch_hash\":\"{:#x}\",\"clock_epoch_hash\":\"{:#x}\",\"signal_hash\":\"{:#x}\",\"raw_evidence_hash\":\"{:#x}\",\"timestamp_source_hash\":\"{:#x}\",\"sequence\":{},\"receive_monotonic_ns\":{},\"decoded_ns\":{},\"sensor_ingested_ns\":{},\"recognized_ns\":{},\"traceable\":true,\"timestamp_provenance_traceable\":true,\"sensor_clock_traceable\":false,\"clock_scope\":\"LOCAL_MONOTONIC\",\"monotonic_clock\":\"RUST_STD_INSTANT\",\"disciplined_ns\":null,\"global_max_error_ns\":null,\"recognition_stage\":\"NQC_SENSOR_FABRIC\",\"sensor_observation_hash\":\"{:#x}\",\"recognition_ticket_hash\":\"{:#x}\",\"peer_id_full\":\"{}\",\"peer_identity_hash\":\"{:#x}\",\"network_path_hash\":\"{:#x}\",\"wire_payload_hash\":\"{:#x}\",\"wire_payload_hash_algorithm\":\"KECCAK256_RLP_ETH_MESSAGE_BODY\",\"transaction_origin\":\"External\",\"tx_hash\":\"{:#x}\",\"message_kind\":\"{}\"}}",
                      source_identity_hash,
                      source_epoch_hash,
                      clock_epoch_hash,
                      signal.fingerprint(),
                      wire_payload_hash,
                      timestamp_source_hash,
                      sequence,
                      receive,
                      decoded,
                      sensor_ingested,
                      recognized,
                      sensor_observation_hash,
                      recognition_ticket_hash,
                      peer_text,
                      peer_identity_hash,
                      network_path_hash,
                      wire_payload_hash,
                      hash,
                      kind,
                  );
              }

          '''
          ns=ns.replace(method_marker,helper+method_marker,1)

          anchor='''                // ensure we didn't receive any blob transactions as these are disallowed to be
          '''
          insertion='''                let nqc_t35_wire_payload_hash =
                      alloy_primitives::keccak256(alloy_rlp::encode(&msg));
                  for tx in &msg.0 {
                      Self::nqc_t35_capture_peer_signal(
                          &peer_id,
                          "IncomingTransactions",
                          tx.tx_hash(),
                          &nqc_t35_wire_payload_hash,
                      );
                  }

                  // ensure we didn't receive any blob transactions as these are disallowed to be
          '''
          if anchor not in ns:
              raise SystemExit("full transaction ingress anchor missing")
          ns=ns.replace(anchor,insertion,1)
          network.write_text(ns)
          PY

          git add -N \
            examples/nqc-sensor-fabric/Cargo.toml \
            examples/nqc-sensor-fabric/src/lib.rs \
            examples/nqc-t35-observer/Cargo.toml \
            examples/nqc-t35-observer/src/main.rs
          git diff --check
          git diff --binary > /tmp/nqc-t35/evidence/nqc-t35-capture.patch
          test -s /tmp/nqc-t35/evidence/nqc-t35-capture.patch
          sha256sum /tmp/nqc-t35/evidence/nqc-t35-capture.patch > /tmp/nqc-t35/evidence/capture-patch.sha256

          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(".")
          h=hashlib.sha256()
          files=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              rel=p.relative_to(root)
              if ".git" in rel.parts or "target" in rel.parts:
                  continue
              files.append(rel)
          for rel in sorted(files, key=lambda p: p.as_posix()):
              data=(root/rel).read_bytes()
              h.update(rel.as_posix().encode()+b"\0")
              h.update(hashlib.sha256(data).digest())
          Path("/tmp/nqc-t35/evidence/capture-source-tree.sha256").write_text(h.hexdigest()+"\n")
          PY

      - name: Build exact pinned capture binary
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth
          cargo build -p nqc-t35-observer
          BIN="$PWD/target/debug/nqc-t35-observer"
          test -x "$BIN"
          "$BIN" --version | tee /tmp/nqc-t35/evidence/capture-binary-version.txt
          sha256sum "$BIN" > /tmp/nqc-t35/evidence/capture-binary.sha256
          stat -c %s "$BIN" > /tmp/nqc-t35/evidence/capture-binary.size

      - name: Persist pinned Reth build cache before physical execution
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/nqc-t35/reth/target
          key: nqc-t35-reth-v2.5.2-rust1.98.1-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install pinned Foundry and compile exact T37 physical fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-t37-phase3/foundry /tmp/nqc-t37-phase3/contracts/src /tmp/nqc-t37-phase3/evidence
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/nqc-t37-phase3/foundry.tar.gz \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/nqc-t37-phase3/foundry.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nqc-t37-phase3/foundry.tar.gz -C /tmp/nqc-t37-phase3/foundry
          export PATH="/tmp/nqc-t37-phase3/foundry:$PATH"
          forge --version | tee /tmp/nqc-t37-phase3/evidence/forge-version.txt
          cast --version | tee /tmp/nqc-t37-phase3/evidence/cast-version.txt

          cp "$GITHUB_WORKSPACE/ci/nqc-t37/physical-contracts/foundry.toml" /tmp/nqc-t37-phase3/contracts/
          cp "$GITHUB_WORKSPACE/ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol" /tmp/nqc-t37-phase3/contracts/src/
          cp "$GITHUB_WORKSPACE/ci/nqc-t37/physical-contracts/src/T37PhysicalIntegration.sol" /tmp/nqc-t37-phase3/contracts/src/

          cd /tmp/nqc-t37-phase3/contracts
          # T36's closeout source identity is the exact forge-fmt-normalized source
          # used by its strict Foundry gate, so normalize before verifying the
          # attested executor SHA rather than comparing the repository pre-format bytes.
          forge fmt
          forge fmt --check
          echo "bbb5962171f2c1da5067e21ac705a627a35028fdafe5c9403f601bb813d39320  src/NqcFlashFundingExecutor.sol" | sha256sum -c -
          forge build --sizes 2>&1 | tee /tmp/nqc-t37-phase3/evidence/forge-build.txt
          for contract in T37SyntheticMarket T37MockFlashToken T37MockFundedStrategy T37MockAaveFlashPool T37MockBalancerVault T37FundingDriver; do
            forge inspect "$contract" bytecode > "/tmp/nqc-t37-phase3/${contract}.bytecode"
          done
          {
            echo "touch=$(cast sig 'touch(uint256)')"
            echo "stateHash=$(cast sig 'stateHash()')"
            echo "run=$(cast sig 'run(bytes32)')"
          } | tee /tmp/nqc-t37-phase3/evidence/selectors.txt
          find src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/nqc-t37-phase3/evidence/physical-contract-sources.sha256

      - name: Run local-dev physical unified signal simulation funding fence WAL and canonical outcome
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t35/reth
          export PATH="/tmp/nqc-t37-phase3/foundry:$PATH"
          BIN="$PWD/target/debug/nqc-t35-observer"
          EV=/tmp/nqc-t37-phase3/evidence
          rm -rf /tmp/nqc-a /tmp/nqc-b /tmp/nqc-t37-phase3/fence
          rm -f /tmp/nqc-a.ipc /tmp/nqc-b.ipc /tmp/nqc-a-p2p.raw /tmp/nqc-a-exex.raw /tmp/nqc-b-exex.raw /tmp/nqc-t37-phase3/wal.ndjson
          mkdir -p /tmp/nqc-a /tmp/nqc-b /tmp/nqc-t37-phase3/fence

          cleanup() {
            test -f /tmp/nqc-t37-phase3/a.pid && kill "$(cat /tmp/nqc-t37-phase3/a.pid)" 2>/dev/null || true
            test -f /tmp/nqc-t37-phase3/b.pid && kill "$(cat /tmp/nqc-t37-phase3/b.pid)" 2>/dev/null || true
          }
          trap cleanup EXIT

          NQC_T35_CHAIN_ID=1337 \
          NQC_T35_REGION_SEED=github-runner \
          NQC_T35_INSTANCE_SEED=node-b \
          NQC_T35_BOOT_SEED=node-b-phase3 \
          NQC_T35_EXEX_RAW=/tmp/nqc-b-exex.raw \
          "$BIN" node --dev --dev.block-time 3600s --datadir /tmp/nqc-b \
            --disable-discovery --no-persist-peers --nat none \
            --ipcpath /tmp/nqc-b.ipc --http --http.addr 127.0.0.1 --http.port 18546 \
            --http.api admin,debug,eth,net,web3 --port 31304 --authrpc.port 18552 \
            > "$EV/reth-b.log" 2>&1 &
          echo $! > /tmp/nqc-t37-phase3/b.pid

          for i in $(seq 1 120); do
            curl -fsS -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}' \
              http://127.0.0.1:18546 > "$EV/b-client.json" && break
            sleep 1
          done
          test -s "$EV/b-client.json"

          curl -fsS -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"admin_nodeInfo","params":[]}' \
            http://127.0.0.1:18546 > "$EV/b-nodeinfo.json"
          ENODE="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/nqc-t37-phase3/evidence/b-nodeinfo.json'))['result']['enode'])
          PY
          )"

          NQC_T35_CHAIN_ID=1337 \
          NQC_T35_REGION_SEED=github-runner \
          NQC_T35_INSTANCE_SEED=node-a \
          NQC_T35_BOOT_SEED=node-a-phase3 \
          NQC_T35_P2P_RAW=/tmp/nqc-a-p2p.raw \
          NQC_T35_EXEX_RAW=/tmp/nqc-a-exex.raw \
          "$BIN" node --dev --dev.block-time 2s --datadir /tmp/nqc-a \
            --disable-discovery --trusted-only --trusted-peers "$ENODE" --no-persist-peers --nat none \
            --ipcpath /tmp/nqc-a.ipc --http --http.addr 127.0.0.1 --http.port 18545 \
            --http.api admin,debug,eth,net,web3 --port 31303 --authrpc.port 18551 \
            > "$EV/reth-a.log" 2>&1 &
          echo $! > /tmp/nqc-t37-phase3/a.pid

          for i in $(seq 1 120); do
            curl -fsS -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}' \
              http://127.0.0.1:18545 > "$EV/a-client.json" && break
            sleep 1
          done
          test -s "$EV/a-client.json"

          for i in $(seq 1 90); do
            curl -fsS -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"net_peerCount","params":[]}' \
              http://127.0.0.1:18545 > "$EV/a-peer-count.json" || true
            python3 - <<'PY' && break || true
          import json
          x=json.load(open('/tmp/nqc-t37-phase3/evidence/a-peer-count.json'))
          assert int(x['result'],16)==1
          PY
            sleep 1
          done

          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path

          A='http://127.0.0.1:18545'
          ev=Path('/tmp/nqc-t37-phase3/evidence')
          root=Path('/tmp/nqc-t37-phase3')

          def rpc(url,method,params):
              data=json.dumps({'jsonrpc':'2.0','id':37,'method':method,'params':params},separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,headers={'content-type':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=json.loads(r.read().decode())
              if body.get('error') is not None:
                  raise RuntimeError(f'{method}: {body["error"]}')
              return body['result']

          def wait_receipt(txh):
              for _ in range(120):
                  r=rpc(A,'eth_getTransactionReceipt',[txh])
                  if r is not None:
                      assert int(r['status'],16)==1, r
                      return r
                  time.sleep(1)
              raise RuntimeError(f'receipt timeout {txh}')

          accounts=rpc(A,'eth_accounts',[])
          assert len(accounts)>=2, accounts
          deployer=accounts[0]
          signal_sender=accounts[1]
          chain_id=rpc(A,'eth_chainId',[])
          gas_price=rpc(A,'eth_gasPrice',[])

          def bytecode(name):
              text=(root/f'{name}.bytecode').read_text().strip()
              assert text.startswith('0x') and len(text)>4, name
              return text

          import subprocess
          cast='/tmp/nqc-t37-phase3/foundry/cast'
          dev_mnemonic='test test test test test test test test test test test junk'
          dev_private_key=subprocess.check_output(
