              't37_scale_subject_hash':'0xd236346a6643b424986cb350360a0b864cece64b1dc3b738b200314b955e67d8',
              't37_scale_attestation_hash':'0x214f4794b257815decb09350bec2dca2ac86bd70fc64779e3a33cbf45df17e86',
              't37_scale_toolchain_hash':hx(t37_toolchain),
              'evidence_generator_build_hash':'0xccbf62959f77cd682b86df6c87f6ec4ba45b29eabc1715ddfcea9e5e5837c66b',
              'canonical_generation':'1',
              'chain_id':str(meta['chain_id']),
              'block_number':str(int(anchor['number'],16)),
              'block_hash':anchor['hash'],
              'state_root':anchor['stateRoot'],
              'execution_identity_hash':execution_identity,
              'signal_evidence_hash':p2p['signal_hash'],
              'recognition_ticket_hash':p2p['recognition_ticket_hash'],
              'market_identity_hash':market_identity,
              'market_semantics_hash':market_semantics,
              'market_state_hash':sim['market_state_before'],
              'candidate_hash':candidate,
              'exact_simulation_input_hash':exact_input,
              'exact_simulation_digest_hash':exact_digest,
              'differential_verification_hash':differential,
              'funding_plan_hash':funding_plan,
              'funding_execution_evidence_hash':funding_evidence,
              'governor_decision_hash':governor_hash,
              'action_plan_hash':action_hash,
              'action_fence_hash':fence_hash,
              'durable_wal_commit_hash':wal_hash,
              'canonical_outcome_hash':canonical_outcome,
              'realization_evidence_hash':realization,
              'reorg_invalidation_reason_hash':hx(sha(b'T37_REORG_GENERATION_ADVANCE_VALIDATION_V1')),
          }
          (ev/'phase3-validator-input.txt').write_text(''.join(f'{k}={v}\n' for k,v in values.items()))
          (ev/'execution-lineage.json').write_text(json.dumps(values,indent=2,sort_keys=True)+'\n')
          PY

          rm -rf /tmp/nqc-t37-phase3/evidence-generator
          mkdir -p /tmp/nqc-t37-phase3/evidence-generator
          cat "$GITHUB_WORKSPACE"/ci/nqc-t37/unified-evidence-crate.parts/part-*.b64 > /tmp/nqc-t37-phase3/evidence-generator.tar.gz.b64
          test "$(wc -c < /tmp/nqc-t37-phase3/evidence-generator.tar.gz.b64)" = "5912"
          base64 -d /tmp/nqc-t37-phase3/evidence-generator.tar.gz.b64 > /tmp/nqc-t37-phase3/evidence-generator.tar.gz
          echo "38e717c6d39bd80163af2091213fd0af0ed76c59646587cac9c1951b69372fe7  /tmp/nqc-t37-phase3/evidence-generator.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nqc-t37-phase3/evidence-generator.tar.gz -C /tmp/nqc-t37-phase3/evidence-generator
          cd /tmp/nqc-t37-phase3/evidence-generator
          cargo generate-lockfile
          echo "73f77c1774ad1af5b7527bbc3a6442f3d18d8e14f85c147a041a5a331cc2c0be  Cargo.lock" | sha256sum -c -
          mkdir -p src/bin
          cp "$GITHUB_WORKSPACE/ci/nqc-t37/phase3-validator.rs" src/bin/phase3-validator.rs
          cargo fmt
          cargo clippy --locked --bin phase3-validator -- -D warnings
          cargo run --locked --quiet --bin phase3-validator -- "$EV/phase3-validator-input.txt" \
            | tee "$EV/phase3-validator-output.txt"
          grep -q '^stale_generation_blocked=true$' "$EV/phase3-validator-output.txt"
          grep -q '^authority_issued=false$' "$EV/phase3-validator-output.txt"
          grep -q '^real_market_census=NOT_TESTED$' "$EV/phase3-validator-output.txt"
          grep -q '^live_pnl_evidence=false$' "$EV/phase3-validator-output.txt"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          ev=Path('/tmp/nqc-t37-phase3/evidence')
          def fsha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          def stable(x): return json.dumps(x,sort_keys=True,separators=(',',':')).encode()
          validator={}
          for line in (ev/'phase3-validator-output.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); validator[k]=v
          out={
              'schema_version':1,
              'tranche':'T37_PHYSICAL_UNIFIED_DRYRUN_EVIDENCE_GENERATOR',
              'phase':'PHASE3_LOCAL_DEV_PHYSICAL_UNIFIED_DRYRUN',
              'status':'PASS',
              'scope':'LOCAL_DEV_PHYSICAL_UNIFIED_NO_LIVE_AUTHORITY',
              'chain_id':1337,
              'reth_source_commit':'5a6940e351fed80458fe6c9da8581cbe4b8bd036',
              'reth_release':'v2.5.2',
              'p2p_capture_quality':'PEER_GOSSIP_EXACT',
              'sensor_recognition':'NQC_SENSOR_FABRIC_PHYSICAL',
              'canonical_lane':'RETH_AF_UNIX_JSON_RPC',
              'exact_simulation':'MEASURED_RETH_ETH_CALL_AT_PINNED_LOCAL_ANCHOR',
              'differential_simulation_repeat_match':True,
              'funding_execution':'MEASURED_RETH_ETH_CALL_LOCAL_FIXTURE',
              't36_real_protocol_semantics_binding':'HISTORICAL_FORK_CLOSEOUT_ATTESTATION',
              'action_fence':'DURABLE_EXCLUSIVE_CREATE_FSYNC',
              'durable_wal':'FSYNC_MEASURED',
              'wire_action_submission':'SUPPRESSED',
              'canonical_outcome':'MEASURED_LOCAL_DEV_RECEIPT_AND_STATE_DELTA',
              'execution_bundle_fingerprint':validator['bundle_fingerprint'],
              'stale_generation_blocked':validator['stale_generation_blocked']=='true',
              'authority_issued':False,
              'setup_transactions_are_test_fixture_authority_only':True,
              'production_authority_issued':False,
              'secret_dependency':False,
              'production_runtime_third_party_api_dependency':False,
              'real_market_census':'NOT_TESTED',
              'real_live_market_evidence':False,
              'live_pnl_evidence':False,
              'production_latency_claim':'NONE',
              'production_certification':'NOT_CERTIFIED',
              'nqc_global_status':'NOT_CERTIFIED / ACCELERATION_EVIDENCE_NOT_TARGET_ADMISSION',
              'primary_p2p_event_sha256':fsha(ev/'primary-p2p-event.json'),
              'exact_simulation_sha256':fsha(ev/'exact-simulation.json'),
              'funding_dryrun_sha256':fsha(ev/'funding-dryrun.json'),
              'canonical_realization_sha256':fsha(ev/'canonical-realization.json'),
              'validator_output_sha256':fsha(ev/'phase3-validator-output.txt'),
          }
          out['attestation_sha256']=hashlib.sha256(stable(out)).hexdigest()
          (ev/'phase3-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          cleanup
          trap - EXIT

      - name: Finalize Phase3 evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t37-phase3
          cp /tmp/nqc-t35/evidence/capture-binary.sha256 evidence/
          cp /tmp/nqc-t35/evidence/capture-source-tree.sha256 evidence/
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          sha256sum evidence/SHA256SUMS.txt
          cat evidence/phase3-summary.json

      - name: Upload T37 Phase3 physical unified evidence
        uses: actions/upload-artifact@v4
        with:
          name: nqc-t37-phase3-physical-unified-dryrun
          path: /tmp/nqc-t37-phase3/evidence/
          if-no-files-found: error
          retention-days: 30
