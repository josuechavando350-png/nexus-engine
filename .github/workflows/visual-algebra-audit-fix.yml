name: Visual Algebra audited fixes

on:
  push:
    branches:
      - feat/visual-algebra-engine
    paths:
      - '.github/workflows/visual-algebra-audit-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited source and test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          primitives = Path('packages/visual-algebra/src/primitives.ts')
          source = primitives.read_text()
          old = '''      const children = Object.freeze(input.children.map((child) => definePrimitive(child)));
                assertUniquePrimitiveIds(children);
                const inferred = unionBounds(children.map((child) => child.bounds));'''.replace('        ', '      ')
          # Keep matching robust to indentation while requiring the exact semantic sequence.
          old = '''      const children = Object.freeze(input.children.map((child) => definePrimitive(child)));
      assertUniquePrimitiveIds(children);
      const inferred = unionBounds(children.map((child) => child.bounds));'''
          new = '''      const children = Object.freeze(input.children.map((child) => definePrimitive(child)));
      assertUniquePrimitiveIds(children);
      if (flattenPrimitives(children).some((child) => child.id === input.id)) {
        throw new Error(`Duplicate primitive id: ${input.id}`);
      }
      const inferred = unionBounds(children.map((child) => child.bounds));'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one container invariant target, found {source.count(old)}')
          primitives.write_text(source.replace(old, new))

          tests = Path('packages/visual-algebra/src/__tests__/visual-algebra.test.ts')
          text = tests.read_text()
          brittle = r'toThrow(/\[0, 1\]/);'
          robust = r'toThrow(/\[0,\s*1\]/);'
          if text.count(brittle) != 1:
              raise SystemExit(f'Expected one legacy range matcher, found {text.count(brittle)}')
          text = text.replace(brittle, robust)

          anchor = '''  test("accepts extreme but finite geometry", () => {'''
          added = '''  test("rejects a container id duplicated by one of its descendants", () => {
    expect(() => definePrimitive({
      id: "same",
      kind: "container",
      children: [{ id: "same", kind: "rectangle", bounds: { x: 0, y: 0, width: 10, height: 10 } }],
    })).toThrow(/Duplicate primitive id: same/);
  });

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one test insertion anchor, found {text.count(anchor)}')
          if 'rejects a container id duplicated by one of its descendants' not in text:
              text = text.replace(anchor, added + anchor)
          tests.write_text(text)
          PY

          git diff --check
          git diff -- packages/visual-algebra/src/primitives.ts packages/visual-algebra/src/__tests__/visual-algebra.test.ts
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/visual-algebra/src/primitives.ts packages/visual-algebra/src/__tests__/visual-algebra.test.ts
          git commit -m "fix(visual-algebra): close audited edge cases"
          git push
