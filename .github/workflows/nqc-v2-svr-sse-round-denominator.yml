name: NQC V2 SVR SSE Canonical WETH Round Denominator (READ ONLY)

on:
  pull_request:
    paths:
      - 'ci/nqc-census/rmc-v2-shadow/svr_channel_access_probe.py'
      - 'ci/nqc-census/rmc-v2-shadow/svr_sse_round_denominator.py'
      - 'ci/nqc-census/rmc-v2-shadow/test_svr_sse_round_denominator.py'
      - 'ci/nqc-census/rmc-v2-shadow/SVR_SSE_ROUND_DENOMINATOR_CONTRACT.md'
      - '.github/workflows/nqc-v2-svr-sse-round-denominator.yml'

permissions:
  contents: read

concurrency:
  group: nqc-svr-round-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-svr-round-denominator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ci/nqc-census/rmc-v2-shadow:ci/nqc-census/rmc-v2-economics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact head, 12 new adversarial source tests and inherited regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          OUT="$RUNNER_TEMP/nqc-svr-round"
          mkdir -p "$OUT"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_svr_sse_round_denominator.py -v 2>&1 | tee "$OUT/new-unit-tests.log"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_svr_channel_access_probe.py -v 2>&1 | tee "$OUT/pr734-regression-tests.log"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_svr_hint_admission.py -v 2>&1 | tee "$OUT/pr733-regression-tests.log"
          python3 -m py_compile ci/nqc-census/rmc-v2-shadow/svr_sse_round_denominator.py
      - name: One finite 180-second SSE witness between two canonical WETH round snapshots
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-svr-round"
          timeout 510s python3 ci/nqc-census/rmc-v2-shadow/svr_sse_round_denominator.py \
            --seconds 180 --out "$OUT/attempt" > "$OUT/run.log" 2> "$OUT/stderr.log"
          jq -e '
            .schema_version==1 and
            (.source_precommit_sha256|test("^[0-9a-f]{64}$")) and
            .PFT_closed==true and
            .RMC_closed==false and
            .Shadow_certified==false and
            .canary_or_live_authorized==false and
            .SSE_is_private_SVR_access_certificate==false and
            .first_seen_before_builder_cutoff_proven==false and
            .liquidation_capture_or_net_ev_proven==false and
            .gas_financing_without_recourse_proven==false and
            .realized_NQC_USD=="0" and
            all(.source_rpc_calls[]; .<=36) and
            (
              .status=="NO_WETH_ROUND_ADVANCE_BETWEEN_PINNED_BOOKENDS" or
              .status=="WETH_FEED_CHANGED_IN_BOOKENDS_NOT_PREINCLUSION_PROOF" or
              .status=="WETH_FEED_CHANGED_BUT_SSE_OBSERVATION_CENSORED" or
              (.status|startswith("INCOMPLETE_"))
            ) and
            (if .status|startswith("INCOMPLETE_")
              then (.source_errors|length)>0 or (.status!="INCOMPLETE_SOURCE_OR_CANONICAL_QUORUM")
              else (.source_errors|length)==0 and
                .before.same_block_two_RPC_parity==true and
                .after.same_block_two_RPC_parity==true
              end)
          ' "$OUT/attempt/round-denominator.json" > "$OUT/contract-check.log"
          echo 'No net income / bidder inclusion / private SVR entitlement proven.'
      - name: Content-addressed exact tested code and immutable negative evidence
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-svr-round"
          mkdir -p "$OUT/source"
          cp ci/nqc-census/rmc-v2-shadow/svr_channel_access_probe.py \
             ci/nqc-census/rmc-v2-shadow/svr_sse_round_denominator.py \
             ci/nqc-census/rmc-v2-shadow/test_svr_sse_round_denominator.py \
             ci/nqc-census/rmc-v2-shadow/SVR_SSE_ROUND_DENOMINATOR_CONTRACT.md \
             .github/workflows/nqc-v2-svr-sse-round-denominator.yml "$OUT/source/"
          git rev-parse HEAD > "$OUT/code-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/code-tree.txt"
          cd "$OUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | \
            xargs -0 sha256sum > manifest.sha256
          sha256sum --check --strict manifest.sha256
      - name: Preserve exact-head source and read-only witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-svr-weth-round-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-svr-round/
          retention-days: 30
          if-no-files-found: error
