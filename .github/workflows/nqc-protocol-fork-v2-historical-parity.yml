name: NQC T39 V2 Historical State Quote Parity

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-v2-historical-parity.yml
      - ci/nqc-protocol-fork/parity/**
      - ci/nqc-protocol-fork/reimplementation/nqc-v2-state/**
      - ci/nqc-protocol-fork/recovered-source/**
      - ci/nqc-protocol-fork/compatibility/**
      - ci/nqc-protocol-fork/locks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v2-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: "1.98.1"
      NQC_V2_HIST: /tmp/nqc-v2-historical-parity

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify sources and prepare isolated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          rm -rf "$NQC_V2_HIST"
          mkdir -p "$NQC_V2_HIST/recovered-source" "$NQC_V2_HIST/reimplementation" "$NQC_V2_HIST/evidence"
          git rev-parse HEAD > "$NQC_V2_HIST/evidence/repository-source-sha.txt"
          (cd ci/nqc-protocol-fork/recovered-source && sha256sum -c SOURCE_FILES.sha256)
          cp -a ci/nqc-protocol-fork/recovered-source/. "$NQC_V2_HIST/recovered-source/"
          cp -a ci/nqc-protocol-fork/reimplementation/nqc-v2-state "$NQC_V2_HIST/reimplementation/"

          declare -A patches=(
            [PFT-COMPAT-001-aave-u40.patch]=9dbea652b4555e6240f694a4ceb9b3eb8354d12dcaaf6ec2e3a254a7ab3463ca
            [PFT-COMPAT-002-executor-return.patch]=3c41e00641b4715471f17933749c8059b0c84aa9c8d4b85ec16c25f155623ba7
            [PFT-COMPAT-003-sync-devdep.patch]=7076c8d5c6f4ba737c7e5a8e030bcb2a32a50642969d35d3156082ddf1eea3a5
            [PFT-COMPAT-005-opportunity-devdep.patch]=12c23465ce52ffa71f6bb45737e2b56f866d4d4a56dcad22ffd31f81d2a73664
          )
          for name in "${!patches[@]}"; do
            patch="$GITHUB_WORKSPACE/ci/nqc-protocol-fork/compatibility/$name"
            test "$(sha256sum "$patch" | cut -d' ' -f1)" = "${patches[$name]}"
            git -C "$NQC_V2_HIST/recovered-source" apply --unidiff-zero "$patch"
          done

          cp ci/nqc-protocol-fork/locks/recovered-2b640cc-Cargo.lock "$NQC_V2_HIST/recovered-source/Cargo.lock"
          cp ci/nqc-protocol-fork/locks/recovered-2b640cc-Cargo.lock "$NQC_V2_HIST/reimplementation/nqc-v2-state/Cargo.lock"

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv | tee "$NQC_V2_HIST/evidence/rustc.txt"
          cargo -V | tee "$NQC_V2_HIST/evidence/cargo.txt"
          cargo fetch --locked --manifest-path "$NQC_V2_HIST/recovered-source/Cargo.toml"

          cp "$NQC_V2_HIST/reimplementation/nqc-v2-state/Cargo.lock" "$NQC_V2_HIST/evidence/Cargo.lock.baseline"
          cargo generate-lockfile --offline --manifest-path "$NQC_V2_HIST/reimplementation/nqc-v2-state/Cargo.toml"
          cp "$NQC_V2_HIST/reimplementation/nqc-v2-state/Cargo.lock" "$NQC_V2_HIST/evidence/Cargo.lock.resolved"

          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          ev=Path("/tmp/nqc-v2-historical-parity/evidence")
          before=tomllib.loads((ev/"Cargo.lock.baseline").read_text())
          after=tomllib.loads((ev/"Cargo.lock.resolved").read_text())
          def external(doc):
              return {
                  (p["name"], p["version"], p.get("source"), p.get("checksum"))
                  for p in doc["package"] if p.get("source") is not None
              }
          b,a=external(before),external(after)
          unexpected=sorted(a-b)
          if unexpected:
              raise SystemExit(f"external dependency drift: {unexpected}")
          (ev/"dependency-pruning.txt").write_text(
              f"baseline_external={len(b)}\nresolved_external={len(a)}\n"
              f"pruned_external={len(b-a)}\nunexpected_external=0\n"
          )
          PY

      - name: Capture independent exact V2 state and router quote witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -u ci/nqc-protocol-fork/parity/v2_historical_witness.py             --out "$NQC_V2_HIST/evidence"
          python3 ci/nqc-protocol-fork/parity/generate_v2_historical_parity.py             "$NQC_V2_HIST/evidence/v2-historical-witness.json"             "$NQC_V2_HIST/reimplementation/nqc-v2-state/examples/pft_v2_historical_parity.rs"
          cp "$NQC_V2_HIST/reimplementation/nqc-v2-state/examples/pft_v2_historical_parity.rs"             "$NQC_V2_HIST/evidence/"
          sha256sum             ci/nqc-protocol-fork/parity/v2_historical_witness.py             ci/nqc-protocol-fork/parity/generate_v2_historical_parity.py             ci/nqc-protocol-fork/reimplementation/nqc-v2-state/src/lib.rs             > "$NQC_V2_HIST/evidence/harness-source.sha256"

      - name: Build measured V2 state reader and execute against both providers
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo build --offline             --manifest-path "$NQC_V2_HIST/reimplementation/nqc-v2-state/Cargo.toml"             --example pft_v2_historical_parity

          for entry in 'blastapi-public|https://eth-mainnet.public.blastapi.io' 'mevblocker-rpc|https://rpc.mevblocker.io'; do
            provider_id="${entry%%|*}"
            provider_url="${entry#*|}"
            socket="$NQC_V2_HIST/$provider_id.ipc"
            if test "$provider_id" = "mevblocker-rpc"; then
              min_interval="1.25"
            else
              min_interval="0.35"
            fi

            NQC_PFT_PROXY_PORT=18547             NQC_PFT_UPSTREAM_URL="$provider_url"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval"             NQC_PFT_MAX_ATTEMPTS=12             NQC_PFT_PROXY_LOG="$NQC_V2_HIST/evidence/$provider_id-throttle.jsonl"               python3 ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py               > "$NQC_V2_HIST/evidence/$provider_id-throttle.log" 2>&1 &
            throttle_pid=$!

            NQC_PFT_IPC_SOCKET="$socket"             NQC_PFT_UPSTREAM_URL=http://127.0.0.1:18547             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_BRIDGE_TIMEOUT_SECONDS=180               python3 ci/nqc-protocol-fork/parity/ipc_http_bridge.py               > "$NQC_V2_HIST/evidence/$provider_id-bridge.log" 2>&1 &
            bridge_pid=$!
            trap 'kill "$bridge_pid" "$throttle_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 100); do
              if test -S "$socket" && curl --silent --fail http://127.0.0.1:18547/health >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 0.1
            done
            test "$ready" -eq 1

            NQC_PFT_IPC_PATH="$socket" NQC_PFT_UPSTREAM_ID="$provider_id"               "$NQC_V2_HIST/reimplementation/nqc-v2-state/target/debug/examples/pft_v2_historical_parity"               2>&1 | tee "$NQC_V2_HIST/evidence/$provider_id-parity.log"

            test "$(grep -c '^V2_HISTORICAL_PARITY_PASS ' "$NQC_V2_HIST/evidence/$provider_id-parity.log")" -eq 2
            grep '^V2_HISTORICAL_TOTAL ' "$NQC_V2_HIST/evidence/$provider_id-parity.log"
            kill "$bridge_pid" "$throttle_pid"
            wait "$bridge_pid" "$throttle_pid" 2>/dev/null || true
            trap - EXIT
          done

          printf '%s\n' 'PASS_SELECTED_PAIR_STATE_SINGLE_MULTI_QUOTE' > "$NQC_V2_HIST/evidence/parity-status.txt"
          printf '%s\n' 'OPEN_PENDING_SYNC_ZERO_LIQUIDITY_AND_REORG' > "$NQC_V2_HIST/evidence/PFT-SRC-002-status.txt"
          printf '%s\n' 'NOT_CLOSED' > "$NQC_V2_HIST/evidence/protocol-fork-truth.txt"
          (
            cd "$NQC_V2_HIST/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-v2-historical-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-v2-historical-parity/evidence
          if-no-files-found: error
          retention-days: 30
