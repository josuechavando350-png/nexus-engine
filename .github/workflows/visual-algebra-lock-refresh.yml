name: Visual Algebra lockfile refresh

on:
  push:
    branches:
      - feat/visual-algebra-engine
    paths:
      - '.github/workflows/visual-algebra-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Activate repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Regenerate pnpm lockfile only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(visual-algebra): refresh pnpm lockfile"
          git push
