name: GAUSS Nemesis 69 real ML-KEM storage
on:
  pull_request:
    paths:
      - 'gauss/nemesis/**'
      - '.github/workflows/gauss-nemesis-mlkem69.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mlkem69:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Require real native ML-KEM encapsulation and decapsulation, not a fallback
        run: |
          node -e "const c=require('node:crypto');if(typeof c.encapsulate!=='function'||typeof c.decapsulate!=='function')process.exit(1)"
      - name: Verify imported source integrity before cryptographic tests
        run: node gauss/nemesis/scripts/verify-source-lock.mjs
      - name: Run all original ML-KEM, Nash and QAOA tests without any skips
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap gauss/nemesis/engine/test/crypto-nash-qaoa.test.mjs | tee "$RUNNER_TEMP/nemesis69.tap"
          grep -qx '# tests 8' "$RUNNER_TEMP/nemesis69.tap"
          grep -qx '# pass 8' "$RUNNER_TEMP/nemesis69.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/nemesis69.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/nemesis69.tap"
      - name: Prove all 401 original Némesis tests pass in one Node 24 run with zero skips
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=4 --test-reporter=tap gauss/nemesis/engine/test/*.test.mjs > "$RUNNER_TEMP/nemesis-all.tap"
          grep -qx '# tests 401' "$RUNNER_TEMP/nemesis-all.tap" || { tail -n 35 "$RUNNER_TEMP/nemesis-all.tap"; exit 1; }
          grep -qx '# pass 401' "$RUNNER_TEMP/nemesis-all.tap" || { tail -n 35 "$RUNNER_TEMP/nemesis-all.tap"; exit 1; }
          grep -qx '# fail 0' "$RUNNER_TEMP/nemesis-all.tap" || { tail -n 35 "$RUNNER_TEMP/nemesis-all.tap"; exit 1; }
          grep -qx '# skipped 0' "$RUNNER_TEMP/nemesis-all.tap" || { tail -n 35 "$RUNNER_TEMP/nemesis-all.tap"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/nemesis-all.tap"
      - name: Run GAUSS integration audit and smoke all 100 registered engines
        run: |
          node --test gauss/nemesis/tests/*.test.mjs
          node gauss/nemesis/engine/scripts/smoke-100.mjs
      - name: Verify source was not mutated and checkout remains clean
        run: |
          node gauss/nemesis/scripts/verify-source-lock.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
