name: Format — one-shot cargo fmt

# Applies `cargo fmt --all` to the Rust workspace and commits the result.
#
# Why a workflow instead of an editor: rustfmt must be the one that writes the
# formatting, and it must be the *same* rustfmt that `cargo fmt --all --check`
# runs in the closeout gate. Hand-editing formatting is how files get
# truncated. This job mirrors the toolchain setup of closeout-stages.yml
# exactly, so the two cannot disagree.
#
# Run it from Actions -> "Format — one-shot cargo fmt" -> Run workflow.
# It is manual-dispatch only and never runs on push.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Apply cargo fmt --all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Identical to the closeout gate, so the resolved rustfmt is identical.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Record the exact toolchain used
        run: |
          rustc --version
          cargo fmt --version

      - name: Apply formatting
        run: cargo fmt --all

      # The evidence you asked for: the exact list of files rustfmt rewrote.
      - name: List every file rustfmt changed
        run: |
          cd ..
          git diff --stat
          echo "---- files ----"
          git diff --name-only

      # Proves the gate now passes, before anything is committed.
      - name: Verify the format gate passes
        run: cargo fmt --all --check

      - name: Commit the formatting
        run: |
          cd ..
          if git diff --quiet; then
            echo "Nothing to format; the gate was already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply cargo fmt across the Rust workspace"
          git push
