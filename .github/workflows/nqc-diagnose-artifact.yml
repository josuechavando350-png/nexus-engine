name: NQC diagnose a failed census stage

# Read-only diagnosis of RMC-009 run 36648778677, whose index partition 3 on
# tenderly-public failed ten times with JSON-RPC -32602 "invalid params". The
# probe rebuilds that partition's exact eth_getLogs requests from the
# certified D06 history and records every refused window and its full
# error. Nothing is written anywhere.
on:
  push:
    branches: [claude/handoff-mercados-execution-xmkiwm]
    paths:
      - .github/workflows/nqc-diagnose-artifact.yml
      - ci/nqc-probe/d09_tenderly_window_probe.py

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the certified D06 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nqc-rmc006-evidence-25437474-a33a012591cd6625ddb921d995bb1bd95b4a5406-36627517591-1
          run-id: "36627517591"
          github-token: ${{ github.token }}
          path: /tmp/d06
      - name: Probe tenderly-public on partition 3
        run: |
          set -euo pipefail
          echo "297f642608eaeaedb7e9c56ed150e18f8036aae3861d611d3fcbf7c21dae7a6f  /tmp/d06/aave-history.json" | sha256sum --check --strict
          python3 ci/nqc-probe/d09_tenderly_window_probe.py /tmp/d06/aave-history.json | tee /tmp/probe.log
          grep -E "^(PROBE|TENDERLY_REFUSED|REFUSED_WINDOW|TENDERLY_SPAN|MEVBLOCKER_REFUSED)" /tmp/probe.log
