name: NQC diagnose a failed census artifact

# Read-only diagnosis: downloads one artifact of an earlier run and prints
# its error and stage logs plus a summary of its store streams. It changes
# nothing and acquires nothing.
on:
  push:
    branches: [claude/handoff-mercados-execution-xmkiwm]
    paths:
      - .github/workflows/nqc-diagnose-artifact.yml

permissions:
  contents: read
  actions: read

env:
  RUN_ID: "36648778677"
  ARTIFACT: d09-index-tenderly-public-3-d46604e2e6f28c1e9af49c2adbce7062518ec0fd-36648778677-1

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/diag
      - name: Print errors, stage log and stream summary
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/diag
          ls -la
          for f in stage-attempt-*.err stage.log; do
            [ -f "$f" ] || continue
            echo "===== $f ($(wc -c < "$f") bytes)"
            tail -c 6000 "$f"
            echo
          done
          echo "===== streams"
          for scope in store/streams/*/; do
            [ -d "$scope" ] || continue
            echo "$scope SCOPE: $(head -c 600 "$scope/SCOPE" 2>/dev/null || true)"
            ls "$scope/checkpoints" | tail -n 3
            echo "checkpoints=$(ls "$scope/checkpoints" | wc -l)"
          done
          echo "===== last checkpoint"
          last=$(ls -1 store/streams/*/checkpoints/* 2>/dev/null | sort | tail -n 1 || true)
          [ -n "$last" ] && head -c 3000 "$last" | strings | head -60 || true
