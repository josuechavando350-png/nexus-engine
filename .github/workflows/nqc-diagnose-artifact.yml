name: NQC diagnose a failed census stage

# Read-only diagnosis of RMC-009 live run 36674256094, whose index counted 13
# Mint/BalanceTransfer logs to the zero address. The probe finds every such log
# from the exact RMC-009 filter on both providers, requires them to agree,
# identifies each transaction, and reads the zero address's scaled balance and
# balance of every token at the census anchor. Nothing is written anywhere.
on:
  push:
    branches: [claude/handoff-mercados-execution-xmkiwm]
    paths:
      - .github/workflows/nqc-diagnose-artifact.yml
      - ci/nqc-probe/d09_zero_account_probe.py

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the certified D06 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nqc-rmc006-evidence-25437474-a33a012591cd6625ddb921d995bb1bd95b4a5406-36627517591-1
          run-id: "36627517591"
          github-token: ${{ github.token }}
          path: /tmp/d06
      - name: Probe the zero-address index logs and holdings
        run: |
          set -euo pipefail
          echo "297f642608eaeaedb7e9c56ed150e18f8036aae3861d611d3fcbf7c21dae7a6f  /tmp/d06/aave-history.json" | sha256sum --check --strict
          python3 ci/nqc-probe/d09_zero_account_probe.py /tmp/d06/aave-history.json | tee /tmp/probe.log
          grep -E "^(PROBE|ZERO_|PROVIDERS_|REFUSED|NO_ANSWER)" /tmp/probe.log
