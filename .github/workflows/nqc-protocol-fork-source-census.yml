name: NQC T39 Protocol Fork Source Census

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-source-census.yml
      - ci/nqc-protocol-fork/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/nqc-protocol-fork-source-census.yml
      - ci/nqc-protocol-fork/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-census:
    name: Protocol/Fork Truth source census
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify Build Truth ancestry and closed prerequisite
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bc519fb90baf6629b5ce9b99ed69c4b5e05dcfe0 HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path

          close=json.loads(Path("ci/nqc-build-truth/BUILD_TRUTH_CLOSEOUT.json").read_text())
          assert close["status"] == "BUILD_TRUTH_CLOSED"
          assert close["closeout_attestation_sha256"] == "1bfc0007c988da7b0c3ab590c5fa8918b0d8cd0c4864537f2b5c744f924db22a"
          truth=close["truth_boundaries"]
          assert truth["real_market_census"] == "NOT_TESTED"
          assert truth["live_pnl_evidence"] is False
          assert truth["production_authority_issued"] is False
          PY

      - name: Verify fail-closed T39 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract=json.loads(Path("ci/nqc-protocol-fork/PROTOCOL_FORK_TRUTH_CONTRACT.json").read_text())
          assert contract["schema_version"] == 1
          assert contract["tranche"] == "T39_PROTOCOL_FORK_TRUTH_55_TO_62"
          assert contract["status"] == "NOT_TESTED"
          assert contract["scope"] == "POST_BUILD_TRUTH_PROTOCOL_AND_HISTORICAL_FORK_CERTIFICATION"
          assert contract["source_of_truth"]["build_truth_closeout_main_commit"] == "bc519fb90baf6629b5ce9b99ed69c4b5e05dcfe0"
          assert contract["source_of_truth"]["build_truth_closeout_attestation_sha256"] == "1bfc0007c988da7b0c3ab590c5fa8918b0d8cd0c4864537f2b5c744f924db22a"

          recovered=contract["recovered_physical_source"]
          assert recovered["git_bundle_checkpoint"] == "2b640ccdeadeb8bf7b0ffc0e07ce861305cf11b9"
          assert recovered["git_bundle_checkpoint_status"] == "PHYSICALLY_RECOVERED_EXTERNALLY_AND_DIGEST_RECORDED"
          assert recovered["checkpoint_archive_sha256"] == "50471b7e29fd55a8c110d4e29ddf38021bfa3e0006ca42c6d833db02c4fa188e"
          assert recovered["documented_master_head"] == "dd5db84"
          assert recovered["documented_target_checkpoint"] == "4eba05d1fe15"
          assert recovered["documented_master_head_status"] == "NOT_PHYSICALLY_AVAILABLE"
          assert recovered["documented_target_checkpoint_status"] == "NOT_PHYSICALLY_AVAILABLE"

          blockers={b["id"]:b for b in contract["current_blockers"]}
          assert set(blockers) == {"PFT-SRC-001","PFT-SRC-002","PFT-SRC-003"}
          assert all(b["severity"] == "HARD" for b in blockers.values())
          closeout_paths={
              "PFT-SRC-001":Path("ci/nqc-protocol-fork/reimplementation/nqc-v2-backrun-executor/PFT-SRC-001-CLOSEOUT.json"),
              "PFT-SRC-002":Path("ci/nqc-protocol-fork/reimplementation/nqc-v2-state/PFT-SRC-002-CLOSEOUT.json"),
              "PFT-SRC-003":Path("ci/nqc-protocol-fork/reimplementation/nqc-aave-reconciler/PFT-SRC-003-CLOSEOUT.json"),
          }
          for blocker_id,blocker in blockers.items():
              assert blocker["status"] in {"OPEN","CLOSED"}, (blocker_id,blocker["status"])
              if blocker["status"]=="CLOSED":
                  closeout_path=closeout_paths[blocker_id]
                  assert closeout_path.is_file(), (blocker_id,"closed without closeout file")
                  closeout=json.loads(closeout_path.read_text())
                  assert closeout["source_blocker"]==blocker_id
                  assert closeout["status"]=="CLOSED"
                  assert closeout["unexplained_mismatches"]==0
                  assert closeout["protocol_fork_truth"]=="NOT_CLOSED"

          assert contract["parity_rules"]["unexplained_mismatch_terminal_count"] == 0
          truth=contract["truth_boundaries"]
          assert truth["real_market_census"] == "NOT_TESTED"
          assert truth["real_live_market_evidence"] is False
          assert truth["shadow_live_market_execution"] is False
          assert truth["canary_execution"] is False
          assert truth["live_pnl_evidence"] is False
          assert truth["production_authority_issued"] is False
          assert truth["production_certification"] == "NOT_CERTIFIED"
          PY

      - name: Verify current GitHub tree and measured source gaps
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol
          test -f ci/nqc-t36/fork/NqcFlashFundingExecutorFork.t.sol
          test -f ci/nqc-t36/T36_CLOSEOUT.json
          test -f ci/nqc-t37/T37_CLOSEOUT.json

          # Recovery census checks only the immutable recovered-source namespace.
          # Explicit measured reimplementations live under reimplementation/ and
          # must not be mistaken for recovered historical bytes.
          test ! -e ci/nqc-protocol-fork/recovered-source/contracts/src/NqcV2BackrunExecutor.sol
          test ! -e ci/nqc-protocol-fork/recovered-source/crates/nqc-v2-state
          test ! -e ci/nqc-protocol-fork/recovered-source/crates/nqc-aave-reconciler

          python3 - <<'PY'
          import json
          from pathlib import Path

          census=json.loads(Path("ci/nqc-protocol-fork/SOURCE_CENSUS.json").read_text())
          assert census["github_main"] == "bc519fb90baf6629b5ce9b99ed69c4b5e05dcfe0"
          assert census["classification"] == "SOURCE_CENSUS_COMPLETE_WITH_HARD_RECOVERY_GAPS"
          assert census["protocol_fork_truth_status"] == "BLOCKED_PENDING_SOURCE_RECOVERY_OR_MEASURED_DEFECT_REPAIR"
          assert census["physical_git_bundle"]["checkpoint_head"] == "2b640ccdeadeb8bf7b0ffc0e07ce861305cf11b9"
          assert census["physical_git_bundle"]["verification_scope"].startswith("RECOVERED_LIBRARY_ARTIFACT_INSPECTED_OUTSIDE_GITHUB_CI")
          assert len(census["exact_absences_verified"]) == 6

          t36=json.loads(Path("ci/nqc-t36/T36_CLOSEOUT.json").read_text())
          assert t36["aave_v3_real_pool_callback_parity"] is True
          assert t36["balancer_v2_real_vault_callback_parity"] is True
          assert t36["exact_fee_match_verified"] is True
          PY

      - name: Emit content-addressed census evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-pft-source-census
          cp ci/nqc-protocol-fork/PROTOCOL_FORK_TRUTH_CONTRACT.json /tmp/nqc-pft-source-census/
          cp ci/nqc-protocol-fork/SOURCE_CENSUS.json /tmp/nqc-pft-source-census/
          sha256sum             ci/nqc-protocol-fork/PROTOCOL_FORK_TRUTH_CONTRACT.json             ci/nqc-protocol-fork/SOURCE_CENSUS.json             > /tmp/nqc-pft-source-census/source-census.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path("ci/nqc-protocol-fork/PROTOCOL_FORK_TRUTH_CONTRACT.json").read_text())
          blockers=contract["current_blockers"]
          open_count=sum(1 for b in blockers if b["status"]=="OPEN")
          closed_count=sum(1 for b in blockers if b["status"]=="CLOSED")
          status={
              "tranche":"T39_PROTOCOL_FORK_TRUTH_55_TO_62",
              "source_census":"PASS",
              "historical_source_recovery_gaps":3,
              "hard_source_blockers_open":open_count,
              "hard_source_blockers_closed":closed_count,
              "protocol_fork_truth":"BLOCKED_BY_SOURCE" if open_count else "SOURCE_BLOCKERS_CLOSED_OTHER_GATES_MAY_REMAIN",
              "real_market_census":"NOT_TESTED",
              "live_pnl_evidence":False,
              "production_certification":"NOT_CERTIFIED",
          }
          Path("/tmp/nqc-pft-source-census/status.json").write_text(
              json.dumps(status,indent=2,sort_keys=True)+"\n"
          )
          PY
          sha256sum /tmp/nqc-pft-source-census/* > /tmp/nqc-pft-source-census/SHA256SUMS
          (cd /tmp/nqc-pft-source-census && sha256sum -c SHA256SUMS)

      - name: Upload source census evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-protocol-fork-source-census
          path: /tmp/nqc-pft-source-census/
          if-no-files-found: error
          retention-days: 30
