name: NQC RMC-016 Top-Three WETH Preblock Health Truth

on:
  pull_request:
    paths:
      - '.github/workflows/nqc-rmc016-top3-preblock-health.yml'
      - 'ci/nqc-census/rmc016_top3_preblock_health.py'
      - 'ci/nqc-census/test_rmc016_top3_preblock_health.py'
      - 'ci/nqc-census/RMC016_TOP3_PREBLOCK_HEALTH_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rmc016-top3-hf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  three-authentic-historical-winner-prestates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify precise old stage ancestry and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4e4983f2c937f6d3f1c65bcdfc699b18afb5dbbd HEAD
          test "$(git hash-object ci/nqc-census/rmc016_aave_event_legs.py)" = 0474d97814deb60490a795b2059f3065c72d8103
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = 5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa
          python3 ci/nqc-census/test_rmc016_top3_preblock_health.py
          python3 ci/nqc-census/test_rmc016_rank1_preblock_health.py
          python3 -m py_compile ci/nqc-census/rmc016_top3_preblock_health.py
          mkdir -p "$RUNNER_TEMP/nqc016-top3-source" "$RUNNER_TEMP/nqc016-top3-report"
          sha256sum ci/nqc-census/rmc016_top3_preblock_health.py \
                    ci/nqc-census/RMC016_TOP3_PREBLOCK_HEALTH_CONTRACT.md \
                    > "$RUNNER_TEMP/nqc016-top3-report/source-sha256.txt"
          echo RMC016_TOP3_PREBLOCK_HF_ADVERSARIAL_OFFLINE_PASS

      - name: Independently pin three real source archives and prior rank-one HF authority
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nqc016-top3-source"
          check() {
            local run="$1" head="$2" workflow="$3" outcome="$4" artifact="$5" name="$6" digest="$7" label="$8"
            local meta art
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            art="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact")"
            test "$(jq -r .status <<<"$meta")" = completed
            test "$(jq -r .conclusion <<<"$meta")" = "$outcome"
            test "$(jq -r .name <<<"$meta")" = "$workflow"
            test "$(jq -r .head_sha <<<"$meta")" = "$head"
            test "$(jq -r .expired <<<"$art")" = false
            test "$(jq -r .name <<<"$art")" = "$name"
            test "$(jq -r .digest <<<"$art")" = "sha256:$digest"
            test "$(jq -r .workflow_run.id <<<"$art")" = "$run"
            if [ "$label" != "rank1-cert" ]; then
              curl --fail --silent --show-error --location --retry 2 \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" \
                -o "$root/$label.zip"
              printf '%s  %s\n' "$digest" "$root/$label.zip" | sha256sum --check --strict
            fi
          }
          check 37718661409 abe54f1f23bd7bff8c37871200f7da7c59c45ac3 'NQC RMC-016 Full Liquidation Ledger Discovery' success 11524139188 'rmc016-full-liquidation-events-abe54f1f23bd7bff8c37871200f7da7c59c45ac3' '6b4098c1acf153106ac5b67d2c5c7db5cd0295a16c782ad8c34ae75303306204' events
          check 37719091371 569d4aaeecb3d066389c054efed695be02e3ef40 'NQC RMC-016 Dual Operator Winner Receipt Parity' failure 11524199698 'rmc016-dual-winner-receipts-569d4aaeecb3d066389c054efed695be02e3ef40' '182b5e81b00ca04e53c9193c1496a725dc152ade9a17d3ab2dfaeb5045ac86b6' receipts
          check 37722878737 b02e7c5a4ff9a8c38898ab35e46777f9af35d192 'NQC RMC-016 Historical Aave Raw Liquidation Legs' success 11525823668 'rmc016-integer-liquidation-legs-b02e7c5a4ff9a8c38898ab35e46777f9af35d192' 'b5927f49a5099a9fe8971df82f1ea5fa2c4a169b11a846f2f3c2671b1efa71ee' legs
          check 37739525958 4e4983f2c937f6d3f1c65bcdfc699b18afb5dbbd 'NQC RMC-016 Rank-One Aave Preblock Health Truth' success 11533585303 'rmc016-rank1-hf-preblock-4e4983f2c937f6d3f1c65bcdfc699b18afb5dbbd' 'fea8c534a1386dafbc180e626c8af4d2ea339b0a752cae5860306647a8fff344' rank1-cert
          echo RMC016_TOP3_ALL_SOURCE_AND_PREVIOUS_HF_ARCHIVES_PINNED

      - name: Compare actual top-three winner receipts and predecessor Aave HF over two RPCs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nqc016-top3-source"
          out="$RUNNER_TEMP/nqc016-top3-report/top3-preblock-hf.json"
          python3 ci/nqc-census/rmc016_top3_preblock_health.py \
            --event-zip "$root/events.zip" \
            --receipt-zip "$root/receipts.zip" \
            --legs-zip "$root/legs.zip" \
            --out "$out"
          jq -e '.status=="RMC016_TOP3_HISTORICAL_WETH_PREBLOCK_HEALTH_TRUTH_ONLY" and
                 .observed_historical_top_three_count == 3 and
                 (.three_source_rows | length) == 3 and
                 .observed_predecessor_below_one_count +
                   .observed_predecessor_not_below_one_count == 3 and
                 .three_source_rows[0].rank == 1 and
                 .three_source_rows[0].health_factor_wad == "1000000001993818630" and
                 .three_source_rows[0].below_one_at_previous_block == false and
                 .independent_two_provider_parity == true and
                 .source_selection_uses_future_winner_knowledge == true and
                 .evidence_of_ex_ante_discovery_or_strategy_capture == false and
                 .replayed_real_liquidation_in_preblock == false and
                 .flash_principal_and_gas_externally_financed == false and
                 .complete_costs_or_realized_nexus_profit_certified == false and
                 .real_market_census_closed == false' "$out" >/dev/null
          (cd "$RUNNER_TEMP/nqc016-top3-report" &&
            sha256sum top3-preblock-hf.json source-sha256.txt > archive.sha256 &&
            sha256sum --check --strict archive.sha256)
          echo RMC016_THREE_REAL_WINNER_PREBLOCK_HF_OBSERVED_NO_EX_ANTE_CAPTURES

      - name: Preserve immutable top-three time-eligibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc016-three-winner-preblock-hf-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nqc016-top3-report/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
