name: NQC RMC-016 Two WETH Winner Historical Prices

on:
  push:
    branches:
      - 'nqc/rmc016-top2-weth-price-source-20261008'
    paths:
      - 'ci/nqc-census/rmc016_historical_gas_price_oracle.py'
      - 'ci/nqc-census/test_rmc016_historical_gas_price_oracle.py'
      - 'ci/nqc-census/rmc016_preblock_gas_oracle_batch.py'
      - 'ci/nqc-census/test_rmc016_preblock_gas_oracle_batch.py'
      - 'ci/nqc-census/RMC016_TOP_TWO_WETH_PRICE_CONTRACT.md'
      - '.github/workflows/nqc-rmc016-top-weth-oracle.yml'
  pull_request:
    paths:
      - 'ci/nqc-census/rmc016_preblock_gas_oracle_batch.py'
      - 'ci/nqc-census/test_rmc016_preblock_gas_oracle_batch.py'
      - 'ci/nqc-census/RMC016_PREBLOCK_GAS_PRICE_REFERENCE_CONTRACT.md'
      - '.github/workflows/nqc-rmc016-preblock-gas-reference.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nqc-top-weth-oracle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  immutable-sources-and-real-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify immutable D16 code ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7ec0f23fb7e114c6ac6d873bdb2889f309c2ac50 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = \
            '5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa'
          python3 -m py_compile ci/nqc-census/rmc016_preblock_gas_oracle_batch.py
          jq -e '.authority.nqc_conservative_realizable_capacity_usd_wad == "0" and
                 .authority.month1_300k_target_proven == false' \
            ci/nqc-census/rmc016-production-evidence.json >/dev/null
      - name: Independently verify three exact immutable GitHub archive identities
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nqc-oracle-evidence"
          mkdir -p "$ROOT"
          check() {
            local run="$1" head="$2" tree="$3" workflow="$4" outcome="$5" artifact="$6" artname="$7" expected="$8"
            local meta art file
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            art="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact")"
            test "$(jq -r .status <<<"$meta")" = completed
            test "$(jq -r .conclusion <<<"$meta")" = "$outcome"
            test "$(jq -r .name <<<"$meta")" = "$workflow"
            test "$(jq -r .head_sha <<<"$meta")" = "$head"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')" = "$tree"
            test "$(jq -r .expired <<<"$art")" = false
            test "$(jq -r .name <<<"$art")" = "$artname"
            test "$(jq -r .digest <<<"$art")" = "sha256:$expected"
            test "$(jq -r '.workflow_run.id' <<<"$art")" = "$run"
            file="$ROOT/github-actions-artifact-$artifact.zip"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" -o "$file"
            printf '%s  %s\n' "$expected" "$file" | sha256sum --check --strict
          }
          check 37718661409 abe54f1f23bd7bff8c37871200f7da7c59c45ac3 \
            c74f8d9d2c317a011284398643b2d4aa6de06e83 \
            'NQC RMC-016 Full Liquidation Ledger Discovery' success \
            11524139188 rmc016-full-liquidation-events-abe54f1f23bd7bff8c37871200f7da7c59c45ac3 \
            6b4098c1acf153106ac5b67d2c5c7db5cd0295a16c782ad8c34ae75303306204
          check 37719091371 569d4aaeecb3d066389c054efed695be02e3ef40 \
            ba648214fb5cb1cdca1db1f42f28059054d78e63 \
            'NQC RMC-016 Dual Operator Winner Receipt Parity' failure \
            11524199698 rmc016-dual-winner-receipts-569d4aaeecb3d066389c054efed695be02e3ef40 \
            182b5e81b00ca04e53c9193c1496a725dc152ade9a17d3ab2dfaeb5045ac86b6
          check 37719715290 1a03cbb1c95ae9b66096ab19e5842cec435f1e1e \
            0f24e31f52a31256f2bfc34fa2cb7f46eef9958a \
            'NQC RMC-016 Historical WETH Price Oracle Sample' success \
            11524894285 rmc016-historical-weth-oracle-1a03cbb1c95ae9b66096ab19e5842cec435f1e1e \
            5d321ec4707da6b9b0a0e1b24ce2d28992bb9329dd937baa6466c759359c3f73
          echo "NQC_ORACLE_SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Adversarial test matrix and authentic source cardinality
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/test_rmc016_historical_gas_price_oracle.py
          python3 ci/nqc-census/test_rmc016_preblock_gas_oracle_batch.py
          python3 - "$NQC_ORACLE_SOURCE_ROOT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'ci/nqc-census')
          from rmc016_preblock_gas_oracle_batch import src
          root=Path(sys.argv[1])
          by,blocks,samples=src(root/'github-actions-artifact-11524139188.zip',
                                root/'github-actions-artifact-11524199698.zip',
                                root/'github-actions-artifact-11524894285.zip')
          assert len(blocks)==123 and sum(map(len,by.values()))==127
          assert samples['25883782']['price_raw']=='243398000000'
          print('RMC016_127_REAL_RECEIPTS_123_DISTINCT_BLOCKS_PINNED_PASS')
          PY
      - name: Compare two specified historical WETH/WETH winning blocks independently
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nqc-gas-reference"
          python3 - "$NQC_ORACLE_SOURCE_ROOT" "$RUNNER_TEMP/nqc-gas-reference/top-two-weth-prices.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'ci/nqc-census')
          from rmc016_preblock_gas_oracle_batch import src,acquire,canonical
          root=Path(sys.argv[1]);output=Path(sys.argv[2])
          a=root/'github-actions-artifact-11524139188.zip'
          b=root/'github-actions-artifact-11524199698.zip'
          c=root/'github-actions-artifact-11524894285.zip'
          receipt_by_block,blocks,_=src(a,b,c)
          targets=[
            (25938048,'0x6313fb267755f3cfa48214bf74309505984306129ee09a558efe4801006dcbba',
             '0xf143f9988199037938e4dff57aaf24301a4c26770aefc0ec64774954cbf2dbe4'),
            (26071849,'0x3c8757b8e83e098f64d88d0244709c7cdcf50ef67238e24d32357bcb679b5adb',
             '0xa0a76708671af64aab973d384b02d31dc5a3f5f110efd7435b60fb6001b13807')
          ]
          rows=[]
          for number,tid,blockhash in targets:
              assert number in blocks and len(receipt_by_block[number])==1
              assert receipt_by_block[number][0]['transaction_hash']==tid
              assert receipt_by_block[number][0]['block_hash']==blockhash
              item=acquire(a,b,c,offset=blocks.index(number),count=1,spacing=1.5)
              assert item['status']=='RMC016_DUAL_OPERATOR_PREBLOCK_GAS_REFERENCE_PASS'
              assert item['two_provider_consensus'] is True
              assert item['exact_pre_tx_state_proven'] is False
              x=item['prices'][0]
              assert x['tx_block']==number and x['block_end']['hash']==blockhash
              rows.append({'transaction_hash':tid,'block_number':number,
                           'preblock':x['preblock'],'block_end':x['block_end'],
                           'historical_winner_gas_wei':x['winner_gas_wei'],
                           'two_operator_preblock_oracle_consensus':True,
                           'exact_transaction_prestate_proven':False})
          report={'schema_version':1,
             'status':'TWO_HISTORICAL_WETH_WINNER_PREBLOCK_ORACLE_PRICES_PASS',
             'source_scope':'TWO_OBSERVED_COMPETITOR_WINNERS_NOT_NEXUS',
             'transactions':rows,
             'preblock_oracle_unit':'USD_WITH_8_DECIMALS',
             'exact_intratransaction_price_proven':False,
             'historical_protocol_flash_fees_verified':False,
             'nexus_gas_and_principal_funding_proven':False,
             'nexus_capture_proven':False,
             'nexus_realized_profitability_proven':False,
             'real_market_census_closed':False}
          report['report_sha256']=hashlib.sha256(canonical(report)).hexdigest()
          output.write_bytes(canonical(report))
          print(report['status'],len(rows),rows[0]['preblock']['oracle_usd_base_1e8'],rows[1]['preblock']['oracle_usd_base_1e8'])
          PY
          jq -e '
            .status == "TWO_HISTORICAL_WETH_WINNER_PREBLOCK_ORACLE_PRICES_PASS" and
            (.transactions | length) == 2 and
            .transactions[0].block_number == 25938048 and
            .transactions[1].block_number == 26071849 and
            .transactions[0].two_operator_preblock_oracle_consensus == true and
            .transactions[1].two_operator_preblock_oracle_consensus == true and
            .nexus_capture_proven == false and
            .nexus_realized_profitability_proven == false and
            .exact_intratransaction_price_proven == false and
            .real_market_census_closed == false
          ' "$RUNNER_TEMP/nqc-gas-reference/top-two-weth-prices.json"
          (cd "$RUNNER_TEMP/nqc-gas-reference" &&
             sha256sum top-two-weth-prices.json > archive.sha256 &&
             sha256sum -c archive.sha256)
      - name: Preserve sampled oracle evidence or fail-closed diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc016-two-weth-winner-historical-prices-${{ github.sha }}
          path: ${{ runner.temp }}/nqc-gas-reference/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
