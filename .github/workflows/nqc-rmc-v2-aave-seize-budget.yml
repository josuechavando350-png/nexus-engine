name: NQC RMC V2 Aave sUSDe Conditional Seizure Audit (NO EXECUTION)
on:
  pull_request:
    paths:
      - 'ci/nqc-census/rmc-v2-economics/aave_susde_seize_budget.py'
      - 'ci/nqc-census/rmc-v2-economics/test_aave_susde_seize_budget.py'
      - '.github/workflows/nqc-rmc-v2-aave-seize-budget.yml'
  push:
    branches:
      - 'nqc/rmc-v2-aave-liquidation-seize-budget-20261013'
    paths:
      - 'ci/nqc-census/rmc-v2-economics/aave_susde_seize_budget.py'
      - 'ci/nqc-census/rmc-v2-economics/test_aave_susde_seize_budget.py'
      - '.github/workflows/nqc-rmc-v2-aave-seize-budget.yml'

permissions:
  contents: read

concurrency:
  group: rmc-v2-aave-collateral-budget-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conditional-not-liquidatable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact producing source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject unexpected branch checkout and run offline adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile ci/nqc-census/rmc-v2-economics/aave_susde_seize_budget.py
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-economics \
            -p 'test_aave_susde_seize_budget.py' -v
      - name: Install pinned read-only Foundry 1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry" "$RUNNER_TEMP/aave-susde-seize"
          curl --fail --location --retry 4 --retry-all-errors --max-time 160 \
            -o "$RUNNER_TEMP/foundry.tar.gz" \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  $RUNNER_TEMP/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: Read pinned Aave reserve, eMode, oracle, borrower aToken and debt state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aave-susde-seize"
          : > "$OUT/provider-attempts.txt"
          SUCCESS=0
          for RPC in \
            "https://ethereum-rpc.publicnode.com" \
            "https://eth.drpc.org" \
            "https://1rpc.io/eth" \
            "https://eth.llamarpc.com"
          do
            echo "TRY_PUBLIC_ARCHIVE $RPC" >> "$OUT/provider-attempts.txt"
            if timeout 320s python3 ci/nqc-census/rmc-v2-economics/aave_susde_seize_budget.py \
                --rpc-url "$RPC" \
                --source-out "$OUT/exact-onchain-input.json" \
                --result-out "$OUT/conditional-seizure-budget.json" \
                > "$OUT/console.txt" 2> "$OUT/last-error.txt"; then
              echo "CANONICAL_STATE_RECONSTRUCTED_WITH_THIS_RPC $RPC" >> "$OUT/provider-attempts.txt"
              echo "$RPC" > "$OUT/provider.txt"
              SUCCESS=1
              break
            fi
            echo "RPC_OR_CONFIG_GATE_REJECTED" >> "$OUT/provider-attempts.txt"
          done
          test "$SUCCESS" -eq 1
          jq -e '
            .contract=="NQC_RMC_V2_AAVE_SUSDE_SEIZE_BUDGET_CONDITIONAL_RESEARCH"
            and .block_number==26184741
            and .block_hash=="0xe4b0718c51a6a484eef56edce0f25e9a5c546c2f66f595c6e305a589a612dbbe"
            and .emode==24 and .emode_bonus_bps==10310
            and .health_factor_below_one==false
            and .illustrative_debt_cover_usdtb_raw=="472000000000000000000000"
            and (.sUSDe_protocol_liquidation_fee_bps|type)=="number"
            and (.conditional_protocol_fee_susde_raw|type)=="string"
            and (.separate_fluid_fork_sizes|length)==4
            and .no_interpolation_between_samples==true
            and .liquidation_executed==false
            and .route_settled==false
            and .economic_net_pnl_usd==null
            and .external_nonrecourse_gas==false
            and .p2_shadow_certified==false
            and .rmc_closed==false
            and .commercial_score_upgrade==false
            and .nqc_realized_pnl_usd=="0"
          ' "$OUT/conditional-seizure-budget.json"
          jq '{
            block_number,health_factor_wad,emode_bonus_bps,
            sUSDe_protocol_liquidation_fee_bps,
            sUSDe_oracle_price_1e8,USDtb_oracle_price_1e8,
            illustrative_debt_cover_usdtb_raw,
            conditional_close_factor_max_cover_raw,
            conditional_gross_collateral_susde_raw,
            conditional_protocol_fee_susde_raw,
            conditional_liquidator_net_susde_raw,
            gross_388k_susde_possible,net_388k_susde_possible,
            net_minus_388k_susde_raw,
            separate_fluid_fork_sizes
          }' "$OUT/conditional-seizure-budget.json" | tee "$OUT/summary.json"
      - name: Archive non-authoritative calculations with content hashes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aave-susde-seize"
          cp ci/nqc-census/rmc-v2-economics/aave_susde_seize_budget.py "$OUT/model-source.py"
          cp ci/nqc-census/rmc-v2-economics/test_aave_susde_seize_budget.py "$OUT/model-tests.py"
          jq -n --arg head "${{ github.event.pull_request.head.sha || github.sha }}" \
             '{schema_version:1,source_commit:$head,
               scope:"ONE_ARCHIVE_RPC_EXACT_HISTORICAL_BLOCK_CONDITIONAL_AAVE_MATH",
               Aave_liquidation_possible_at_observed_HF:false,
               conditional_collateral_not_real_seizure:true,
               raw_oracle_quote_not_prospective_trigger:true,
               independent_operator_quorum:false,
               full_cross_asset_atomic_execution:false,
               successful_flash_settlement:false,
               real_collateral_received:false,
               no_assumed_profit_from_separate_fork_swaps:true,
               gas_and_builder_not_paid_or_quoted:true,
               p2_shadow_certified:false,rmc_closed:false,
               commercial_score_upgrade:false,nqc_realized_pnl_usd:"0"}' > "$OUT/nonclaims.json"
          (cd "$OUT" && sha256sum exact-onchain-input.json conditional-seizure-budget.json \
             summary.json model-source.py model-tests.py nonclaims.json > evidence.sha256 \
             && sha256sum -c evidence.sha256)
      - name: Preserve both positive and negative diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc-v2-aave-susde-budget-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aave-susde-seize/
          if-no-files-found: warn
          retention-days: 30
