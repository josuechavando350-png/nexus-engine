name: Topology bootstrap retry

on:
  push:
    branches:
      - feat/topology-engine
    paths:
      - '.github/workflows/topology-bootstrap-retry.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Materialize audited topology source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, tarfile
          from pathlib import Path
          text = Path('.github/workflows/topology-bootstrap.yml').read_text()
          prefix = "printf '%s' '"
          suffix = "' | base64 -d > /tmp/topology-payload.tgz"
          start = text.find(prefix)
          if start < 0:
              raise SystemExit('Topology payload prefix not found')
          start += len(prefix)
          end = text.find(suffix, start)
          if end < 0:
              raise SystemExit('Topology payload suffix not found')
          archive = Path('/tmp/topology-payload.tgz')
          archive.write_bytes(base64.b64decode(text[start:end], validate=True))
          with tarfile.open(archive, 'r:gz') as tar:
              tar.extractall('.')
          package_path = Path('packages/topology/package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test'] = 'vitest run --root ../.. packages/topology/src/__tests__/topology.test.ts'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Validate Motor 2 packages
        run: |
          pnpm --filter @nexus/topology typecheck
          pnpm --filter @nexus/topology test
          pnpm --filter @nexus/topology build
          pnpm --filter @nexus/measurement typecheck
          pnpm --filter @nexus/measurement build
          git diff --check
      - name: Commit Motor 2 and remove bootstrap helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/topology packages/measurement/package.json packages/measurement/topology.ts packages/measurement/topology.test.ts pnpm-lock.yaml
          git rm .github/workflows/topology-bootstrap.yml .github/workflows/topology-bootstrap-retry.yml
          git commit -m "feat(topology): integrate persistent homology engine"
          git push
