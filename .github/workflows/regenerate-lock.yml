name: Restore capability branch Cargo lock

on:
  push:
    paths:
      - '.github/workflows/regenerate-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore runtime Cargo.lock from main
        run: |
          git fetch origin main
          git checkout origin/main -- runtime/Cargo.lock
      - name: Commit restoration if changed
        run: |
          if git diff --quiet -- runtime/Cargo.lock; then
            echo "runtime/Cargo.lock already matches main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/Cargo.lock
          git commit -m "chore(ctr): restore unrelated Cargo lock"
          git push
