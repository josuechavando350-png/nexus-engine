name: NQC RMC-007 V2 Discovery

on:
  pull_request:
    paths:
      - .github/workflows/nqc-census-v2-discovery.yml
      - ci/nqc-census/V2_DISCOVERY_CONTRACT.md
      - ci/nqc-census/v2-discovery-scope.json
      - nqc-census/Cargo.toml
      - nqc-census/Cargo.lock
      - nqc-census/crates/nqc-census-v2-discovery/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      D07_BASE: 8ebf6860e0a16964f5293df0ef40695b303b286d
      PFT_CERTIFIED_COMMIT: 5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf
      PFT_CERTIFIED_TREE: ef3498da528f85cdb9fdd82222d64773a557f853
      RUST_TOOLCHAIN: "1.98.1"
      D07_TESTS_EXPECTED: "10"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify authority and exact scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PFT_CERTIFIED_COMMIT")" = "$PFT_CERTIFIED_TREE"
          git merge-base --is-ancestor "$D07_BASE" HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          fi
          git diff --quiet "$PFT_CERTIFIED_COMMIT" HEAD --             ci/nqc-protocol-fork/recovered-source ci/nqc-protocol-fork/reimplementation             ci/nqc-protocol-fork/compatibility ci/nqc-protocol-fork/locks
          git diff --quiet "$D07_BASE" HEAD --             nqc-census/crates/nqc-census-core nqc-census/crates/nqc-census-store             nqc-census/crates/nqc-census-chain
          echo RMC007_UPSTREAM_IMMUTABLE_PASS

      - name: Verify no authority duplication or transaction path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("nqc-census/crates/nqc-census-v2-discovery")
          forbidden = re.compile(
              r"private.?key|mnemonic|eth_send|eth_sign|personal_|sendRawTransaction|"
              r"reqwest|hyper|tokio|ureq|std::net|TcpStream|UdpSocket|\bunsafe\b")
          violations = []
          for path in root.rglob("*.rs"):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if line.strip().startswith("//"):
                      continue
                  if forbidden.search(line):
                      violations.append(f"{path}:{number}: {line.strip()}")
          assert not violations, "\n".join(violations)
          print("RMC007_BOUNDARY_PASS")
          PY

      - name: Locked Rust gates
        working-directory: nqc-census
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc -V | grep -F "rustc $RUST_TOOLCHAIN "
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          count=$(cargo test --locked -p nqc-census-v2-discovery --test v2_discovery -- --list 2>/dev/null | grep -c ': test$')
          test "$count" = "$D07_TESTS_EXPECTED"
          cargo test --locked -p nqc-census-v2-discovery -- --nocapture
          cargo test --workspace --all-targets --locked
          cargo build --workspace --all-targets --locked
          echo RMC007_RECONCILIATION_CORE_PASS
