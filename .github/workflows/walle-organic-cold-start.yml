name: WALLE Organic Multi-Tenant Cold Start

on:
  pull_request:
    paths:
      - 'seo-avengers-2500/commercial-demand/**'
      - 'seo-avengers-2500/tests/test_nexus_commercial_organic_cold_start.mjs'
      - 'gauss/**'
      - '.github/workflows/walle-organic-cold-start.yml'

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact head and pristine checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Execute cold-start and negative proofs
        run: |
          set -euo pipefail
          node --test seo-avengers-2500/tests/test_nexus_commercial_organic_cold_start.mjs
