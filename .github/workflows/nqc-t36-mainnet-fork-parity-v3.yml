name: NQC T36 Historical Mainnet Fork Parity v3

on:
  push:
    branches:
      - nqc/t36-flash-funding-evidence-20260926
    paths:
      - .github/workflows/nqc-t36-mainnet-fork-parity-v3.yml
      - ci/nqc-t36/fork/**
      - ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol
      - ci/nqc-t36/mainnet-block-20000000.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-fork-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PINNED_BLOCK_DEC: "20000000"
      PINNED_BLOCK_HEX: "0x1312d00"
      AAVE_V3_POOL: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fa4E2"
      BALANCER_V2_VAULT: "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
      WETH: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Foundry 1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-t36-fork/foundry /tmp/nqc-t36-fork/evidence /tmp/nqc-t36-fork/source
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/nqc-t36-fork/foundry.tar.gz \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/nqc-t36-fork/foundry.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nqc-t36-fork/foundry.tar.gz -C /tmp/nqc-t36-fork/foundry
          /tmp/nqc-t36-fork/foundry/forge --version | tee /tmp/nqc-t36-fork/evidence/forge-version.txt
          /tmp/nqc-t36-fork/foundry/cast --version | tee /tmp/nqc-t36-fork/evidence/cast-version.txt
          sha256sum /tmp/nqc-t36-fork/foundry/forge /tmp/nqc-t36-fork/foundry/cast \
            > /tmp/nqc-t36-fork/evidence/foundry-binaries.sha256

      - name: Restore exact executor plus fork test
        shell: bash
        run: |
          set -euo pipefail
          cp -a ci/nqc-t36/contracts/. /tmp/nqc-t36-fork/source/
          cp ci/nqc-t36/fork/NqcFlashFundingExecutorFork.t.sol \
            /tmp/nqc-t36-fork/source/test/NqcFlashFundingExecutorFork.t.sol
          export PATH="/tmp/nqc-t36-fork/foundry:$PATH"
          cd /tmp/nqc-t36-fork/source
          forge fmt
          forge fmt --check
          forge build --sizes 2>&1 | tee /tmp/nqc-t36-fork/evidence/forge-build.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C /tmp/nqc-t36-fork/source -cf - foundry.toml src test \
            | gzip -n > /tmp/nqc-t36-fork/evidence/fork-tested-source.tar.gz
          sha256sum /tmp/nqc-t36-fork/evidence/fork-tested-source.tar.gz \
            > /tmp/nqc-t36-fork/evidence/fork-tested-source.tar.gz.sha256

      - name: Select no-secret archive evidence transport and bind canonical block
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/nqc-t36-fork/foundry:$PATH"
          PIN="$GITHUB_WORKSPACE/ci/nqc-t36/mainnet-block-20000000.json"
          EXPECTED_HASH="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["block_hash"])' "$PIN")"
          EXPECTED_ROOT="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["state_root"])' "$PIN")"
          EXPECTED_TS="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["timestamp"])' "$PIN")"

          : > /tmp/nqc-t36-fork/evidence/provider-attempts.txt
          SELECTED=""
          for rpc in \
            "https://eth.drpc.org" \
            "https://ethereum-rpc.publicnode.com" \
            "https://1rpc.io/eth" \
            "https://ethereum.blockpi.network/v1/rpc/public" \
            "https://eth.llamarpc.com" \
            "https://rpc.flashbots.net"
          do
            echo "TRY $rpc" >> /tmp/nqc-t36-fork/evidence/provider-attempts.txt
            rm -f /tmp/nqc-t36-fork/candidate-block.json /tmp/nqc-t36-fork/aave.code /tmp/nqc-t36-fork/balancer.code /tmp/nqc-t36-fork/weth.code
            if ! timeout 25s cast block "$PINNED_BLOCK_DEC" --rpc-url "$rpc" --json > /tmp/nqc-t36-fork/candidate-block.json 2>> /tmp/nqc-t36-fork/evidence/provider-attempts.txt; then
              echo "BLOCK_FAIL" >> /tmp/nqc-t36-fork/evidence/provider-attempts.txt
              continue
            fi
            if ! python3 - "$EXPECTED_HASH" "$EXPECTED_ROOT" "$EXPECTED_TS" <<'PY'
          import json,sys
          d=json.load(open('/tmp/nqc-t36-fork/candidate-block.json'))
          def num(v):
              return int(v,16) if isinstance(v,str) and v.startswith('0x') else int(v)
          assert str(d['hash']).lower()==sys.argv[1].lower(), (d['hash'],sys.argv[1])
          assert str(d['stateRoot']).lower()==sys.argv[2].lower(), (d['stateRoot'],sys.argv[2])
          assert num(d['timestamp'])==int(sys.argv[3]), (d['timestamp'],sys.argv[3])
          assert num(d['number'])==20_000_000, d['number']
          PY
            then
              echo "CANONICAL_IDENTITY_FAIL" >> /tmp/nqc-t36-fork/evidence/provider-attempts.txt
              continue
            fi

            if ! timeout 25s cast code "$AAVE_V3_POOL" --block "$PINNED_BLOCK_DEC" --rpc-url "$rpc" > /tmp/nqc-t36-fork/aave.code 2>> /tmp/nqc-t36-fork/evidence/provider-attempts.txt; then continue; fi
            if ! timeout 25s cast code "$BALANCER_V2_VAULT" --block "$PINNED_BLOCK_DEC" --rpc-url "$rpc" > /tmp/nqc-t36-fork/balancer.code 2>> /tmp/nqc-t36-fork/evidence/provider-attempts.txt; then continue; fi
            if ! timeout 25s cast code "$WETH" --block "$PINNED_BLOCK_DEC" --rpc-url "$rpc" > /tmp/nqc-t36-fork/weth.code 2>> /tmp/nqc-t36-fork/evidence/provider-attempts.txt; then continue; fi
            python3 - <<'PY'
          from pathlib import Path
          for name in ('aave','balancer','weth'):
              x=Path(f'/tmp/nqc-t36-fork/{name}.code').read_text().strip()
              assert x.startswith('0x') and len(x)>4, (name,len(x))
          PY
            SELECTED="$rpc"
            echo "SELECTED $rpc" >> /tmp/nqc-t36-fork/evidence/provider-attempts.txt
            break
          done

          test -n "$SELECTED"
          echo "SELECTED_RPC=$SELECTED" >> "$GITHUB_ENV"
          cp /tmp/nqc-t36-fork/candidate-block.json /tmp/nqc-t36-fork/evidence/canonical-block.json
          sha256sum /tmp/nqc-t36-fork/aave.code /tmp/nqc-t36-fork/balancer.code /tmp/nqc-t36-fork/weth.code \
            > /tmp/nqc-t36-fork/evidence/protocol-code.sha256
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pin=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'ci/nqc-t36/mainnet-block-20000000.json')))
          block=json.load(open('/tmp/nqc-t36-fork/evidence/canonical-block.json'))
          def bsha(p):
              text=Path(p).read_text().strip()
              return hashlib.sha256(bytes.fromhex(text[2:])).hexdigest()
          out={
              'schema_version':3,
              'chain_id':1,
              'block_number':20_000_000,
              'block_hash':pin['block_hash'],
              'state_root':pin['state_root'],
              'timestamp':pin['timestamp'],
              'static_independent_canonical_anchor_match':True,
              'archive_transport_selected_without_secret':True,
              'production_runtime_rpc_dependency':False,
              'secret_dependency':False,
              'protocol_code_sha256':{
                  'aave_v3_pool':bsha('/tmp/nqc-t36-fork/aave.code'),
                  'balancer_v2_vault':bsha('/tmp/nqc-t36-fork/balancer.code'),
                  'weth':bsha('/tmp/nqc-t36-fork/weth.code'),
              },
          }
          Path('/tmp/nqc-t36-fork/evidence/canonical-crosscheck.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Execute real Aave and Balancer historical fork callbacks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/nqc-t36-fork/foundry:$PATH"
          cd /tmp/nqc-t36-fork/source
          forge test \
            --fork-url "$SELECTED_RPC" \
            --fork-block-number "$PINNED_BLOCK_DEC" \
            --match-contract NqcFlashFundingExecutorForkTest \
            -vvv 2>&1 | tee /tmp/nqc-t36-fork/evidence/fork-test.txt

      - name: Attest fork truth
        shell: bash
        run: |
          set -euo pipefail
          grep -q '\[PASS\] testHistoricalMainnetAaveV3FlashLoanSimpleParity()' /tmp/nqc-t36-fork/evidence/fork-test.txt
          grep -q '\[PASS\] testHistoricalMainnetBalancerV2FlashLoanParity()' /tmp/nqc-t36-fork/evidence/fork-test.txt
          grep -q '\[PASS\] testHistoricalMainnetNestedAaveBalancerReverseRepaymentParity()' /tmp/nqc-t36-fork/evidence/fork-test.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          ev=Path('/tmp/nqc-t36-fork/evidence')
          def fsha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          c=json.load(open(ev/'canonical-crosscheck.json'))
          out={
              'schema_version':3,
              'tranche':'FLASH_FUNDING_EXECUTOR_36',
              'scope':'HISTORICAL_ETHEREUM_MAINNET_FORK_PARITY',
              'chain_id':1,
              'block_number':c['block_number'],
              'block_hash':c['block_hash'],
              'state_root':c['state_root'],
              'aave_v3_real_pool_callback_parity':True,
              'balancer_v2_real_vault_callback_parity':True,
              'nested_aave_balancer_reverse_repayment_parity':True,
              'static_independent_canonical_anchor_match':True,
              'fork_test_sha256':fsha(ev/'fork-test.txt'),
              'canonical_crosscheck_sha256':fsha(ev/'canonical-crosscheck.json'),
              'tested_source_archive_sha256':fsha(ev/'fork-tested-source.tar.gz'),
              'rpc_used_only_for_historical_evidence_acquisition':True,
              'production_runtime_rpc_dependency':False,
              'secret_dependency':False,
              'authority_issued':False,
              'live_market_evidence':False,
              'live_pnl_evidence':False,
              'mainnet_fork_truth':'MEASURED_HISTORICAL_PINNED_CANONICAL',
              'formal_certification_status':'NOT_CERTIFIED',
          }
          payload=json.dumps(out,sort_keys=True,separators=(',',':')).encode()
          out['attestation_sha256']=hashlib.sha256(payload).hexdigest()
          (ev/'fork-runtime-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Finalize fork evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nqc-t36-fork
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
          sha256sum evidence/SHA256SUMS.txt
          cat evidence/fork-runtime-summary.json

      - name: Upload T36 historical fork truth evidence
        uses: actions/upload-artifact@v4
        with:
          name: nqc-t36-historical-mainnet-fork-truth-v3
          path: /tmp/nqc-t36-fork/evidence/
          if-no-files-found: error
          retention-days: 30
