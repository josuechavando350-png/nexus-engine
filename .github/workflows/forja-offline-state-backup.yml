name: AXIOMA FORJA Offline State Backup Restore

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate syntax and adversarial restore and signature tests
        run: |
          set -euo pipefail
          node --check forja/state-backup.mjs
          node --check forja/signed-backup.mjs
          node --test forja/tests/state-backup.test.mjs forja/tests/state-backup-hardening.test.mjs forja/tests/signed-backup.test.mjs
      - name: Prove real job and consumed approval survive signed offline restore without replay
        env:
          FORJA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORJA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          ROOT="$(mktemp -d "$RUNNER_TEMP/forja-offline-XXXXXX")"
          chmod 700 "$ROOT"
          STATE="$ROOT/state"
          BACKUP="$ROOT/backup"
          mkdir -m 700 "$STATE" "$BACKUP" "$ROOT/keys" "$ROOT/receipts"
          export ROOT STATE
          node forja/job-queue.mjs submit "$STATE" > "$ROOT/submitted.json"
          node forja/job-queue.mjs run "$STATE" > "$ROOT/finished.json"
          node -e 'const j=require(process.argv[1]);if(j.status!=="SUCCEEDED"||j.sourceRevision!==process.env.FORJA_SOURCE_SHA)process.exit(1)' "$ROOT/finished.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash, generateKeyPairSync } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { challengeForJob, signApproval } from './forja/operator-approval.mjs';
          import { redeemApproval } from './forja/approval-redemption.mjs';
          const { id } = JSON.parse(await readFile(join(process.env.ROOT, 'finished.json'), 'utf8'));
          const pair = generateKeyPairSync('ed25519');
          const operatorId = 'ci-temporary-operator';
          const envelope = signApproval(await challengeForJob({root: process.cwd(),stateDir:process.env.STATE,id}),
            operatorId, pair.privateKey.export({type:'pkcs8',format:'pem'}).toString());
          const trustedOperators = {[operatorId]:pair.publicKey.export({type:'spki',format:'pem'}).toString()};
          const receipt = await redeemApproval({root:process.cwd(),stateDir:process.env.STATE,id,envelope,trustedOperators});
          assert.equal(receipt.status,'CONSUMED_FOR_MANUAL_REVIEW_ONLY');
          assert.equal(receipt.sourceRevision,process.env.FORJA_SOURCE_SHA);
          await writeFile(join(process.env.ROOT,'signed.json'),JSON.stringify(envelope),{mode:0o600});
          await writeFile(join(process.env.ROOT,'trusted.json'),JSON.stringify({operators:trustedOperators}),{mode:0o600});
          const backupPair = generateKeyPairSync('ed25519');
          await writeFile(join(process.env.ROOT,'keys','private.pem'),backupPair.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o600});
          await writeFile(join(process.env.ROOT,'keys','public.pem'),backupPair.publicKey.export({type:'spki',format:'pem'}),{mode:0o600});
          await writeFile(join(process.env.ROOT,'key-fingerprint'),createHash('sha256')
            .update(backupPair.publicKey.export({type:'spki',format:'der'})).digest('hex'),{mode:0o600});
          NODE
          node forja/state-backup.mjs create "$STATE" "$BACKUP" > "$ROOT/snapshot.json"
          ID="$(node -p 'require(process.argv[1]).id' "$ROOT/snapshot.json")"
          JOBID="$(node -p 'require(process.argv[1]).id' "$ROOT/finished.json")"
          PIN="$(cat "$ROOT/key-fingerprint")"
          node forja/state-backup.mjs verify "$BACKUP" "$ID" > "$ROOT/verified.json"
          node forja/signed-backup.mjs sign "$BACKUP" "$ID" "$ROOT/keys/private.pem" "$ROOT/receipts" > "$ROOT/snapshot-signature.json"
          node forja/signed-backup.mjs verify "$BACKUP" "$ID" "$ROOT/receipts" "$ROOT/keys/public.pem" "$PIN" > "$ROOT/verified-signature.json"
          node forja/signed-backup.mjs restore "$BACKUP" "$ID" "$ROOT/receipts" "$ROOT/keys/public.pem" "$PIN" "$ROOT/recovered" > "$ROOT/restored.json"
          diff -r "$STATE" "$ROOT/recovered"
          if node forja/approval-redemption.mjs "$PWD" "$ROOT/recovered" "$JOBID" "$ROOT/signed.json" "$ROOT/trusted.json" > "$ROOT/replay.out" 2> "$ROOT/replay.err"; then
            echo 'A restored consumed approval was replayable' >&2
            exit 1
          fi
          grep -q 'already consumed' "$ROOT/replay.err"
          diff -r "$STATE" "$ROOT/recovered"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
