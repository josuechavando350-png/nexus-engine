name: RMC011 Lock Debug
on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc011-pft-math-bridge/**"
      - ".github/workflows/rmc011-lock-debug.yml"

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate bridge lock and show exact diff
        shell: bash
        working-directory: ci/nqc-census/rmc011-pft-math-bridge
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo generate-lockfile
          echo '=== RMC011_LOCK_DIFF_BEGIN ==='
          diff -u /tmp/Cargo.lock.before Cargo.lock || true
          echo '=== RMC011_LOCK_DIFF_END ==='
          echo '=== RMC011_LOCK_BASE64_BEGIN ==='
          base64 -w0 Cargo.lock
          echo
          echo '=== RMC011_LOCK_BASE64_END ==='
