name: TEMP Capability 12 Correctness Fix

on:
  push:
    branches:
      - feat/capability-12-crawl-observability

permissions:
  contents: write

jobs:
  correct-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-12-crawl-observability
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Apply audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('packages/crawl-observability/src/index.ts')
          text = src.read_text()
          old = '''      ids.push(nextObservation.id);\n      current = nextObservation.redirectLocation;\n      if (hop >= 2) {'''
          new = '''      ids.push(nextObservation.id);\n      current = nextObservation.redirectLocation;\n      if (visited.has(current)) {\n        issues.push({ code: "SEARCH_BOT_REDIRECT_CHAIN", severity: "ERROR", url: start, observationIds: Object.freeze([...ids]), detail: "Observed search-bot redirects contain a loop." });\n        break;\n      }\n      if (hop >= 2) {'''
          if old not in text:
              raise SystemExit('redirect patch anchor not found')
          text = text.replace(old, new, 1)
          old = 'const status: CrawlAssessmentStatus = search.length < 3 ? "INSUFFICIENT_EVIDENCE" : hasError ? "BLOCKED" : hasWarn ? "DEGRADED" : "READY";'
          new = 'const status: CrawlAssessmentStatus = hasError ? "BLOCKED" : search.length < 3 ? "INSUFFICIENT_EVIDENCE" : hasWarn ? "DEGRADED" : "READY";'
          if old not in text:
              raise SystemExit('status patch anchor not found')
          src.write_text(text.replace(old, new, 1))

          tst = Path('packages/crawl-observability/src/index.test.ts')
          text = tst.read_text()
          old = '''    expect(assessment.status).not.toBe("READY");\n    expect(assessment.issues.some((issue) => issue.code === "SEARCH_BOT_REDIRECT_CHAIN")).toBe(true);'''
          new = '''    expect(assessment.status).toBe("BLOCKED");\n    expect(assessment.issues.some((issue) => issue.code === "SEARCH_BOT_REDIRECT_CHAIN" && issue.severity === "ERROR")).toBe(true);'''
          if old not in text:
              raise SystemExit('loop assertion anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''  it("detects redirect chains and loops", () => {'''
          addition = '''  it("fails closed on an observed 5xx even when evidence volume is sparse", () => {\n    const input = createDataset({\n      site: "https://example.com",\n      windowStart: "2026-08-30T09:00:00Z",\n      windowEnd: "2026-08-30T11:00:00Z",\n      observations: [{ ...base, id: "sparse-5xx", observedAt: "2026-08-30T10:00:00Z", url: "https://example.com/", status: 503 }],\n    });\n    const assessment = assessCrawl(input);\n    expect(assessment.status).toBe("BLOCKED");\n    expect(assessment.issues.some((issue) => issue.code === "SEARCH_BOT_5XX" && issue.severity === "ERROR")).toBe(true);\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tst.write_text(text.replace(anchor, addition + anchor, 1))
          PY
      - name: Install and audit focused package
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @nexus/crawl-observability typecheck
          pnpm --filter @nexus/crawl-observability test
          pnpm --filter @nexus/crawl-observability build
      - name: Commit corrections and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-capability-12-correctness.yml
          git add packages/crawl-observability/src/index.ts packages/crawl-observability/src/index.test.ts
          git diff --cached --check
          git config user.name "nexus-ci"
          git config user.email "nexus-ci@users.noreply.github.com"
          git commit -m "fix(crawl): fail closed on sparse errors and redirect loops"
          git push origin HEAD:feat/capability-12-crawl-observability
