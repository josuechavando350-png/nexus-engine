name: NEXUS Web Experience Sources

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'vendor/web-experience/**'
      - 'scripts/web-experience.mjs'
      - 'tests/web-experience*'
      - '.github/workflows/web-experience-sources.yml'
  push:
    branches: [main]
    paths:
      - '.gitignore'
      - 'vendor/web-experience/**'
      - 'scripts/web-experience.mjs'
      - 'tests/web-experience*'
      - '.github/workflows/web-experience-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-experience-sources-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-sources:
    name: Pinned upstream source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout exact source SHA without upstream execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run offline registry contract tests
        run: node --test tests/web-experience.contract.mjs
      - name: Verify pinned registrations before downloading
        run: node scripts/web-experience.mjs verify all
      - name: Clone the four pinned upstream sources into ignored cache
        run: node scripts/web-experience.mjs init all
      - name: Verify every checkout and license identity
        run: node scripts/web-experience.mjs verify all --checkout
      - name: Prove repeated initialization is safe
        run: |
          node scripts/web-experience.mjs init all
          node scripts/web-experience.mjs verify all --checkout
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Record bounded verification result
        run: |
          {
            printf '## Web experience source verification\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'All four pinned repositories were cloned into ignored directories; commits and LICENSE blobs were verified.\n\n'
            printf 'No upstream npm scripts, demos, production website or visual adapter were executed. The tracked Git inventory stayed clean. This proves source availability, not browser or production readiness.\n'
          } >> "$GITHUB_STEP_SUMMARY"
