name: NEXUS R3 — restore, diagnose and validate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Recover R2 repair engine
        shell: bash
        run: |
          set -euo pipefail

          R2=".github/workflows/NEXUS_RESTORE_MIGRATE_R2.yml"

          if [ ! -f "$R2" ]; then
            echo "::error::R2 workflow is missing: $R2"
            exit 1
          fi

          sed -n \
            "/cat > \/tmp\/nexus_repair.py <<'PY'/,/^          PY$/p" \
            "$R2" \
            | sed '1d;$d;s/^          //' \
            > /tmp/nexus_repair.py

          if [ ! -s /tmp/nexus_repair.py ]; then
            echo "::error::Could not recover the repair engine from R2."
            exit 1
          fi

          python3 -m py_compile /tmp/nexus_repair.py

          echo "R2 repair engine recovered successfully."

      - name: Repair truncated orchestrator and migrate call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/nexus_repair.py

          echo
          echo "Changed files after repair:"
          git diff --name-only

      - name: Verify orchestrator recovery
        shell: bash
        run: |
          set -euo pipefail

          FILE="runtime/crates/nexus-agent/src/orchestrator.rs"

          grep -q "pub struct SituationView" "$FILE"
          grep -q "pub struct VerifiedFacts" "$FILE"
          grep -q "fn a_read_only_inspection_reaches_a_signed_task()" "$FILE"
          grep -q "fn risk_bands_are_explicit()" "$FILE"

          if grep -q "fn a_read_only_inspec$" "$FILE"; then
            echo "::error::orchestrator.rs is still truncated."
            exit 1
          fi

          if grep -q "#\[allow(clippy::too_many_arguments)\]" "$FILE"; then
            echo "::error::Forbidden clippy suppression reappeared."
            exit 1
          fi

          echo "orchestrator.rs recovery verified."

      - name: Format repaired workspace
        working-directory: runtime
        run: cargo fmt --all

      - name: Run V3 static architecture gates
        shell: bash
        run: |
          set -euo pipefail

          # V3's architecture script also tries to invoke Cargo.
          # R3 intentionally shadows Cargo ONLY for this static-gate step.
          # The real Rust toolchain gates run explicitly below with full logs.
          mkdir -p /tmp/nexus-static-gates

          cat > /tmp/nexus-static-gates/cargo <<'EOF'
          #!/bin/sh
          exit 127
          EOF

          chmod +x /tmp/nexus-static-gates/cargo

          PATH="/tmp/nexus-static-gates:$PATH" \
            node scripts/v3-architecture-gates.mjs

      - name: Run V4 architecture gates
        run: node scripts/v4-architecture-gates.mjs

      - name: Run V5 architecture gates
        run: node scripts/v5-architecture-gates.mjs

      - name: Run V6 architecture gates
        run: node scripts/v6-architecture-gates.mjs

      - name: Cargo format check
        working-directory: runtime
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: runtime
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy — full diagnostics
        working-directory: runtime
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --all-features \
            -- \
            -D warnings

      - name: Tests — full workspace
        working-directory: runtime
        run: cargo test --workspace --all-features

      - name: Release build
        working-directory: runtime
        run: cargo build --workspace --release --all-features

      - name: Validate final diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo
          echo "========================================"
          echo "NEXUS R3 FINAL DIFF"
          echo "========================================"
          git diff --stat

          echo
          echo "Changed files:"
          git diff --name-only

      - name: Commit validated R3 repair
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No repair changes remain to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            runtime/crates/nexus-agent/src/orchestrator.rs \
            runtime/services/orchestratord/src/main.rs \
            runtime/examples/factory-line/src/main.rs \
            runtime/examples/warehouse-robot/src/main.rs

          git diff --cached --check

          git commit -m "R3: restore orchestrator and validate SituationView migration"

          git push origin HEAD:main

      - name: R3 success
        run: |
          echo "========================================"
          echo "NEXUS R3 COMPLETED SUCCESSFULLY"
          echo "========================================"
          echo "Orchestrator restored."
          echo "SituationView migration validated."
          echo "Architecture gates passed."
          echo "Cargo check passed."
          echo "Clippy passed with -D warnings."
          echo "Tests passed."
          echo "Release build passed."
          echo "Validated repair committed to main."
