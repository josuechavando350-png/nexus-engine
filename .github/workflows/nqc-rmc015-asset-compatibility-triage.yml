name: NQC RMC-015 Asset Compatibility Triage (Auxiliary)

on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc015_asset_compatibility_frontier.py"
      - "ci/nqc-census/test_rmc015_asset_compatibility_frontier.py"
      - "ci/nqc-census/RMC015_ASSET_COMPATIBILITY_TRIAGE_CONTRACT.md"
      - ".github/workflows/nqc-rmc015-asset-compatibility-triage.yml"
  push:
    branches:
      - "nqc/rmc015-asset-compatibility-triage-20261008"
    paths:
      - "ci/nqc-census/rmc015_asset_compatibility_frontier.py"
      - "ci/nqc-census/test_rmc015_asset_compatibility_frontier.py"
      - "ci/nqc-census/RMC015_ASSET_COMPATIBILITY_TRIAGE_CONTRACT.md"
      - ".github/workflows/nqc-rmc015-asset-compatibility-triage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rmc015-asset-compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authenticated-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Offline adversarial source and asset regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/nqc-census -p test_rmc015_material_frontier.py -v
          python3 -m unittest discover -s ci/nqc-census -p test_rmc015_asset_compatibility_frontier.py -v
          python3 -m py_compile ci/nqc-census/rmc015_material_frontier.py ci/nqc-census/rmc015_asset_compatibility_frontier.py

      - name: Authenticate independent immutable D08 and D09 ZIPs
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          mkdir -p "$RUNNER_TEMP/asset-triage-inputs"
          for row in \
            'D08 36964016388 11237887761 36c732a36789e1967ce7178010889427ad7cf0f2 9431ea07144ae78e68e0ffcc7f650fa32068ee63fb53ca41ff8a062b87845913' \
            'D09 36823489219 11159396055 6db82ca89d4ef3a66a1b236de95670a6967eb3ea 9aa6a4beb3ebc90f40d07d1889f84c1bcf94b3dea90b0e7b596dc6ff70fda0f6'; do
            read -r stage run artifact head digest <<< "$row"
            run_json="$(gh api "repos/$REPO/actions/runs/$run")"
            art_json="$(gh api "repos/$REPO/actions/artifacts/$artifact")"
            test "$(jq -r '.status' <<< "$run_json")" = completed
            test "$(jq -r '.conclusion' <<< "$run_json")" = success
            test "$(jq -r '.head_sha' <<< "$run_json")" = "$head"
            test "$(jq -r '.expired' <<< "$art_json")" = false
            test "$(jq -r '.workflow_run.id' <<< "$art_json")" = "$run"
            test "$(jq -r '.digest' <<< "$art_json")" = "sha256:$digest"
            test "$(jq -r '.name' <<< "$art_json" | grep -c -- "$head")" = 1
            curl --fail --silent --show-error --location --retry 3 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact/zip" \
              --output "$RUNNER_TEMP/asset-triage-inputs/$stage.zip"
            echo "$digest  $RUNNER_TEMP/asset-triage-inputs/$stage.zip" | sha256sum -c -
          done

      - name: Replay exact triage twice and verify fail-closed scope
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/asset-triage-out"
          mkdir -p "$OUT"
          for index in 1 2; do
            python3 ci/nqc-census/rmc015_asset_compatibility_frontier.py \
              --d08 "$RUNNER_TEMP/asset-triage-inputs/D08.zip" \
              --d09 "$RUNNER_TEMP/asset-triage-inputs/D09.zip" \
              --d08-sha256 9431ea07144ae78e68e0ffcc7f650fa32068ee63fb53ca41ff8a062b87845913 \
              --d09-sha256 9aa6a4beb3ebc90f40d07d1889f84c1bcf94b3dea90b0e7b596dc6ff70fda0f6 \
              --d08-commit 36c732a36789e1967ce7178010889427ad7cf0f2 \
              --d09-commit 6db82ca89d4ef3a66a1b236de95670a6967eb3ea \
              --evaluation-start-block 26095352 \
              --out "$OUT/asset-triage-$index.json"
          done
          cmp "$OUT/asset-triage-1.json" "$OUT/asset-triage-2.json"
          mv "$OUT/asset-triage-1.json" "$OUT/asset-compatibility-triage.json"
          rm "$OUT/asset-triage-2.json"
          jq -e '
            .status == "RMC015_AUXILIARY_COMPATIBILITY_TRIAGE_VERIFIED" and
            .terminal_authority == false and
            .execution_eligibility_certified == false and
            .realized_profitability_proven == false and
            .retrospective_backtest_admitted == false and
            .lookahead_used == false and
            .earliest_ex_ante_evaluation_block == 26095352 and
            .observation_anchor.block_number == 26095351 and
            .unique_watchlist_accounts == 857 and
            .focus_top_k_debt_assets == 4 and
            .focus_unique_account_count == 807 and
            .distinct_debt_underlyings == 26 and
            .distinct_supply_underlyings == 36 and
            .aave_underlying_token_witness_count == 67 and
            .token_admission_record_count == 514279 and
            .blocked_token_admission_record_count == 514279 and
            ([.top_debt_underlyings[].execution_compatibility_status] | all(. == "BLOCKED")) and
            ([.top_debt_underlyings[].execution_authority_claimed] | all(. == false)) and
            .count_semantics == "UNIQUE_WATCHLIST_ACCOUNTS_PER_ASSET_NOT_VALUE_OR_PNL; CROSS_ASSET_SUMS_CAN_DOUBLE_COUNT; FOCUS_USES_UNION"
          ' "$OUT/asset-compatibility-triage.json" > /dev/null
          (cd "$OUT" && sha256sum asset-compatibility-triage.json > asset-compatibility-triage.sha256 && sha256sum -c asset-compatibility-triage.sha256)
          echo RMC015_AUXILIARY_COMPATIBILITY_TRIAGE_VERIFIED

      - name: Upload aggregate-only immutable compatibility triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc015-asset-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/asset-triage-out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
