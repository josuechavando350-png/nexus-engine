name: Temporary Capability 11 Validation

on:
  push:
    branches:
      - feat/capability-11-apca-v2

permissions:
  contents: write

jobs:
  validate-apca-v2:
    runs-on: ubuntu-24.04
    env:
      NEXUS_CAPTURE_EVIDENCE_DIR: .artifacts/cap11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-11-apca-v2
      - name: Repair APCA numeric luminance invocation once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/capture/apca-audit.ts')
          s = p.read_text()
          old_import = 'import { calcAPCA, fontLookupAPCA } from "apca-w3";'
          new_import = 'import { APCAcontrast, fontLookupAPCA, sRGBtoY } from "apca-w3";'
          old_call = 'numericLc(calcAPCA(candidate.textRgb, background))'
          new_call = 'numericLc(APCAcontrast(sRGBtoY([...candidate.textRgb, 1]), sRGBtoY([...background, 1])))'
          changed = False
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
              changed = True
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
              changed = True
          if changed:
              p.write_text(s)
          PY
          if ! git diff --quiet -- packages/capture/apca-audit.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add packages/capture/apca-audit.ts
            git commit -m 'fix(apca): calculate Lc from numeric sRGB luminance'
            git push origin HEAD:feat/capability-11-apca-v2
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit
      - name: Typecheck APCA integration
        run: pnpm --filter @nexus/capture typecheck
      - name: Build APCA integration
        run: pnpm --filter @nexus/capture build
      - name: Run capture browser suite
        run: pnpm --filter @nexus/capture test:browser
      - name: Print APCA evidence on failure
        if: failure()
        run: |
          find . -path '*/.artifacts/cap11/*-apca.json' -type f -print -exec cat {} \; || true
      - name: Lint touched APCA files
        if: success()
        run: pnpm exec eslint packages/capture/apca-audit.ts packages/capture/tests/apca-audit.test.ts packages/capture/playwright-adapter.ts packages/capture/tests/playwright-adapter.test.ts
