name: Proof Carrying Validate

on:
  push:
    branches:
      - feat/proof-carrying-experience-engine

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Validate Motor 4
        shell: bash
        run: |
          pnpm --filter @nexus/proof-carrying-experience typecheck
          pnpm --filter @nexus/proof-carrying-experience test
          pnpm --filter @nexus/proof-carrying-experience build
          pnpm --filter @nexus/evidence typecheck
          pnpm --filter @nexus/evidence build
          pnpm exec vitest run packages/evidence/proof-carrying-experience.test.ts
          git diff --check
          if grep -R -n -E 'TODO|FIXME|placeholder|stub|not implemented|Math\.random|Date\.now' packages/proof-carrying-experience packages/evidence/proof-carrying-experience.ts packages/evidence/proof-carrying-experience.test.ts --exclude-dir=node_modules --exclude-dir=dist; then
            echo 'Forbidden implementation marker found'
            exit 1
          fi
      - name: Commit lockfile and remove validation helper
        shell: bash
        run: |
          rm .github/workflows/proof-carrying-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/proof-carrying-validate.yml
          git commit -m 'chore(proof): lock validated workspace integration'
          git push origin HEAD:feat/proof-carrying-experience-engine
