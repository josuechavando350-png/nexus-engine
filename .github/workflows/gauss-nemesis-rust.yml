name: GAUSS Nemesis Rust native
on:
  pull_request:
    paths:
      - 'gauss/nemesis/**'
      - '.github/workflows/gauss-nemesis-rust.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain on GitHub runner
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Prove installed rustc can compile and run
        shell: bash
        run: |
          printf '%s\n' '#[test] fn installed_rust_works() { assert_eq!(2 + 2, 4); }' > "$RUNNER_TEMP/nemesis-rust-smoke.rs"
          rustc --edition 2021 --test "$RUNNER_TEMP/nemesis-rust-smoke.rs" -o "$RUNNER_TEMP/nemesis-rust-smoke"
          "$RUNNER_TEMP/nemesis-rust-smoke"
      - name: Compile original Némesis 89 TFHE and run native tests
        shell: bash
        run: |
          cargo test --release --manifest-path gauss/nemesis/native/fhe/Cargo.toml -- --test-threads=1
      - name: Native FHE encrypted addition and Boolean circuit
        shell: bash
        run: |
          printf '255 255' | gauss/nemesis/native/fhe/target/release/nemesis-fhe --add-stdin
          printf '101' | gauss/nemesis/native/fhe/target/release/nemesis-fhe --circuit-stdin 'xor:0:1;mux:2:3:1;not:4' '3,4,5'
  gauss-integration:
    needs: rust-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete GAUSS-Némesis integration
        shell: bash
        run: |
          test -f gauss/nemesis/engine/src/index.mjs || { echo 'NEMESIS_INTEGRATION_NOT_TESTED: complete Némesis JS source is missing'; exit 1; }
          node --test gauss/nemesis/tests/*.test.mjs
          node gauss/nemesis/engine/scripts/smoke-100.mjs
