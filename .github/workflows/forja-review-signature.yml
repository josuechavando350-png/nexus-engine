name: AXIOMA FORJA Detached Review Signature Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact SHA and pristine checkout
        env:
          FORJA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORJA_SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "$FORJA_SOURCE_SHA"
          fi
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test pinned Ed25519 review verification, tampering and time bounds
        run: |
          set -euo pipefail
          node --check forja/review-signature.mjs
          node --check forja/tests/review-signature.test.mjs
          node --test forja/tests/review-signature.test.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
