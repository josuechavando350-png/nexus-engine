name: GAUSS one-shot lint repair (temporary)
on:
  push:
    branches: [feat/gauss-1000-audited-integration]
    paths: ['.github/workflows/gauss-lint-repair-once.yml']
permissions: {}
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify isolated checkout and SHA-pinned patch before changing code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/gauss-1000-audited-integration'
          git merge-base --is-ancestor 46d8f0d37a4ca5f96c53139127b4653cd406f0a1 HEAD
          test -z "$(git status --porcelain)"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-41dc-81f5-9808-18da1830892c/raw?se=2026-09-18T05%3A03%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=8b34d2ea-70c2-598c-a4fb-506e32b92b8c&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T01%3A41%3A08Z&ske=2026-09-19T01%3A41%3A08Z&sks=b&skv=2026-02-06&sig=DGsJsmOrS109bGedfzFEvdAVfnyyVHCpO8IwzuRXrvQ%3D' -o "$RUNNER_TEMP/gauss-lint-fix.patch"
          echo '9519844c63c75c1f26d6dceb081f25847d4c11168b4da04175b67d68fed1cfcc  '"$RUNNER_TEMP/gauss-lint-fix.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/gauss-lint-fix.patch"
          git apply "$RUNNER_TEMP/gauss-lint-fix.patch"
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 22
          if git diff --name-only | grep -Ev '^gauss/'; then echo 'UNEXPECTED PATH' >&2; exit 1; fi
      - name: Enable pinned package manager and install from lockfile
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Run full-repository lint and all GAUSS tests before committing
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          node --test gauss/tests/*.test.mjs
          pnpm typecheck
      - name: Commit only tested GAUSS fixes to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add gauss/
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 22
          if git diff --cached --name-only | grep -Ev '^gauss/'; then exit 1; fi
          git -c user.name='GAUSS audit bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(gauss): resolve lint violations without weakening scientific proofs'
          git push origin HEAD:refs/heads/feat/gauss-1000-audited-integration
