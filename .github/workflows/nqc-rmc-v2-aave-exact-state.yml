name: NQC RMC V2 Aave eMode24 Exact Borrower State (NO LIQUIDATION)

on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc-v2-economics/aave_emode24_exact_block_state.py"
      - "ci/nqc-census/rmc-v2-economics/test_aave_emode24_exact_block_state.py"
      - ".github/workflows/nqc-rmc-v2-aave-exact-state.yml"
  push:
    branches:
      - "nqc/rmc-v2-aave-state-gate-20261013"
    paths:
      - "ci/nqc-census/rmc-v2-economics/aave_emode24_exact_block_state.py"
      - "ci/nqc-census/rmc-v2-economics/test_aave_emode24_exact_block_state.py"
      - ".github/workflows/nqc-rmc-v2-aave-exact-state.yml"

permissions:
  contents: read

concurrency:
  group: aave-emode24-exact-state-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aave-emode24-state-negatives:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact proposed source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run offline adversarial state/rounding tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile ci/nqc-census/rmc-v2-economics/aave_emode24_exact_block_state.py
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-economics \
            -p 'test_aave_emode24_exact_block_state.py' -v

      - name: Install SHA256 pinned Foundry read-only cast
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry" "$RUNNER_TEMP/nqc-aave-emode24-state"
          curl --fail --location --retry 4 --retry-all-errors --max-time 160 \
            -o "$RUNNER_TEMP/foundry.tar.gz" \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  $RUNNER_TEMP/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry/cast" --version

      - name: Resolve Aave actual reserve fee, collateral, USDtb debt and close factor
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-aave-emode24-state"
          : > "$OUT/provider-attempts.txt"
          PASS=0
          for RPC in \
            "https://ethereum-rpc.publicnode.com" \
            "https://eth.drpc.org" \
            "https://1rpc.io/eth" \
            "https://eth.llamarpc.com"
          do
            echo "TRY_PUBLIC_ARCHIVE $RPC" >> "$OUT/provider-attempts.txt"
            if timeout 330s python3 ci/nqc-census/rmc-v2-economics/aave_emode24_exact_block_state.py \
              --rpc-url "$RPC" --out "$OUT/aave-emode24-block26184741.json" \
              > "$OUT/console.txt" 2> "$OUT/last-error.txt"; then
              echo "EXACT_BLOCK_AAVE_STATE_ACQUIRED $RPC" >> "$OUT/provider-attempts.txt"
              echo "$RPC" > "$OUT/selected-public-archive-rpc.txt"
              PASS=1
              break
            fi
            echo "REJECT_RPC_OR_AUTHORITY_MISMATCH" >> "$OUT/provider-attempts.txt"
          done
          test "$PASS" -eq 1
          jq -e '
            .contract == "NQC_AAVE_EMODE24_EXACT_BLOCK_SEIZURE_NEGATIVE_GATE"
            and .claim_scope == "HISTORICAL_SINGLE_ARCHIVE_RPC_RESEARCH_NO_P2"
            and .chain_id == 1 and .block_number == 26184741
            and .block_hash == "0xe4b0718c51a6a484eef56edce0f25e9a5c546c2f66f595c6e305a589a612dbbe"
            and .e_mode == 24
            and .liquidation_bonus_bps == 10310
            and .oracle_susde_8decimals == "125127009"
            and .oracle_usdtb_8decimals == "100000000"
            and (.liquidation_protocol_fee_bps | type == "number")
            and (.borrower_susde_atoken_balance_raw | test("^[0-9]+$"))
            and (.borrower_usdtb_variable_debt_balance_raw | test("^[0-9]+$"))
            and .hf_below_one == false
            and .aave_actual_liquidation_admitted == false
            and .liquidated_susde_obtained == false
            and .cross_asset_full_route_executed == false
            and .atomic_morpho_repayment_verified == false
            and .externally_sponsored_gas_verified == false
            and .independent_rpc_quorum == false
            and .actual_nqc_net_pnl_usd == null
            and .realized_nqc_pnl_usd == "0"
            and .commercial_score_upgrade == false
            and .shadow_p2_certified == false
            and .rmc_closed == false
          ' "$OUT/aave-emode24-block26184741.json"
          jq '{block_number,e_mode,liquidation_bonus_bps,
               liquidation_protocol_fee_bps,
               borrower_susde_atoken_balance_raw,
               borrower_usdtb_variable_debt_balance_raw,
               borrower_hf_wad_raw,
               maximum_usdtb_debt_cover_raw_conditional,
               collateral_seizure_sensitivity,
               aave_actual_liquidation_admitted,
               realized_nqc_pnl_usd}' "$OUT/aave-emode24-block26184741.json" \
            | tee "$OUT/readable-summary.json"

      - name: Archive only negative evidence and exact producing source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-aave-emode24-state"
          cp ci/nqc-census/rmc-v2-economics/aave_emode24_exact_block_state.py "$OUT/producer.py"
          cp ci/nqc-census/rmc-v2-economics/test_aave_emode24_exact_block_state.py "$OUT/adversarial-tests.py"
          jq -n --arg sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            '{schema_version:1,source_commit:$sha,
              scope:"SINGLE_RPC_AAVE_HF_GT_ONE_RESEARCH_ONLY",
              no_actual_liquidation:true,not_a_prospective_crossing:true,
              deployed_aave_calculation_math_parity_not_terminal:true,
              no_own_capital_gas_commitment:true,
              no_full_morpho_curve_aave_fluid_repayment:true,
              no_nqc_realized_pnl:true,
              p2_certified:false,rmc_closed:false,commercial_upgrade:false}' \
              > "$OUT/nonclaims.json"
          (
            cd "$OUT"
            sha256sum producer.py adversarial-tests.py aave-emode24-block26184741.json \
              readable-summary.json nonclaims.json > evidence.sha256
            sha256sum -c evidence.sha256
          )

      - name: Preserve exact source and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-v2-aave-emode24-state-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-aave-emode24-state/
          if-no-files-found: warn
          retention-days: 30
