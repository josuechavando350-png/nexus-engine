name: NQC T37 Phase3 Contract Gate

on:
  push:
    branches:
      - nqc/t37-unified-dryrun-evidence-20260926
    paths:
      - .github/workflows/nqc-t37-phase3-contract-gate.yml
      - ci/nqc-t37/physical-contracts/**
      - ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-contract-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Foundry 1.7.1 and compile T37 fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nqc-t37-contract-gate/foundry /tmp/nqc-t37-contract-gate/contracts/src
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/nqc-t37-contract-gate/foundry.tar.gz             https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  /tmp/nqc-t37-contract-gate/foundry.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nqc-t37-contract-gate/foundry.tar.gz -C /tmp/nqc-t37-contract-gate/foundry
          export PATH="/tmp/nqc-t37-contract-gate/foundry:$PATH"
          forge --version
          cp ci/nqc-t37/physical-contracts/foundry.toml /tmp/nqc-t37-contract-gate/contracts/
          cp ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol /tmp/nqc-t37-contract-gate/contracts/src/
          cp ci/nqc-t37/physical-contracts/src/T37PhysicalIntegration.sol /tmp/nqc-t37-contract-gate/contracts/src/
          cd /tmp/nqc-t37-contract-gate/contracts
          forge fmt
          forge fmt --check
          echo "bbb5962171f2c1da5067e21ac705a627a35028fdafe5c9403f601bb813d39320  src/NqcFlashFundingExecutor.sol" | sha256sum -c -
          forge build --sizes
          for contract in T37SyntheticMarket T37MockFlashToken T37MockFundedStrategy T37MockAaveFlashPool T37MockBalancerVault T37FundingDriver; do
            forge inspect "$contract" bytecode >/dev/null
          done
          echo "PASS T37 Phase3 strict Foundry contract gate"
