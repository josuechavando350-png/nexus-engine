name: NQC T39 REVM Historical Fork Differential

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-revm-historical-differential.yml
      - ci/nqc-protocol-fork/differential/**
      - ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py
      - ci/nqc-protocol-fork/parity/ipc_http_bridge.py
      - ci/nqc-protocol-fork/recovered-source/**
      - ci/nqc-protocol-fork/compatibility/**
      - ci/nqc-protocol-fork/locks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revm-historical-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_TOOLCHAIN: "1.98.1"
      FOUNDRY_VERSION: "1.7.1"
      FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
      SOLC_VERSION: "0.8.24+commit.e11b9ed9"
      SOLC_SHA256: "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f"
      NQC_DIFF: /tmp/nqc-revm-historical-differential

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable inputs and prepare isolated recovered source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          rm -rf "$NQC_DIFF"
          mkdir -p "$NQC_DIFF/source" "$NQC_DIFF/evidence" "$NQC_DIFF/helper/src" "$NQC_DIFF/bin"
          git rev-parse HEAD > "$NQC_DIFF/evidence/repository-source-sha.txt"
          (cd ci/nqc-protocol-fork/recovered-source && sha256sum -c SOURCE_FILES.sha256)
          cp -a ci/nqc-protocol-fork/recovered-source/. "$NQC_DIFF/source/"
          cp ci/nqc-protocol-fork/locks/recovered-2b640cc-Cargo.lock "$NQC_DIFF/source/Cargo.lock"
          echo "f32e4cf8ef1896ac982082583ebfda0e65d45a490ffc4dd6bf58be2077d8984a  $NQC_DIFF/source/Cargo.lock" | sha256sum -c -

          declare -A patches=(
            [PFT-COMPAT-001-aave-u40.patch]=9dbea652b4555e6240f694a4ceb9b3eb8354d12dcaaf6ec2e3a254a7ab3463ca
            [PFT-COMPAT-002-executor-return.patch]=3c41e00641b4715471f17933749c8059b0c84aa9c8d4b85ec16c25f155623ba7
            [PFT-COMPAT-003-sync-devdep.patch]=7076c8d5c6f4ba737c7e5a8e030bcb2a32a50642969d35d3156082ddf1eea3a5
            [PFT-COMPAT-005-opportunity-devdep.patch]=12c23465ce52ffa71f6bb45737e2b56f866d4d4a56dcad22ffd31f81d2a73664
            [PFT-COMPAT-006-revm-blob-fee-fraction.patch]=f83b44b92ed52faec14cc4ed119b7addcb618c4d5520afa31c266e950d4820c0
          )
          for name in "${!patches[@]}"; do
            patch="$GITHUB_WORKSPACE/ci/nqc-protocol-fork/compatibility/$name"
            test "$(sha256sum "$patch" | cut -d' ' -f1)" = "${patches[$name]}"
            if test "$name" = "PFT-COMPAT-001-aave-u40.patch"; then
              git -C "$NQC_DIFF/source" apply --check "$patch"
              git -C "$NQC_DIFF/source" apply "$patch"
            else
              git -C "$NQC_DIFF/source" apply --unidiff-zero --check "$patch"
              git -C "$NQC_DIFF/source" apply --unidiff-zero "$patch"
            fi
          done

          mkdir -p "$NQC_DIFF/source/crates/nqc-sim/examples"
          cp ci/nqc-protocol-fork/differential/pft_revm_historical_replay.rs             "$NQC_DIFF/source/crates/nqc-sim/examples/pft_revm_historical_replay.rs"
          sha256sum             ci/nqc-protocol-fork/differential/PftRevmForkHarness.sol             ci/nqc-protocol-fork/differential/run_anvil_historical_differential.py             ci/nqc-protocol-fork/differential/pft_revm_historical_replay.rs             > "$NQC_DIFF/evidence/differential-source.sha256"

      - name: Install pinned Rust Foundry and solc
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv | tee "$NQC_DIFF/evidence/rustc.txt"
          cargo -V | tee "$NQC_DIFF/evidence/cargo.txt"

          curl --fail --location --retry 5 --retry-all-errors             -o "$NQC_DIFF/foundry.tar.gz"             "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  $NQC_DIFF/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$NQC_DIFF/foundry.tar.gz" -C "$NQC_DIFF/bin"
          export PATH="$NQC_DIFF/bin:$PATH"
          forge --version | tee "$NQC_DIFF/evidence/forge.txt"
          anvil --version | tee "$NQC_DIFF/evidence/anvil.txt"
          cast --version | tee "$NQC_DIFF/evidence/cast.txt"
          forge --version | grep -F "$FOUNDRY_VERSION"

          curl --fail --location --retry 5 --retry-all-errors             -o "$NQC_DIFF/solc-0.8.24"             "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9"
          echo "$SOLC_SHA256  $NQC_DIFF/solc-0.8.24" | sha256sum -c -
          chmod +x "$NQC_DIFF/solc-0.8.24"
          "$NQC_DIFF/solc-0.8.24" --version | tee "$NQC_DIFF/evidence/solc.txt"
          "$NQC_DIFF/solc-0.8.24" --version | grep -F "$SOLC_VERSION"

      - name: Build exact differential helper and REVM replay executable
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$NQC_DIFF/bin:$PATH"

          cp ci/nqc-protocol-fork/differential/PftRevmForkHarness.sol "$NQC_DIFF/helper/src/"
          cat > "$NQC_DIFF/helper/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          solc_version = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          via_ir = false
          EOF
          (
            cd "$NQC_DIFF/helper"
            forge build --force --offline --use "$NQC_DIFF/solc-0.8.24"               2>&1 | tee "$NQC_DIFF/evidence/helper-build.log"
            forge inspect --offline --use "$NQC_DIFF/solc-0.8.24"               PftRevmForkHarness deployedBytecode               > "$NQC_DIFF/evidence/helper-runtime.hex"
          )
          test -s "$NQC_DIFF/evidence/helper-runtime.hex"

          cd "$NQC_DIFF/source"
          cargo fetch --locked
          cat >> crates/nqc-sim/Cargo.toml <<'EOF'

          [dev-dependencies]
          tokio.workspace = true
          serde_json.workspace = true
          hex.workspace = true
          EOF
          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          cargo generate-lockfile --offline
          cargo build --offline -p nqc-sim --example pft_revm_historical_replay             2>&1 | tee "$NQC_DIFF/evidence/revm-build.log"
          test -x "$NQC_DIFF/source/target/debug/examples/pft_revm_historical_replay"
          sha256sum "$NQC_DIFF/source/target/debug/examples/pft_revm_historical_replay"             > "$NQC_DIFF/evidence/revm-runner.sha256"

      - name: Capture two-provider Anvil historical-fork reference executions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$NQC_DIFF/bin:$PATH"

          for entry in             'blastapi-public|https://eth-mainnet.public.blastapi.io|18601|18701|0.35'             'mevblocker-rpc|https://rpc.mevblocker.io|18602|18702|1.25'; do
            IFS='|' read -r provider_id provider_url proxy_port anvil_port min_interval <<< "$entry"

            NQC_PFT_PROXY_PORT="$proxy_port"             NQC_PFT_UPSTREAM_URL="$provider_url"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval"             NQC_PFT_MAX_ATTEMPTS=12             NQC_PFT_UPSTREAM_TIMEOUT_SECONDS=60             NQC_PFT_PROXY_LOG="$NQC_DIFF/evidence/$provider_id-reference-throttle.jsonl"               python3 ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py               > "$NQC_DIFF/evidence/$provider_id-reference-throttle.log" 2>&1 &
            proxy_pid=$!
            trap 'kill "$anvil_pid" "$proxy_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 150); do
              if curl --silent --fail "http://127.0.0.1:$proxy_port/health" >/dev/null 2>&1; then
                ready=1; break
              fi
              sleep 0.1
            done
            test "$ready" -eq 1

            anvil               --fork-url "http://127.0.0.1:$proxy_port"               --fork-block-number 25252136               --chain-id 1               --hardfork osaka               --port "$anvil_port"               --silent               > "$NQC_DIFF/evidence/$provider_id-anvil.log" 2>&1 &
            anvil_pid=$!

            ready=0
            for _ in $(seq 1 300); do
              if curl --silent --fail                 -H 'content-type: application/json'                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'                 "http://127.0.0.1:$anvil_port" | grep -q '"result"'; then
                ready=1; break
              fi
              sleep 0.2
            done
            test "$ready" -eq 1

            python3 -u ci/nqc-protocol-fork/differential/run_anvil_historical_differential.py               --rpc "http://127.0.0.1:$anvil_port"               --provider-id "$provider_id"               --runtime "$NQC_DIFF/evidence/helper-runtime.hex"               --out "$NQC_DIFF/evidence/$provider_id-reference.json"               2>&1 | tee "$NQC_DIFF/evidence/$provider_id-reference-run.log"
            grep -F "ANVIL_HISTORICAL_DIFFERENTIAL_CAPTURE_PASS provider=$provider_id"               "$NQC_DIFF/evidence/$provider_id-reference-run.log"

            kill "$anvil_pid" "$proxy_pid"
            wait "$anvil_pid" "$proxy_pid" 2>/dev/null || true
            trap - EXIT
          done

          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          root=Path("/tmp/nqc-revm-historical-differential/evidence")
          docs=[]
          for name in ("blastapi-public","mevblocker-rpc"):
              doc=json.loads((root/f"{name}-reference.json").read_text())
              doc.pop("provider_id",None)
              # Synthetic block entropy and transaction hashes are framework identifiers;
              # semantic receipt/state equality remains mandatory below and in REVM.
              doc["execution_block"].pop("prevrandao",None)
              for tx in doc["transactions"]:
                  tx.pop("transaction_hash",None)
              docs.append(doc)
          if docs[0] != docs[1]:
              raise SystemExit("PROVIDER_DISSENT: semantic Anvil historical reference differs")
          print("ANVIL_TWO_PROVIDER_SEMANTIC_CONSENSUS_PASS")
          PY

      - name: Replay identical transactions in REVM against both historical providers
        shell: bash
        run: |
          set -euo pipefail
          for entry in             'blastapi-public|https://eth-mainnet.public.blastapi.io|18801|0.35'             'mevblocker-rpc|https://rpc.mevblocker.io|18802|1.25'; do
            IFS='|' read -r provider_id provider_url proxy_port min_interval <<< "$entry"
            socket="$NQC_DIFF/$provider_id.ipc"

            NQC_PFT_PROXY_PORT="$proxy_port"             NQC_PFT_UPSTREAM_URL="$provider_url"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval"             NQC_PFT_MAX_ATTEMPTS=12             NQC_PFT_UPSTREAM_TIMEOUT_SECONDS=60             NQC_PFT_PROXY_LOG="$NQC_DIFF/evidence/$provider_id-revm-throttle.jsonl"               python3 ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py               > "$NQC_DIFF/evidence/$provider_id-revm-throttle.log" 2>&1 &
            throttle_pid=$!

            NQC_PFT_IPC_SOCKET="$socket"             NQC_PFT_UPSTREAM_URL="http://127.0.0.1:$proxy_port"             NQC_PFT_UPSTREAM_ID="$provider_id"             NQC_PFT_BRIDGE_TIMEOUT_SECONDS=180               python3 ci/nqc-protocol-fork/parity/ipc_http_bridge.py               > "$NQC_DIFF/evidence/$provider_id-bridge.log" 2>&1 &
            bridge_pid=$!
            trap 'kill "$bridge_pid" "$throttle_pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in $(seq 1 200); do
              if test -S "$socket" && curl --silent --fail "http://127.0.0.1:$proxy_port/health" >/dev/null 2>&1; then
                ready=1; break
              fi
              sleep 0.1
            done
            test "$ready" -eq 1

            NQC_PFT_IPC_PATH="$socket"             NQC_PFT_UPSTREAM_ID="$provider_id"               "$NQC_DIFF/source/target/debug/examples/pft_revm_historical_replay"               "$NQC_DIFF/evidence/$provider_id-reference.json"               "$NQC_DIFF/evidence/helper-runtime.hex"               "$NQC_DIFF/evidence/$provider_id-revm.json"               2>&1 | tee "$NQC_DIFF/evidence/$provider_id-revm.log"
            grep -F "REVM_HISTORICAL_FORK_DIFFERENTIAL_PASS upstream=$provider_id txs=5 unexplained_mismatches=0"               "$NQC_DIFF/evidence/$provider_id-revm.log"
            test "$(grep -c '^REVM_TX_PARITY_PASS ' "$NQC_DIFF/evidence/$provider_id-revm.log")" -eq 5

            kill "$bridge_pid" "$throttle_pid"
            wait "$bridge_pid" "$throttle_pid" 2>/dev/null || true
            trap - EXIT
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/nqc-revm-historical-differential/evidence")
          docs=[]
          for name in ("blastapi-public","mevblocker-rpc"):
              doc=json.loads((root/f"{name}-revm.json").read_text())
              doc.pop("provider_id",None)
              docs.append(doc)
          if docs[0] != docs[1]:
              raise SystemExit("PROVIDER_DISSENT: REVM differential report differs")
          if docs[0].get("unexplained_mismatches") != 0:
              raise SystemExit("non-zero unexplained mismatch ledger")
          print("REVM_TWO_PROVIDER_DIFFERENTIAL_CONSENSUS_PASS")
          PY

          printf '%s\n' 'PASS_REVM_HISTORICAL_FORK_DIFFERENTIAL_SYNTHETIC_TX_OVER_REAL_STATE'             > "$NQC_DIFF/evidence/gate-status.txt"
          printf '%s\n' '0' > "$NQC_DIFF/evidence/unexplained-mismatch-count.txt"
          printf '%s\n' 'NOT_CLOSED' > "$NQC_DIFF/evidence/protocol-fork-truth.txt"
          (
            cd "$NQC_DIFF/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve exact differential evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-revm-historical-differential-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-revm-historical-differential/evidence
          if-no-files-found: error
          retention-days: 30

# exact-head certification trigger: T39 Protocol/Fork closeout
