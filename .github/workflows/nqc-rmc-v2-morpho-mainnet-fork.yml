name: NQC RMC V2 Morpho / USDT Ethereum Mainnet Fork (NO LIVE)
on:
  pull_request:
    paths:
      - "ci/nqc-t36/contracts/test/NqcFlashFundingExecutorV2MorphoFork.t.sol"
      - ".github/workflows/nqc-rmc-v2-morpho-mainnet-fork.yml"
  push:
    branches:
      - "nqc/rmc-v2-morpho-mainnet-fork-20261013"
    paths:
      - "ci/nqc-t36/contracts/test/NqcFlashFundingExecutorV2MorphoFork.t.sol"
      - ".github/workflows/nqc-rmc-v2-morpho-mainnet-fork.yml"
permissions:
  contents: read
concurrency:
  group: rmc-v2-morpho-ethereum-fork-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-contract-historical-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLOCK: "26184741"
      EXPECTED_HASH: "0xe4b0718c51a6a484eef56edce0f25e9a5c546c2f66f595c6e305a589a612dbbe"
      EXPECTED_PARENT: "0x53ddf49d46b566154bbb876ae76839331ee43b01beab19190b813eecbda5ec66"
      MORPHO: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
      USDT: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      EXPECTED_MORPHO_USDT_RAW: "65666477002958"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove frozen original T36 untouched and initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git hash-object ci/nqc-t36/contracts/src/NqcFlashFundingExecutor.sol)" = "aa3883fa141aa096006e90e56d8d4150c9ee14ef"
          test "$(git hash-object ci/nqc-t36/contracts/test/NqcFlashFundingExecutor.t.sol)" = "cebb90e36bf7d7ab4a9ad0e01a95da2039203ee0"
          mkdir -p "$RUNNER_TEMP/nqc-morpho-real-fork"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$RUNNER_TEMP/nqc-morpho-real-fork/acquisition-status.txt"
      - name: Install pinned Foundry 1.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry"
          curl --fail --location --retry 4 --retry-all-errors --max-time 160 \
            -o "$RUNNER_TEMP/foundry.tar.gz" \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  $RUNNER_TEMP/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/foundry/forge" --version
      - name: Strict formatting and exact source compilation
        working-directory: ci/nqc-t36/contracts
        shell: bash
        run: |
          set -euo pipefail
          forge fmt --check test/NqcFlashFundingExecutorV2MorphoFork.t.sol
          forge build --sizes 2>&1 | tee "$RUNNER_TEMP/nqc-morpho-real-fork/build.txt"
      - name: Find public Ethereum archive RPC with the exact canonical block and Morpho USDT state
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-morpho-real-fork"
          : > "$OUT/provider-attempts.txt"
          SELECTED=""
          for RPC in \
            "https://ethereum-rpc.publicnode.com" \
            "https://eth.drpc.org" \
            "https://1rpc.io/eth" \
            "https://eth.llamarpc.com" \
            "https://rpc.flashbots.net"
          do
            echo "TRY_PUBLIC_RPC $RPC" >> "$OUT/provider-attempts.txt"
            if ! timeout 30s cast block "$BLOCK" --rpc-url "$RPC" --json > "$OUT/candidate-block.json" 2>/dev/null; then
              echo "REJECT_BLOCK_UNAVAILABLE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! jq -e --arg hash "$EXPECTED_HASH" --arg parent "$EXPECTED_PARENT" \
              '(.hash|ascii_downcase)==$hash and (.parentHash|ascii_downcase)==$parent' "$OUT/candidate-block.json" > /dev/null; then
              echo "REJECT_BLOCK_IDENTITY" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! timeout 30s cast code "$MORPHO" --block "$BLOCK" --rpc-url "$RPC" > "$OUT/morpho-runtime-code.txt" 2>/dev/null; then
              echo "REJECT_MORPHO_RUNTIME_UNAVAILABLE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! test "$(wc -c < "$OUT/morpho-runtime-code.txt")" -gt 32; then
              echo "REJECT_EMPTY_MORPHO_CODE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! timeout 30s cast code "$USDT" --block "$BLOCK" --rpc-url "$RPC" > "$OUT/usdt-runtime-code.txt" 2>/dev/null; then
              echo "REJECT_USDT_RUNTIME_UNAVAILABLE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! test "$(wc -c < "$OUT/usdt-runtime-code.txt")" -gt 32; then
              echo "REJECT_EMPTY_USDT_CODE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            if ! timeout 30s cast call "$USDT" 'balanceOf(address)(uint256)' "$MORPHO" \
                   --block "$BLOCK" --rpc-url "$RPC" > "$OUT/morpho-usdt-balance.txt" 2>/dev/null; then
              echo "REJECT_HISTORICAL_TOKEN_STATE_UNAVAILABLE" >> "$OUT/provider-attempts.txt"
              continue
            fi
            RAW="$(awk '{print $1}' "$OUT/morpho-usdt-balance.txt")"
            if [[ "$RAW" != "$EXPECTED_MORPHO_USDT_RAW" ]]; then
              echo "REJECT_TOKEN_BALANCE_MISMATCH" >> "$OUT/provider-attempts.txt"
              continue
            fi
            echo "BLOCK_AND_MORPHO_USDT_STATE_MATCH $RPC" >> "$OUT/provider-attempts.txt"
            SELECTED="$RPC"
            break
          done
          test -n "$SELECTED"
          echo "SELECTED_PUBLIC_RPC=$SELECTED" >> "$GITHUB_ENV"
          echo "$SELECTED" > "$OUT/selected-rpc.txt"
          mv "$OUT/candidate-block.json" "$OUT/canonical-block.json"
          sha256sum "$OUT/morpho-runtime-code.txt" "$OUT/usdt-runtime-code.txt" "$OUT/morpho-usdt-balance.txt" > "$OUT/runtime-state-sha256.txt"
      - name: Run actual-contract mainnet fork tests (read-only, never broadcast)
        working-directory: ci/nqc-t36/contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-morpho-real-fork"
          timeout 180s forge test \
            --fork-url "$SELECTED_PUBLIC_RPC" \
            --fork-block-number "$BLOCK" \
            --match-contract NqcFlashFundingExecutorV2MorphoForkTest -vvv \
            2>&1 | tee "$OUT/forge-fork-tests.txt"
          grep -F '[PASS] testRealForkMorphoFourHundredSeventyTwoThousandUSDTFlashPrincipalReturnsExactly()' "$OUT/forge-fork-tests.txt"
          grep -F '[PASS] testRealForkMorphoArtificialProfitFloorMustRevertAtomically()' "$OUT/forge-fork-tests.txt"
          grep -F '[PASS] testRealForkMorphoUnsolicitedCallbackDenied()' "$OUT/forge-fork-tests.txt"
      - name: Freeze evidence, source and limitations
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-morpho-real-fork"
          cp ci/nqc-t36/contracts/src/NqcFlashFundingExecutorV2.sol "$OUT/executor-source.sol"
          cp ci/nqc-t36/contracts/test/NqcFlashFundingExecutorV2MorphoFork.t.sol "$OUT/fork-tests-source.sol"
          jq -n --arg src "${{ github.event.pull_request.head.sha || github.sha }}" \
            --arg block_hash "$EXPECTED_HASH" \
            --arg parent_hash "$EXPECTED_PARENT" \
            --arg block "$BLOCK" \
            '{schema_version:1,scope:"ETHEREUM_SINGLE_ARCHIVE_RPC_REAL_CONTRACT_FORK_TEST_ONLY",
              source_commit:$src,chain_id:1,block_number:($block|tonumber),
              block_hash:$block_hash,parent_hash:$parent_hash,
              borrowed_token:"USDT",borrowed_from:"MORPHO_BLUE_DEPLOYED",
              callback:"onMorphoFlashLoan(uint256,bytes)",
              direct_principal_repayment_tested:true,
              cross_asset_route_tested:false,flash_loan_profit_usd:null,
              genuine_profit_attribution:false,independent_operator_quorum:false,
              external_gas_sponsor_eligible:false,fork_fee_gas_excluded:true,
              no_live_broadcast:true,own_funds_spent_usd:"0",
              p2_shadow_certified:false,rmc_closed:false,
              commercial_score_upgrade:false,nqc_realized_pnl_usd:"0"}' > "$OUT/non-authoritative.json"
          (cd "$OUT" && sha256sum executor-source.sol fork-tests-source.sol build.txt canonical-block.json \
            morpho-runtime-code.txt usdt-runtime-code.txt morpho-usdt-balance.txt \
            forge-fork-tests.txt non-authoritative.json > "archive.sha256" && sha256sum -c archive.sha256)
      - name: Preserve successes and failure diagnostics without claims
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc-v2-morpho-fork-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-morpho-real-fork/
          if-no-files-found: warn
          retention-days: 30
