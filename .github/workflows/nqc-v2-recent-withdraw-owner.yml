name: NQC V2 Recent Aave Withdraw Owner HF Census (READ ONLY)

on:
  pull_request:
    paths:
      - 'ci/nqc-census/rmc-v2-shadow/prospective_recent_withdraw_cohort.py'
      - 'ci/nqc-census/rmc-v2-shadow/test_prospective_recent_withdraw_cohort.py'
      - 'ci/nqc-census/rmc-v2-shadow/FRESH_WITHDRAW_OWNER_RISK_CONTRACT.md'
      - '.github/workflows/nqc-v2-recent-withdraw-owner.yml'

permissions:
  contents: read

concurrency:
  group: nqc-v2-recent-withdraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-withdraw-owner-risk:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ci/nqc-census/rmc-v2-shadow:ci/nqc-census/rmc-v2-economics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact commit and 24 adversarial dense Withdraw/source/state tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          OUT="$RUNNER_TEMP/nqc-recent-withdraw"
          mkdir -p "$OUT"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_prospective_recent_withdraw_cohort.py -v 2>&1 | tee "$OUT/withdraw-unit-tests.log"
          python3 -m py_compile ci/nqc-census/rmc-v2-shadow/prospective_recent_withdraw_cohort.py
      - name: Exact 384-block Withdraw owner and current canonical risk source audit
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-recent-withdraw"
          timeout 900s python3 ci/nqc-census/rmc-v2-shadow/prospective_recent_withdraw_cohort.py \
            --out "$OUT/withdraw-owner-risk.json" \
            > "$OUT/stdout.log" 2> "$OUT/stderr.log"
          jq -e '
            .schema_version==1 and
            .chain_id==1 and
            .source_event_topic0=="0x3115d1449a7b732c986cba18244e897a450f61e1bb8d589cd2e69e6c8924f9f7" and
            (.status=="DUAL_RPC_RECENT_WITHDRAW_OWNERS_RISK_ONLY_NOT_P2" or
             .status=="ZERO_WITHDRAW_EVENTS_ONLY_THIS_384_BLOCK_WINDOW" or
             .status=="INCOMPLETE_WITHDRAW_COHORT_NOT_MARKET_ABSENCE") and
            (.source_reports|keys|sort)==["drpc","publicnode"] and
            all(.source_reports[];.rpc_calls_used<=413 and
                .shards_complete<=16 and
                (.positive_receipts|length)<=2 and
                (.events|length)<=320 and
                (if .status=="COMPLETE_CANONICAL_WITHDRAW_EVENTS"
                 then (.event_blocks_verified<=320) and
                      (.event_blocks_verified==(.events|map(.block_number)|unique|length)) and
                      (.event_blocks_verified==([.canonical_header_partitions[].number_of_distinct_event_blocks]|add//0)) and
                      all(.canonical_header_partitions[];
                        .all_headers_authenticated==true and
                        .number_of_distinct_event_blocks<=96)
                 else true end)) and
            (.source_cohort|length)<=64 and
            .hf_state_pinned_after_complete_event_discovery==true and
            .hf_state_block_may_differ_from_event_window_end==true and
            .not_all_Aave_borrowers_or_collateral_users==true and
            .only_post_inclusion_source_state_not_pending_detection==true and
            .withdraw_is_not_automatically_collateral_withdrawal==true and
            .operator_source_independence_not_established==true and
            .cold_gas_NQC_verified==false and
            .real_liquidation_route_proven==false and
            .competitive_capture_proven==false and
            .external_native_gas_sponsor_nonrecourse_proven==false and
            .net_pnl_proven==false and
            .RMC_closed==false and
            .P2_shadow_certified==false and
            .canary_live_authorized==false and
            .commercial_score_upgrade==false and
            .nqc_realized_pnl_usd=="0" and
            (if .status=="DUAL_RPC_RECENT_WITHDRAW_OWNERS_RISK_ONLY_NOT_P2"
               then .verified_withdraw_event_count>0 and
                    .verified_distinct_owner_count>0 and
                    .verified_selected_owner_count>0 and
                    .verified_selected_owner_count<=64 and
                    .verified_selected_owner_count==(.source_cohort|length) and
                    .hf_state_anchored_at.number >= .anchor.last_block and
                    .anchor.state_block_after_event_window_end ==
                      (.hf_state_anchored_at.number-.anchor.last_block) and
                    .verified_active_debt_accounts!=null and
                    .verified_hf_lt_one_count!=null and
                    .selection.owners_omitted_due_bounded_limit>=0 and
                    all(.source_reports[];.status=="COMPLETE_CANONICAL_WITHDRAW_EVENTS" and
                        (.positive_receipts|length)>0) and
                    (.verified_selected_owner_count as $selected |
                        all(.state_reports[]; (.accounts|length)==$selected and
                            .status=="COMPLETE_STATE"))
               elif .status=="ZERO_WITHDRAW_EVENTS_ONLY_THIS_384_BLOCK_WINDOW"
               then .verified_withdraw_event_count==0 and
                    .verified_selected_owner_count==0 and
                    .verified_hf_lt_one_count==null
               else .verified_withdraw_event_count==null and
                    .verified_hf_lt_one_count==null
               end)
          ' "$OUT/withdraw-owner-risk.json" > "$OUT/evidence-contract-check.log"
          echo "Post-event owner HF not a pending signal, executable liquidation, MEV edge or NQC P&L."
      - name: Content-address code, source transcripts, facts and failures
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-recent-withdraw"
          mkdir -p "$OUT/source"
          cp ci/nqc-census/rmc-v2-shadow/prospective_recent_withdraw_cohort.py \
             ci/nqc-census/rmc-v2-shadow/test_prospective_recent_withdraw_cohort.py \
             ci/nqc-census/rmc-v2-shadow/prospective_recent_borrow_cohort.py \
             ci/nqc-census/rmc-v2-shadow/test_prospective_recent_borrow_cohort.py \
             ci/nqc-census/rmc-v2-shadow/prospective_50borrower_state.py \
             ci/nqc-census/rmc-v2-shadow/postwindow_indexed_winner_conflicts.py \
             ci/nqc-census/rmc-v2-shadow/blockscout_aave_89390_indexed_research.py \
             ci/nqc-census/rmc-v2-shadow/postwindow_economic_envelope.py \
             ci/nqc-census/rmc-v2-economics/postwindow_competition_capacity_hurdle.py \
             ci/nqc-census/rmc-v2-shadow/FRESH_WITHDRAW_OWNER_RISK_CONTRACT.md \
             .github/workflows/nqc-v2-recent-withdraw-owner.yml "$OUT/source/"
          git rev-parse HEAD > "$OUT/code-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/code-tree.txt"
          cd "$OUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          sha256sum --check --strict manifest.sha256
      - name: Preserve exact-head source-censored or owner-risk artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-v2-recent-withdraw-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-recent-withdraw/
          retention-days: 30
          if-no-files-found: error

  repository-lint:
    runs-on: ubuntu-24.04
    container: node:24
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
