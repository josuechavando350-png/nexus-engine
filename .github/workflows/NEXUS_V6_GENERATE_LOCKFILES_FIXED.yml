name: NEXUS V6 — generate dependency lockfiles FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    name: Generate and commit lockfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Generate Cargo lockfile
        working-directory: runtime
        run: cargo generate-lockfile

      - name: Verify lockfiles exist
        run: |
          test -f pnpm-lock.yaml
          test -f runtime/Cargo.lock
          git diff --check
          git status --short

      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml runtime/Cargo.lock

          if git diff --cached --quiet; then
            echo "Lockfiles already tracked and up to date."
            exit 0
          fi

          git commit -m "V6: lock dependency graph for reproducible builds"
          git push origin HEAD:main
