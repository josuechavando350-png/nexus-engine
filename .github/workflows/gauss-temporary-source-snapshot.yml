name: GAUSS temporary source snapshot
on:
  push:
    branches:
      - feat/gauss-remaining-800-work-2
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only committed GAUSS-related source
        shell: bash
        run: |
          git archive --format=zip --output=/tmp/gauss-source-snapshot.zip HEAD gauss walle/gauss-evidence-verify.mjs walle/adapters/gauss.sh scripts/nexus-gauss.mjs seo-avengers-2500/quantum-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: gauss-source-audit
          path: /tmp/gauss-source-snapshot.zip
          retention-days: 1
          if-no-files-found: error
