name: TEMP APCA Lock Refresh

on:
  push:
    branches:
      - feat/experience-quality-loop-v1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[apca-lock-refreshed]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/experience-quality-loop-v1
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit normalized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lock): add canonical APCA dependency [apca-lock-refreshed]"
          git push origin HEAD:feat/experience-quality-loop-v1
