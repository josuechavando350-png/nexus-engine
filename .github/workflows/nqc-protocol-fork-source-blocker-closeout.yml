name: NQC T39 Source Blocker Closeout Contracts

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-source-blocker-closeout.yml
      - ci/nqc-protocol-fork/reimplementation/nqc-v2-backrun-executor/PFT-SRC-001-CLOSEOUT.json
      - ci/nqc-protocol-fork/reimplementation/nqc-aave-reconciler/PFT-SRC-003-CLOSEOUT.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-blocker-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate no source blocker can close without all measured evidence
        shell: bash
        env:
          NQC_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import json,os,re,urllib.request
          from pathlib import Path

          sha=re.compile(r"^[0-9a-f]{64}$")
          head=re.compile(r"^[0-9a-f]{40}$")

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["NQC_GITHUB_TOKEN"]
          if not token:
              raise AssertionError("missing GitHub Actions token for source-blocker attestation")

          def verify_artifact(blocker,name,item):
              artifact_id=int(item["artifact_id"])
              workflow_run_id=int(item["workflow_run_id"])
              artifact_sha256=item["artifact_sha256"]
              artifact_head=item["head"]
              assert artifact_id>0 and workflow_run_id>0
              assert sha.fullmatch(artifact_sha256), (blocker,name,"missing sha256")
              assert head.fullmatch(artifact_head), (blocker,name,"bad head")
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"nqc-source-blocker-closeout-v2",
                  },
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  actual=json.loads(response.read())
              assert int(actual["id"])==artifact_id, (blocker,name,"artifact id mismatch")
              assert actual.get("expired") is False, (blocker,name,"artifact expired")
              assert actual.get("digest")==f"sha256:{artifact_sha256}", (
                  blocker,name,"artifact digest mismatch",actual.get("digest")
              )
              run=actual.get("workflow_run") or {}
              assert int(run.get("id",0))==workflow_run_id, (
                  blocker,name,"workflow run mismatch",run.get("id")
              )
              assert run.get("head_sha")==artifact_head, (
                  blocker,name,"workflow head mismatch",run.get("head_sha"),artifact_head
              )

          paths=[
            Path("ci/nqc-protocol-fork/reimplementation/nqc-v2-backrun-executor/PFT-SRC-001-CLOSEOUT.json"),
            Path("ci/nqc-protocol-fork/reimplementation/nqc-aave-reconciler/PFT-SRC-003-CLOSEOUT.json"),
          ]
          docs=[json.loads(p.read_text()) for p in paths]
          assert {d["source_blocker"] for d in docs}=={"PFT-SRC-001","PFT-SRC-003"}

          for d in docs:
              assert d["classification"]=="NEW_MEASURED_REIMPLEMENTATION_NOT_RECOVERED_SOURCE"
              assert d["recovery_status"]=="RECOVERY_EXHAUSTED_OVER_AVAILABLE_PHYSICAL_CORPUS"
              assert d["unexplained_mismatches"]==0
              assert d["protocol_fork_truth"]=="NOT_CLOSED"
              pending=[]
              for name,item in d["evidence"].items():
                  assert head.fullmatch(item["head"]), (d["source_blocker"],name,"bad head")
                  if item["status"]=="PASS":
                      verify_artifact(d["source_blocker"],name,item)
                  else:
                      pending.append(name)

              if d["status"]=="CLOSED":
                  assert not pending, (d["source_blocker"],"closed with pending evidence",pending)
                  print(d["source_blocker"]+"_CLOSEOUT_PASS")
              else:
                  assert d["status"].startswith("NOT_TESTED_")
                  assert pending
                  print(d["source_blocker"]+"_CLOSEOUT_PENDING "+",".join(pending))
          PY

          sha256sum             ci/nqc-protocol-fork/reimplementation/nqc-v2-backrun-executor/PFT-SRC-001-CLOSEOUT.json             ci/nqc-protocol-fork/reimplementation/nqc-aave-reconciler/PFT-SRC-003-CLOSEOUT.json             > /tmp/nqc-source-blocker-closeout.sha256
          sha256sum -c /tmp/nqc-source-blocker-closeout.sha256
