name: CANO evidence validation
on:
  push:
    branches:
      - feat/cano-gauss-axioma-evidence-boundary
    paths:
      - 'seo-avengers-2500/commercial-demand/cano-evidence-v1.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-evidence-v1.test.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-tournament-v1.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-tournament-v1.test.mjs'
      - '.github/workflows/cano-evidence-validation.yml'
  pull_request:
    paths:
      - 'seo-avengers-2500/commercial-demand/cano-evidence-v1.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-evidence-v1.test.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-tournament-v1.mjs'
      - 'seo-avengers-2500/commercial-demand/cano-tournament-v1.test.mjs'
      - '.github/workflows/cano-evidence-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check CANO module syntax
        run: |
          node --check seo-avengers-2500/commercial-demand/cano-evidence-v1.mjs
          node --check seo-avengers-2500/commercial-demand/cano-tournament-v1.mjs
      - name: Run CANO evidence and tournament tests
        run: node --test seo-avengers-2500/commercial-demand/cano-evidence-v1.test.mjs seo-avengers-2500/commercial-demand/cano-tournament-v1.test.mjs
