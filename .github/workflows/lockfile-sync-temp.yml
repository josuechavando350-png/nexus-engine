name: TEMP Lockfile Sync

on:
  push:
    branches:
      - feat/capability-05-passage-intelligence

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-05-passage-intelligence
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Regenerate only the workspace lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --exit-code -- . ':(exclude)pnpm-lock.yaml'
          grep -Fq '  packages/passage-intelligence: {}' pnpm-lock.yaml

      - name: Commit lockfile when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(passage): synchronize workspace lockfile'
          git push origin HEAD:feat/capability-05-passage-intelligence
