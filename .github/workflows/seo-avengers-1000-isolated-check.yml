name: SEO Avengers 1000 Isolated Check

on:
  push:
    branches:
      - feat/seo-avengers-1000-batch-801-1000
    paths:
      - 'seo-avengers-1000/**'
      - '.github/workflows/seo-avengers-1000-isolated-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'seo-avengers-1000/**'
      - '.github/workflows/seo-avengers-1000-isolated-check.yml'

permissions:
  contents: read

jobs:
  verify-1000:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify audited M001-M800 plus exact M801-M1000
        run: bash seo-avengers-1000/scripts/verify.sh

      - name: Prove branch diff is isolated
        shell: bash
        run: |
          git fetch origin main --no-tags
          CHANGED="$(git diff --name-only origin/main...HEAD)"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(seo-avengers-1000/|\.github/workflows/seo-avengers-1000-isolated-check\.yml$)' || true)"
          if [ -n "$BAD" ]; then
            echo 'Avengers 1000 branch changed files outside the isolated allowlist:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(apps/cano-penal|delivery/cano-penal)/'; then
            echo 'Avengers 1000 branch unexpectedly touched cano-penal' >&2
            exit 1
          fi
          echo 'branch diff is isolated to seo-avengers-1000 and its dedicated workflow'
