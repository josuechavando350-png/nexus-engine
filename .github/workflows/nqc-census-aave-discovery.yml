name: NQC RMC-006 Aave Discovery

on:
  pull_request:
    paths:
      - .github/workflows/nqc-census-aave-discovery.yml
      - ci/nqc-census/**
      - nqc-census/**
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact immutable original source run (36820687233).
        required: true
        default: ""
      source_artifact_id:
        description: Exact immutable original source artifact (11143129177).
        required: true
        default: ""
      source_zip_sha256:
        description: SHA-256 of the original seed ZIP. No live acquisition fallback.
        required: true
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: nqc-rmc006-offline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    container: node:24
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Required repository validation
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  aave-discovery:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RECERTIFICATION_BASE: 3b23804a46bfcc730d57784fb95a349e6e6e726b
      D06_BASE: 8ebf6860e0a16964f5293df0ef40695b303b286d
      RMC003_2_AUTHORITY: 519e5f6f7a4d42ff1cab67fef8306cfef9aab120
      PFT_CERTIFIED_COMMIT: 5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf
      PFT_CERTIFIED_TREE: ef3498da528f85cdb9fdd82222d64773a557f853
      RUST_TOOLCHAIN: "1.98.1"
      D06_TESTS_EXPECTED: "21"
      D06_HISTORY_TESTS_EXPECTED: "11"
      D06_SOURCE: /tmp/nqc-rmc006-authenticated-source
      D06_SEED: /tmp/nqc-rmc006-seed
      D06_EVIDENCE: /tmp/nqc-rmc006-evidence
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject non-seed dispatch inputs
        id: seed
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ZIP_SHA256: ${{ inputs.source_zip_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "verify=false" >> "$GITHUB_OUTPUT"
            echo "RMC006_CODE_GATES_ONLY: this PR run certifies nothing"
            exit 0
          fi
          test "$EVENT_NAME" = workflow_dispatch
          test "$SOURCE_RUN_ID" = 36820687233
          test "$SOURCE_ARTIFACT_ID" = 11143129177
          test "$SOURCE_ZIP_SHA256" = 1cdb46fca52ebf1e0e2094b1c14b19384ecb7beceb50229b967592ab7a0308b4
          echo "verify=true" >> "$GITHUB_OUTPUT"

      - name: Verify authority and upstream immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T "$PFT_CERTIFIED_COMMIT")" = "$PFT_CERTIFIED_TREE"
          git merge-base --is-ancestor "$RECERTIFICATION_BASE" HEAD
          git merge-base --is-ancestor "$D06_BASE" HEAD
          git merge-base --is-ancestor "$D06_BASE" "$RMC003_2_AUTHORITY"
          git merge-base --is-ancestor "$RMC003_2_AUTHORITY" HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          fi
          git diff --quiet "$PFT_CERTIFIED_COMMIT" HEAD --             ci/nqc-protocol-fork/recovered-source ci/nqc-protocol-fork/reimplementation             ci/nqc-protocol-fork/compatibility ci/nqc-protocol-fork/locks
          git diff --quiet "$RMC003_2_AUTHORITY" HEAD -- \
            nqc-census/crates/nqc-census-core nqc-census/crates/nqc-census-store \
            nqc-census/crates/nqc-census-chain
          git diff --quiet a33a012591cd6625ddb921d995bb1bd95b4a5406 HEAD -- \
            ci/nqc-census/rpc-providers.json ci/nqc-census/aave-history-providers.json \
            ci/nqc-census/aave-discovery-scope.json nqc-census/rust-toolchain.toml
          echo RMC006_UPSTREAM_IMMUTABLE_PASS

      - name: Verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'private.?key|mnemonic|eth_send|eth_sign|sendRawTransaction|reqwest|hyper|tokio|std::net|unsafe'             nqc-census/crates/nqc-census-aave-discovery --include='*.rs'; then
            echo "forbidden execution/network authority in D06"
            exit 1
          fi
          echo RMC006_BOUNDARY_PASS

      - name: Locked Rust gates
        working-directory: nqc-census
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc -V | grep -F "rustc $RUST_TOOLCHAIN "
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          count=$(cargo test --locked -p nqc-census-aave-discovery --test aave_discovery -- --list 2>/dev/null | grep -c ': test$')
          test "$count" = "$D06_TESTS_EXPECTED"
          count=$(cargo test --locked -p nqc-census-aave-discovery --test aave_history -- --list 2>/dev/null | grep -c ': test$')
          test "$count" = "$D06_HISTORY_TESTS_EXPECTED"
          cargo test --locked -p nqc-census-aave-discovery -- --nocapture
          cargo test --workspace --all-targets --locked
          cargo build --workspace --all-targets --locked
          cargo build --release --locked -p nqc-census-aave-discovery --bins
          cargo build --release --locked -p nqc-census-store --bin nqc-census-store-verify
          echo RMC006_RECONCILIATION_CORE_PASS


      - name: Seed authentication and fail-closed code tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/nqc-census -p 'test_rmc006_recertification*.py' -v

      - name: Download only the pinned original seed
        if: steps.seed.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = josuechavando350-png/nexus-engine
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "$D06_SEED"
          gh api repos/josuechavando350-png/nexus-engine/actions/runs/36820687233 > "$D06_SEED/run.json"
          gh api repos/josuechavando350-png/nexus-engine/actions/artifacts/11143129177 > "$D06_SEED/artifact.json"
          gh api repos/josuechavando350-png/nexus-engine/git/commits/a33a012591cd6625ddb921d995bb1bd95b4a5406 > "$D06_SEED/commit.json"
          gh api repos/josuechavando350-png/nexus-engine/actions/artifacts/11143129177/zip > "$D06_SEED/source.zip"
          python3 ci/nqc-census/verify_rmc006_recertification_source.py \
            --archive "$D06_SEED/source.zip" --run-metadata "$D06_SEED/run.json" \
            --artifact-metadata "$D06_SEED/artifact.json" --commit-metadata "$D06_SEED/commit.json" \
            --extract-to "$D06_SOURCE" --provenance "$D06_SEED/source-provenance.json"

      - name: Real-package authentication negative matrix
        if: steps.seed.outputs.verify == 'true'
        env:
          RMC006_SOURCE_ARCHIVE: /tmp/nqc-rmc006-seed/source.zip
          RMC006_SOURCE_RUN_METADATA: /tmp/nqc-rmc006-seed/run.json
          RMC006_SOURCE_ARTIFACT_METADATA: /tmp/nqc-rmc006-seed/artifact.json
          RMC006_SOURCE_COMMIT_METADATA: /tmp/nqc-rmc006-seed/commit.json
        run: python3 -m unittest discover -s ci/nqc-census -p 'test_rmc006_recertification*.py' -v

      - name: Disconnected replay, admission and deterministic new closeout
        if: steps.seed.outputs.verify == 'true'
        run: |
          set -euo pipefail
          parent_network="$(readlink /proc/self/ns/net)"
          sudo unshare --net --mount -- python3 ci/nqc-census/run_rmc006_recertification.py \
            --repo "$GITHUB_WORKSPACE" --source "$D06_SOURCE" --out "$D06_EVIDENCE" \
            --parent-network-namespace "$parent_network"
          python3 ci/nqc-census/verify_rmc006_recertification_source.py \
            --archive "$D06_SEED/source.zip" --run-metadata "$D06_SEED/run.json" \
            --artifact-metadata "$D06_SEED/artifact.json" --commit-metadata "$D06_SEED/commit.json" \
            --verify-extracted "$D06_SOURCE" --provenance "$D06_SEED/source-provenance-after.json"
          sudo unshare --net --mount -- python3 ci/nqc-census/test_rmc006_recertification_replay.py \
            --repo "$GITHUB_WORKSPACE" --source "$D06_SOURCE" --work "$D06_EVIDENCE/negative-tests" \
            --parent-network-namespace "$parent_network"
          sudo chown -R "$(id -u):$(id -g)" "$D06_EVIDENCE"
          cp -a "$D06_SEED" "$D06_EVIDENCE/source-provenance"

      - name: Index genuinely new verification evidence
        if: success() && steps.seed.outputs.verify == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - "$D06_EVIDENCE" "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)" <<'PYCODE'
          import hashlib, json, os, pathlib, sys
          root, head, tree = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          assert os.environ['JOB_STATUS'] == 'success'
          proof = json.loads((root/'offline-verification.json').read_text())
          assert proof['code_commit'] == head and proof['code_tree'] == tree
          files = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  files.append({'path': str(path.relative_to(root)), 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)})
          index = {'schema': 'nqc-rmc006-evidence-index-v1', 'code_commit': head, 'code_tree': tree,
                   'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'job_status': os.environ['JOB_STATUS'], 'files': files}
          (root/'evidence-index.json').write_text(json.dumps(index, sort_keys=True, indent=2)+'\n')
          PYCODE

      - name: Preserve new verification evidence and original provenance
        if: success() && steps.seed.outputs.verify == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-rmc006-evidence-26095351-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/nqc-rmc006-evidence
          if-no-files-found: error
          retention-days: 30
