name: Topology bootstrap

on:
  push:
    branches:
      - feat/topology-engine
    paths:
      - '.github/workflows/topology-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Materialize audited topology source
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/topology-payload.tgz
          tar -xzf /tmp/topology-payload.tgz -C .
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only
      - name: Validate Motor 2 packages
        run: |
          pnpm --filter @nexus/topology typecheck
          pnpm --filter @nexus/topology test
          pnpm --filter @nexus/topology build
          pnpm --filter @nexus/measurement typecheck
          pnpm --filter @nexus/measurement build
          git diff --check
      - name: Commit Motor 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/topology packages/measurement/package.json packages/measurement/topology.ts packages/measurement/topology.test.ts pnpm-lock.yaml
          git commit -m "feat(topology): integrate persistent homology engine"
          git push
