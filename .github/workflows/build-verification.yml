name: Build Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-verification:
    runs-on: ubuntu-24.04
    container: node:24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
