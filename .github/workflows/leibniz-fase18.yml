name: LEIBNIZ Rust validation blocks 1-3
on:
  push:
    branches: [leibniz/fase18]
    paths: ['leibniz/fase18-payload/**', '.github/workflows/leibniz-fase18.yml']
permissions:
  contents: read
jobs:
  rust-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore verified original source archive
        shell: bash
        run: |
          set -euo pipefail
          cat leibniz/fase18-payload/part-* | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          echo '254038cdcd9b6c4fc6245b297aee51b8942193c8d5fbddcddc56c1bd969f633e  '"$RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/leibniz-standalone"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/leibniz-standalone"
          echo "LEIBNIZ_DIR=$RUNNER_TEMP/leibniz-standalone" >> "$GITHUB_ENV"
      - name: Apply original reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          for fix in "$GITHUB_WORKSPACE"/leibniz/fase18-payload/fix-*.patch; do
            test -f "$fix" || continue
            patch --batch --forward -p1 < "$fix"
          done
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Restore SHA-identified missing source bytes
        run: python3 leibniz/fase18-payload/recover-one-missing-byte.py
      - name: Restore verified higher-order checker
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/leibniz/fase18-payload/higher-order-b1.b64" > "$RUNNER_TEMP/hol.tar.xz"
          echo 'a359971dac7f342989c77cacc08dd8a621fe39effcff56bab8509b6843cf0f58  '"$RUNNER_TEMP/hol.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/hol.tar.xz" -C "$LEIBNIZ_DIR"
          test -s "$LEIBNIZ_DIR/src/hol.rs"
      - name: Apply reviewed higher-order corrections
        shell: bash
        run: |
          set -euo pipefail
          for fix in "$GITHUB_WORKSPACE"/leibniz/fase18-payload/hol-fix-*.patch; do
            test -f "$fix" || continue
            patch --batch --forward -p1 < "$fix"
          done
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Assemble independent model and trusted handoff in Rust crate
        shell: bash
        run: |
          set -euo pipefail
          p="$GITHUB_WORKSPACE/leibniz/fase18-payload"
          cp "$p/hol-standard.rs" "$LEIBNIZ_DIR/tests/hol_standard.rs"
          cp "$p/FORMAL_SEMANTICS_AND_ACCEPTANCE.md" "$LEIBNIZ_DIR/FORMAL_SEMANTICS_AND_ACCEPTANCE.md"
          cp "$p/finite_model.rs" "$LEIBNIZ_DIR/src/finite_model.rs"
          cp "$p/hol-semantic-oracle.rs" "$LEIBNIZ_DIR/tests/hol_semantic_oracle.rs"
          cp "$p/BLOCK2_FORMAL_VALIDATION.md" "$LEIBNIZ_DIR/BLOCK2_FORMAL_VALIDATION.md"
          cp "$p/SECOND_BLOCK_RELEASE_NOTES.md" "$LEIBNIZ_DIR/SECOND_BLOCK_RELEASE_NOTES.md"
          cp "$p/SECOND_BLOCK_VALIDATION_TARGET" "$LEIBNIZ_DIR/SECOND_BLOCK_VALIDATION_TARGET"
          cp "$p/formal_audit.rs" "$LEIBNIZ_DIR/src/formal_audit.rs"
          cp "$p/formal-audit-acceptance.rs" "$LEIBNIZ_DIR/tests/formal_audit_acceptance.rs"
          test "$(grep -c '^#\[test\]' "$LEIBNIZ_DIR/tests/hol_standard.rs")" -eq 5
          test "$(grep -c '^#\[test\]' "$LEIBNIZ_DIR/tests/hol_semantic_oracle.rs")" -eq 11
          test "$(grep -c '^#\[test\]' "$LEIBNIZ_DIR/tests/formal_audit_acceptance.rs")" -eq 13
          printf '\npub mod finite_model;\npub mod formal_audit;\n' >> "$LEIBNIZ_DIR/src/lib.rs"
      - name: Format reconstructed source
        run: cargo fmt --all
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Verify reconstructed source formatting
        run: cargo fmt --all -- --check
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Validate all 213 Rust tests with zero failures or ignored
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets --offline 2>&1 | tee "$RUNNER_TEMP/test-results.log"
          passed=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="passed;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/test-results.log")
          ignored=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="ignored;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/test-results.log")
          echo "Rust tests passed: $passed; ignored: $ignored"
          test "$passed" -eq 213
          test "$ignored" -eq 0
          echo "Passed: $passed; ignored: $ignored; SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Strict Clippy
        run: cargo clippy --all-targets --offline -- -D warnings
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Release build
        run: cargo build --release --offline
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Benchmark
        run: cargo run --release --offline --example benchmark -- 250 3
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Graph scaling
        run: cargo run --release --offline --example graph_scale -- 8 16 24
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Package exact human-readable source
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$LEIBNIZ_DIR" --exclude='./target' --exclude='./.git' -cJf "$RUNNER_TEMP/LEIBNIZ-blocks-1-2-3-source.tar.xz" .
          sha256sum "$RUNNER_TEMP/LEIBNIZ-blocks-1-2-3-source.tar.xz" | tee "$RUNNER_TEMP/LEIBNIZ-source-sha256.txt"
          echo "Source SHA-256: $(cut -d' ' -f1 "$RUNNER_TEMP/LEIBNIZ-source-sha256.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact tested source
        uses: actions/upload-artifact@v4
        with:
          name: leibniz-blocks-1-2-3-rust-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/LEIBNIZ-blocks-1-2-3-source.tar.xz
            ${{ runner.temp }}/LEIBNIZ-source-sha256.txt
          if-no-files-found: error
          retention-days: 14
