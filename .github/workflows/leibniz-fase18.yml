name: LEIBNIZ first-block Rust validation
on:
  push:
    branches: [leibniz/fase18]
    paths: ['leibniz/fase18-payload/**', '.github/workflows/leibniz-fase18.yml']
permissions:
  contents: read
jobs:
  rust-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore original source
        shell: bash
        run: |
          set -euo pipefail
          cat leibniz/fase18-payload/part-* | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          echo '254038cdcd9b6c4fc6245b297aee51b8942193c8d5fbddcddc56c1bd969f633e  '"$RUNNER_TEMP/source.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/leibniz-standalone"
          tar -xJf "$RUNNER_TEMP/source.tar.xz" -C "$RUNNER_TEMP/leibniz-standalone"
          echo "LEIBNIZ_DIR=$RUNNER_TEMP/leibniz-standalone" >> "$GITHUB_ENV"
      - name: Apply source patches
        shell: bash
        run: |
          set -euo pipefail
          for fix in "$GITHUB_WORKSPACE"/leibniz/fase18-payload/fix-*.patch; do
            test -f "$fix" || continue
            patch --batch --forward -p1 < "$fix"
          done
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Restore cryptographically identified missing transfer bytes
        run: python3 leibniz/fase18-payload/recover-one-missing-byte.py
      - name: Restore higher-order proof checker and acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$GITHUB_WORKSPACE/leibniz/fase18-payload/higher-order-b1.b64" > "$RUNNER_TEMP/hol.tar.xz"
          echo 'a359971dac7f342989c77cacc08dd8a621fe39effcff56bab8509b6843cf0f58  '"$RUNNER_TEMP/hol.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/hol.tar.xz" -C "$LEIBNIZ_DIR"
          test -s "$LEIBNIZ_DIR/src/hol.rs"
          test -s "$LEIBNIZ_DIR/tests/hol.rs"
          test -s "$LEIBNIZ_DIR/tests/block1_acceptance.rs"
      - name: Apply reviewed HOL source corrections
        shell: bash
        run: |
          set -euo pipefail
          for fix in "$GITHUB_WORKSPACE"/leibniz/fase18-payload/hol-fix-*.patch; do
            test -f "$fix" || continue
            patch --batch --forward -p1 < "$fix"
          done
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Format code
        run: cargo fmt --all
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Verify formatting
        run: cargo fmt --all -- --check
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Run original and new tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets --offline 2>&1 | tee "$RUNNER_TEMP/test-results.log"
          passed=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="passed;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/test-results.log")
          ignored=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="ignored;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/test-results.log")
          echo "Rust tests passed: $passed; ignored: $ignored"
          test "$passed" -ge 184
          test "$ignored" -eq 0
          echo "Passed: $passed; ignored: $ignored; SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Strict Clippy
        run: cargo clippy --all-targets --offline -- -D warnings
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Release build
        run: cargo build --release --offline
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Benchmark
        run: cargo run --release --offline --example benchmark -- 250 3
        working-directory: ${{ env.LEIBNIZ_DIR }}
      - name: Graph scaling
        run: cargo run --release --offline --example graph_scale -- 8 16 24
        working-directory: ${{ env.LEIBNIZ_DIR }}
