name: LEIBNIZ source-pinned four-block and manifest-bridge validation
on:
  push:
    branches: [leibniz/fase18]
    paths:
      - 'leibniz/fase18-payload/**'
      - 'leibniz/rust/**'
      - 'leibniz/ORIGINAL_MANIFEST_GAP_MATRIX.md'
      - '.github/workflows/leibniz-fase18.yml'
permissions:
  contents: read
jobs:
  rust-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require directly tracked readable source
        run: |
          set -euo pipefail
          test -s leibniz/rust/Cargo.toml
          test -s leibniz/rust/src/gauss_bridge.rs
          test -s leibniz/rust/src/authorized_ingest.rs
          test -s leibniz/rust/src/sequential_ingest.rs
          test -s leibniz/rust/src/trusted_head.rs
          test -s leibniz/rust/examples/trusted_head_source.rs
          test -s leibniz/rust/examples/sequential_source.rs
          test -s leibniz/rust/src/operational_gate.rs
          test -s leibniz/ORIGINAL_MANIFEST_GAP_MATRIX.md
          git diff --exit-code
      - name: Format without changing tracked source
        working-directory: leibniz/rust
        run: cargo fmt --all -- --check
      - name: All 245 Rust tests in debug
        working-directory: leibniz/rust
        run: |
          set -euo pipefail
          cargo test --all-targets --offline 2>&1 | tee "$RUNNER_TEMP/leibniz-debug.log"
          passed=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="passed;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/leibniz-debug.log")
          ignored=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="ignored;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/leibniz-debug.log")
          test "$passed" -eq 245 && test "$ignored" -eq 0
          echo "LEIBNIZ Rust debug: $passed passed; $ignored ignored" >> "$GITHUB_STEP_SUMMARY"
      - name: Strict Clippy
        working-directory: leibniz/rust
        run: cargo clippy --all-targets --offline -- -D warnings
      - name: Production build including sequential, trusted-head and bridge executables
        working-directory: leibniz/rust
        run: cargo build --release --offline --all-targets
      - name: All 245 Rust tests in release
        working-directory: leibniz/rust
        run: |
          set -euo pipefail
          cargo test --release --all-targets --offline 2>&1 | tee "$RUNNER_TEMP/leibniz-release.log"
          passed=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="passed;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/leibniz-release.log")
          ignored=$(awk '/test result: ok\./ {for (i=1;i<=NF;i++) if ($i=="ignored;") total+=$(i-1)} END {print total+0}' "$RUNNER_TEMP/leibniz-release.log")
          test "$passed" -eq 245 && test "$ignored" -eq 0
          echo "LEIBNIZ Rust release: $passed passed; $ignored ignored" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline proof benchmark
        working-directory: leibniz/rust
        run: cargo run --release --offline --example benchmark -- 250 3
      - name: Graph regression through 48 nodes and explicit 64-node abstention
        working-directory: leibniz/rust
        run: |
          set -euo pipefail
          cargo run --release --offline --example graph_scale -- 8 16 24 32 48
          set +e
          cargo run --release --offline --example graph_scale -- 64 2>&1 | tee "$RUNNER_TEMP/graph-64.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -q 'ABSTAIN: max_matches exhausted during unification' "$RUNNER_TEMP/graph-64.log"
      - name: Retain old genuine synthetic Rust -> GAUSS -> Quantum regression
        run: |
          set -euo pipefail
          leibniz/rust/target/release/examples/gauss_bridge_fixture > "$RUNNER_TEMP/leibniz-original-fixture.tsv"
          LEIBNIZ_SYNTHETIC_FIXTURE="$RUNNER_TEMP/leibniz-original-fixture.tsv" node leibniz/fase18-payload/gauss_bridge_smoke.mjs
      - name: Execute variable Rust archive and independent-pin bridge against real GAUSS and Quantum
        env:
          LEIBNIZ_BRIDGE_EXPORT_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/gauss_bridge_export
          LEIBNIZ_BRIDGE_SOURCE_GENERATOR: ${{ github.workspace }}/leibniz/rust/target/release/examples/gauss_bridge_source
        run: |
          set -euo pipefail
          node --test leibniz/fase18-payload/gauss_measured_linear_bridge.test.mjs
          git diff --exit-code -- gauss/ quantum/ walle/ runtime/ packages/
          echo 'Source-pinned two-edge Rust/GAUSS/Quantum tests executed; synthetic test origin only.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise operator-authored TSV ingestion through LEIBNIZ, actual GAUSS and Quantum
        env:
          LEIBNIZ_BRIDGE_EXPORT_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/gauss_bridge_export
          LEIBNIZ_AUTHORIZED_INGEST_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/ingest_authorized_source
        run: |
          set -euo pipefail
          node --test leibniz/fase18-payload/authorized_ingest_bridge.test.mjs
          git diff --exit-code -- gauss/ quantum/ walle/ runtime/ packages/
          echo 'Operator-authored TEST records: typed ingestion -> Rust archive -> GAUSS solve + Quantum receipt; no external-source authenticity claim.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise two ordered LEIBNIZ source batches and reject replay through real GAUSS and Quantum
        env:
          LEIBNIZ_BRIDGE_EXPORT_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/gauss_bridge_export
          LEIBNIZ_SEQUENTIAL_SOURCE_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/sequential_source
        run: |
          set -euo pipefail
          node --test leibniz/fase18-payload/sequential_ingest.test.mjs
          git diff --exit-code -- gauss/ quantum/ walle/ runtime/ packages/
          echo 'Two synthetic, manually submitted batches; no live source or source authentication claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reject simultaneous rollback of checkpoint and ordinary pin using separate latest-head witness
        env:
          LEIBNIZ_TRUSTED_HEAD_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/trusted_head_source
          LEIBNIZ_BRIDGE_EXPORT_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/gauss_bridge_export
          LEIBNIZ_SEQUENTIAL_SOURCE_BINARY: ${{ github.workspace }}/leibniz/rust/target/release/examples/sequential_source
        run: |
          set -euo pipefail
          node --test leibniz/fase18-payload/trusted_head.test.mjs
          git diff --exit-code -- gauss/ quantum/ walle/ runtime/ packages/
          echo 'SYNTHETIC witness-gate test passed; external monotonic authority and authentication are NOT implemented.' >> "$GITHUB_STEP_SUMMARY"
      - name: Package exact tested tracked Rust source
        run: |
          set -euo pipefail
          git diff --exit-code -- leibniz/rust
          tar -C leibniz/rust --exclude='./target' --exclude='./.git' -cJf "$RUNNER_TEMP/LEIBNIZ-tested-source.tar.xz" .
          sha256sum "$RUNNER_TEMP/LEIBNIZ-tested-source.tar.xz" | tee "$RUNNER_TEMP/LEIBNIZ-source-sha256.txt"
      - name: Re-test source extracted into clean directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/leibniz-replay"
          tar -xJf "$RUNNER_TEMP/LEIBNIZ-tested-source.tar.xz" -C "$RUNNER_TEMP/leibniz-replay"
          cmp leibniz/rust/src/gauss_bridge.rs "$RUNNER_TEMP/leibniz-replay/src/gauss_bridge.rs"
          cmp leibniz/rust/src/authorized_ingest.rs "$RUNNER_TEMP/leibniz-replay/src/authorized_ingest.rs"
          cmp leibniz/rust/src/sequential_ingest.rs "$RUNNER_TEMP/leibniz-replay/src/sequential_ingest.rs"
          cmp leibniz/rust/src/trusted_head.rs "$RUNNER_TEMP/leibniz-replay/src/trusted_head.rs"
          cargo fmt --all --manifest-path "$RUNNER_TEMP/leibniz-replay/Cargo.toml" -- --check
          cargo test --all-targets --offline --manifest-path "$RUNNER_TEMP/leibniz-replay/Cargo.toml"
      - name: Publish tested source and digest
        uses: actions/upload-artifact@v4
        with:
          name: leibniz-manifest-bridge-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/LEIBNIZ-tested-source.tar.xz
            ${{ runner.temp }}/LEIBNIZ-source-sha256.txt
          if-no-files-found: error
          retention-days: 30
