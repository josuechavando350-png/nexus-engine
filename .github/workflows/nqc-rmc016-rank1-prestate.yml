name: NQC RMC-016 Rank-One Real Prestate Witness

on:
  pull_request:
    paths:
      - '.github/workflows/nqc-rmc016-rank1-prestate.yml'
      - 'ci/nqc-census/rmc016_rank1_prestate_probe.py'
      - 'ci/nqc-census/test_rmc016_rank1_prestate_probe.py'
      - 'ci/nqc-census/RMC016_RANK1_PRESTATE_FORK_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rmc016-real-rank1-prestate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authenticated-previous-block-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify D16+T36 lineage and run source-negative tests
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 43551884875776fd518d186a29b2a30371324f22 HEAD
          test "$(git hash-object ci/nqc-census/rmc016-production-evidence.json)" = '5d5ed3635a426d686c8a98aa3547fd5b9d8b95aa'
          # Exact code identity from PR #619; no alternate ABI interpretation.
          test "$(git hash-object ci/nqc-census/rmc016_aave_event_legs.py)" = '0474d97814deb60490a795b2059f3065c72d8103'
          python3 ci/nqc-census/test_rmc016_rank1_prestate_probe.py
          python3 -m py_compile ci/nqc-census/rmc016_rank1_prestate_probe.py
          mkdir -p "$RUNNER_TEMP/nqc016-rank1-source" "$RUNNER_TEMP/nqc016-rank1-proof"
          sha256sum ci/nqc-census/rmc016_rank1_prestate_probe.py \
                    ci/nqc-census/RMC016_RANK1_PRESTATE_FORK_CONTRACT.md \
                    > "$RUNNER_TEMP/nqc016-rank1-proof/producer-source.sha256"
          echo RMC016_RANK1_PRESTATE_NEGATIVE_SOURCE_CHECKS_PASS

      - name: Reauthenticate original 139 events / 127 receipts / 139 decoded leg archives
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nqc016-rank1-source"
          check() {
            local run="$1" head="$2" workflow="$3" outcome="$4" artifact="$5" name="$6" digest="$7" label="$8"
            local meta art
            meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            art="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact")"
            test "$(jq -r .status <<<"$meta")" = completed
            test "$(jq -r .conclusion <<<"$meta")" = "$outcome"
            test "$(jq -r .name <<<"$meta")" = "$workflow"
            test "$(jq -r .head_sha <<<"$meta")" = "$head"
            test "$(jq -r .expired <<<"$art")" = false
            test "$(jq -r .name <<<"$art")" = "$name"
            test "$(jq -r .digest <<<"$art")" = "sha256:$digest"
            test "$(jq -r .workflow_run.id <<<"$art")" = "$run"
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" \
              -o "$root/$label.zip"
            printf '%s  %s\n' "$digest" "$root/$label.zip" | sha256sum --check --strict
          }
          check 37718661409 abe54f1f23bd7bff8c37871200f7da7c59c45ac3 'NQC RMC-016 Full Liquidation Ledger Discovery' success 11524139188 'rmc016-full-liquidation-events-abe54f1f23bd7bff8c37871200f7da7c59c45ac3' '6b4098c1acf153106ac5b67d2c5c7db5cd0295a16c782ad8c34ae75303306204' events
          check 37719091371 569d4aaeecb3d066389c054efed695be02e3ef40 'NQC RMC-016 Dual Operator Winner Receipt Parity' failure 11524199698 'rmc016-dual-winner-receipts-569d4aaeecb3d066389c054efed695be02e3ef40' '182b5e81b00ca04e53c9193c1496a725dc152ade9a17d3ab2dfaeb5045ac86b6' receipts
          check 37722878737 b02e7c5a4ff9a8c38898ab35e46777f9af35d192 'NQC RMC-016 Historical Aave Raw Liquidation Legs' success 11525823668 'rmc016-integer-liquidation-legs-b02e7c5a4ff9a8c38898ab35e46777f9af35d192' 'b5927f49a5099a9fe8971df82f1ea5fa2c4a169b11a846f2f3c2671b1efa71ee' legs
          echo RMC016_RANK1_PINNED_THREE_ARCHIVES_AUTHENTICATED

      - name: Independently verify raw competing winner, prior block state and borrower
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nqc016-rank1-source"
          target="$RUNNER_TEMP/nqc016-rank1-proof/rank1-prestate-witness.json"
          python3 ci/nqc-census/rmc016_rank1_prestate_probe.py \
            --event-zip "$root/events.zip" \
            --receipt-zip "$root/receipts.zip" \
            --legs-zip "$root/legs.zip" \
            --out "$target"
          jq -e '.status=="RMC016_RANK1_SOURCE_AUTHENTICATED_PREDECESSOR_STATE_WITNESS" and
            .winning_block_number==25938048 and
            .previous_block.number==25938047 and
            .debt_to_cover_raw_wei=="10684013854557827871" and
            .independent_operator_receipt_and_parent_hash_consensus==true and
            .source_selection_retrospective_from_future_winner_tx==true and
            .decision_time_prior_awareness_of_this_opportunity_proven==false and
            .borrower_liquidatable_at_previous_block_proven==false and
            .aave_atomic_liquidation_replayed==false and
            .flash_principal_and_gas_externally_authorized==false and
            .nexus_realized_net_profit_proven==false and
            .real_market_census_closed==false' "$target" >/dev/null
          (cd "$RUNNER_TEMP/nqc016-rank1-proof" && \
            sha256sum rank1-prestate-witness.json producer-source.sha256 > archive.sha256 && \
            sha256sum --check --strict archive.sha256)
          echo RMC016_REAL_HISTORICAL_RANK1_PREBLOCK_WITNESS_NO_EX_ANTE_SIGNAL

      - name: Preserve exact historical borrower fixture and SHA witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc016-rank1-real-prestate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nqc016-rank1-proof/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
