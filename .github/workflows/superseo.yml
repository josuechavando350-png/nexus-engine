name: SUPERSEO

on:
  pull_request:
    paths:
      - "superseo/**"
      - "seo-avengers-2500/**"
      - "gauss/core/**"
      - "apps/cano-penal/src/superseo/**"
      - ".github/workflows/superseo*.yml"
  push:
    branches: [main]
    paths:
      - "superseo/**"
      - "seo-avengers-2500/**"
      - "gauss/core/**"
      - "apps/cano-penal/src/superseo/**"
      - ".github/workflows/superseo*.yml"
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (id en superseo/clientes)"
        required: true
        default: "cano"
      max_paginas:
        description: "Máximo de páginas a rastrear"
        required: true
        default: "300"
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  pruebas:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Pruebas SUPERSEO (incluye los 1,500 módulos Avengers)
        run: node --test superseo/tests/*.test.mjs

  ciclo:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency: superseo-estado
    env:
      CLIENTE: ${{ inputs.cliente || 'cano' }}
      MAX_PAGINAS: ${{ inputs.max_paginas || '300' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validar cliente
        run: |
          case "$CLIENTE" in *[!a-z0-9-]*|"") echo "cliente inválido"; exit 2;; esac
          test -f "superseo/clientes/$CLIENTE.json"

      - name: Abrir estado del vigía y el oráculo (rama superseo-estado)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin superseo-estado >/dev/null; then
            git fetch --depth 1 origin superseo-estado:superseo-estado
            git worktree add estado superseo-estado
          else
            git worktree add --orphan -b superseo-estado estado
          fi

      - name: Ciclo SUPERSEO (rastreo, auditoría, grafo, Search Console, Avengers, demanda)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPIEDAD: ${{ vars.GSC_PROPIEDAD }}
        run: |
          set -euo pipefail
          node superseo/cli.mjs ciclo "$CLIENTE" --max "$MAX_PAGINAS" --salida "superseo-salida/$CLIENTE" > /dev/null
          cat "superseo-salida/$CLIENTE/reporte.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Vigía de competencia
        continue-on-error: true
        run: |
          set -euo pipefail
          { echo "## Vigía de competencia"; echo; echo '```'; node superseo/cli.mjs vigia "$CLIENTE" --estado "estado/$CLIENTE/vigia" --salida "superseo-salida/$CLIENTE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Oráculo de tendencias
        continue-on-error: true
        run: |
          set -euo pipefail
          { echo "## Oráculo de tendencias"; echo; echo '```'; node superseo/cli.mjs oraculo "$CLIENTE" --estado "estado/$CLIENTE/oraculo" --salida "superseo-salida/$CLIENTE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar estado
        run: |
          set -euo pipefail
          cd estado
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios de estado"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "SUPERSEO: estado de vigía y oráculo ($CLIENTE)"
          git push -q origin superseo-estado

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superseo-${{ env.CLIENTE }}
          path: superseo-salida/
          retention-days: 30
          if-no-files-found: ignore
