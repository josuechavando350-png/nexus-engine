name: TEMP Resumability Bootstrap

on:
  push:
    branches:
      - feat/capability-08-resumability

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-08-resumability
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Make resumability source browser-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/resumability/src/index.ts')
          text = path.read_text()
          text = text.replace('import { Buffer } from "node:buffer";\nimport { createHash } from "node:crypto";\n\n', '')
          text = text.replace('export interface SymbolDef extends SymbolDefInput {}', 'export type SymbolDef = SymbolDefInput;')
          marker = 'export const STATE_AUTHORITY = "NEXUS_RESUMABLE_STATE_V1" as const;\n'
          sha = r'''function utf8Bytes(value: string): Uint8Array {
  return new TextEncoder().encode(value);
}

function utf8ByteLength(value: string): number {
  return utf8Bytes(value).byteLength;
}

function rotateRight(value: number, count: number): number {
  return (value >>> count) | (value << (32 - count));
}

function sha256Hex(value: string): string {
  const constants = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ];
  const initial = [
    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
    0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
  ];
  const input = utf8Bytes(value);
  const bitLength = BigInt(input.byteLength) * 8n;
  const paddedLength = Math.ceil((input.byteLength + 9) / 64) * 64;
  const padded = new Uint8Array(paddedLength);
  padded.set(input);
  padded[input.byteLength] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(paddedLength - 8, Number((bitLength >> 32n) & 0xffffffffn), false);
  view.setUint32(paddedLength - 4, Number(bitLength & 0xffffffffn), false);
  const hash = [...initial];
  const words = new Uint32Array(64);
  for (let offset = 0; offset < paddedLength; offset += 64) {
    for (let index = 0; index < 16; index += 1) words[index] = view.getUint32(offset + index * 4, false);
    for (let index = 16; index < 64; index += 1) {
      const x = words[index - 15]!;
      const y = words[index - 2]!;
      const s0 = rotateRight(x, 7) ^ rotateRight(x, 18) ^ (x >>> 3);
      const s1 = rotateRight(y, 17) ^ rotateRight(y, 19) ^ (y >>> 10);
      words[index] = (words[index - 16]! + s0 + words[index - 7]! + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = hash as [number, number, number, number, number, number, number, number];
    for (let index = 0; index < 64; index += 1) {
      const s1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
      const choice = (e & f) ^ (~e & g);
      const temp1 = (h + s1 + choice + constants[index]! + words[index]!) >>> 0;
      const s0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
      const majority = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (s0 + majority) >>> 0;
      h = g;
      g = f;
      f = e;
      e = (d + temp1) >>> 0;
      d = c;
      c = b;
      b = a;
      a = (temp1 + temp2) >>> 0;
    }
    hash[0] = (hash[0]! + a) >>> 0;
    hash[1] = (hash[1]! + b) >>> 0;
    hash[2] = (hash[2]! + c) >>> 0;
    hash[3] = (hash[3]! + d) >>> 0;
    hash[4] = (hash[4]! + e) >>> 0;
    hash[5] = (hash[5]! + f) >>> 0;
    hash[6] = (hash[6]! + g) >>> 0;
    hash[7] = (hash[7]! + h) >>> 0;
  }
  return hash.map((word) => word.toString(16).padStart(8, "0")).join("");
}

'''
          if marker not in text:
              raise SystemExit('authority marker missing')
          text = text.replace(marker, sha + marker, 1)
          old_digest = 'return createHash("sha256").update(canonicalJson(value)).digest("hex");'
          if old_digest not in text:
              raise SystemExit('node digest implementation missing')
          text = text.replace(old_digest, 'return sha256Hex(canonicalJson(value));', 1)
          text = text.replace('Buffer.byteLength(canonicalJson(value), "utf8")', 'utf8ByteLength(canonicalJson(value))')
          text = text.replace('Buffer.byteLength(text, "utf8")', 'utf8ByteLength(text)')
          path.write_text(text)
          PY
          if grep -Eq 'from "node:(buffer|crypto)"' packages/resumability/src/index.ts; then
            echo 'Node-only runtime import remains in browser package' >&2
            exit 1
          fi

      - name: Add digest parity assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/resumability/src/index.test.ts')
          text = path.read_text()
          if 'from "node:crypto"' not in text:
              text = 'import { createHash } from "node:crypto";\n' + text
          text = text.replace('  createManifest,\n  createState,', '  createManifest,\n  createState,\n  digest,')
          needle = '    expect(createState({ b: 2, a: 1 }).digest).toBe(createState({ a: 1, b: 2 }).digest);'
          replacement = needle + '\n    expect(digest({ a: 1 })).toBe(createHash("sha256").update("{\\"a\\":1}").digest("hex"));'
          if needle not in text:
              raise SystemExit('determinism assertion missing')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY

      - name: Install and regenerate workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck capability
        run: pnpm --filter @nexus/resumability typecheck

      - name: Test capability
        run: pnpm --filter @nexus/resumability test

      - name: Build capability
        run: pnpm --filter @nexus/resumability build

      - name: Repository lint
        run: pnpm lint

      - name: Exercise source operational consumer
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createManifest, createState } from './packages/resumability/src/index.ts';
          const state = createState({ count: 1 });
          const manifest = createManifest('a'.repeat(64), [{ id: 's', module: '/assets/s.123.js', exportName: 'go' }], [{ id: 'b', event: 'click', symbolId: 's', stateIds: ['count'] }]);
          await writeFile('/tmp/resume.json', JSON.stringify({ state, manifest }));
          NODE
          node scripts/audit-resumability.mjs --spec /tmp/resume.json

      - name: Verify bounded working-tree changes
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)pnpm-lock.yaml' ':(exclude)packages/resumability/src/index.ts' ':(exclude)packages/resumability/src/index.test.ts'
          grep -Fq '  packages/resumability: {}' pnpm-lock.yaml

      - name: Commit audited source and lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/resumability/src/index.ts packages/resumability/src/index.test.ts pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'fix(resume): make runtime browser-safe and synchronize lockfile'
          git push origin HEAD:feat/capability-08-resumability
