name: NEXUS V10 Full Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  push:
    branches: [main, "v10-*"]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: V3→V10 full validation on exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Setup pinned Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh patched Wasmtime lock resolution
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          cargo update -p wasmtime --precise 36.0.13
          mkdir -p ../artifacts/security
          cp Cargo.lock ../artifacts/security/Cargo.lock.generated

      - name: Install pinned Rust supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Dependency and policy gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          pnpm audit --audit-level high 2>&1 | tee artifacts/security/pnpm-audit.txt
          (
            cd runtime
            cargo audit 2>&1 | tee ../artifacts/security/cargo-audit.txt
            cargo deny check 2>&1 | tee ../artifacts/security/cargo-deny.txt
          )

      - name: Generate SHA-bound CycloneDX SBOM
        run: pnpm sbom

      - name: Record supply-chain identity
        shell: bash
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo-audit=$(cargo audit --version)"
            echo "cargo-deny=$(cargo deny --version)"
          } | tee artifacts/security/toolchain.txt

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Security hygiene
        run: pnpm security-hygiene

      - name: Architecture gates V3→V10
        run: |
          pnpm v3-gates
          pnpm v4-gates
          pnpm v5-gates
          pnpm v6-gates
          pnpm v7-gates
          pnpm v8-gates
          pnpm v9-gates
          pnpm v10-gates

      - name: Rust tests
        run: pnpm rust:test

      - name: Rust lint
        run: pnpm rust:lint

      - name: Rust release build
        run: pnpm rust:build

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-supply-chain-${{ github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 90
