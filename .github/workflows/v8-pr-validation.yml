name: NEXUS V10 Full Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  push:
    branches: [main, "v10-*"]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: V3→V10 full validation on exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Setup pinned Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh patched Wasmtime lock resolution in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          lock_worktree="${RUNNER_TEMP}/nexus-lock-refresh"
          rm -rf "$lock_worktree"
          git worktree prune
          git worktree add --detach "$lock_worktree" HEAD
          (
            cd "$lock_worktree/runtime"
            cargo update -p wasmtime --precise 36.0.13
          )
          mkdir -p artifacts/security
          cp "$lock_worktree/runtime/Cargo.lock" artifacts/security/Cargo.lock.generated
          echo "NEXUS_LOCK_WORKTREE=$lock_worktree" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install pinned Rust supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Dependency and policy gates
        shell: bash
        run: |
          set -euo pipefail
          test -d "$NEXUS_LOCK_WORKTREE/runtime"
          mkdir -p artifacts/security
          pnpm audit --audit-level high 2>&1 | tee artifacts/security/pnpm-audit.txt
          (
            cd "$NEXUS_LOCK_WORKTREE/runtime"
            cargo audit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/security/cargo-audit.txt"
            cargo deny check 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/security/cargo-deny.txt"
          )
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Generate SHA-bound CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          test -d "$NEXUS_LOCK_WORKTREE/runtime"
          pnpm sbom
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Record supply-chain identity
        shell: bash
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo-audit=$(cargo audit --version)"
            echo "cargo-deny=$(cargo deny --version)"
          } | tee artifacts/security/toolchain.txt

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Security hygiene
        shell: bash
        run: |
          set -euo pipefail
          pnpm security-hygiene
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "Tracked mutation detected after Security hygiene:" >&2
            printf '%s\n' "$status" >&2
            git diff --name-status >&2 || true
            git diff >&2 || true
            exit 1
          fi

      - name: Architecture gates V3→V10
        shell: bash
        run: |
          set -euo pipefail
          assert_clean() {
            label="$1"
            status="$(git status --porcelain --untracked-files=no)"
            if [ -n "$status" ]; then
              mkdir -p artifacts/security
              printf '%s\n' "$status" | tee "artifacts/security/tracked-mutation-${label}.txt" >&2
              git diff --name-status | tee "artifacts/security/tracked-mutation-${label}-names.txt" >&2 || true
              git diff | tee "artifacts/security/tracked-mutation-${label}.patch" >&2 || true
              echo "Tracked mutation detected after ${label}" >&2
              exit 1
            fi
          }
          pnpm v3-gates
          assert_clean v3
          pnpm v4-gates
          assert_clean v4
          pnpm v5-gates
          assert_clean v5
          pnpm v6-gates
          assert_clean v6
          pnpm v7-gates
          assert_clean v7
          pnpm v8-gates
          assert_clean v8
          pnpm v9-gates
          assert_clean v9
          pnpm v10-gates
          assert_clean v10

      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$NEXUS_LOCK_WORKTREE/runtime"
          cargo test --workspace --locked

      - name: Rust lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$NEXUS_LOCK_WORKTREE/runtime"
          cargo clippy --all-targets --locked -- -D warnings

      - name: Rust release build
        shell: bash
        run: |
          set -euo pipefail
          cd "$NEXUS_LOCK_WORKTREE/runtime"
          cargo build --workspace --release --locked

      - name: Clean isolated Rust worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NEXUS_LOCK_WORKTREE:-}" ]; then
            git worktree remove --force "$NEXUS_LOCK_WORKTREE" >/dev/null 2>&1 || true
            git worktree prune
          fi
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "Tracked mutation detected before final diff hygiene:" >&2
            printf '%s\n' "$status" >&2
            git diff --name-status >&2 || true
            git diff >&2 || true
            exit 1
          fi

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-supply-chain-${{ github.sha }}
          path: artifacts/security
          if-no-files-found: error
          retention-days: 90
