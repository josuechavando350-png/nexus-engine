name: NEXUS Full Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  NEXUS_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Full validation on exact source SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Setup Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit
      - name: Security hygiene
        run: pnpm security-hygiene
      - name: Asset integrity
        run: pnpm verify:assets
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Hermetic deterministic build
        run: pnpm build
      - name: Real browser tests
        run: pnpm test:browser
      - name: V3 runtime boundary
        run: pnpm v3-gates
      - name: Rust tests
        run: pnpm rust:test
      - name: Rust lint
        run: pnpm rust:lint
      - name: Rust release build
        run: pnpm rust:build
      - name: H07 clean-room proof
        run: pnpm operability:h07
      - name: Third-party public-surface proof
        run: pnpm third-party-proof
      - name: Final hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi
