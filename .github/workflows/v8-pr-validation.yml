name: NEXUS V10 Full Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  push:
    branches: [main, "v10-*"]
    paths:
      - "runtime/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "NEXUS_V9_ARCHITECTURE_PLAN.md"
      - "NEXUS_V10_ARCHITECTURE_PLAN.md"
      - "NEXUS_VERSION_REGISTRY.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  NEXUS_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: V3→V10 full validation on exact source SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$NEXUS_VALIDATED_SHA" || {
            echo "Source SHA mismatch: expected $NEXUS_VALIDATED_SHA, checkout is $actual" >&2
            exit 1
          }
          printf 'validated_source_sha=%s\n' "$actual"
          test -z "$(git status --porcelain)"

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Setup pinned Rust 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          pnpm --filter @nexus/capture exec playwright install --with-deps chromium webkit

      - name: Verify committed Rust lockfile is authoritative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          cp runtime/Cargo.lock artifacts/security/Cargo.lock.committed
          (
            cd runtime
            cargo metadata --locked --format-version 1 >/dev/null
          )
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install pinned Rust supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Dependency and policy gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          pnpm audit --audit-level high 2>&1 | tee artifacts/security/pnpm-audit.txt
          (
            cd runtime
            cargo audit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/security/cargo-audit.txt"
            cargo deny check 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/security/cargo-deny.txt"
          )
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Generate source-SHA-bound CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          pnpm sbom
          test -f "artifacts/security/nexus-${NEXUS_VALIDATED_SHA}.cdx.json"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Record supply-chain identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "validated_sha=$NEXUS_VALIDATED_SHA"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "cargo-audit=$(cargo audit --version)"
            echo "cargo-deny=$(cargo deny --version)"
          } | tee artifacts/security/toolchain.txt
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Real browser tests
        run: pnpm test:browser

      - name: Build
        run: pnpm build

      - name: Security hygiene
        shell: bash
        run: |
          set -euo pipefail
          pnpm security-hygiene
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "Tracked mutation detected after Security hygiene:" >&2
            printf '%s\n' "$status" >&2
            git diff --name-status >&2 || true
            git diff >&2 || true
            exit 1
          fi

      - name: Architecture gates V3→V10
        shell: bash
        run: |
          set -euo pipefail
          assert_clean() {
            label="$1"
            status="$(git status --porcelain --untracked-files=no)"
            if [ -n "$status" ]; then
              mkdir -p artifacts/security
              printf '%s\n' "$status" | tee "artifacts/security/tracked-mutation-${label}.txt" >&2
              git diff --name-status | tee "artifacts/security/tracked-mutation-${label}-names.txt" >&2 || true
              git diff | tee "artifacts/security/tracked-mutation-${label}.patch" >&2 || true
              echo "Tracked mutation detected after ${label}" >&2
              exit 1
            fi
          }
          pnpm v3-gates
          assert_clean v3
          pnpm v4-gates
          assert_clean v4
          pnpm v5-gates
          assert_clean v5
          pnpm v6-gates
          assert_clean v6
          pnpm v7-gates
          assert_clean v7
          pnpm v8-gates
          assert_clean v8
          pnpm v9-gates
          assert_clean v9
          pnpm v10-gates
          assert_clean v10

      - name: Rust tests
        run: pnpm rust:test

      - name: Rust lint
        run: pnpm rust:lint

      - name: Rust release build
        run: pnpm rust:build

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEXUS_VALIDATED_SHA"
          status="$(git status --porcelain --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "Tracked mutation detected before final diff hygiene:" >&2
            printf '%s\n' "$status" >&2
            git diff --name-status >&2 || true
            git diff >&2 || true
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-supply-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/security
          if-no-files-found: warn
          retention-days: 90
