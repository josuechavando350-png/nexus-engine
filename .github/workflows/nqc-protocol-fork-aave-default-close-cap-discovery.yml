name: NQC T39 Aave Default Close Cap Discovery

on:
  pull_request:
    paths:
      - .github/workflows/nqc-protocol-fork-aave-default-close-cap-discovery.yml
      - ci/nqc-protocol-fork/discovery/aave_default_close_candidates.json
      - ci/nqc-protocol-fork/discovery/discover_aave_default_close_candidates.py
      - ci/nqc-protocol-fork/parity/generate_aave_default_close_candidate_probe.py
      - ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py
      - ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py
      - ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json
      - ci/nqc-protocol-fork/recovered-source/**
      - ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch
      - ci/nqc-protocol-fork/locks/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default-close-cap-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUST_TOOLCHAIN: "1.98.1"
      FOUNDRY_VERSION: "1.7.1"
      FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
      SOLC_VERSION: "0.8.24+commit.e11b9ed9"
      SOLC_SHA256: "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f"
      NQC_PROBE: /tmp/nqc-aave-default-close-cap
      NQC_PFT_DEFAULT_CLOSE_DISCOVERY_OUT: /tmp/nqc-aave-default-close-cap/discovery

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable inputs and prepare isolated recovered source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          rm -rf "$NQC_PROBE"
          mkdir -p "$NQC_PROBE/discovery" "$NQC_PROBE/foundry/src" "$NQC_PROBE/foundry/test" "$NQC_PROBE/source" "$NQC_PROBE/evidence"
          git rev-parse HEAD > "$NQC_PROBE/evidence/repository-source-sha.txt"
          (cd ci/nqc-protocol-fork/recovered-source && sha256sum -c SOURCE_FILES.sha256)
          cp -a ci/nqc-protocol-fork/recovered-source/. "$NQC_PROBE/source/"
          patch --dry-run --silent -p1 -d "$NQC_PROBE/source" < ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch
          patch --silent -p1 -d "$NQC_PROBE/source" < ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch
          python3 ci/nqc-protocol-fork/parity/prepare_reserve_parity.py "$NQC_PROBE/source"
          grep -F 'percent_mul_ceil_unbounded' "$NQC_PROBE/source/crates/nqc-aave-opportunity/src/lib.rs"

          cat > "$NQC_PROBE/foundry/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          fs_permissions = [{ access = "read-write", path = "../evidence" }]
          EOF

          sha256sum ci/nqc-protocol-fork/discovery/aave_default_close_candidates.json ci/nqc-protocol-fork/discovery/discover_aave_default_close_candidates.py ci/nqc-protocol-fork/parity/generate_aave_default_close_candidate_probe.py ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py ci/nqc-protocol-fork/parity/prepare_reserve_parity.py ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.patch ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.json > "$NQC_PROBE/evidence/input-source.sha256"

      - name: Discover candidate anchors and LiquidationCall consensus
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-protocol-fork/discovery/discover_aave_default_close_candidates.py | tee "$NQC_PROBE/evidence/discovery-stdout.json"
          test "$(find "$NQC_PROBE/discovery/candidates" -maxdepth 1 -name '*.json' | wc -l)" -ge 1
          cp -a "$NQC_PROBE/discovery" "$NQC_PROBE/evidence/discovery"

      - name: Install pinned Foundry solc and Rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NQC_PROBE/bin"
          curl --fail --location --retry 5 --retry-all-errors -o "$NQC_PROBE/foundry.tar.gz" "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "$FOUNDRY_SHA256  $NQC_PROBE/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$NQC_PROBE/foundry.tar.gz" -C "$NQC_PROBE/bin"
          export PATH="$NQC_PROBE/bin:$PATH"
          forge --version | tee "$NQC_PROBE/evidence/forge.txt"
          forge --version | grep -F "$FOUNDRY_VERSION"

          curl --fail --location --retry 5 --retry-all-errors -o "$NQC_PROBE/solc-0.8.24" "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9"
          echo "$SOLC_SHA256  $NQC_PROBE/solc-0.8.24" | sha256sum -c -
          chmod +x "$NQC_PROBE/solc-0.8.24"
          "$NQC_PROBE/solc-0.8.24" --version | tee "$NQC_PROBE/evidence/solc.txt"
          "$NQC_PROBE/solc-0.8.24" --version | grep -F "$SOLC_VERSION"

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv | tee "$NQC_PROBE/evidence/rustc.txt"
          cargo fetch --locked --manifest-path "$NQC_PROBE/source/Cargo.toml"

      - name: Prove at least one real default-close cap boundary
        shell: bash
        working-directory: /tmp/nqc-aave-default-close-cap/foundry
        run: |
          set -euo pipefail
          export PATH="$NQC_PROBE/bin:$PATH"
          export CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0
          : > "$NQC_PROBE/evidence/default-close-candidate-results.log"
          match_count=0
          candidate_count=0

          for fixture in "$NQC_PROBE"/discovery/candidates/*.json; do
            candidate_count=$((candidate_count + 1))
            case_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["case_id"])' "$fixture")"
            safe_id="${case_id//[^A-Za-z0-9_.-]/_}"
            root="$NQC_PROBE/evidence/$safe_id"
            mkdir -p "$root/blastapi-public" "$root/mevblocker-rpc" "$root/canonical"

            python3 "$GITHUB_WORKSPACE/ci/nqc-protocol-fork/parity/generate_aave_liquidation_matrix_witness.py" --multi "$GITHUB_WORKSPACE/ci/nqc-protocol-fork/corpus/cases/aave-liquidation-multiasset-2026-06-c953.json" --single "$fixture" --output "$NQC_PROBE/foundry/test/PftAaveLiquidationMatrixWitness.t.sol"

            witness_ok=1
            for entry in 'blastapi-public|https://eth-mainnet.public.blastapi.io|19101|0.35' 'mevblocker-rpc|https://rpc.mevblocker.io|19102|1.25'; do
              IFS='|' read -r provider_id provider_url port min_interval <<< "$entry"
              NQC_PFT_PROXY_PORT="$port" NQC_PFT_UPSTREAM_URL="$provider_url" NQC_PFT_UPSTREAM_ID="$provider_id" NQC_PFT_MIN_INTERVAL_SECONDS="$min_interval" NQC_PFT_MAX_ATTEMPTS=12 NQC_PFT_UPSTREAM_TIMEOUT_SECONDS=60 NQC_PFT_PROXY_LOG="$root/$provider_id-throttle.jsonl" python3 "$GITHUB_WORKSPACE/ci/nqc-protocol-fork/parity/http_rpc_throttle_proxy.py" > "$root/$provider_id-throttle.log" 2>&1 &
              proxy_pid=$!
              trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT

              ready=0
              for _ in $(seq 1 150); do
                if curl --silent --fail "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 0.1
              done
              test "$ready" -eq 1

              set +e
              PFT_RPC_URL="http://127.0.0.1:$port" PFT_WITNESS_DIR="$root/$provider_id" forge test --use "$NQC_PROBE/solc-0.8.24" --match-contract PftAaveLiquidationMatrixWitnessTest --match-test testFork_CaptureSingleLiquidationMatrix -vvvv 2>&1 | tee "$root/$provider_id-foundry.log"
              forge_rc=${PIPESTATUS[0]}
              set -e

              kill "$proxy_pid" 2>/dev/null || true
              wait "$proxy_pid" 2>/dev/null || true
              trap - EXIT

              if [ "$forge_rc" -ne 0 ] || [ ! -s "$root/$provider_id/14.json" ]; then
                printf '%s\n' "AAVE_DEFAULT_CLOSE_CANDIDATE_PROVIDER_REJECT case_id=$case_id provider=$provider_id forge_rc=$forge_rc" | tee -a "$NQC_PROBE/evidence/default-close-candidate-results.log"
                witness_ok=0
                break
              fi
              python3 -m json.tool "$root/$provider_id/14.json" >/dev/null
            done

            if [ "$witness_ok" -ne 1 ]; then
              printf '%s\n' 'PROVIDER_REJECT' > "$root/default-close-cap-status.txt"
              continue
            fi

            python3 -c 'import json,sys; from pathlib import Path; root=Path(sys.argv[1]); left=json.loads((root/"blastapi-public"/"14.json").read_text()); right=json.loads((root/"mevblocker-rpc"/"14.json").read_text()); keys=sorted(k for k in set(left)|set(right) if left.get(k)!=right.get(k)); (not keys) or (_ for _ in ()).throw(SystemExit(f"PROVIDER_DISSENT keys={keys}")); (root/"canonical"/"14.json").write_text(json.dumps(left,indent=2,sort_keys=True)+"\n"); print("AAVE_DEFAULT_CLOSE_CANDIDATE_TWO_PROVIDER_WITNESS_PASS")' "$root"

            python3 "$GITHUB_WORKSPACE/ci/nqc-protocol-fork/parity/generate_aave_default_close_candidate_probe.py" --witness "$root/canonical/14.json" --fixture "$fixture" --output "$NQC_PROBE/source/crates/nqc-aave-math/examples/pft_default_close_candidate.rs"

            cargo run --locked --offline --manifest-path "$NQC_PROBE/source/Cargo.toml" -p nqc-aave-math --example pft_default_close_candidate 2>&1 | tee "$root/default-close-probe.log"
            cat "$root/default-close-probe.log" >> "$NQC_PROBE/evidence/default-close-candidate-results.log"

            if grep -q '^AAVE_DEFAULT_CLOSE_CAP_MATCH ' "$root/default-close-probe.log"; then
              match_count=$((match_count + 1))
              cp "$fixture" "$root/candidate-fixture.json"
              printf '%s\n' 'MATCH' > "$root/default-close-cap-status.txt"
            else
              grep -q '^AAVE_DEFAULT_CLOSE_CAP_NO_MATCH ' "$root/default-close-probe.log"
              printf '%s\n' 'NO_MATCH' > "$root/default-close-cap-status.txt"
            fi
          done

          test "$candidate_count" -ge 1
          test "$match_count" -ge 1
          grep '^AAVE_DEFAULT_CLOSE_CAP_MATCH ' "$NQC_PROBE/evidence/default-close-candidate-results.log" | tee "$NQC_PROBE/evidence/default-close-cap-matches.txt"
          printf '%s\n' "$match_count" > "$NQC_PROBE/evidence/default-close-cap-match-count.txt"
          printf '%s\n' 'NOT_CLOSED' > "$NQC_PROBE/evidence/protocol-fork-truth.txt"
          (
            cd "$NQC_PROBE/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve default-close discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-t39-aave-default-close-cap-discovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-aave-default-close-cap/evidence
          if-no-files-found: error
          retention-days: 30
