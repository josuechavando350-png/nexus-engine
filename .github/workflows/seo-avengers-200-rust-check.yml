name: SEO Avengers 200 Validation

on:
  push:
    branches:
      - feat/seo-avengers-200
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seo-avengers-200/apps/edge-cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cargo check wasm32
        run: cargo check --target wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install --locked worker-build
      - name: Build Worker
        run: worker-build --release

  semantic-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seo-avengers-200/packages/Semantic-Python-NLP
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install semantic runtime and test tools
        run: python -m pip install . pytest pytest-asyncio ruff
      - name: Ruff production integration surface
        run: >-
          ruff check
          render_neon_entry.py
          neon_store.py
          local_semantic_provider.py
          site_bootstrap.py
          tests/test_site_bootstrap.py
      - name: Pytest
        run: pytest -q
