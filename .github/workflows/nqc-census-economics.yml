name: NQC RMC-013 Execution Economics

on:
  pull_request:
    paths:
      - "nqc-census/crates/nqc-census-economics/**"
      - "nqc-census/crates/nqc-census-portfolio/**"
      - "nqc-census/crates/nqc-census-capital/**"
      - "nqc-census/Cargo.toml"
      - "nqc-census/Cargo.lock"
      - "ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md"
      - ".github/workflows/nqc-census-economics.yml"
  push:
    branches:
      - "nqc/rmc-013-execution-economics-capture-20260930"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"
  D13_TESTS_EXPECTED: "12"

jobs:
  rmc-013-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify stacked authority
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RMC-013 — Execution Economics and Capture Truth Contract' ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md
          grep -F 'full 512-bit intermediate' ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md
          grep -F 'PriorOnly' ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md
          grep -F 'ShadowCalibrated' ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md
          grep -F 'predictive economics, not realized P&L' ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md

      - name: Verify no execution or network authority
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'eth_sendRawTransaction|send_raw_transaction|private.?key|mnemonic|sign_transaction|broadcast_transaction|reqwest|hyper|tokio|ureq|std::net|TcpStream|UdpSocket'             nqc-census/crates/nqc-census-economics ci/nqc-census/EXECUTION_ECONOMICS_CONTRACT.md; then
            echo "RMC013_BOUNDARY_FAIL economics layer contains transaction/network authority"
            exit 1
          fi
          echo RMC013_BOUNDARY_PASS

      - name: Exact Rust gates
        working-directory: nqc-census
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc -V | grep -F "rustc $RUST_TOOLCHAIN "
          cargo fmt --all -- --check
          cargo clippy --locked -p nqc-census-economics --all-targets -- -D warnings
          count=$(cargo test --locked -p nqc-census-economics --test economics -- --list 2>/dev/null | grep -c ': test$')
          echo "economics_tests=$count expected=$D13_TESTS_EXPECTED"
          test "$count" = "$D13_TESTS_EXPECTED"
          cargo test --locked -p nqc-census-economics -- --nocapture
          cargo test --locked -p nqc-census-portfolio
          cargo test --locked -p nqc-census-capital
          cargo test --locked --workspace
          cargo build --release --locked -p nqc-census-economics
          echo RMC013_ECONOMICS_FOUNDATION_PASS
