name: GAUSS Nemesis source import (one archive)
on:
  push:
    branches:
      - feat/gauss-nemesis-rust-integration
    paths:
      - 'gauss/nemesis/import/GAUSS_NEMESIS_v19_fuente_para_subir_GitHub_NO_CERTIFICADO.zip'
      - '.github/workflows/gauss-nemesis-source-import.yml'
  pull_request:
    paths:
      - 'gauss/nemesis/import/GAUSS_NEMESIS_v19_fuente_para_subir_GitHub_NO_CERTIFICADO.zip'
      - '.github/workflows/gauss-nemesis-source-import.yml'
concurrency:
  group: gauss-nemesis-original-source-import-449
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  import-exact-release:
    if: >-
      github.repository == 'josuechavando350-png/nexus-engine' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Use required Node.js 22.16.0 for original Némesis (node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify pinned ZIP and existing reviewed source; import only when source is absent
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$BRANCH" = 'feat/gauss-nemesis-rust-integration'
          printf '%s  %s\n' 'dfb28dd86060dc31edae1b930a208adabb1c66606e26da88a49790fdbf5884c6' 'gauss/nemesis/import/GAUSS_NEMESIS_v19_fuente_para_subir_GitHub_NO_CERTIFICADO.zip' | sha256sum -c -
          if test -f gauss/nemesis/engine/src/index.mjs; then
            echo 'NEMESIS_ORIGINAL_ALREADY_IMPORTED; verify reviewed lock instead of overwriting files'
          else
            python3 gauss/nemesis/scripts/import-source.py
          fi
          node gauss/nemesis/scripts/verify-source-lock.mjs
          test "$(find gauss/nemesis/engine/ -type f | wc -l)" -eq 297
      - name: Commit original sources only if absent, without claiming certification
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$BRANCH" = 'feat/gauss-nemesis-rust-integration'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- gauss/nemesis/engine/
          if git diff --cached --quiet; then
            echo 'NEMESIS_SOURCE_ALREADY_IMPORTED'
          else
            test "$(git diff --cached --name-only -- gauss/nemesis/engine/ | wc -l)" -eq 297
            test "$(git diff --cached --name-only | wc -l)" -eq 297
            git commit -m 'GAUSS: import 297 SHA-verified original Némesis source files (not certified)'
            git push origin "HEAD:${BRANCH}"
          fi
      - name: Test reviewed source; any failure leaves PR red
        shell: bash
        run: |
          node --test --test-concurrency=4 gauss/nemesis/engine/test/*.test.mjs
          node gauss/nemesis/engine/scripts/smoke-100.mjs
          node --test gauss/nemesis/tests/*.test.mjs
