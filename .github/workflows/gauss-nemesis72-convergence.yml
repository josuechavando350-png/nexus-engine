name: GAUSS Nemesis 72 periodic diffusion convergence
on:
  pull_request:
    paths:
      - 'gauss/nemesis/fokker-planck-72-validation.mjs'
      - 'gauss/nemesis/bridge.mjs'
      - 'gauss/nemesis/tests/fokker-planck-72-validation.test.mjs'
      - '.github/workflows/gauss-nemesis72-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify source integrity and syntax
        run: |
          node gauss/nemesis/scripts/verify-source-lock.mjs
          node --check gauss/nemesis/fokker-planck-72-validation.mjs
          node --check gauss/nemesis/bridge.mjs
      - name: Check periodic diffusion convergence, mass, positivity, original #72 and GAUSS dispatch
        run: node --test gauss/nemesis/tests/fokker-planck-72-validation.test.mjs
