name: Topology audit hardening

on:
  push:
    branches:
      - feat/topology-engine
    paths:
      - '.github/workflows/topology-audit-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Apply audited hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # complex.ts — runtime boundary validation.
          path = 'packages/topology/src/complex.ts'
          replace_once(path,
              'import { digestValue, leafPrimitives, primitiveCenter, validateBounds } from "@nexus/visual-algebra";',
              'import { digestValue, leafPrimitives, primitiveCenter, validateBounds, validatePrimitive } from "@nexus/visual-algebra";')
          replace_once(path,
              'function assertUnit(value: number, label: string): void {\n  if (!Number.isFinite(value) || value < 0 || value > 1) throw new Error(`${label} must be a finite value in [0,1]`);\n}',
              'function assertUnit(value: number, label: string): void {\n  if (!Number.isFinite(value) || value < 0 || value > 1) throw new Error(`${label} must be a finite value in [0,1]`);\n}\nfunction assertSha256(value: string, label: string): void {\n  if (!/^[a-f0-9]{64}$/.test(value)) throw new Error(`${label} must be SHA-256 hex`);\n}')
          replace_once(path,
              '  const maxHomologyDimension = input.maxHomologyDimension ?? 1;\n  const maxSimplexDimension = (maxHomologyDimension + 1) as 1 | 2;\n  const leaves = leafPrimitives(input.primitives);',
              '  const maxHomologyDimension = input.maxHomologyDimension ?? 1;\n  if (maxHomologyDimension !== 0 && maxHomologyDimension !== 1) throw new Error("Only H0 and H1 persistent homology are supported");\n  if (input.sourceTermDigest !== undefined) assertSha256(input.sourceTermDigest, "sourceTermDigest");\n  for (const primitive of input.primitives) validatePrimitive(primitive);\n  const maxSimplexDimension = (maxHomologyDimension + 1) as 1 | 2;\n  const leaves = leafPrimitives(input.primitives);')
          replace_once(path,
              '    ...(input.sourceTermDigest ? { sourceTermDigest: input.sourceTermDigest } : {}),',
              '    ...(input.sourceTermDigest !== undefined ? { sourceTermDigest: input.sourceTermDigest } : {}),')

          # homology.ts — export and strengthen structural validation.
          path = 'packages/topology/src/homology.ts'
          replace_once(path,
              'import { digestValue } from "@nexus/visual-algebra";',
              'import { digestValue, validateBounds } from "@nexus/visual-algebra";')
          replace_once(path,
              'function validateComplex(complex: FiltrationComplex): void {\n  const { digest, ...digestPayload } = complex;',
              'export function validateFiltrationComplex(complex: FiltrationComplex): void {\n  if (complex.authority !== "NEXUS_FILTERED_FLAG_COMPLEX_V1") throw new Error("Unsupported filtration complex authority");\n  validateBounds(complex.canvasBounds, "complex.canvasBounds");\n  if (complex.canvasBounds.width <= 0 || complex.canvasBounds.height <= 0) throw new Error("Complex canvas must have positive width and height");\n  if (complex.maxHomologyDimension !== 0 && complex.maxHomologyDimension !== 1) throw new Error("Complex maxHomologyDimension must be 0 or 1");\n  if (complex.maxSimplexDimension !== complex.maxHomologyDimension + 1) throw new Error("Complex simplex/homology dimensions are inconsistent");\n  if (complex.sourceTermDigest !== undefined && !/^[a-f0-9]{64}$/.test(complex.sourceTermDigest)) throw new Error("Complex sourceTermDigest must be SHA-256 hex");\n  const vertexIds = new Set<string>();\n  for (const vertex of complex.vertices) {\n    if (!vertex.id.trim() || !vertex.sourcePrimitiveId.trim()) throw new Error("Complex vertex ids cannot be empty");\n    if (vertexIds.has(vertex.id)) throw new Error(`Duplicate complex vertex id: ${vertex.id}`);\n    if (!Number.isFinite(vertex.point.x) || !Number.isFinite(vertex.point.y)) throw new Error(`Complex vertex ${vertex.id} has non-finite coordinates`);\n    vertexIds.add(vertex.id);\n  }\n  const { digest, ...digestPayload } = complex;')
          replace_once(path,
              '    if (simplex.vertices.length !== simplex.dimension + 1) throw new Error(`Simplex ${simplex.id} has invalid dimension`);',
              '    if (simplex.vertices.length !== simplex.dimension + 1 || simplex.dimension > complex.maxSimplexDimension) throw new Error(`Simplex ${simplex.id} has invalid dimension`);\n    if (new Set(simplex.vertices).size !== simplex.vertices.length) throw new Error(`Simplex ${simplex.id} repeats a vertex`);\n    if (simplex.vertices.some((vertexId) => !vertexIds.has(vertexId))) throw new Error(`Simplex ${simplex.id} references an unknown vertex`);')
          replace_once(path,
              '  for (const simplex of complex.simplices) {\n    for (const faceId of boundaryIds(simplex)) {',
              '  for (const vertexId of vertexIds) if (!simplexById.has(simplexId([vertexId]))) throw new Error(`Complex is missing vertex simplex ${vertexId}`);\n  for (const simplex of complex.simplices) {\n    for (const faceId of boundaryIds(simplex)) {')
          replace_once(path,
              '  if (diagram.authority !== "NEXUS_PERSISTENCE_DIAGRAM_V1") throw new Error("Unsupported persistence diagram authority");',
              '  if (diagram.authority !== "NEXUS_PERSISTENCE_DIAGRAM_V1") throw new Error("Unsupported persistence diagram authority");\n  if (diagram.maxDimension !== 0 && diagram.maxDimension !== 1) throw new Error("Persistence diagram maxDimension must be 0 or 1");\n  if (!/^[a-f0-9]{64}$/.test(diagram.sourceComplexDigest)) throw new Error("Persistence diagram sourceComplexDigest must be SHA-256 hex");')
          replace_once(path, '  validateComplex(complex);', '  validateFiltrationComplex(complex);')

          # distance.ts — protect JS/runtime callers too.
          path = 'packages/topology/src/distance.ts'
          replace_once(path,
              'export function bottleneckDistance(left: PersistenceDiagram, right: PersistenceDiagram, dimension?: 0 | 1): BottleneckDistanceResult {\n  validatePersistenceDiagram(left); validatePersistenceDiagram(right);',
              'export function bottleneckDistance(left: PersistenceDiagram, right: PersistenceDiagram, dimension?: 0 | 1): BottleneckDistanceResult {\n  if (dimension !== undefined && dimension !== 0 && dimension !== 1) throw new Error("Bottleneck dimension must be 0 or 1");\n  validatePersistenceDiagram(left); validatePersistenceDiagram(right);')

          # synthesis.ts — validate runtime kinds/dimensions and full provenance linkage.
          path = 'packages/topology/src/synthesis.ts'
          replace_once(path,
              'import { computePersistentHomology } from "./homology.js";',
              'import { computePersistentHomology, validateFiltrationComplex, validatePersistenceDiagram } from "./homology.js";')
          replace_once(path,
              'function validateConstraint(constraint: TopologyConstraint): void {',
              'const CONSTRAINT_KINDS = new Set<string>([\n  "min_bottleneck_distance", "max_bottleneck_distance",\n  "min_total_persistence", "max_total_persistence",\n  "min_cycle_count", "max_cycle_count",\n  "min_component_count", "max_component_count",\n]);\n\nfunction validateConstraint(constraint: TopologyConstraint): void {')
          replace_once(path,
              '  if (!Number.isFinite(constraint.value)) throw new Error(`Topology constraint ${constraint.id} requires a finite value`);\n  if (constraint.severity !== "required" && constraint.severity !== "recommended") throw new Error(`Invalid severity for ${constraint.id}`);',
              '  if (!Number.isFinite(constraint.value)) throw new Error(`Topology constraint ${constraint.id} requires a finite value`);\n  if (!CONSTRAINT_KINDS.has(constraint.kind)) throw new Error(`Unsupported topology constraint kind: ${constraint.kind}`);\n  if (constraint.severity !== "required" && constraint.severity !== "recommended") throw new Error(`Invalid severity for ${constraint.id}`);')
          replace_once(path,
              '  const bottleneck = constraint.kind.includes("bottleneck_distance");\n  if (!bottleneck && constraint.dimension !== undefined) throw new Error(`Constraint ${constraint.id} cannot specify dimension`);',
              '  const bottleneck = constraint.kind.includes("bottleneck_distance");\n  if (constraint.dimension !== undefined && constraint.dimension !== 0 && constraint.dimension !== 1) throw new Error(`Constraint ${constraint.id} dimension must be 0 or 1`);\n  if (!bottleneck && constraint.dimension !== undefined) throw new Error(`Constraint ${constraint.id} cannot specify dimension`);')
          # Preserve explicitly supplied source digests so the lower layer can reject malformed values.
          text = Path(path).read_text().replace('...(input.sourceTermDigest ? { sourceTermDigest: input.sourceTermDigest } : {})', '...(input.sourceTermDigest !== undefined ? { sourceTermDigest: input.sourceTermDigest } : {})')
          Path(path).write_text(text)
          replace_once(path,
              '  return Object.freeze({ status, complex, diagram, fingerprint, ...(nearest ? { nearestReferenceId: nearest.id, nearestBottleneckDistance: nearest.distance } : {}), evaluations, certificate });\n}\nexport function synthesizeTermCertified',
              '  const result = Object.freeze({ status, complex, diagram, fingerprint, ...(nearest ? { nearestReferenceId: nearest.id, nearestBottleneckDistance: nearest.distance } : {}), evaluations, certificate });\n  validateCertifiedSynthesisResult(result);\n  return result;\n}\n\nexport function validateCertifiedSynthesisResult(result: CertifiedSynthesisResult): void {\n  if (result.status !== "CERTIFIED" && result.status !== "REJECTED" && result.status !== "NOT_TESTED") throw new Error("Invalid certified synthesis status");\n  validateFiltrationComplex(result.complex);\n  validatePersistenceDiagram(result.diagram);\n  if (result.diagram.sourceComplexDigest !== result.complex.digest) throw new Error("Diagram is not bound to the supplied complex");\n\n  const { digest: fingerprintDigest, ...fingerprintPayload } = result.fingerprint;\n  if (digestValue(fingerprintPayload) !== fingerprintDigest) throw new Error("Topological fingerprint digest mismatch");\n  const expectedFingerprint = createTopologicalFingerprint(result.diagram);\n  if (expectedFingerprint.digest !== fingerprintDigest || result.fingerprint.sourceComplexDigest !== result.complex.digest || result.fingerprint.sourceDiagramDigest !== result.diagram.digest) {\n    throw new Error("Topological fingerprint is not bound to the supplied diagram/complex");\n  }\n\n  const certificate = result.certificate;\n  if (certificate.authority !== "NEXUS_TOPOLOGY_CERTIFICATE_V1" || certificate.version !== 1) throw new Error("Unsupported topology certificate authority/version");\n  if (!certificate.planId.trim() || !certificate.subject.trim()) throw new Error("Topology certificate planId/subject cannot be empty");\n  if (certificate.status !== result.status) throw new Error("Topology certificate status mismatch");\n  if (certificate.complexDigest !== result.complex.digest || certificate.diagramDigest !== result.diagram.digest || certificate.fingerprintDigest !== result.fingerprint.digest) {\n    throw new Error("Topology certificate digest linkage mismatch");\n  }\n  if ((certificate.sourceTermDigest ?? null) !== (result.complex.sourceTermDigest ?? null)) throw new Error("Topology certificate source term linkage mismatch");\n  if (digestValue(certificate.evaluations) !== digestValue(result.evaluations)) throw new Error("Topology certificate evaluations mismatch");\n  const { certificateDigest, ...certificatePayload } = certificate;\n  if (digestValue(certificatePayload) !== certificateDigest) throw new Error("Topology certificate digest mismatch");\n}\n\nexport function synthesizeTermCertified')

          # index.ts — expose validators as intentional public API.
          path = 'packages/topology/src/index.ts'
          replace_once(path,
              'export { computePersistentHomology, validatePersistenceDiagram } from "./homology.js";',
              'export { computePersistentHomology, validateFiltrationComplex, validatePersistenceDiagram } from "./homology.js";')
          replace_once(path,
              'export { synthesizeCertified, synthesizeTermCertified } from "./synthesis.js";',
              'export { synthesizeCertified, synthesizeTermCertified, validateCertifiedSynthesisResult } from "./synthesis.js";')

          # Measurement refuses detached/tampered result objects.
          path = 'packages/measurement/topology.ts'
          replace_once(path,
              'import type { CertifiedSynthesisResult } from "@nexus/topology";',
              'import { validateCertifiedSynthesisResult } from "@nexus/topology";\nimport type { CertifiedSynthesisResult } from "@nexus/topology";')
          replace_once(path,
              'export function projectTopologyMeasurement(result: CertifiedSynthesisResult): TopologyMeasurementProjection {\n  assertSha256(result.complex.digest, "complex digest");',
              'export function projectTopologyMeasurement(result: CertifiedSynthesisResult): TopologyMeasurementProjection {\n  validateCertifiedSynthesisResult(result);\n  assertSha256(result.complex.digest, "complex digest");')

          # Tests for runtime boundaries and provenance tampering.
          path = 'packages/topology/src/__tests__/topology.test.ts'
          replace_once(path,
              '  validatePersistenceDiagram,\n} from "../index.js";',
              '  validatePersistenceDiagram,\n  validateCertifiedSynthesisResult,\n} from "../index.js";')
          replace_once(path,
              '  test("retains Visual Algebra provenance", () => {',
              '  test("rejects unsupported runtime homology dimensions", () => {\n    expect(() => buildFiltrationComplex({ primitives: [point("a", 0, 0)], canvasBounds: canvas, maxHomologyDimension: 2 as never })).toThrow(/H0 and H1/);\n  });\n\n  test("retains Visual Algebra provenance", () => {')
          replace_once(path,
              '  test("requires integer count constraints", () => {',
              '  test("rejects unsupported runtime bottleneck dimensions", () => {\n    const diagram = computePersistentHomology(buildVietorisRipsComplex({ primitives: [point("a", 0, 0)], canvasBounds: canvas }));\n    expect(() => bottleneckDistance(diagram, diagram, 2 as never)).toThrow(/dimension must be 0 or 1/);\n    expect(() => synthesizeCertified({ planId: "bad-dimension", subject: "candidate", primitives: [point("a", 0, 0)], canvasBounds: canvas, referenceDiagrams: [{ id: "ref", diagram }],\n      constraints: [{ id: "distance", kind: "min_bottleneck_distance", value: 0, severity: "required", dimension: 2 as never }] })).toThrow(/dimension must be 0 or 1/);\n  });\n\n  test("validates full certificate linkage and rejects detached evidence", () => {\n    const result = synthesizeCertified({ planId: "linked", subject: "candidate", primitives: [point("a", 0, 0), point("b", 20, 0)], canvasBounds: canvas });\n    expect(() => validateCertifiedSynthesisResult(result)).not.toThrow();\n    const tampered = Object.freeze({ ...result, certificate: Object.freeze({ ...result.certificate, complexDigest: "0".repeat(64) }) });\n    expect(() => validateCertifiedSynthesisResult(tampered)).toThrow(/digest linkage mismatch/);\n  });\n\n  test("requires integer count constraints", () => {')

          path = 'packages/measurement/topology.test.ts'
          replace_once(path,
              '    expect(projection.samples.every((sample) => Number.isFinite(sample.value))).toBe(true);\n  });',
              '    expect(projection.samples.every((sample) => Number.isFinite(sample.value))).toBe(true);\n\n    const tampered = Object.freeze({ ...result, certificate: Object.freeze({ ...result.certificate, diagramDigest: "0".repeat(64) }) });\n    expect(() => projectTopologyMeasurement(tampered)).toThrow(/digest linkage mismatch/);\n  });')
          PY
      - name: Validate audit patch
        run: |
          pnpm --filter @nexus/topology typecheck
          pnpm --filter @nexus/topology test
          pnpm --filter @nexus/topology build
          pnpm --filter @nexus/measurement typecheck
          pnpm --filter @nexus/measurement build
          git diff --check
      - name: Commit audited hardening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/topology packages/measurement/topology.ts packages/measurement/topology.test.ts
          git rm .github/workflows/topology-audit-hardening.yml
          git commit -m "fix(topology): harden runtime and certificate invariants"
          git push
