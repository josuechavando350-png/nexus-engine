name: NQC RMC-013 Real Execution Evidence

on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc013-execution-inputs.json"
      - "ci/nqc-census/plan_rmc013_v2_routes.py"
      - "ci/nqc-census/test_plan_rmc013_v2_routes.py"
      - "ci/nqc-census/run_rmc013_anvil_candidate.py"
      - "ci/nqc-census/test_run_rmc013_anvil_candidate.py"
      - "ci/nqc-census/run_rmc013_anvil_batch.py"
      - "ci/nqc-census/test_run_rmc013_anvil_batch.py"
      - "ci/nqc-census/reconcile_rmc013_provider_evidence.py"
      - "ci/nqc-census/test_reconcile_rmc013_provider_evidence.py"
      - "ci/nqc-census/collect_rmc013_gas_evidence.py"
      - "ci/nqc-census/reconcile_rmc013_gas_evidence.py"
      - "ci/nqc-census/test_rmc013_gas_evidence.py"
      - "ci/nqc-census/materialize_rmc013_execution_economics.py"
      - "ci/nqc-census/test_materialize_rmc013_execution_economics.py"
      - "ci/nqc-census/materialize_effective_source.py"
      - "ci/nqc-census/effective-source-profile.json"
      - ".github/workflows/nqc-census-execution-evidence.yml"
  push:
    branches:
      - "nqc/rmc-013-clean-restack-d12-20260930"
      - "nqc/rmc-013-materialization-hardening-20261007"
    paths:
      - "ci/nqc-census/rmc013-execution-inputs.json"
      - "ci/nqc-census/plan_rmc013_v2_routes.py"
      - "ci/nqc-census/test_plan_rmc013_v2_routes.py"
      - "ci/nqc-census/run_rmc013_anvil_candidate.py"
      - "ci/nqc-census/test_run_rmc013_anvil_candidate.py"
      - "ci/nqc-census/run_rmc013_anvil_batch.py"
      - "ci/nqc-census/test_run_rmc013_anvil_batch.py"
      - "ci/nqc-census/reconcile_rmc013_provider_evidence.py"
      - "ci/nqc-census/test_reconcile_rmc013_provider_evidence.py"
      - "ci/nqc-census/collect_rmc013_gas_evidence.py"
      - "ci/nqc-census/reconcile_rmc013_gas_evidence.py"
      - "ci/nqc-census/test_rmc013_gas_evidence.py"
      - "ci/nqc-census/materialize_rmc013_execution_economics.py"
      - "ci/nqc-census/test_materialize_rmc013_execution_economics.py"
      - ".github/workflows/nqc-census-execution-evidence.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: rmc013-real-execution-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INPUTS: ci/nqc-census/rmc013-execution-inputs.json
  FOUNDRY_VERSION: "1.7.1"
  FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
  SOLC_VERSION: "0.8.24+commit.e11b9ed9"
  SOLC_SHA256: "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      status: ${{ steps.inputs.outputs.status }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate fail-closed producer inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1 and
            .repository == env.GITHUB_REPOSITORY and
            (.status == "BLOCKED_AWAITING_CERTIFIED_RMC012" or .status == "PINNED") and
            .pft.certified_commit == "5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf" and
            .pft.certified_tree == "ef3498da528f85cdb9fdd82222d64773a557f853" and
            .pft.aave_flash_premium_compatibility_id == "PFT-COMPAT-009" and
            .route_policy.venue_family == "UNISWAP_V2" and
            .route_policy.max_hops == 3 and
            .route_policy.keep_routes_per_candidate == 0 and
            .route_policy.emission_policy == "ALL_POSITIVE_ELSE_BEST_NONPOSITIVE" and
            .gas_policy.wrapped_native_asset == "0xC02aaa39b223FE8D0A0e5C4F27eAD9083C756Cc2" and
            .gas_policy.history_blocks == 128 and
            .gas_policy.reward_percentiles == [50,90,99] and
            .gas_policy.admission_priority_percentile == 99 and
            .gas_policy.base_fee_policy == "NEXT_BLOCK_MAX_EIP1559_CEIL_9_OVER_8" and
            .gas_policy.provider_reconciliation == "MAX_ADMISSION_PRIORITY_FEE_REQUIRE_EXACT_ANCHOR_AND_NATIVE_PRICE" and
            .gas_policy.native_price_source == "RMC008_AAVE_ORACLE_MANIFEST" and
            (.providers | map(.provider_id)) == ["publicnode","drpc"] and
            (if .status == "BLOCKED_AWAITING_CERTIFIED_RMC012"
             then .d12 == null and (.blocking_reasons | length > 0)
             else
               (.blocking_reasons | length == 0) and
               (.d12.run_id | type == "number") and
               (.d12.head_sha | test("^[0-9a-f]{40}$")) and
               (.d12.tree_sha | test("^[0-9a-f]{40}$")) and
               (.d12.workflow_name == "NQC RMC-012 Terminal Actionability Authority") and
               (.d12.artifact_id | type == "number") and
               (.d12.artifact_name | startswith("rmc012-terminal-actionability-")) and
               (.d12.artifact_digest | test("^sha256:[0-9a-f]{64}$"))
             end)
          ' "$INPUTS" >/dev/null
          echo "status=$(jq -r '.status' "$INPUTS")" >> "$GITHUB_OUTPUT"

      - name: Verify immutable PFT source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%T 5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf)" = ef3498da528f85cdb9fdd82222d64773a557f853
          test "$(git rev-parse 5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf:ci/nqc-protocol-fork/compatibility/PFT-COMPAT-009-aave-flash-premium-ceil.json)" = 17eba73198f9d15e090a4099daaf1a4e099fb747

      - name: Deterministic producer regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/test_plan_rmc013_v2_routes.py
          python3 ci/nqc-census/test_run_rmc013_anvil_candidate.py
          python3 ci/nqc-census/test_run_rmc013_anvil_batch.py
          python3 ci/nqc-census/test_reconcile_rmc013_provider_evidence.py
          python3 ci/nqc-census/test_rmc013_gas_evidence.py
          python3 ci/nqc-census/test_materialize_rmc013_execution_economics.py
          python3 -m py_compile \
            ci/nqc-census/plan_rmc013_v2_routes.py \
            ci/nqc-census/run_rmc013_anvil_candidate.py \
            ci/nqc-census/run_rmc013_anvil_batch.py \
            ci/nqc-census/reconcile_rmc013_provider_evidence.py \
            ci/nqc-census/materialize_rmc013_execution_economics.py \
            ci/nqc-census/collect_rmc013_gas_evidence.py \
            ci/nqc-census/reconcile_rmc013_gas_evidence.py \
            ci/nqc-census/materialize_rmc013_execution_economics.py

      - name: Verify producer has no live signing authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'private.?key|sign_transaction|broadcast_transaction|eth_sendRawTransaction' \
            ci/nqc-census/plan_rmc013_v2_routes.py \
            ci/nqc-census/run_rmc013_anvil_candidate.py \
            ci/nqc-census/run_rmc013_anvil_batch.py \
            ci/nqc-census/reconcile_rmc013_provider_evidence.py
          grep -F 'local_url = f"http://127.0.0.1:{port}"' ci/nqc-census/run_rmc013_anvil_candidate.py
          grep -F '"live_transaction_sent": False' ci/nqc-census/run_rmc013_anvil_candidate.py

  producer:
    if: ${{ github.event_name == 'push' && needs.preflight.outputs.status == 'PINNED' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      WORK: /tmp/nqc-rmc013-real-execution
    steps:
      - name: Checkout exact producer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authenticate and download exact D12 terminal authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK"
          mkdir -p "$WORK/d12" "$WORK/d11" "$WORK/routes" "$WORK/evidence"
          RUN_ID="$(jq -r '.d12.run_id' "$INPUTS")"
          HEAD_SHA="$(jq -r '.d12.head_sha' "$INPUTS")"
          TREE_SHA="$(jq -r '.d12.tree_sha' "$INPUTS")"
          ARTIFACT_ID="$(jq -r '.d12.artifact_id' "$INPUTS")"
          ARTIFACT_NAME="$(jq -r '.d12.artifact_name' "$INPUTS")"
          ARTIFACT_DIGEST="$(jq -r '.d12.artifact_digest' "$INPUTS")"

          RUN_JSON="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = success
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$HEAD_SHA"
          test "$(git show -s --format=%T "$HEAD_SHA")" = "$TREE_SHA"

          ART_JSON="$(gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r '.expired' <<<"$ART_JSON")" = false
          test "$(jq -r '.name' <<<"$ART_JSON")" = "$ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$ART_JSON")" = "$ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$ART_JSON")" = "$RUN_ID"

          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT_NAME" --dir "$WORK/d12"
          (
            cd "$WORK/d12"
            sha256sum -c terminal-archive.sha256
          )
          jq -e '.status == "RMC_012_TERMINAL_ACTIONABILITY_CERTIFIED"' \
            "$WORK/d12/terminal-actionability-certification.json" >/dev/null

      - name: Authenticate exact D11 package named by D12
        shell: bash
        run: |
          set -euo pipefail
          CERT="$WORK/d12/terminal-actionability-certification.json"
          RUN_ID="$(jq -r '.d11.run_id' "$CERT")"
          HEAD_SHA="$(jq -r '.d11.head_sha' "$CERT")"
          TREE_SHA="$(jq -r '.d11.tree_sha' "$CERT")"
          ARTIFACT_ID="$(jq -r '.d11.artifact_id' "$CERT")"
          ARTIFACT_NAME="$(jq -r '.d11.artifact_name' "$CERT")"
          ARTIFACT_DIGEST="$(jq -r '.d11.artifact_digest' "$CERT")"

          RUN_JSON="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = success
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$HEAD_SHA"
          test "$(git show -s --format=%T "$HEAD_SHA")" = "$TREE_SHA"

          ART_JSON="$(gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r '.expired' <<<"$ART_JSON")" = false
          test "$(jq -r '.name' <<<"$ART_JSON")" = "$ARTIFACT_NAME"
          test "$(jq -r '.digest' <<<"$ART_JSON")" = "$ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$ART_JSON")" = "$RUN_ID"

          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT_NAME" --dir "$WORK/d11"
          (
            cd "$WORK/d11"
            sha256sum -c CERTIFICATION-PACKAGE-SHA256SUMS
            cd d11
            sha256sum -c capital-archive.sha256
          )

      - name: Normalize exact D08 and D12 execution inputs
        shell: bash
        run: |
          set -euo pipefail
          D11_INPUTS="$WORK/d11/rmc011-real-source-inputs.json"
          D08_REL="$(jq -r '.d08.market_state_manifest' "$D11_INPUTS")"
          D08_ORACLE_REL="$(jq -r '.d08.oracle_manifest' "$D11_INPUTS")"
          D08_STATE="$WORK/d11/upstream/d08/$D08_REL"
          D08_ORACLE="$WORK/d11/upstream/d08/$D08_ORACLE_REL"
          test -f "$D08_STATE"
          test -f "$D08_ORACLE"
          for name in actionability-records.jsonl actionability-summary.json capital-promotions.jsonl; do
            test -f "$WORK/d12/$name"
            cp -- "$WORK/d12/$name" "$WORK/$name"
          done
          test -f "$WORK/d11/d11/capital-sources.jsonl"
          cp -- "$D08_STATE" "$WORK/d08-market-state-manifest.jsonl"
          cp -- "$D08_ORACLE" "$WORK/d08-oracle-manifest.jsonl"
          cp -- "$WORK/d11/d11/capital-sources.jsonl" "$WORK/capital-sources.jsonl"

      - name: Plan every positive exact V2 route
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/plan_rmc013_v2_routes.py \
            --d08-state "$WORK/d08-market-state-manifest.jsonl" \
            --d12-actionability "$WORK/actionability-records.jsonl" \
            --d12-summary "$WORK/actionability-summary.json" \
            --d12-promotions "$WORK/capital-promotions.jsonl" \
            --out "$WORK/routes" \
            --max-hops 3 \
            --keep-routes 0
          jq -e '
            .status == "RMC_013_V2_ROUTE_PLANNING_PASS" and
            .route_execution_coverage_complete == true and
            .positive_routes_omitted == 0 and
            .emission_policy == "ALL_POSITIVE_ELSE_BEST_NONPOSITIVE"
          ' "$WORK/routes/v2-route-summary.json" >/dev/null

      - name: Collect independent pre-anchor gas evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/gas/providers"
          WRAPPED_NATIVE="$(jq -r '.gas_policy.wrapped_native_asset' "$INPUTS")"
          HISTORY_BLOCKS="$(jq -r '.gas_policy.history_blocks' "$INPUTS")"
          PERCENTILES="$(jq -r '.gas_policy.reward_percentiles | map(tostring) | join(",")' "$INPUTS")"
          ADMISSION_PERCENTILE="$(jq -r '.gas_policy.admission_priority_percentile' "$INPUTS")"
          collect_gas() {
            local provider_id="$1"
            local rpc_url="$2"
            python3 ci/nqc-census/collect_rmc013_gas_evidence.py \
              --rpc-url "$rpc_url" \
              --provider-id "$provider_id" \
              --anchor-summary "$WORK/actionability-summary.json" \
              --oracle-manifest "$WORK/d08-oracle-manifest.jsonl" \
              --wrapped-native "$WRAPPED_NATIVE" \
              --history-blocks "$HISTORY_BLOCKS" \
              --reward-percentiles "$PERCENTILES" \
              --admission-priority-percentile "$ADMISSION_PERCENTILE" \
              --out "$WORK/gas/providers/$provider_id.json"
          }
          PUBLICNODE_GAS="$(jq -r '.providers[] | select(.provider_id=="publicnode") | .rpc_url' "$INPUTS")"
          DRPC_GAS="$(jq -r '.providers[] | select(.provider_id=="drpc") | .rpc_url' "$INPUTS")"
          collect_gas publicnode "$PUBLICNODE_GAS" &
          PID_PUBLICNODE_GAS=$!
          collect_gas drpc "$DRPC_GAS" &
          PID_DRPC_GAS=$!
          wait "$PID_PUBLICNODE_GAS"
          wait "$PID_DRPC_GAS"

          python3 ci/nqc-census/reconcile_rmc013_gas_evidence.py \
            --provider-evidence "$WORK/gas/providers/publicnode.json" \
            --provider-evidence "$WORK/gas/providers/drpc.json" \
            --out "$WORK/gas/gas-price-evidence.json"

          jq -e '
            .status == "RMC_013_GAS_PRICE_EVIDENCE_PASS" and
            .lookahead_used == false and
            (.provider_evidence | length == 2)
          ' "$WORK/gas/gas-price-evidence.json" >/dev/null

      - name: Install exact PFT executor toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$WORK/toolchain"
          mkdir -p "$TOOL/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            -o "$TOOL/foundry.tar.gz" \
            "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  $TOOL/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$TOOL/foundry.tar.gz" -C "$TOOL/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            -o "$TOOL/solc-0.8.24" \
            "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9"
          echo "${SOLC_SHA256}  $TOOL/solc-0.8.24" | sha256sum -c -
          chmod +x "$TOOL/solc-0.8.24"
          export PATH="$TOOL/bin:$PATH"
          forge --version | grep -F "$FOUNDRY_VERSION"
          "$TOOL/solc-0.8.24" --version | grep -F "$SOLC_VERSION"

      - name: Rebuild exact PFT Aave executor twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$WORK/toolchain/bin:$PATH"
          PFT=5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf
          PFT_TREE=ef3498da528f85cdb9fdd82222d64773a557f853
          test "$(git show -s --format=%T "$PFT")" = "$PFT_TREE"
          mkdir -p "$WORK/pft"
          git show "$PFT:ci/nqc-protocol-fork/compatibility/PFT-COMPAT-007-aave-stack-lifetime.patch" \
            > "$WORK/pft/PFT-COMPAT-007-aave-stack-lifetime.patch"
          test "$(sha256sum "$WORK/pft/PFT-COMPAT-007-aave-stack-lifetime.patch" | awk '{print $1}')" = \
            "bf3d8ad2f5f1ddbbf80cdb50ba60442e08dce2ef990f68a5f29ba48992ea1fae"

          for build in A B; do
            ROOT="$WORK/pft/build-$build"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/contracts/src"
            git show "$PFT:ci/nqc-protocol-fork/recovered-source/contracts/src/NqcAaveV3Executor.sol" \
              > "$ROOT/contracts/src/NqcAaveV3Executor.sol"
            (
              cd "$ROOT"
              git init -q
              git add contracts/src/NqcAaveV3Executor.sol
              git -c user.name=nqc -c user.email=nqc@example.invalid commit -qm baseline
              git apply --unidiff-zero "$WORK/pft/PFT-COMPAT-007-aave-stack-lifetime.patch"
              cat > foundry.toml <<'EOF'
          [profile.default]
          src = "contracts/src"
          solc_version = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          via_ir = false
          bytecode_hash = "none"
          cbor_metadata = false
          EOF
              forge build --force --offline --use "$WORK/toolchain/solc-0.8.24"
              forge inspect --offline --use "$WORK/toolchain/solc-0.8.24" \
                NqcAaveV3Executor bytecode > "$WORK/pft/aave-creation-$build.hex"
              forge inspect --offline --use "$WORK/toolchain/solc-0.8.24" \
                NqcAaveV3Executor deployedBytecode > "$WORK/pft/aave-template-$build.hex"
            )
          done
          cmp "$WORK/pft/aave-creation-A.hex" "$WORK/pft/aave-creation-B.hex"
          cmp "$WORK/pft/aave-template-A.hex" "$WORK/pft/aave-template-B.hex"
          cp "$WORK/pft/aave-creation-A.hex" "$WORK/pft/aave-creation-bytecode.hex"
          sha256sum \
            "$WORK/pft/aave-creation-bytecode.hex" \
            "$WORK/pft/aave-template-A.hex" \
            > "$WORK/pft/executor-build.sha256"
          echo RMC013_PFT_EXECUTOR_REBUILD_PASS

      - name: Execute every retained route on both exact provider forks
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$WORK/toolchain/bin:$PATH"
          PUBLICNODE="$(jq -r '.providers[] | select(.provider_id=="publicnode") | .rpc_url' "$INPUTS")"
          DRPC="$(jq -r '.providers[] | select(.provider_id=="drpc") | .rpc_url' "$INPUTS")"
          test -n "$PUBLICNODE"
          test -n "$DRPC"

          run_fork_batch() {
            local rpc_url="$1"
            local provider_id="$2"
            local port="$3"
            python3 ci/nqc-census/run_rmc013_anvil_batch.py \
              --routes "$WORK/routes/v2-route-plans.jsonl" \
              --rpc-url "$rpc_url" \
              --provider-id "$provider_id" \
              --creation-bytecode "$WORK/pft/aave-creation-bytecode.hex" \
              --output "$WORK/evidence/$provider_id.jsonl" \
              --summary "$WORK/evidence/$provider_id-summary.json" \
              --anvil-log "$WORK/evidence/$provider_id-anvil.log" \
              --port "$port"
          }
          run_fork_batch "$PUBLICNODE" publicnode 18545 &
          PID_PUBLICNODE_EXEC=$!
          run_fork_batch "$DRPC" drpc 18546 &
          PID_DRPC_EXEC=$!
          wait "$PID_PUBLICNODE_EXEC"
          wait "$PID_DRPC_EXEC"

          jq -e '.status=="RMC_013_ANVIL_BATCH_PASS" and .route_conserved==true and .live_transaction_sent==false and .own_capital_used==false' \
            "$WORK/evidence/publicnode-summary.json" >/dev/null
          jq -e '.status=="RMC_013_ANVIL_BATCH_PASS" and .route_conserved==true and .live_transaction_sent==false and .own_capital_used==false' \
            "$WORK/evidence/drpc-summary.json" >/dev/null

      - name: Reconcile provider execution semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/reconcile_rmc013_provider_evidence.py \
            --routes "$WORK/routes/v2-route-plans.jsonl" \
            --left "$WORK/evidence/publicnode.jsonl" \
            --right "$WORK/evidence/drpc.jsonl" \
            --left-summary "$WORK/evidence/publicnode-summary.json" \
            --right-summary "$WORK/evidence/drpc-summary.json" \
            --output "$WORK/evidence/reconciled-execution.jsonl" \
            --summary "$WORK/evidence/provider-reconciliation-summary.json"

          jq -e '
            .status == "RMC_013_PROVIDER_RECONCILIATION_PASS" and
            .provider_mismatch_count == 0 and
            .unexplained_mismatch_count == 0 and
            .route_conserved == true
          ' "$WORK/evidence/provider-reconciliation-summary.json" >/dev/null
          test "$(jq '.emitted_route_count' "$WORK/routes/v2-route-summary.json")" -eq \
            "$(jq '.reconciled_route_count' "$WORK/evidence/provider-reconciliation-summary.json")"
          test "$(jq '.capital_feasible_candidate_count' "$WORK/routes/v2-route-summary.json")" -eq \
            "$(( $(jq '.candidate_with_route_count' "$WORK/routes/v2-route-summary.json") + $(jq '.route_unavailable_candidate_count' "$WORK/routes/v2-route-summary.json") ))"
          echo RMC013_PHYSICAL_PROVIDER_CONSENSUS_PASS

      - name: Materialize exact terminal execution economics
        shell: bash
        run: |
          set -euo pipefail
          ECON="$WORK/economics"
          rm -rf "$ECON"
          mkdir -p "$ECON"
          python3 ci/nqc-census/materialize_rmc013_execution_economics.py \
            --routes "$WORK/routes/v2-route-plans.jsonl" \
            --route-rejections "$WORK/routes/v2-route-rejections.jsonl" \
            --reconciled "$WORK/evidence/reconciled-execution.jsonl" \
            --gas-evidence "$WORK/gas/gas-price-evidence.json" \
            --capital-sources "$WORK/capital-sources.jsonl" \
            --d12-summary "$WORK/actionability-summary.json" \
            --d12-artifact-digest "$(jq -r '.d12.artifact_digest' "$INPUTS")" \
            --out "$ECON"

          SUMMARY="$ECON/execution-evidence-summary.json"
          jq -e '
            .status == "RMC_013_REAL_EXECUTION_ECONOMICS_PASS" and
            .coverage_complete == true and
            .unresolved_mismatch_count == 0 and
            .unknown_rejection_count == 0 and
            .capture_probability_invented == false and
            .global_concurrent_gas_capacity_claimed == false and
            .economics_quote_count >= .economics_candidate_count and
            .execution_variant_count == .economics_quote_count and
            .input_candidate_count == (.execution_simulatable_count + .explicit_rejection_count) and
            .economics_candidate_count == .execution_simulatable_count and
            .gas_funding_candidate_count == .execution_simulatable_count and
            .operator_owned_gas_funding_count == 0 and
            (.execution_simulatable_count == 0 or .zero_own_capital_proven == true) and
            .capture_calibrated_count == 0 and
            .realized_profitability_proven == false and
            .monthly_target_probability_proven == false
          ' "$SUMMARY" >/dev/null

          test "$(wc -l < "$ECON/execution-economics.jsonl")" -eq "$(jq '.economics_quote_count' "$SUMMARY")"
          test "$(jq -r '.candidate_id' "$ECON/execution-economics.jsonl" 2>/dev/null | LC_ALL=C sort -u | wc -l)" -eq "$(jq '.economics_candidate_count' "$SUMMARY")"
          test "$(wc -l < "$ECON/gas-funding-bindings.jsonl")" -eq "$(jq '.gas_funding_candidate_count' "$SUMMARY")"
          jq -e -s 'all(.[]; .reason != "UNKNOWN")' "$ECON/execution-rejection-ledger.jsonl" >/dev/null
          echo RMC013_ECONOMICS_MATERIALIZATION_PASS

      - name: Assemble immutable physical execution evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$WORK/physical-package"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$WORK/routes/"{v2-route-plans.jsonl,v2-route-rejections.jsonl,v2-route-summary.json} "$OUT/"
          cp "$WORK/evidence/"{publicnode.jsonl,publicnode-summary.json,drpc.jsonl,drpc-summary.json,reconciled-execution.jsonl,provider-reconciliation-summary.json} "$OUT/"
          cp "$WORK/gas/gas-price-evidence.json" "$OUT/"
          cp "$WORK/gas/providers/"{publicnode.json,drpc.json} "$OUT/"
          cp "$WORK/economics/"{execution-evidence-summary.json,execution-economics.jsonl,execution-rejection-ledger.jsonl,capacity-curves.jsonl,shadow-predictions.jsonl,gas-funding-bindings.jsonl,gas-conflict-claims.jsonl,evidence-manifest.json} "$OUT/"
          cp "$WORK/pft/"{aave-creation-bytecode.hex,aave-template-A.hex,executor-build.sha256,PFT-COMPAT-007-aave-stack-lifetime.patch} "$OUT/"
          cp "$WORK/d08-oracle-manifest.jsonl" "$OUT/"

          HEAD="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          jq -S -c -n \
            --arg head "$HEAD" \
            --arg tree "$TREE" \
            --arg d12_digest "$(jq -r '.d12.artifact_digest' "$INPUTS")" \
            --arg route_sha "$(sha256sum "$OUT/v2-route-plans.jsonl" | awk '{print $1}')" \
            --arg oracle_sha "$(sha256sum "$OUT/d08-oracle-manifest.jsonl" | awk '{print $1}')" \
            --arg gas_sha "$(sha256sum "$OUT/gas-price-evidence.json" | awk '{print $1}')" \
            --arg executor_sha "$(sha256sum "$OUT/aave-creation-bytecode.hex" | awk '{print $1}')" \
            --arg economics_summary_sha "$(sha256sum "$OUT/execution-evidence-summary.json" | awk '{print $1}')" \
            --arg economics_manifest_sha "$(sha256sum "$OUT/evidence-manifest.json" | awk '{print $1}')" \
            --argjson planned "$(jq '.emitted_route_count' "$OUT/v2-route-summary.json")" \
            --argjson route_rejected "$(jq '.route_unavailable_candidate_count' "$OUT/v2-route-summary.json")" \
            --argjson passed "$(jq '.execution_pass_count' "$OUT/provider-reconciliation-summary.json")" \
            --argjson exec_rejected "$(jq '.execution_rejection_count' "$OUT/provider-reconciliation-summary.json")" '
            {
              schema_version:1,
              status:"RMC_013_PHYSICAL_EXECUTION_PASS",
              code_commit:$head,
              code_tree:$tree,
              d12_artifact_digest:$d12_digest,
              pft:{
                certified_commit:"5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf",
                certified_tree:"ef3498da528f85cdb9fdd82222d64773a557f853",
                executor_compatibility:"PFT-COMPAT-007",
                flash_premium_compatibility:"PFT-COMPAT-009"
              },
              route_plan_sha256:$route_sha,
              oracle_manifest_sha256:$oracle_sha,
              gas_price_evidence_sha256:$gas_sha,
              executor_creation_sha256:$executor_sha,
              execution_economics_summary_sha256:$economics_summary_sha,
              execution_economics_manifest_sha256:$economics_manifest_sha,
              economics_materialized:true,
              planned_route_count:$planned,
              route_unavailable_candidate_count:$route_rejected,
              execution_pass_count:$passed,
              execution_rejection_count:$exec_rejected,
              provider_mismatch_count:0,
              unexplained_mismatch_count:0,
              route_conserved:true,
              provider_consensus:true,
              gas_evidence_pre_anchor:true,
              live_transaction_sent:false,
              own_capital_used:false,
              economics_certified:false,
              realized_pnl_certified:false
            }' > "$OUT/physical-execution-summary.json"

          (
            cd "$OUT"
            LC_ALL=C find . -maxdepth 1 -type f ! -name archive.sha256 -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum > archive.sha256
            sha256sum -c archive.sha256
          )
          echo RMC013_PHYSICAL_EXECUTION_EVIDENCE_PASS

      - name: Upload immutable physical execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmc013-physical-execution-${{ github.sha }}
          path: ${{ env.WORK }}/physical-package/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
