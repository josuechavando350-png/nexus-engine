name: NQC RMC-003.1 Typed Chain Observations

on:
  pull_request:
    paths:
      - .github/workflows/nqc-census-typed-observations.yml
      - ci/nqc-census/TYPED_OBSERVATION_CONTRACT.md
      - ci/nqc-census/typed_observation_vectors.py
      - ci/nqc-census/typed-observation-vectors.json
      - nqc-census/crates/nqc-census-core/src/lib.rs
      - nqc-census/crates/nqc-census-core/src/keccak.rs
      - nqc-census/crates/nqc-census-core/src/rlp.rs
      - nqc-census/crates/nqc-census-core/src/observation.rs
      - nqc-census/crates/nqc-census-core/tests/typed_observations.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RMC003_TYPED_BASE: 8032f55011625a106cf22a109dbd6af39cb1ecc4
      RMC005_MERGE: 5e856c3dc78902b055ed9878c117d3c1469a8fda
      RMC004_MERGE: ad6cb0366b42d4acc835545f3ba6c68324cadd89
      RMC003_MERGE: 765dc30fdd178a4960ade1e106669eb0b023fbeb
      RMC002_MERGE: 0d90ee7a7d439d2c658209c8fe176a8dda6bcbcb
      RMC001_MERGE: cea25577edfcaf89dc8fc8bf60ee04bc01d01a3d
      PFT_CERTIFIED_COMMIT: 5b4a0cb778cb4370cd54eb6fcba765dc8d7cecdf
      PFT_CERTIFIED_TREE: ef3498da528f85cdb9fdd82222d64773a557f853
      RUST_TOOLCHAIN: "1.98.1"
      TYPED_TESTS_EXPECTED: "14"
      EVIDENCE: /tmp/nqc-rmc003-typed-evidence
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify authority lineage and exact scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git show -s --format=%T "$PFT_CERTIFIED_COMMIT")" = "$PFT_CERTIFIED_TREE"
          for ancestor in "$PFT_CERTIFIED_COMMIT" "$RMC001_MERGE" "$RMC002_MERGE" \
                          "$RMC003_MERGE" "$RMC004_MERGE" "$RMC005_MERGE" "$RMC003_TYPED_BASE"; do
            git merge-base --is-ancestor "$ancestor" HEAD
          done
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
            if [ "${{ github.event.pull_request.base.sha }}" = "$RMC003_TYPED_BASE" ]; then
              python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/nqc-census-typed-observations.yml",
              ".github/workflows/nqc-census-store.yml",
              "ci/nqc-census/TYPED_OBSERVATION_CONTRACT.md",
              "ci/nqc-census/typed_observation_vectors.py",
              "ci/nqc-census/typed-observation-vectors.json",
              "nqc-census/crates/nqc-census-core/src/lib.rs",
              "nqc-census/crates/nqc-census-core/src/keccak.rs",
              "nqc-census/crates/nqc-census-core/src/rlp.rs",
              "nqc-census/crates/nqc-census-core/src/observation.rs",
              "nqc-census/crates/nqc-census-core/tests/typed_observations.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "8032f55011625a106cf22a109dbd6af39cb1ecc4...HEAD"],
              text=True,
          ).splitlines())
          assert changed == expected, (
              f"RMC-003.1 scope mismatch missing={sorted(expected - changed)} "
              f"extra={sorted(changed - expected)}"
          )
          print(f"RMC_003_1_SCOPE_PASS files={len(expected)}")
          PY
              git diff --check "$RMC003_TYPED_BASE"...HEAD
            else
              echo "RMC_003_1_EXACT_SCOPE=NOT_THIS_PR base=${{ github.event.pull_request.base.sha }}"
              git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
            fi
          else
            git diff --check
          fi
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"

      - name: Verify Protocol/Fork and RMC-001..005 authorities untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PFT_CERTIFIED_COMMIT" HEAD -- \
            ci/nqc-protocol-fork/recovered-source \
            ci/nqc-protocol-fork/reimplementation \
            ci/nqc-protocol-fork/compatibility \
            ci/nqc-protocol-fork/locks \
            ci/nqc-protocol-fork/PROTOCOL_FORK_TRUTH_CONTRACT.json \
            ci/nqc-protocol-fork/PROTOCOL_FORK_FINAL_CLOSEOUT.json
          echo RMC_003_1_PROTOCOL_FORK_IMMUTABLE_PASS
          git diff --quiet "$RMC001_MERGE" HEAD -- \
            ci/nqc-census/IDENTITY_CONTRACT.md \
            ci/nqc-census/identity-vectors.json \
            nqc-census/rust-toolchain.toml \
            nqc-census/crates/nqc-census-core/Cargo.toml \
            nqc-census/crates/nqc-census-core/src/identity.rs \
            nqc-census/crates/nqc-census-core/tests/identity.rs
          git diff --quiet "$RMC003_MERGE" HEAD -- \
            ci/nqc-census/OBSERVATION_PIPELINE_CONTRACT.md \
            nqc-census/crates/nqc-census-core/src/pipeline.rs \
            nqc-census/crates/nqc-census-core/src/capability.rs \
            nqc-census/crates/nqc-census-core/tests/observation_pipeline.rs
          git diff --quiet "$RMC005_MERGE" HEAD -- \
            ci/nqc-census/EFFECTIVE_SOURCE_CONTRACT.md \
            ci/nqc-census/effective-source-profile.json \
            ci/nqc-census/materialize_effective_source.py \
            ci/nqc-census/STORE_CONTRACT.md \
            ci/nqc-census/DEPLOYMENT_ADMISSION_CONTRACT.md \
            nqc-census/crates/nqc-census-store \
            nqc-census/crates/nqc-census-core/src/deployment.rs \
            nqc-census/crates/nqc-census-core/tests/deployment_registry.rs
          echo RMC_003_1_UPSTREAM_CENSUS_IMMUTABLE_PASS

      - name: Verify legacy RawLog semantics are textually preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          def source(rev):
              return subprocess.check_output(
                  ["git", "show", f"{rev}:nqc-census/crates/nqc-census-core/src/observation.rs"],
                  text=True)
          def block(text, signature):
              start = text.index(signature)
              depth, i = 0, text.index("{", start)
              while True:
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i + 1]
                  i += 1
          old, new = source("765dc30fdd178a4960ade1e106669eb0b023fbeb"), source("HEAD")
          for signature in (
              "pub fn digest(&self) -> Result<ObservationDigest, ObservationError>",
              "fn digest_observation(",
              "pub fn from_raw_log(",
              "impl ObservationEnvelope {",
          ):
              assert block(old, signature) == block(new, signature), signature
          for constant in ('const OBSERVATION_DOMAIN: &[u8] = b"NQC-CENSUS-OBSERVATION-V1";',
                           'const RAW_LOG_DOMAIN: &[u8] = b"NQC-CENSUS-RAW-LOG-V1";'):
              assert constant in old and constant in new, constant
          assert "pub struct ObservationDigest([u8; 32]);" in new, "digest must stay opaque"
          assert not re.search(r"impl\s+From<[^>]*>\s+for\s+ObservationDigest", new)
          assert "pub trait ObservationPayload: sealed::Sealed" in new
          print("RMC_003_1_LEGACY_RAW_LOG_TEXT_PRESERVED_PASS")
          PY

      - name: Verify provider signer and network free core
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'reqwest|alloy-provider|tokio|std::net|TcpStream|UdpSocket|process::Command|std::env::var|signer|private.?key|secret|http://|https://|eth_send|sendRawTransaction' \
            nqc-census/crates/nqc-census-core/src \
            nqc-census/crates/nqc-census-core/tests
          ! grep -R -niE 'aave|uniswap|\breserve|liquidat|profit|\bpnl\b' \
            nqc-census/crates/nqc-census-core/src/keccak.rs \
            nqc-census/crates/nqc-census-core/src/rlp.rs \
            nqc-census/crates/nqc-census-core/tests/typed_observations.rs
          echo RMC_003_1_NO_IO_NO_PROTOCOL_BOUNDARY_PASS

      - name: Regenerate vectors independently
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/nqc-census/typed_observation_vectors.py --check ci/nqc-census/typed-observation-vectors.json
          python3 ci/nqc-census/typed_observation_vectors.py --write "$EVIDENCE/vectors-run-1.json"
          python3 ci/nqc-census/typed_observation_vectors.py --write "$EVIDENCE/vectors-run-2.json"
          cmp "$EVIDENCE/vectors-run-1.json" "$EVIDENCE/vectors-run-2.json"
          cmp "$EVIDENCE/vectors-run-1.json" ci/nqc-census/typed-observation-vectors.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          vectors = json.loads(Path("ci/nqc-census/typed-observation-vectors.json").read_text())
          rust = Path("nqc-census/crates/nqc-census-core/tests/typed_observations.rs").read_text()
          pinned = [vectors["synthetic_header"]["hash"]]
          for vector in vectors["shared_payload_vectors"] + [vectors["reverted_call_vector"], vectors["absent_code_vector"]]:
              pinned += [vector["raw_payload_digest"], vector["observation_digest"], vector["canonical_observation_sha256"]]
          for vector in vectors["legacy_raw_log_vectors"]:
              pinned += [vector["raw_payload_digest"], vector["observation_digest"]]
          pinned += list(vectors["keccak256"].values())
          missing = [value for value in pinned if value not in rust]
          assert not missing, f"Rust golden constants disagree with independent vectors: {missing}"
          assert vectors["purpose"] == "SYNTHETIC_TYPED_OBSERVATION_SERIALIZATION_VECTORS_NOT_CHAIN_EVIDENCE"
          print(f"RMC_003_1_RUST_PYTHON_GOLDEN_AGREEMENT_PASS values={len(pinned)}")
          PY

      - name: Rust format lint test and build locked
        working-directory: nqc-census
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc -V | grep -F "rustc $RUST_TOOLCHAIN "
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          count=$(cargo test --locked -p nqc-census-core --test typed_observations -- --list 2>/dev/null | grep -c ': test$')
          test "$count" = "$TYPED_TESTS_EXPECTED"
          cargo test --locked -p nqc-census-core --test typed_observations -- --nocapture 2>&1 | tee "$EVIDENCE/typed-tests-run-1.log"
          cargo test --locked -p nqc-census-core --test typed_observations 2>&1 | tee "$EVIDENCE/typed-tests-run-2.log"
          grep -F "test result: ok. $TYPED_TESTS_EXPECTED passed" "$EVIDENCE/typed-tests-run-1.log"
          grep -F "test result: ok. $TYPED_TESTS_EXPECTED passed" "$EVIDENCE/typed-tests-run-2.log"
          cargo test --workspace --all-targets --locked
          cargo build --workspace --all-targets --locked
          echo RMC_003_1_TYPED_OBSERVATIONS_PASS | tee "$EVIDENCE/status.txt"

      - name: Seal evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cd "$EVIDENCE"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-rmc003-typed-observations-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/nqc-rmc003-typed-evidence
          if-no-files-found: error
          retention-days: 30
