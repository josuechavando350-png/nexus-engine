name: NQC V2 Oracle RPC Source Capability and Positive Controls (READ ONLY)

on:
  pull_request:
    paths:
      - 'ci/nqc-census/rmc-v2-shadow/oracle_rpc_source_capability_matrix.py'
      - 'ci/nqc-census/rmc-v2-shadow/test_oracle_rpc_source_capability_matrix.py'
      - 'ci/nqc-census/rmc-v2-shadow/ORACLE_RPC_SOURCE_CAPABILITY_CONTRACT.md'
      - '.github/workflows/nqc-v2-oracle-rpc-source-matrix.yml'

permissions:
  contents: read

concurrency:
  group: nqc-v2-oracle-rpc-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-controls-and-recent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind exact SHA and test adversarial source capability
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          OUT="$RUNNER_TEMP/nqc-oracle-rpc-matrix"
          mkdir -p "$OUT"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_oracle_rpc_source_capability_matrix.py -v 2>&1 | tee "$OUT/tests.log"
          python3 -m py_compile ci/nqc-census/rmc-v2-shadow/oracle_rpc_source_capability_matrix.py
      - name: Historical positive controls then bounded current source matrix
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-oracle-rpc-matrix"
          timeout 330s python3 ci/nqc-census/rmc-v2-shadow/oracle_rpc_source_capability_matrix.py \
            --out "$OUT/oracle-rpc-source-matrix.json" \
            > "$OUT/stdout.log" 2> "$OUT/stderr.log"
          jq -e '
            .schema_version==1 and
            (.status=="TWO_SOURCE_ORACLE_LOG_CAPABILITY_AND_RECENT_PARITY" or
             .status=="INCOMPLETE_ORACLE_RPC_SOURCE_CAPABILITY") and
            .prospective_detection_proven==false and
            .net_pnl_certified==false and
            .commercial_score_upgrade==false and
            .external_nonrecourse_gas_proven==false and
            .RMC_closed==false and
            .P2_shadow_certified==false and
            .canary_live_authorized==false and
            .nqc_realized_pnl_usd=="0" and
            (.providers|keys|sort)==["blast","drpc"] and
            all(.providers[];.calls_used<=30)
          ' "$OUT/oracle-rpc-source-matrix.json" >/dev/null
          echo "Provider compatibility research only; missing data is not a zero or trade signal."
      - name: Preserve exact source identity and positive or negative findings
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-oracle-rpc-matrix"
          mkdir -p "$OUT/source"
          cp ci/nqc-census/rmc-v2-shadow/oracle_rpc_source_capability_matrix.py \
             ci/nqc-census/rmc-v2-shadow/test_oracle_rpc_source_capability_matrix.py \
             ci/nqc-census/rmc-v2-shadow/oracle_ws_inclusion_audit.py \
             ci/nqc-census/rmc-v2-shadow/oracle_dynamic_topology_truth.py \
             ci/nqc-census/rmc-v2-shadow/ORACLE_RPC_SOURCE_CAPABILITY_CONTRACT.md \
             .github/workflows/nqc-v2-oracle-rpc-source-matrix.yml "$OUT/source/"
          git rev-parse HEAD > "$OUT/code-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/code-tree.txt"
          cd "$OUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          sha256sum --check --strict manifest.sha256
      - name: Upload bounded RPC source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-v2-oracle-rpc-matrix-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-oracle-rpc-matrix/
          retention-days: 30
          if-no-files-found: error

  repository-lint:
    runs-on: ubuntu-24.04
    container: node:24
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
