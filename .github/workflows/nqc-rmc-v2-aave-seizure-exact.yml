name: NQC RMC V2 Aave sUSDe Exact Integer Seizure Gate (NOT LIQUIDATABLE)

on:
  pull_request:
    paths:
      - "ci/nqc-census/rmc-v2-economics/aave_susde_exact_seizure.py"
      - "ci/nqc-census/rmc-v2-economics/test_aave_susde_exact_seizure.py"
      - ".github/workflows/nqc-rmc-v2-aave-seizure-exact.yml"
  push:
    branches:
      - "nqc/rmc-v2-aave-exact-seizure-20261013"
    paths:
      - "ci/nqc-census/rmc-v2-economics/aave_susde_exact_seizure.py"
      - "ci/nqc-census/rmc-v2-economics/test_aave_susde_exact_seizure.py"
      - ".github/workflows/nqc-rmc-v2-aave-seizure-exact.yml"

permissions:
  contents: read

concurrency:
  group: aave-susde-conditional-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aave-exact-counterfactual-non-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact producing commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Refuse synthetic merge SHA, run all adversarial integer tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile ci/nqc-census/rmc-v2-economics/aave_susde_exact_seizure.py
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-economics \
            -p 'test_aave_susde_exact_seizure.py' -v

      - name: Install SHA256-pinned Foundry 1.7.1 for read-only historical cast
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry" "$RUNNER_TEMP/aave-exact"
          curl --fail --location --retry 4 --retry-all-errors --max-time 160 \
            -o "$RUNNER_TEMP/foundry.tar.gz" \
            https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz
          echo "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b  $RUNNER_TEMP/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"

      - name: Pin actual Aave reserve/eMode/oracle/borrower state at block 26184741
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aave-exact"
          : > "$OUT/rpc-attempts.txt"
          FOUND=0
          for RPC in \
            "https://eth.drpc.org" \
            "https://ethereum-rpc.publicnode.com" \
            "https://1rpc.io/eth" \
            "https://eth.llamarpc.com"
          do
            echo "TRY_ARCHIVE_PROVIDER $RPC" >> "$OUT/rpc-attempts.txt"
            if timeout 380s python3 ci/nqc-census/rmc-v2-economics/aave_susde_exact_seizure.py \
              --rpc-url "$RPC" \
              --out "$OUT/conditional-seizure.json" \
              --state-out "$OUT/pinned-account-state.json" \
              > "$OUT/console.json" 2> "$OUT/last-error.txt"; then
              echo "EXACT_AAVE_PRESTATE_RECONCILED $RPC" >> "$OUT/rpc-attempts.txt"
              echo "$RPC" > "$OUT/selected-rpc.txt"
              FOUND=1
              break
            fi
            echo "REJECT_RPC_OR_STATE_OR_CONTRACT_CONFIGURATION" >> "$OUT/rpc-attempts.txt"
            echo "REJECTION_TRACE_FOR $RPC" >> "$OUT/rpc-attempts.txt"
            tail -n 7 "$OUT/last-error.txt" >> "$OUT/rpc-attempts.txt"
          done
          test "$FOUND" -eq 1
          jq -e '
            .contract=="NQC_V2_AAVE_SUSDE_LIQUIDATION_COUNTERFACTUAL_EXACT_INTEGERS"
            and .source_tier=="SINGLE_ARCHIVE_RPC_STATE_ONLY_NO_LIQUIDATION"
            and .block_number==26184741
            and .block_hash=="0xe4b0718c51a6a484eef56edce0f25e9a5c546c2f66f595c6e305a589a612dbbe"
            and .borrower_emode_id==24
            and .actual_health_factor_wad!=null
            and .is_liquidatable_at_block==false
            and .effective_liquidation_bonus_bps==10310
            and .protocol_fee_on_bonus_bps>=0
            and .protocol_fee_on_bonus_bps<=10000
            and .gross_susde_before_protocol_fee_raw!=null
            and .protocol_fee_susde_raw!=null
            and .hypothetical_net_susde_raw!=null
            and .real_liquidation_executed==false
            and .integrated_morpho_curve_aave_fluid_repay_proven==false
            and .independent_operator_quorum_proven==false
            and .external_gas_sponsor_nonrecourse_proven==false
            and .end_to_end_net_pnl_usd==null
            and .commercial_upgrade==false
            and .p2_shadow_certified==false
            and .rmc_closed==false
            and .realized_nqc_pnl_usd=="0"
          ' "$OUT/conditional-seizure.json"
          jq '{
            borrower,
            actual_health_factor_wad,
            is_liquidatable_at_block,
            effective_liquidation_bonus_bps,
            protocol_fee_on_bonus_bps,
            actual_price_susde_in_aave_base_units,
            actual_price_usdtb_in_aave_base_units,
            aave_default_close_factor_bps,
            maximum_debt_cover_raw_sensitivity,
            gross_susde_before_protocol_fee_raw,
            protocol_fee_susde_raw,
            hypothetical_net_susde_raw,
            net_susde_minus_388k_raw,
            attainable:.["388k_susde_counterfactual_attainable_given_static_state_prices_and_valid_trigger"]
          }' "$OUT/conditional-seizure.json" | tee "$OUT/summary.json"

      - name: Freeze conditional evidence, SHA256 and nonclaims
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aave-exact"
          cp ci/nqc-census/rmc-v2-economics/aave_susde_exact_seizure.py "$OUT/producer.py"
          cp ci/nqc-census/rmc-v2-economics/test_aave_susde_exact_seizure.py "$OUT/tests.py"
          jq -n --arg head "${{ github.event.pull_request.head.sha || github.sha }}" \
            '{schema_version:1,producing_head:$head,
              source_tier:"HISTORICAL_SINGLE_ARCHIVE_RPC_COUNTERFACTUAL",
              historical_aave_hf_below_one:false,
              synthetic_oracle_or_state_mutations:false,
              seizable_collateral_is_future_trade_eligible:false,
              Aave_liquidation_submitted:false,
              exact_USDtb_cover_settled:false,
              integrated_flash_route_and_gas_proven:false,
              independent_rpc_operator_quorum:false,
              P2_shadow_certified:false,
              RMC_D17_closed:false,
              commercial_upgrade:false,
              NQC_realized_pnl_usd:"0"}' > "$OUT/nonclaims.json"
          (cd "$OUT" && sha256sum producer.py tests.py conditional-seizure.json \
            pinned-account-state.json summary.json nonclaims.json \
            > archive.sha256 && sha256sum -c archive.sha256)

      - name: Preserve source, exact block state, negative proof and all failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-v2-aave-exact-seizure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aave-exact/
          if-no-files-found: warn
          retention-days: 30
