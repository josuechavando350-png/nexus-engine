name: NQC V2 Oracle Primary/Secondary Round Receipt Ordering (NO TRADE)

on:
  pull_request:
    paths:
      - 'ci/nqc-census/rmc-v2-shadow/oracle_round_transaction_order.py'
      - 'ci/nqc-census/rmc-v2-shadow/test_oracle_round_transaction_order.py'
      - 'ci/nqc-census/rmc-v2-shadow/ORACLE_ROUND_TRANSACTION_ORDER_CONTRACT.md'
      - '.github/workflows/nqc-v2-oracle-round-order.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: nqc-v2-oracle-round-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-receipt-and-round-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact head and adversarial independent-order regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          OUT="$RUNNER_TEMP/nqc-oracle-round"
          mkdir -p "$OUT"
          python3 -m unittest discover -s ci/nqc-census/rmc-v2-shadow \
            -p test_oracle_round_transaction_order.py -v 2>&1 | tee "$OUT/tests.log"
          python3 -m py_compile ci/nqc-census/rmc-v2-shadow/oracle_round_transaction_order.py
      - name: Authenticate immutable PR707 four-event producer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-oracle-round"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38518805299" > "$OUT/pr707-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11873335555" > "$OUT/pr707-artifact.json"
          jq -e '.id==38518805299 and .status=="completed" and
            .conclusion=="success" and
            .head_sha=="b4c553e244eb3ac0401e2db96959938502a6935b"' \
            "$OUT/pr707-run.json" >/dev/null
          jq -e '.id==11873335555 and .expired==false and
            .workflow_run.id==38518805299 and
            .workflow_run.head_sha=="b4c553e244eb3ac0401e2db96959938502a6935b" and
            .digest=="sha256:d3d43c38a0e54f6659957da4159daf0625a05dd934b2c3bd357f10d46456058b"' \
            "$OUT/pr707-artifact.json" >/dev/null
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11873335555/zip" \
            --output "$OUT/pr707-dual-source.zip"
          printf '%s  %s\n' \
            'd3d43c38a0e54f6659957da4159daf0625a05dd934b2c3bd357f10d46456058b' \
            "$OUT/pr707-dual-source.zip" | sha256sum --check --strict
      - name: Verify exact four oracle receipts and paired round ordering on dRPC and Blast
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-oracle-round"
          timeout 300s python3 ci/nqc-census/rmc-v2-shadow/oracle_round_transaction_order.py \
            --producer-artifact "$OUT/pr707-dual-source.zip" \
            --out "$OUT/round-receipt-order.json" \
            > "$OUT/stdout.log" 2> "$OUT/stderr.log"
          jq -e '
            .schema_version==1 and
            .producer_pr707_zip_sha256=="d3d43c38a0e54f6659957da4159daf0625a05dd934b2c3bd357f10d46456058b" and
            (.status=="TWO_ENDPOINT_ORACLE_ROUND_ORDER_RECONCILED_NO_CAPTURE" or
             .status=="SINGLE_ENDPOINT_ROUND_ORDER_DESCRIPTIVE_ONLY" or
             .status=="MISMATCH_ORACLE_RECEIPT_ORDER_NO_AUTHORITY" or
             .status=="INCOMPLETE_ORACLE_ROUND_TRANSACTION_ORDER") and
            .source_lookahead_selection_of_winners==false and
            .pending_first_seen_by_any_operator_proven==false and
            .available_same_block_ordering_proven==false and
            .profitable_aave_liquidation_capture_proven==false and
            .native_gas_external_nonrecourse_proven==false and
            .RMC_closed==false and
            .P2_shadow_certified==false and
            .canary_live_authorized==false and
            .commercial_score_upgrade==false and
            .nqc_realized_pnl_usd=="0" and
            (.rounds|length)<=2 and
            all(.sources[];.rpc_calls_used<=20 and (.results|length)<=4)
          ' "$OUT/round-receipt-order.json" >/dev/null
      - name: Record content-addressed exact source and rejection evidence
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nqc-oracle-round"
          mkdir -p "$OUT/source"
          cp ci/nqc-census/rmc-v2-shadow/oracle_round_transaction_order.py \
             ci/nqc-census/rmc-v2-shadow/test_oracle_round_transaction_order.py \
             ci/nqc-census/rmc-v2-shadow/oracle_dual_event_family_census.py \
             ci/nqc-census/rmc-v2-shadow/oracle_newtransmission_cadence.py \
             ci/nqc-census/rmc-v2-shadow/ORACLE_ROUND_TRANSACTION_ORDER_CONTRACT.md \
             .github/workflows/nqc-v2-oracle-round-order.yml "$OUT/source/"
          git rev-parse HEAD > "$OUT/code-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/code-tree.txt"
          cd "$OUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          sha256sum --check --strict manifest.sha256
      - name: Upload pinned receipts and order certificate or exact blocker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nqc-oracle-round-order-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nqc-oracle-round/
          retention-days: 30
          if-no-files-found: error

  repository-lint:
    runs-on: ubuntu-24.04
    container: node:24
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
