name: LA PAUSE lock bootstrap

on:
  push:
    branches: ["client/la-pause-experience"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(la-pause): refresh pnpm lockfile"
            git push
          fi
