name: NQC RMC-013 One-Shot Rustfmt

on:
  push:
    branches:
      - "nqc/rmc-013-execution-economics-capture-20260929"
    paths:
      - "nqc-census/crates/nqc-census-economics/**"
      - "nqc-census/crates/nqc-census-portfolio/**"
      - ".github/workflows/nqc-rmc013-one-shot-rustfmt.yml"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cd nqc-census
          cargo fmt --all
          cd ..
          if git diff --quiet; then
            echo RMC013_RUSTFMT_ALREADY_CLEAN
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nqc-census
          git commit -m "RMC-013: rustfmt exact economics stack"
          git push origin HEAD:nqc/rmc-013-execution-economics-capture-20260929
